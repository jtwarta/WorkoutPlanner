<!DOCTYPE html>

<!--
  LiftScript v1.13
  Changes from v1.11:
  1.  Hevy CSV measurement import: tap "Import Hevy" on Body Measurements card
  2.  Added shoulder, hip, and thigh to MEASUREMENT_FIELDS
  3.  Manual entry form now includes new fields
  UI upgrades (v1.12b):
  4.  Removed +Log weight and +Measure buttons (Import Hevy is sole data path)
  5.  Active calories now classified with color-coded labels
  6.  Tappable measurement tiles with animated SVG sparkline history charts
  7.  Proportion analysis replaced with SVG radar/spider chart
  8.  Collapsible section headers for strength index, muscle grid legend
  9.  Increased header/title text sizes for scannability
  10. Muscle grid redesign: uniform tiles, urgency dots, volume micro-bars
-->

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>LiftScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #131315;
  --surface2: #1a1a1e;
  --surface3: #222226;
  --border: #2a2a2e;
  --border-light: #333338;
  --text: #f4f4f6;
  --text-mid: #bcbcc4;
  --text-dim: #8e8e98;
  --accent: #4ade80;
  --accent-dim: rgba(74, 222, 128, 0.12);
  --warn: #fb923c;
  --warn-dim: rgba(251, 146, 60, 0.12);
  --danger: #f87171;
  --danger-dim: rgba(248, 113, 113, 0.12);
  --blue: #60a5fa;
  --blue-dim: rgba(96, 165, 250, 0.12);
  --purple: #c084fc;
  --purple-dim: rgba(192, 132, 252, 0.12);
  --strength: #818cf8;
  --strength-dim: rgba(129, 140, 248, 0.12);
  color-scheme: dark;
}

- { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
background: #0a0a0a;
background-color: #0a0a0a;
color-scheme: dark;
overscroll-behavior-y: none;
}

body {
font-family: ‘Figtree’, -apple-system, sans-serif;
color: var(–text);
min-height: 100vh;
-webkit-font-smoothing: antialiased;
line-height: 1.5;
}

/* Layout */
.app {
max-width: 480px;
margin: 0 auto;
padding: 20px 18px;
padding-bottom: 120px;
background: #0a0a0a;
}

/* Header */
.header {
padding: 8px 0 12px;
margin-bottom: 12px;
border-bottom: 1px solid var(–border);
}
.header h1 {
font-size: 28px;
font-weight: 700;
letter-spacing: -0.5px;
color: var(–text);
}
.header .subtitle {
font-size: 13px;
color: var(–text-dim);
font-family: ‘Space Grotesk’, sans-serif;
}

/* Cards */
.card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 18px;
margin-bottom: 14px;
}
.card-title {
font-size: 14px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1.2px;
color: var(–text-dim);
margin-bottom: 14px;
}

/* Tabs */
.tabs {
display: flex;
gap: 4px;
margin-bottom: 18px;
background: var(–surface);
border-radius: 12px;
padding: 4px;
border: 1px solid var(–border);
}
.tab {
flex: 1;
padding: 9px 6px;
text-align: center;
font-size: 16px;
font-weight: 600;
border-radius: 9px;
cursor: pointer;
color: var(–text-dim);
transition: all 0.25s ease;
border: none;
background: none;
font-family: ‘Figtree’, sans-serif;
-webkit-tap-highlight-color: transparent;
}
.tab.active {
background: var(–surface3);
color: var(–text);
}

.urgency-high { background: var(–danger-dim); color: var(–danger); }
.urgency-med { background: var(–warn-dim); color: var(–warn); }
.urgency-low { background: var(–accent-dim); color: var(–accent); }

/* Expandable explainer */
.rec-expand {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
}
.rec-expand.open {
opacity: 1;
}
.rec-explainer {
padding: 0 2px 14px 40px;
font-size: 14px;
color: var(–text-mid);
line-height: 1.55;
}
.rec-explainer strong {
color: var(–text);
font-weight: 600;
}

/* ===================== */
/* EXERCISE PRESCRIPTIONS */
/* ===================== */
.session-summary {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 14px;
padding-bottom: 10px;
border-bottom: 1px solid var(–border);
}
.session-time {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 15px;
font-weight: 600;
color: var(–accent);
}
.session-count {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 13px;
color: var(–text-dim);
}

.ex-group {
margin-bottom: 18px;
}
.ex-group:last-child { margin-bottom: 0; }
.ex-group-title {
font-size: 15px;
font-weight: 600;
margin-bottom: 8px;
padding-bottom: 6px;
border-bottom: 1px solid var(–border);
}
.ex-row {
display: flex;
align-items: baseline;
justify-content: space-between;
padding: 8px 0;
}
.ex-name {
font-size: 15px;
font-weight: 500;
flex: 1;
min-width: 0;
padding-right: 12px;
color: var(–text);
}
.ex-prescription {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 13px;
color: var(–accent);
white-space: nowrap;
flex-shrink: 0;
}
.ex-time {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 11px;
color: var(–text-dim);
white-space: nowrap;
flex-shrink: 0;
margin-left: 8px;
min-width: 38px;
text-align: right;
}

/* ===================== */
/* MUSCLE GRID (v1.2: tappable with explainers) */
/* ===================== */
.muscle-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.muscle-cell {
border-radius: 10px;
padding: 12px;
transition: all 0.3s ease;
border: 1px solid var(–border);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
}
.muscle-cell:active { opacity: 0.85; }
.muscle-cell-header {
display: flex;
align-items: center;
justify-content: space-between;
}
.muscle-name {
font-size: 17px;
font-weight: 600;
}
.muscle-urgency {
font-size: 9px;
font-weight: 600;
padding: 2px 6px;
border-radius: 4px;
font-family: ‘Space Grotesk’, sans-serif;
text-transform: uppercase;
letter-spacing: 0.5px;
}
.muscle-stat {
font-size: 12px;
color: var(–text-mid);
font-family: ‘Space Grotesk’, sans-serif;
margin-top: 5px;
}
.muscle-detail {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
grid-column: 1 / -1;
}
.muscle-detail.open {
opacity: 1;
}
.muscle-detail-inner {
padding: 14px;
background: var(–surface2);
border-radius: 10px;
border: 1px solid var(–border);
font-size: 14px;
color: var(–text-mid);
line-height: 1.55;
}
.muscle-detail-inner strong {
color: var(–text);
font-weight: 600;
}

/* ===================== */
/* WEIGHT TAB            */
/* ===================== */
.weight-header {
display: flex;
align-items: baseline;
justify-content: space-between;
margin-bottom: 18px;
}
.weight-left {
display: flex;
align-items: baseline;
gap: 8px;
}
.weight-chart {
width: 100%;
height: 150px;
position: relative;
}
.weight-chart canvas { width: 100%; height: 100%; }
.weight-current {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 32px;
font-weight: 700;
letter-spacing: -1px;
color: var(–text);
}
.weight-delta {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 14px;
}
.weight-unit {
font-size: 14px;
color: var(–text-dim);
}

/* Constraints chips */
.constraints-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 14px;
}
.constraint-chip {
padding: 5px 10px;
font-size: 13px;
font-weight: 500;
font-family: ‘Space Grotesk’, sans-serif;
background: var(–surface2);
color: var(–text-dim);
border: 1px solid var(–border);
border-radius: 6px;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
transition: all 0.15s ease;
user-select: none;
}
.constraint-chip:active {
transform: scale(0.96);
}
.constraint-chip.active {
color: var(–accent);
border-color: rgba(74, 222, 128, 0.3);
background: var(–accent-dim);
}
.chart-legend {
display: flex;
gap: 16px;
margin-top: 12px;
font-size: 12px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–text-mid);
}
.legend-dot {
display: inline-block;
width: 8px;
height: 8px;
border-radius: 50%;
margin-right: 5px;
vertical-align: middle;
}

/* Weight input form */
.btn-log-weight {
padding: 5px 12px;
font-size: 13px;
font-weight: 600;
background: var(–accent-dim);
color: var(–accent);
border: 1px solid rgba(74, 222, 128, 0.25);
border-radius: 7px;
cursor: pointer;
font-family: ‘Figtree’, sans-serif;
-webkit-tap-highlight-color: transparent;
transition: all 0.2s ease;
}
.btn-log-weight:active {
transform: scale(0.96);
}
/* HISTORY - HEATMAP (v1.1: no scroll) */
/* ===================== */
.heatmap-container {
margin: 0 -4px;
padding: 0 4px;
}
.heatmap-grid {
display: grid;
gap: 3px;
}
.heatmap-label {
font-size: 12px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–text-mid);
display: flex;
align-items: center;
padding-right: 6px;
white-space: nowrap;
position: sticky;
left: 0;
background: var(–surface);
z-index: 2;
}
.heatmap-cell {
width: 16px;
height: 16px;
border-radius: 3px;
background: var(–surface2);
cursor: pointer;
transition: opacity 0.15s ease;
}
.heatmap-cell:active {
opacity: 0.7;
}
.heatmap-day-labels {
font-size: 10px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–text-dim);
display: flex;
align-items: flex-end;
padding-bottom: 4px;
text-align: center;
justify-content: center;
}
.heatmap-day-detail {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
margin-top: 0;
}
.heatmap-day-detail.open {
opacity: 1;
margin-top: 12px;
}
.heatmap-day-detail-inner {
padding: 14px;
background: var(–surface2);
border-radius: 10px;
border: 1px solid var(–border);
font-size: 14px;
line-height: 1.6;
}
.heatmap-day-detail-inner .detail-date {
font-weight: 600;
margin-bottom: 8px;
font-size: 13px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–text-mid);
}
.heatmap-day-detail-inner .detail-exercise {
display: flex;
justify-content: space-between;
align-items: baseline;
padding: 4px 0;
}
.heatmap-day-detail-inner .detail-name {
font-weight: 500;
font-size: 14px;
color: var(–text);
}
.heatmap-day-detail-inner .detail-sets {
font-size: 12px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–accent);
flex-shrink: 0;
}

/* ===================== */
/* LOADING & ERROR       */
/* ===================== */
.loading {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 60vh;
gap: 18px;
}
.spinner {
width: 28px; height: 28px;
border: 2.5px solid var(–border);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
font-size: 14px;
color: var(–text-dim);
font-family: ‘Space Grotesk’, sans-serif;
}
.error-msg {
background: var(–danger-dim);
border: 1px solid rgba(248,113,113,0.2);
border-radius: 10px;
padding: 14px;
font-size: 14px;
color: var(–danger);
margin-bottom: 14px;
line-height: 1.4;
}

/* Health Vitals */
.vitals-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-top: 14px;
}
.vital-cell {
padding: 12px;
border-radius: 10px;
border: 1px solid var(–border);
background: var(–surface2);
}
.vital-label {
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1px;
color: var(–text-dim);
margin-bottom: 6px;
}
.vital-value {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 22px;
font-weight: 700;
color: var(–text);
line-height: 1.2;
}
.vital-unit {
font-size: 12px;
font-weight: 400;
color: var(–text-dim);
margin-left: 2px;
}
.vital-context {
font-size: 11px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–text-dim);
margin-top: 4px;
}

/* Cardio Fitness Score */
.cardio-score-row {
margin-bottom: 14px;
padding-bottom: 14px;
border-bottom: 1px solid var(–border);
}
.cardio-score-header {
display: flex;
align-items: baseline;
justify-content: space-between;
margin-bottom: 10px;
}
.cardio-score-left {
display: flex;
align-items: baseline;
gap: 6px;
}
.cardio-score-value {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 28px;
font-weight: 700;
color: var(–text);
}
.cardio-score-unit {
font-size: 12px;
color: var(–text-dim);
}
.cardio-score-label {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 14px;
font-weight: 600;
}
.cardio-score-bar-wrap {
height: 6px;
border-radius: 3px;
background: var(–surface3);
overflow: hidden;
position: relative;
}
.cardio-score-bar {
height: 100%;
border-radius: 3px;
transition: width 0.6s ease;
}
.cardio-score-scale {
display: flex;
justify-content: space-between;
margin-top: 4px;
font-size: 10px;
font-family: ‘Space Grotesk’, sans-serif;
color: var(–text-dim);
}

.hidden { display: none; }
</style>

</head>
<body>
<div class="app" id="app">

  <!-- Loading Screen -->

  <div id="loading-screen" class="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Connecting to Hevy...</div>
  </div>

  <!-- Main Dashboard -->

  <div id="dashboard" class="hidden">
    <div class="header">
      <div style="display:flex;align-items:baseline;gap:10px;">
        <h1>LiftScript</h1>
        <div class="subtitle" id="last-updated">v1.12</div>
        <button id="header-refresh-btn" onclick="refreshData()" title="Refresh data" style="background:none;border:none;cursor:pointer;padding:2px 4px;margin-left:auto;position:relative;top:1px;line-height:1;-webkit-tap-highlight-color:transparent;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:block;">
            <path d="M13.65 2.35A7.96 7.96 0 008 0C3.58 0 .01 3.58.01 8S3.58 16 8 16c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 018 14 6 6 0 012 8a6 6 0 016-6c1.66 0 3.14.69 4.22 1.78L9 7h7V0l-2.35 2.35z" fill="#8e8e98"/>
          </svg>
        </button>
      </div>
    </div>

<div class="tabs">
  <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
  <button class="tab" data-tab="muscles" onclick="switchTab('muscles')">Muscles</button>
  <button class="tab" data-tab="history" onclick="switchTab('history')">History</button>
  <button class="tab" data-tab="weight" onclick="switchTab('weight')">Body</button>
</div>

<!-- Today Tab -->

<div id="tab-today">
  <div class="card" style="border:1px solid #2a2a2e;">
    <div class="card-title">Today's Session</div>
    <div id="constraints-row" class="constraints-row"></div>
    <div id="session-summary"></div>
    <div id="suggested-exercises"></div>
  </div>
  <div class="card" id="cardio-card" style="border:1px solid #2a2a2e;">
    <div class="card-title">Cardio Plan</div>
    <div id="cardio-summary"></div>
    <div id="cardio-prescriptions"></div>
  </div>
</div>

<!-- Muscles Tab -->

<div id="tab-muscles" class="hidden">
  <div class="card">
    <div class="card-title" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleSectionExplainer('muscle-grid-legend',this)">
      <span>Muscle Group Status</span>
      <span class="section-chevron" style="font-size:10px;color:var(--text-dim);transition:transform 0.3s ease;display:inline-block;">&#9662;</span>
    </div>
    <div id="muscle-grid" class="muscle-grid"></div>
    <div class="muscle-detail" id="muscle-detail">
      <div class="muscle-detail-inner" id="muscle-detail-inner"></div>
    </div>
  </div>
</div>

<!-- History Tab -->

<div id="tab-history" class="hidden">
  <div class="card" id="weekly-summary-card">
    <div class="card-title">This Week</div>
    <div id="weekly-summary"></div>
  </div>
  <div class="card">
    <div class="card-title">Training Heatmap</div>
    <div class="heatmap-container" id="heatmap-container"></div>
    <div class="heatmap-day-detail" id="heatmap-day-detail">
      <div class="heatmap-day-detail-inner" id="heatmap-day-detail-inner"></div>
    </div>
  </div>
</div>

<!-- Weight Tab -->

<div id="tab-weight" class="hidden">
  <div class="card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Body Weight & Strength</span>
    </div>
    <div class="weight-header">
      <div class="weight-left">
        <span class="weight-current" id="weight-current">--</span>
        <span class="weight-delta" id="weight-delta"></span>
        <span class="weight-unit">lbs</span>
      </div>
    </div>
    <!-- v1.7: Compact strength detail (Option A) -->
    <div id="strength-detail" style="margin-bottom:14px;"></div>
    <div class="weight-chart">
      <canvas id="weight-canvas"></canvas>
    </div>
    <div class="chart-legend">
      <span><span class="legend-dot" style="background:#4ade80"></span>Weight</span>
      <span><span class="legend-dot" style="background:#818cf8"></span>Strength Score</span>
    </div>
  </div>

  <!-- Health Vitals Card -->

  <div class="card" id="health-vitals-card" style="display:none;">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Health Vitals</span>
      <span class="health-sync-time" id="health-sync-time" style="font-size:11px;font-family:'Space Grotesk',sans-serif;color:var(--text-dim);text-transform:none;letter-spacing:0;"></span>
    </div>
    <!-- Cardio Fitness Score -->
    <div class="cardio-score-row" id="cardio-score-row">
      <div class="cardio-score-header">
        <div class="cardio-score-left">
          <span class="cardio-score-value" id="cardio-score-value">--</span>
          <span class="cardio-score-unit">mL/kg/min</span>
        </div>
        <div class="cardio-score-label" id="cardio-score-label">--</div>
      </div>
      <div class="cardio-score-bar-wrap">
        <div class="cardio-score-bar" id="cardio-score-bar"></div>
      </div>
      <div class="cardio-score-scale">
        <span>Low</span><span>Fair</span><span>Good</span><span>High</span><span>Elite</span>
      </div>
    </div>
    <!-- Vitals Grid -->
    <div class="vitals-grid" id="vitals-grid"></div>
  </div>

  <!-- Body Measurements Card (v1.7) -->

  <div class="card" id="measurements-card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Body Measurements</span>
      <div style="display:flex;gap:6px;">
        <button class="btn-log-weight" onclick="exportEmbeddableData()" style="background:rgba(142,142,152,0.12);color:#8e8e98;font-size:11px;padding:4px 8px;">ðŸ“‹ Export</button>
        <button class="btn-log-weight" onclick="document.getElementById('hevy-csv-input').click()" style="background:rgba(96,165,250,0.12);color:#60a5fa;">â¬† Import Hevy</button>
      </div>
    </div>
    <input type="file" id="hevy-csv-input" accept=".csv" style="display:none;" onchange="importHevyCSV(this)">
    <div id="hevy-import-status" style="display:none;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;font-family:'Space Grotesk',sans-serif;"></div>
    <div id="measurements-display"></div>
    <div id="proportions-display" style="margin-top:14px;"></div>
  </div>
</div>

  </div>
</div>

<script>
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('loading-text');
  if (el) el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('loading-text');
  if (el) el.textContent = 'Promise Error: ' + (e.reason ? e.reason.message || e.reason : 'unknown');
});
</script>

<script>
// ============================================================
// LIFTSCRIPT v1.13
// ============================================================
// SCIENTIFIC FOUNDATION
// PILLAR 1: Volume-Hypertrophy Targets
// Source: Schoenfeld et al. (2017) "Dose-response relationship between weekly resistance
// training volume and increases in muscle mass"
// Targets scaled to ~65% of Schoenfeld optimal for recreational gym-goers (3-4x/week)
// PILLAR 2: Strength Standards / Percentile Benchmarks
// Based on OpenPowerlifting data, shifted to general gym-going population norms:
// competition 25th percentile \u00E2\u2030\u02C6 gym-population 50th percentile
// PILLAR 3: 1RM Estimation - Brzycki (1993), Epley (1985)

// ============================================================
// 1RM ESTIMATION (Pillar 3)
// ============================================================
function estimate1RM_Brzycki(weightLbs, reps) {
  if (reps <= 0) return 0;
  if (reps === 1) return weightLbs;
  if (reps >= 37) return weightLbs;
  return weightLbs * (36 / (37 - reps));
}

function estimate1RM_Epley(weightLbs, reps) {
  if (reps <= 0) return 0;
  if (reps === 1) return weightLbs;
  return weightLbs * (1 + reps / 30);
}

function estimate1RM(weightLbs, reps) {
  if (reps <= 10) return estimate1RM_Brzycki(weightLbs, reps);
  return estimate1RM_Epley(weightLbs, reps);
}

// ============================================================
// PERCENTILE ESTIMATION
// ============================================================
function estimatePercentile(standardKey, bwMultiplier) {
  const std = STRENGTH_STANDARDS[standardKey];
  if (!std || !std.multipliers) return null;
  const m = std.multipliers;
  const pctiles = [10, 25, 50, 75, 90];

  if (bwMultiplier <= m[0]) return Math.round((bwMultiplier / m[0]) * 10);
  if (bwMultiplier >= m[4]) return Math.min(99, 90 + Math.round(((bwMultiplier - m[4]) / (m[4] * 0.2)) * 9));

  for (let i = 0; i < m.length - 1; i++) {
    if (bwMultiplier >= m[i] && bwMultiplier <= m[i + 1]) {
      const frac = (bwMultiplier - m[i]) / (m[i + 1] - m[i]);
      return Math.round(pctiles[i] + frac * (pctiles[i + 1] - pctiles[i]));
    }
  }
  return 50;
}

// ============================================================
// TIME ESTIMATION
// ============================================================
const TIME_CONSTANTS = {
  compoundSetSec: 45,
  isolationSetSec: 35,
  restBetweenSets: 120,
  transitionSec: 90,
  sessionCapMin: 60,
};

function calculateExerciseTime(exerciseName, sets) {
  const db = EXERCISE_DB[exerciseName];
  const isCompound = db && db.type === 'compound';
  const setTime = isCompound ? TIME_CONSTANTS.compoundSetSec : TIME_CONSTANTS.isolationSetSec;
  return (sets * setTime) + ((sets - 1) * TIME_CONSTANTS.restBetweenSets) + TIME_CONSTANTS.transitionSec;
}

// Consistent working-set extraction used everywhere
function getWorkingSets(exercise) {
  return (exercise.sets || []).filter(s =>
    s.set_type === 'normal' || !s.set_type
  );
}

// Normalize exercise name for caching/matching
function normalizeExerciseName(name) {
  return (name || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[\u2018\u2019\u2032]/g, "'");
}

// Format set counts: show decimals only when fractional
function formatSets(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

// Classification cache keyed by template_id or normalized name
const _classifyCache = new Map();

function classifyExerciseCached(exercise) {
  const key = exercise.exercise_template_id || normalizeExerciseName(exercise.title || '');
  if (_classifyCache.has(key)) return _classifyCache.get(key);
  const result = classifyExercise(exercise.title || '');
  _classifyCache.set(key, result);
  return result;
}

  /treadmill/i, /elliptical/i, /\bbike\b/i, /cycling/i, /rowing machine/i,
  /jump rope/i, /jumping jack/i, /burpee/i, /stair/i, /running/i, /walking/i,
];

function classifyExercise(name) {
  for (const c of CARDIO_PATTERNS) {
    if (c.test(name)) return { primary: 'cardio', secondary: [] };
  }
  for (const m of EXERCISE_MUSCLE_MAP) {
    if (m.pattern.test(name)) return { primary: m.primary, secondary: m.secondary };
  }
  return { primary: 'other', secondary: [] };
}

// STORAGE UTILITY \u00E2\u20AC\u201D centralized localStorage with error boundaries
// ============================================================
const Storage = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn(`Storage.get('${key}') failed:`, e.message);
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.warn(`Storage.set('${key}') failed:`, e.message);
      return false;
    }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch (e) { /* silent */ }
  }
};

function getStoredWeightEntries() {

function saveWeightEntry(date, value) {
  const entries = getStoredWeightEntries();
  const idx = entries.findIndex(e => e.date === date);
  if (idx !== -1) {
    entries[idx].value = value;          // overwrite existing date
  } else {
    entries.push({ date, value });
  }
  entries.sort((a, b) => a.date.localeCompare(b.date));
  // Cap at 400 entries \u00E2\u20AC\u201D drop oldest
  if (entries.length > 400) entries.splice(0, entries.length - 400);
  Storage.set('weightHistory', entries);
}

function getMergedWeightData() {
  const stored = getStoredWeightEntries();
  // Apple Health weight entries from iOS Shortcut (via Hevy \u00E2\u2020\u2019 HealthKit)
  const appleEntries = (healthData && Array.isArray(healthData.weight_entries))
    ? healthData.weight_entries.map(e => ({ date: e.date, value: parseFloat(e.lbs) || 0 })).filter(e => e.value > 0)
    : [];
  const all = [...WEIGHT_DATA_BASELINE, ...appleEntries, ...stored];
  // Dedup by date \u00E2\u20AC\u201D later sources win (stored > apple > baseline)
  const byDate = {};
  for (const entry of all) {
    byDate[entry.date] = entry.value;
  }
  return Object.entries(byDate)
    .map(([date, value]) => ({ date, value }))
    .sort((a, b) => b.date.localeCompare(a.date));
}

  if (idx !== -1) {

    entries[idx] = Object.assign({}, entries[idx], entry);
  } else {
    entries.push(entry);
  }
  entries.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (entries.length > 400) entries.splice(0, entries.length - 400);

function getLatestMeasurements() {
  const entries = getStoredMeasurements();
  if (entries.length === 0 && !(healthData && healthData.waist_circumference_in)) return null;
  // Merge all entries \u00E2\u20AC\u201D latest value per field wins
  const latest = {};
  const dates = {};
  // Sort chronologically so later entries overwrite
  const sorted = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  for (const entry of sorted) {
    for (const field of MEASUREMENT_FIELDS) {
      if (entry[field.key] != null && entry[field.key] !== '' && !isNaN(entry[field.key])) {
        latest[field.key] = parseFloat(entry[field.key]);
        dates[field.key] = entry.date;
      }
    }
  }
  // Merge Apple Health waist if we don't have a manual entry or Apple is newer
  if (healthData && healthData.waist_circumference_in > 0) {
    const ahDate = healthData.waist_date || '';
    if (!latest.waist_in || (ahDate && ahDate > (dates.waist_in || ''))) {
      latest.waist_in = healthData.waist_circumference_in;
      dates.waist_in = ahDate;
    }
  }
  if (Object.keys(latest).length === 0) return null;
  latest._dates = dates;
  return latest;
}

// ---- Phase 3: Compute proportion deficit scores ----
function computeProportionDeficits(measurements) {
  if (!measurements) return {};
  const deficits = {};

  for (const [fieldKey, ft] of Object.entries(FRAME_TARGETS)) {
    if (!ft.target || !ft.muscle) continue; // skip display-only entries
    const current = measurements[fieldKey];
    if (current == null || current <= 0) continue;

    if (ft.inverted) {
      // Waist: over target = deficit (bigger is worse)
      deficits[ft.muscle] = Math.max(0, (current / ft.target) - 1);
    } else {
      // All other muscles: under target = deficit
      deficits[ft.muscle] = Math.max(0, 1 - (current / ft.target));
    }
  }
  return deficits;
}

const API_BASE = 'https://api.hevyapp.com/v1';
const FETCH_TIMEOUT_MS = 15000;

function fetchWithTimeout(url, options, timeoutMs) {
  timeoutMs = timeoutMs || FETCH_TIMEOUT_MS;
  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('Network timeout after ' + (timeoutMs / 1000) + 's')); }, timeoutMs);
    })
  ]);
}
const CACHE_KEY = 'workoutCache_v1';
const CACHE_STALE_MS = 8 * 60 * 60 * 1000; // 8 hours

function getCachedWorkouts() {
  const parsed = Storage.get(CACHE_KEY, null);
  if (!parsed || !parsed.ts || !parsed.data) return null;
  return parsed;
}

function setCachedWorkouts(workouts) {
  Storage.set(CACHE_KEY, { ts: Date.now(), data: workouts });
}

function isCacheStale(cached) {
  return !cached || (Date.now() - cached.ts) > CACHE_STALE_MS;
}

async function fetchWorkouts(pageSize = 10, maxPages = 10) {
  const allWorkouts = [];
  let page = 1;
  let totalPages = 1;

  while (page <= totalPages && page <= maxPages) {
    updateLoading(`Loading workouts (${allWorkouts.length})...`);
    const resp = await fetchWithTimeout(`${API_BASE}/workouts?page=${page}&pageSize=${pageSize}`, {
      headers: { 'api-key': apiKey }
    });
    if (!resp.ok) throw new Error(`API error ${resp.status}: ${resp.statusText}`);
    const data = await resp.json();
    totalPages = data.page_count || 1;
    if (data.workouts) allWorkouts.push(...data.workouts);
    page++;
  }
  return allWorkouts;
}

// Single pass over workouts producing all downstream data
// ============================================================
function preprocessWorkouts(workouts, bodyweightLbs, weightData) {
  const now = new Date();
  const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

  // Sort oldest -> newest for history building
  const sorted = [...workouts].sort((a, b) =>
    new Date(a.start_time || a.created_at) - new Date(b.start_time || b.created_at)
  );

  // ---- Output structures ----
  const exHistory = {};
  const muscleStats = {};
  const muscle1RMInputs = {}; // { muscleKey: { best1RM, exercise } }
  const siRolling1RMs = { bench: 0, squat: 0, deadlift: 0, ohp: 0, row: 0 };
  const siTimeline = [];
  const heatmapDayMuscle = {};
  const heatmapDayWorkouts = {};
  const heatmapDayCardio = {}; // dateStr \u00E2\u2020\u2019 { minutes, sessions: [{ name, minutes, source }] }

  // Init muscle stats
  for (const [key, meta] of Object.entries(MUSCLE_GROUPS)) {
    muscleStats[key] = {
      key, name: meta.name, color: meta.color,
      idealFreqDays: meta.idealFreqDays, idealSetsPerWeek: meta.idealSetsPerWeek,
      lastTrainedPrimary: null, daysSincePrimary: Infinity,
      lastTrainedAny: null, daysSinceAny: Infinity,
      totalSets30d: 0, totalVolume30d: 0, sessionCount30d: 0, exercises: new Set(),
    };
    muscle1RMInputs[key] = { best1RM: 0, exercise: '' };
  }

  // Weight data sorted for SI interpolation
  const weightSorted = [...weightData].sort((a, b) => a.date.localeCompare(b.date));
  function getBodyweightAt(dateStr) {
    let bw = bodyweightLbs;
    for (const w of weightSorted) {
      if (w.date <= dateStr) bw = w.value;
      else break;
    }
    return bw;
  }

  // ---- Single pass ----
  for (const w of sorted) {
    const wDate = new Date(w.start_time || w.created_at);
    const dateStr = localDateStr(wDate);
    const isRecent = wDate >= thirtyDaysAgo;
    const musclesThisWorkout = new Set();
    let siUpdated = false;

    if (!heatmapDayMuscle[dateStr]) heatmapDayMuscle[dateStr] = {};
    if (!heatmapDayWorkouts[dateStr]) heatmapDayWorkouts[dateStr] = [];

    for (const ex of (w.exercises || [])) {
      const name = ex.title || '';
      if (!name) continue;

      const classification = classifyExerciseCached(ex);
      const workingSets = getWorkingSets(ex);

      // --- Exercise history ---
      if (workingSets.length > 0) {
        let bestWeight = 0, bestReps = 0;
        for (const s of workingSets) {
          const wLbs = Math.round((s.weight_kg || 0) * 2.20462);
          if (wLbs > bestWeight) { bestWeight = wLbs; bestReps = s.reps || 0; }
        }
        if (!exHistory[name]) exHistory[name] = { weights: [], dates: [] };
        exHistory[name].lastWeightLbs = bestWeight;
        exHistory[name].lastReps = bestReps;
        exHistory[name].lastDate = wDate;
        exHistory[name].lastSets = workingSets.length;
        exHistory[name].weights.push(bestWeight);
        exHistory[name].dates.push(wDate);
      }

      if (classification.primary === 'cardio') {
        // Accumulate cardio minutes for heatmap row
        let cardioMin = 0;
        for (const s of (ex.sets || [])) {
          if (s.duration_seconds && s.duration_seconds > 0) {
            cardioMin += s.duration_seconds / 60;
          }
        }
        // Conservative default: if cardio exercise exists but has no duration data, assume 15 min
        if (cardioMin === 0 && (ex.sets || []).length > 0) cardioMin = 15;
        if (cardioMin > 0) {
          if (!heatmapDayCardio[dateStr]) heatmapDayCardio[dateStr] = { minutes: 0, sessions: [] };
          heatmapDayCardio[dateStr].minutes += cardioMin;
          heatmapDayCardio[dateStr].sessions.push({ name, minutes: Math.round(cardioMin), source: 'hevy' });
        }
      }

      if (classification.primary === 'cardio' || classification.primary === 'other') continue;

      const setCount = workingSets.length;
      const allMuscles = [classification.primary, ...classification.secondary];

      // --- Muscle stats (30d) ---
      for (const muscle of allMuscles) {
        if (!muscleStats[muscle]) continue;
        const stat = muscleStats[muscle];
        const isPrimary = muscle === classification.primary;

        // Track recency: primary vs any (secondary) separately
        // This prevents secondary stimulus (e.g. RDLs for back) from
        // resetting the "last trained" clock on back, which would
        // incorrectly suppress back recommendations.
        if (!stat.lastTrainedAny || wDate > stat.lastTrainedAny) {
          stat.lastTrainedAny = wDate;
          stat.daysSinceAny = Math.floor((now - wDate) / (1000 * 60 * 60 * 24));
        }
        if (isPrimary && (!stat.lastTrainedPrimary || wDate > stat.lastTrainedPrimary)) {
          stat.lastTrainedPrimary = wDate;
          stat.daysSincePrimary = Math.floor((now - wDate) / (1000 * 60 * 60 * 24));
        }

        if (isRecent) {
          const weight = isPrimary ? 1.0 : 0.5;
          stat.totalSets30d += setCount * weight;
          for (const s of workingSets) {
            stat.totalVolume30d += (s.reps || 0) * (s.weight_kg || 0) * weight;
          }
          stat.exercises.add(name);
          musclesThisWorkout.add(muscle);
        }
      }

      // --- Heatmap data ---
      for (const muscle of allMuscles) {
        if (!MUSCLE_GROUPS[muscle]) continue;
        const isPrimary = muscle === classification.primary;
        const weight = isPrimary ? 1.0 : 0.5;
        heatmapDayMuscle[dateStr][muscle] = (heatmapDayMuscle[dateStr][muscle] || 0) + setCount * weight;
      }

      // Heatmap detail
      const bestSet = workingSets.reduce((best, s) => {
        const wLbs = Math.round((s.weight_kg || 0) * 2.20462);
        return wLbs > (best.w || 0) ? { w: wLbs, r: s.reps || 0 } : best;
      }, {});
      heatmapDayWorkouts[dateStr].push({
        name, sets: setCount,
        bestWeight: bestSet.w || 0, bestReps: bestSet.r || 0,
      });

      // --- Muscle 1RM (last 30d) ---
      if (isRecent) {
        for (const [muscleKey, keyLift] of Object.entries(MUSCLE_KEY_LIFTS)) {
          const matched = keyLift.patterns.some(p => p.test(name));
          if (!matched) continue;
          for (const s of workingSets) {
            const wLbs = (s.weight_kg || 0) * 2.20462;
            const reps = s.reps || 0;
            if (wLbs <= 0 || reps <= 0) continue;
            const est = estimate1RM(wLbs, reps);
            if (est > muscle1RMInputs[muscleKey].best1RM) {
              muscle1RMInputs[muscleKey].best1RM = est;
              muscle1RMInputs[muscleKey].exercise = name;
            }
          }
        }
      }

      // --- Strength index timeline ---
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        const matched = liftDef.patterns.some(p => p.test(name));
        if (!matched) continue;
        for (const s of workingSets) {
          const wLbs = (s.weight_kg || 0) * 2.20462;
          const reps = s.reps || 0;
          if (wLbs <= 0 || reps <= 0) continue;
          const est = estimate1RM(wLbs, reps);
          if (est > siRolling1RMs[liftKey]) {
            siRolling1RMs[liftKey] = est;
            siUpdated = true;
          }
        }
      }
    }

    // Session count
    if (isRecent) {
      for (const m of musclesThisWorkout) {
        if (muscleStats[m]) muscleStats[m].sessionCount30d++;
      }
    }

    // Strength Score data point (normalized: 1.0 = 50th percentile gym-goer for user's age)
    const hasData = Object.values(siRolling1RMs).some(v => v > 0);
    if (hasData) {
      const bw = getBodyweightAt(dateStr);
      const lifts = {};
      let totalWeight = 0;

      // First pass: identify which lifts have data and sum their weights
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        if (siRolling1RMs[liftKey] > 0) totalWeight += liftDef.weight;
      }

      // Second pass: compute normalized score with re-weighted lifts
      let index = 0;
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        const mult = bw > 0 ? siRolling1RMs[liftKey] / bw : 0;
        const normalized = liftDef.p50 > 0 ? mult / liftDef.p50 : 0;
        const adjustedWeight = totalWeight > 0 ? liftDef.weight / totalWeight : 0;
        if (siRolling1RMs[liftKey] > 0) {
          index += normalized * adjustedWeight;
        }
        lifts[liftKey] = { rm: Math.round(siRolling1RMs[liftKey]), mult: Math.round(mult * 100) / 100 };
      }
      siTimeline.push({ date: dateStr, index: Math.round(index * 100) / 100, lifts: { ...lifts } });
    }
  }

  // Finalize muscle 1RMs with percentiles
  const muscle1RMResults = {};
  for (const [key, data] of Object.entries(muscle1RMInputs)) {
    const keyLift = MUSCLE_KEY_LIFTS[key];
    const bwMult = bodyweightLbs > 0 ? data.best1RM / bodyweightLbs : 0;
    const percentile = estimatePercentile(keyLift.standard, bwMult);
    muscle1RMResults[key] = {
      best1RM: Math.round(data.best1RM),
      bwMult: Math.round(bwMult * 100) / 100,
      percentile, exercise: data.exercise,
    };
  }

  // Merge Apple Watch cardio into heatmap (dedup against Hevy within 30 min)
  const WATCH_NON_CARDIO_HM = /strength|weight\s*train|yoga|pilates|stretch|cool\s*down|flexibility|mind.*body|tai\s*chi/i;
  if (healthData && Array.isArray(healthData.workouts)) {
    // Collect Hevy cardio timestamps for dedup
    const hevyCardioTs = [];
    for (const [dateStr, cd] of Object.entries(heatmapDayCardio)) {
      for (const sess of cd.sessions) {
        if (sess.source === 'hevy') {
          // Approximate timestamp from date
          hevyCardioTs.push(new Date(dateStr + 'T12:00:00').getTime());
        }
      }
    }
    for (const aw of healthData.workouts) {
      if (WATCH_NON_CARDIO_HM.test(aw.type || '')) continue;
      const startStr = (aw.start || '').replace(/\s+at\s+/i, ' ');
      const awDate = new Date(startStr);
      if (isNaN(awDate.getTime())) continue;
      const dur = parseFloat(aw.duration_min) || 0;
      if (dur <= 0) continue;
      const dateStr = localDateStr(awDate);
      // Dedup: skip if Hevy cardio on same day within 30 min
      const DEDUP_MS = 30 * 60 * 1000;
      const isDup = hevyCardioTs.some(ts => Math.abs(ts - awDate.getTime()) < DEDUP_MS);
      if (isDup) continue;
      if (!heatmapDayCardio[dateStr]) heatmapDayCardio[dateStr] = { minutes: 0, sessions: [] };
      heatmapDayCardio[dateStr].minutes += dur;
      heatmapDayCardio[dateStr].sessions.push({ name: aw.type || 'Cardio', minutes: Math.round(dur), source: 'watch' });
    }
  }

  return {
    exerciseHistory: exHistory,
    muscleStats,
    muscle1RMs: muscle1RMResults,
    strengthIndexTimeline: siTimeline,
    heatmapDayMuscle,
    heatmapDayWorkouts,
    heatmapDayCardio,
  };
}

// ============================================================
// CARDIOVASCULAR TRAINING ENGINE (Pillar 5)
// ============================================================
// SCIENTIFIC FOUNDATION
// Source 1: ACSM (2018) "Guidelines for Exercise Testing & Prescription" (11th ed)
//   - 150 min/week moderate OR 75 min/week vigorous, or equivalent combination
// Source 2: Seiler (2010) "What is Best Practice for Training Intensity and Duration
//   Distribution in Endurance Athletes?" - polarized 80/20 model
// Source 3: Tanaka et al. (2001) "Age-predicted maximal heart rate revisited"
//   - HRmax = 208 - 0.7 \u00C3\u2014 age (more accurate than 220-age)
// Source 4: Karvonen (1957) "Heart Rate Reserve" method for HR zones
//   - Target HR = ((HRmax - HRrest) \u00C3\u2014 %intensity) + HRrest
// Source 5: St\u00F6ggl & Sperlich (2014) "Polarized training has greater impact on key
//   endurance variables than threshold, high-intensity, or high-volume training"

// HR Zone calculations
function calculateHRZones(age, restingHR) {
  // Tanaka formula (Source 3)
  const hrMax = Math.round(208 - 0.7 * age);

  if (restingHR && restingHR > 0) {
    // Karvonen method (Source 4) - more personalized
    const hrr = hrMax - restingHR;
    return {
      hrMax,
      method: 'karvonen',
      zone1: { low: Math.round(restingHR + hrr * 0.50), high: Math.round(restingHR + hrr * 0.60), label: 'Recovery' },
      zone2: { low: Math.round(restingHR + hrr * 0.60), high: Math.round(restingHR + hrr * 0.70), label: 'Aerobic Base' },
      zone3: { low: Math.round(restingHR + hrr * 0.70), high: Math.round(restingHR + hrr * 0.80), label: 'Tempo' },
      zone4: { low: Math.round(restingHR + hrr * 0.80), high: Math.round(restingHR + hrr * 0.90), label: 'Threshold' },
      zone5: { low: Math.round(restingHR + hrr * 0.90), high: hrMax, label: 'VO2max' },
    };
  }

  // Fallback: straight %HRmax
  return {
    hrMax,
    method: 'hrmax',
    zone1: { low: Math.round(hrMax * 0.50), high: Math.round(hrMax * 0.60), label: 'Recovery' },
    zone2: { low: Math.round(hrMax * 0.60), high: Math.round(hrMax * 0.70), label: 'Aerobic Base' },
    zone3: { low: Math.round(hrMax * 0.70), high: Math.round(hrMax * 0.80), label: 'Tempo' },
    zone4: { low: Math.round(hrMax * 0.80), high: Math.round(hrMax * 0.90), label: 'Threshold' },
    zone5: { low: Math.round(hrMax * 0.90), high: hrMax, label: 'VO2max' },
  };
}

// Weekly targets (Source 1: ACSM + Source 2: Seiler polarized model)

  hiitPct: 0.20,          // Polarized: 20% hard

  hiitMinPerWeek: 30,     // 20% of 150 = 30 min (at vigorous = 60 min moderate-equivalent)
  sessionsPerWeek: 3,     // 2 easy + 1 hard
};

// Analyze cardio from workout history (last 7 days)
// Apple Watch workout types that count as cardio
// Only workouts explicitly started via the Watch Workouts app are included
// in health-data.json (the Shortcut filters source = Apple Watch).
// Keys are lowercase; matching uses exact then fuzzy fallback.
const APPLE_CARDIO_TYPES = {
  'indoor walk':    'treadmill',
  'outdoor walk':   'treadmill',
  'indoor run':     'treadmill',
  'outdoor run':    'treadmill',
  'indoor cycle':   'bike',
  'outdoor cycle':  'bike',
  'cycling':        'bike',
  'elliptical':     'elliptical',
  'stair climbing': 'stairclimber',
  'stair stepper':  'stairclimber',
  'stairstepper':   'stairclimber',
  'rowing':         'rower',
  'hiking':         'treadmill',
  'swimming':       'swimming',
  'cross training': 'cross-training',
  'walking':        'treadmill',
  'running':        'treadmill',
};

// Fuzzy fallback for workout types not in the exact map
const APPLE_CARDIO_FUZZY = [
  { pattern: /walk/i,      modality: 'treadmill' },
  { pattern: /run|jog/i,   modality: 'treadmill' },
  { pattern: /cycl|bike/i, modality: 'bike' },
  { pattern: /ellip/i,     modality: 'elliptical' },
  { pattern: /stair|step/i,modality: 'stairclimber' },
  { pattern: /row/i,       modality: 'rower' },
  { pattern: /hik/i,       modality: 'treadmill' },
  { pattern: /swim/i,      modality: 'swimming' },
  { pattern: /cross.?train/i, modality: 'cross-training' },
];

function resolveAppleCardioModality(type) {
  const lower = (type || '').toLowerCase().trim();
  if (APPLE_CARDIO_TYPES[lower]) return APPLE_CARDIO_TYPES[lower];
  for (const f of APPLE_CARDIO_FUZZY) {
    if (f.pattern.test(lower)) return f.modality;
  }
  return null; // not a recognized cardio type
}

function analyzeCardioHistory(workouts) {
  const now = new Date();
  const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

  let cardioSessions7d = 0;
  let estimatedMinutes7d = 0;
  const recentModalities = [];
  // Track session timestamps for dedup against Apple Health
  const hevyCardioTimestamps = [];
  // Track per-source breakdown for UI
  let hevySessions = 0;
  let appleSessions = 0;
  let hevyMinutes = 0;
  let appleMinutes = 0;
  const cardioLog = []; // per-session detail for breakdown

  // --- Pass 1: Hevy workouts ---
  for (const w of workouts) {
    const wDate = new Date(w.start_time || w.created_at);
    if (wDate < sevenDaysAgo) continue;

    let workoutHasCardio = false;
    let workoutCardioMin = 0;
    let workoutCardioName = '';

    for (const ex of (w.exercises || [])) {
      const name = ex.title || '';
      const isCardio = CARDIO_PATTERNS.some(p => p.test(name));
      if (!isCardio) continue;

      workoutHasCardio = true;
      if (!workoutCardioName) workoutCardioName = name;
      let sessionMin = 0;
      for (const s of (ex.sets || [])) {
        if (s.duration_seconds && s.duration_seconds > 0) {
          sessionMin += s.duration_seconds / 60;
        } else {
          sessionMin = 20;
          break;
        }
      }
      estimatedMinutes7d += sessionMin;
      hevyMinutes += sessionMin;
      workoutCardioMin += sessionMin;

      const modality = name.toLowerCase();
      if (/treadmill|walk|run/i.test(modality)) recentModalities.push('treadmill');
      else if (/bike|cycl/i.test(modality)) recentModalities.push('bike');
      else if (/elliptical/i.test(modality)) recentModalities.push('elliptical');
      else if (/stair/i.test(modality)) recentModalities.push('stairclimber');
      else if (/row/i.test(modality)) recentModalities.push('rower');
    }

    if (workoutHasCardio) {
      cardioSessions7d++;
      hevySessions++;
      hevyCardioTimestamps.push(wDate.getTime());
      cardioLog.push({
        source: 'hevy',
        type: workoutCardioName,
        date: wDate,
        minutes: workoutCardioMin,
        calories: 0,
      });
    }
  }

  // --- Pass 2: Apple Health Watch workouts ---
  // Everything in healthData.workouts[] was explicitly started on the Watch.
  // We count all workout types EXCEPT strength/flexibility \u00E2\u20AC\u201D those aren't cardio.
  const WATCH_NON_CARDIO = /strength|weight\s*train|yoga|pilates|stretch|cool\s*down|flexibility|mind.*body|tai\s*chi/i;

  if (healthData && Array.isArray(healthData.workouts)) {
    for (const aw of healthData.workouts) {
      // Parse flexible date: ISO or Shortcuts format "Feb 14, 2026 at 5:10 PM"
      const startStr = (aw.start || '').replace(/\s+at\s+/i, ' ');
      const awDate = new Date(startStr);
      if (isNaN(awDate.getTime()) || awDate < sevenDaysAgo) continue;

      // Skip non-cardio workout types (strength training, yoga, etc.)
      if (WATCH_NON_CARDIO.test(aw.type || '')) continue;

      // Dedup: skip if a Hevy cardio session started within 30 min
      const DEDUP_WINDOW_MS = 30 * 60 * 1000;
      const isDuplicate = hevyCardioTimestamps.some(
        ts => Math.abs(ts - awDate.getTime()) < DEDUP_WINDOW_MS
      );
      if (isDuplicate) continue;

      const dur = parseFloat(aw.duration_min) || 0;
      if (dur <= 0) continue;

      cardioSessions7d++;
      appleSessions++;
      estimatedMinutes7d += dur;
      appleMinutes += dur;

      // Best-effort modality tag for variety tracking
      const modality = resolveAppleCardioModality(aw.type) || 'other';
      recentModalities.push(modality);

      // Log for breakdown
      cardioLog.push({
        source: 'watch',
        type: aw.type || 'Unknown',
        date: awDate,
        minutes: dur,
        calories: parseFloat(aw.calories) || 0,
      });
    }
  }

  return {
    cardioSessions7d, estimatedMinutes7d, recentModalities,
    hevySessions, appleSessions, hevyMinutes, appleMinutes,
    cardioLog,
  };
}

// Generate cardio recommendations for today
function generateCardioRecommendations(workouts) {
  const rhr = healthData ? healthData.resting_heart_rate : null;
  const zones = calculateHRZones(PROFILE.age, rhr);
  const history = analyzeCardioHistory(workouts);

  const targetMin = CARDIO_WEEKLY_TARGETS.totalMinModerate;
  const remainingMin = Math.max(0, targetMin - history.estimatedMinutes7d);
  const targetSessions = CARDIO_WEEKLY_TARGETS.sessionsPerWeek;
  const remainingSessions = Math.max(0, targetSessions - history.cardioSessions7d);

  // If target met for the week
  if (remainingSessions <= 0 && remainingMin <= 0) {
    return { zones, history, prescriptions: [], weekComplete: true, remainingMin: 0, targetMin };
  }

  const prescriptions = [];

  // Decide session split: if 3+ sessions remain, prescribe 1 HIIT + 1 Zone 2
  // If 2 remain: 1 Zone 2 + 1 HIIT. If 1 remains: Zone 2 (safer default)
  // If sessions met but minutes remain, prescribe 1 Zone 2 to fill the gap
  const effectiveSessions = remainingSessions > 0 ? remainingSessions : (remainingMin > 0 ? 1 : 0);
  const needHIIT = effectiveSessions >= 2 && history.cardioSessions7d < 1;
  const zone2Count = needHIIT ? 1 : Math.min(effectiveSessions, 2);
  const hiitCount = needHIIT ? 1 : (effectiveSessions >= 2 ? 1 : 0);

  // Pick zone 2 protocols (avoid recently used modalities for variety)
  const z2Pool = CARDIO_PROTOCOLS.zone2.filter(p => !history.recentModalities.includes(p.modality));
  const z2Picks = z2Pool.length > 0 ? z2Pool : CARDIO_PROTOCOLS.zone2;

  for (let i = 0; i < zone2Count && i < z2Picks.length; i++) {
    const protocol = z2Picks[i % z2Picks.length];
    prescriptions.push({
      ...protocol,
      zone: 2,
      hrRange: `${zones.zone2.low}-${zones.zone2.high}`,
    });
  }

  // Pick HIIT protocol
  if (hiitCount > 0) {
    const hiitPool = CARDIO_PROTOCOLS.hiit.filter(p => !history.recentModalities.includes(p.modality));
    const hiitPicks = hiitPool.length > 0 ? hiitPool : CARDIO_PROTOCOLS.hiit;
    const protocol = hiitPicks[0];
    const hiitZone = protocol.zone || 4;
    const zoneData = hiitZone === 5 ? zones.zone5 : zones.zone4;
    prescriptions.push({
      ...protocol,
      zone: hiitZone,
      hrRange: `${zoneData.low}-${zoneData.high}`,
    });
  }

  return { zones, history, prescriptions, weekComplete: false, remainingMin, targetMin };
}

function toggleCardioBreakdown() {
  const el = document.getElementById('cardio-breakdown');
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function buildCardioBreakdownHTML(history) {
  const log = history.cardioLog || [];
  if (log.length === 0) {
    return `<div style="font-size:12px;font-family:'Space Grotesk',sans-serif;color:${C.textDark};">No cardio sessions this week.</div>`;
  }

  // Sort by date descending
  const sorted = [...log].sort((a, b) => b.date - a.date);

  // Source summary line
  const parts = [];
  if (history.hevySessions > 0) parts.push(`\u{1F3CB}\uFE0F Hevy: ${history.hevySessions} session${history.hevySessions > 1 ? 's' : ''}, ${Math.round(history.hevyMinutes)} min`);
  if (history.appleSessions > 0) parts.push(`\u231A Watch: ${history.appleSessions} session${history.appleSessions > 1 ? 's' : ''}, ${Math.round(history.appleMinutes)} min`);

  let html = `<div style="font-size:11px;font-family:'Space Grotesk',sans-serif;color:${C.textDim};margin-bottom:8px;">${parts.join(' \u00B7 ')}</div>`;

  // Per-session rows
  for (const s of sorted) {
    const dayStr = s.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const icon = s.source === 'watch' ? '\u231A' : '\u{1F3CB}\uFE0F';
    const calStr = s.calories > 0 ? ` \u00B7 ${Math.round(s.calories)} cal` : '';
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;font-family:'Space Grotesk',sans-serif;">
      <span style="color:${C.textMid};">${icon} ${s.type}</span>
      <span style="color:${C.textDark};">${Math.round(s.minutes)} min${calStr} \u00B7 ${dayStr}</span>
    </div>`;
  }

  return html;
}

function renderCardioPlan(workouts) {
  const result = generateCardioRecommendations(workouts);
  const summaryEl = document.getElementById('cardio-summary');
  const rxEl = document.getElementById('cardio-prescriptions');

  // Week progress bar
  const donePct = Math.min(100, Math.round(((result.targetMin - result.remainingMin) / result.targetMin) * 100));
  const doneMin = result.targetMin - result.remainingMin;

// ============================================================
// SMART WEIGHT PRESCRIPTION (Pillar 4)
// ============================================================
function prescribeExercise(name) {
  const db = EXERCISE_DB[name];
  const hist = exerciseHistory[name];

  let sets = db ? db.sets : 3;
  let reps = db ? db.reps : '8-10';
  let weightLbs = db ? db.benchmarkLbs : 0;
  let note = db ? (db.note || '') : '';

  if (hist && hist.lastWeightLbs > 0) {
    const lastW = hist.lastWeightLbs;
    const trend = hist.weights.length >= 3
      ? hist.weights.slice(-3).reduce((a, b) => a + b, 0) / 3
      : lastW;

    if (db && lastW < db.benchmarkLbs * 0.85) {
      weightLbs = Math.min(Math.round(trend * 1.05 / 5) * 5, db.benchmarkLbs);
    } else {
      weightLbs = Math.round(trend * 1.025 / 5) * 5;
    }
    if (hist.lastSets >= 2 && hist.lastSets <= 6) sets = hist.lastSets;
  } else if (!db) {
    return { sets: 3, reps: '8-10', weightLbs: 0, note: 'no data' };
  }

  if (note === 'bodyweight' || note === 'hold') weightLbs = 0;
  return { sets, reps, weightLbs, note };
}

function formatPrescription(p) {
  let str = `${p.sets}\u00d7${p.reps}`;
  if (p.weightLbs > 0) str += ` @ ${p.weightLbs}lbs`;
  if (p.note === 'per hand' || p.note === 'per side') str += '/ea';
  return str;
}

// ============================================================
// IMBALANCE DETECTION & RECOMMENDATIONS
// ============================================================
function generateRecommendations(muscleStats) {
  const recs = [];
  const weeklyVolumes = {};
  for (const [key, stat] of Object.entries(muscleStats)) {
    weeklyVolumes[key] = stat.totalSets30d / 4.3;
  }

  const volumeRatios = {};
  let maxRatio = 0;
  for (const [key, stat] of Object.entries(muscleStats)) {
    const ratio = weeklyVolumes[key] / stat.idealSetsPerWeek;
    volumeRatios[key] = ratio;
    if (ratio > maxRatio) maxRatio = ratio;
  }

  // Phase 3: proportion deficit scores (0 if no measurements)
  const hasProportions = Object.keys(proportionDeficits).length > 0;
  const proportionWeight = hasProportions ? 0.15 : 0;
  // Rebalance weights when proportions are available
  const recencyW   = hasProportions ? 0.35 : 0.40;
  const volumeW    = hasProportions ? 0.25 : 0.30;
  const imbalanceW = hasProportions ? 0.25 : 0.30;

  for (const [key, stat] of Object.entries(muscleStats)) {
    // Recency uses PRIMARY training date \u00E2\u20AC\u201D secondary stimulus (e.g. RDLs for back)
    // doesn't reset the clock. This prevents back from being deprioritized when
    // only indirect work has been done recently.
    const recencyScore = Math.min(stat.daysSincePrimary / stat.idealFreqDays, 3);
    const idealSets30d = stat.idealSetsPerWeek * 4.3;
    const volumeDeficit = Math.max(0, 1 - (stat.totalSets30d / idealSets30d));
    const imbalanceScore = maxRatio > 0 ? Math.max(0, 1 - (volumeRatios[key] / maxRatio)) : 0;
    const propDeficit = proportionDeficits[key] || 0;

    const score = (recencyScore * recencyW)
               + (volumeDeficit * volumeW)
               + (imbalanceScore * imbalanceW)
               + (propDeficit * proportionWeight);

    let urgency = 'low';
    if (stat.daysSincePrimary >= stat.idealFreqDays * 2.5 || (volumeDeficit > 0.7 && imbalanceScore > 0.5)) {
      urgency = 'high';
    } else if (stat.daysSincePrimary >= stat.idealFreqDays * 1.5 || volumeDeficit > 0.5) {
      urgency = 'med';
    }

    const weeklyActual = weeklyVolumes[key].toFixed(1);
    const weeklyIdeal = stat.idealSetsPerWeek;
    let explainer = '';

    // Has secondary-only recent work? (primary is old but any is recent)
    const hasIndirectOnly = stat.daysSincePrimary > stat.daysSinceAny && stat.daysSinceAny < stat.idealFreqDays;

    if (stat.daysSincePrimary === Infinity && stat.daysSinceAny === Infinity) {
      explainer = `No ${stat.name.toLowerCase()} training found in your history. This muscle group needs attention to build a balanced physique.`;
    } else if (stat.daysSincePrimary === Infinity) {
      explainer = `No direct ${stat.name.toLowerCase()} work found \u00E2\u20AC\u201D only indirect stimulus (${stat.daysSinceAny}d ago). Add dedicated exercises to develop this muscle group.`;
    } else {
      const parts = [];
      if (stat.daysSincePrimary >= stat.idealFreqDays * 2.5) {
        let msg = `Last direct work <strong>${stat.daysSincePrimary} days ago</strong> \u2014 ideally every ${stat.idealFreqDays} days for optimal growth`;
        if (hasIndirectOnly) msg += ` (indirect stimulus ${stat.daysSinceAny}d ago doesn\u2019t fully count)`;
        parts.push(msg);
      } else if (stat.daysSincePrimary >= stat.idealFreqDays * 1.5) {
        let msg = `Directly trained ${stat.daysSincePrimary} days ago, slightly past the ${stat.idealFreqDays}-day window`;
        if (hasIndirectOnly) msg += ` (secondary-only work ${stat.daysSinceAny}d ago)`;
        parts.push(msg);
      }
      if (volumeDeficit > 0.4) {
        parts.push(`Volume is <strong>${weeklyActual} sets/week</strong> vs the ${weeklyIdeal} recommended \u2014 ${Math.round(volumeDeficit * 100)}% below target`);
      }
      if (imbalanceScore > 0.4) {
        const topMuscle = Object.entries(volumeRatios).sort((a, b) => b[1] - a[1])[0];
        if (topMuscle[0] !== key) {
          parts.push(`Lagging behind your ${muscleStats[topMuscle[0]].name.toLowerCase()} proportionally \u2014 focus here to balance out`);
        }
      }
      if (propDeficit > 0.05) {
        const ft = Object.entries(FRAME_TARGETS).find(([k, v]) => v.muscle === key);
        if (ft) {
          parts.push(`Frame target (<strong>${ft[1].label}</strong>) is ${Math.round(propDeficit * 100)}% below potential`);
        }
      }
      if (parts.length === 0) {
        parts.push(`On track. ${weeklyActual} sets/week is close to the ${weeklyIdeal} target. Last direct work ${stat.daysSincePrimary} days ago.`);
      }
      explainer = parts.join('. ') + '.';
    }

    recs.push({
      key, name: stat.name, score, urgency,
      daysSince: stat.daysSincePrimary,
      daysSinceAny: stat.daysSinceAny,
      sets30d: stat.totalSets30d,
      detail: stat.daysSincePrimary === Infinity
        ? (stat.daysSinceAny === Infinity ? 'no data' : `indirect ${stat.daysSinceAny}d ago`)
        : `${stat.daysSincePrimary}d ago \u00b7 ${formatSets(stat.totalSets30d)} sets/30d`,
      explainer,
      weeklyActual: parseFloat(weeklyActual),
      weeklyIdeal,
    });
  }

  recs.sort((a, b) => b.score - a.score);
  return recs;
}

// ============================================================
// SESSION PLANNING (v1.1 Task 8 - upgraded)
// Improved: fatigue-aware, ensures isolation for #1 priority,
// avoids stacking heavy compounds for same movement pattern
// ============================================================
const MUSCLE_EXERCISE_CAP = {
  caps: [3, 2, 2],
};

// Movement pattern groups to avoid stacking
const MOVEMENT_PATTERNS = {
  'horizontal_push': ['Bench Press (Barbell)', 'Incline Bench Press (Dumbbell)', 'Incline Bench Press (Barbell)', 'Chest Press (Machine)', 'Decline Bench Press (Barbell)'],
  'vertical_push': ['Overhead Press (Barbell)', 'Overhead Press (Dumbbell)', 'Arnold Press (Dumbbell)', 'Seated Shoulder Press (Machine)', 'Shoulder Press (Dumbbell)', 'Standing Military Press (Barbell)'],
  'horizontal_pull': ['Bent Over Row (Barbell)', 'Seated Row (Machine)', 'Dumbbell Row', 'Pendlay Row (Barbell)'],
  'vertical_pull': ['Pull Up', 'Chin Up', 'Lat Pulldown (Cable)', 'Lat Pulldown (Machine)'],
  'knee_dominant': ['Squat (Barbell)', 'Leg Press (Machine)', 'Front Squat', 'Goblet Squat'],
  'hip_dominant': ['Deadlift (Barbell)', 'Romanian Deadlift (Barbell)', 'Hip Thrust (Barbell)', 'Hip Thrust (Machine)'],
};

function getMovementPattern(exName) {
  for (const [pattern, exercises] of Object.entries(MOVEMENT_PATTERNS)) {
    if (exercises.includes(exName)) return pattern;
  }
  return null;
}

function buildTimedSession(recs, prefs) {
  prefs = prefs || sessionPrefs;
  const topKeys = recs.slice(0, 3).map(r => r.key);
  const recScores = {};
  recs.forEach(r => { recScores[r.key] = r.score; });

  const muscleCaps = {};
  topKeys.forEach((key, idx) => { muscleCaps[key] = MUSCLE_EXERCISE_CAP.caps[idx] || 2; });

  // Build candidates
  const candidates = [];
  for (const key of topKeys) {
    const picks = MUSCLE_EXERCISE_PICKS[key] || [];
    const cappedPicks = picks.slice(0, muscleCaps[key]);
    const groupPriority = recScores[key] || 0;

    for (let i = 0; i < cappedPicks.length; i++) {
      const exName = cappedPicks[i];

      // Equipment filter: exclude gym-only exercises in home mode
      if (prefs.equipment === 'home' && GYM_ONLY_REGEX.test(exName)) continue;

      const db = EXERCISE_DB[exName];
      const p = prescribeExercise(exName);
      const mp = getMovementPattern(exName);

      // No OHP filter: exclude compound vertical push
      if (prefs.avoidOHP && mp === 'vertical_push' && db && db.type === 'compound') continue;

      const typeBonus = (db && db.type === 'compound') ? 1.5 : 1.0;
      let deficitBonus = 1.0;
      if (db && db.benchmarkLbs > 0 && p.weightLbs > 0) {
        deficitBonus = (p.weightLbs / db.benchmarkLbs) < 0.85 ? 1.3 : 1.0;
      }
      const orderBonus = 1 - (i * 0.1);
      const importance = groupPriority * typeBonus * deficitBonus * orderBonus;
      const timeSec = calculateExerciseTime(exName, p.sets);

      candidates.push({
        name: exName, muscle: key, prescription: p,
        importance, timeSec,
        isCompound: db && db.type === 'compound',
        isIsolation: db && db.type === 'isolation',
        movementPattern: mp,
      });
    }
  }

  candidates.sort((a, b) => b.importance - a.importance);

  // Time cap from prefs
  const capSec = (prefs.sessionCapMin || TIME_CONSTANTS.sessionCapMin) * 60;
  const session = [];
  let totalSec = 0;
  const usedPatterns = new Set();
  const muscleCompoundCount = {};

  const topMuscle = topKeys[0];
  let topMuscleHasIsolation = false;

  // Strictness rules
  const enforcePatternRule = prefs.strictness !== 'loose';
  const strictCompoundRule = prefs.strictness === 'strict';

  for (const c of candidates) {
    if (totalSec + c.timeSec > capSec) continue;

    // Movement pattern uniqueness (strict + balanced)
    if (enforcePatternRule && c.isCompound && c.movementPattern) {
      if (usedPatterns.has(c.movementPattern)) continue;
    }

    // Max 1 compound per muscle
    if (c.isCompound) {
      if (strictCompoundRule && (muscleCompoundCount[c.muscle] || 0) >= 1) continue;
      // Balanced: relax if session is under-filled (<70% cap)
      if (prefs.strictness === 'balanced' && (muscleCompoundCount[c.muscle] || 0) >= 1) {
        if (totalSec >= capSec * 0.7) continue;
      }
    }

    session.push(c);
    totalSec += c.timeSec;
    if (c.isCompound && c.movementPattern) usedPatterns.add(c.movementPattern);
    if (c.isCompound) muscleCompoundCount[c.muscle] = (muscleCompoundCount[c.muscle] || 0) + 1;
    if (c.muscle === topMuscle && c.isIsolation) topMuscleHasIsolation = true;
  }

  // Ensure #1 priority has at least one isolation if possible
  if (!topMuscleHasIsolation && session.length > 0) {
    const isoCandidate = candidates.find(c =>
      c.muscle === topMuscle && c.isIsolation && !session.includes(c) &&
      totalSec + c.timeSec <= capSec
    );
    if (isoCandidate) {
      session.push(isoCandidate);
      totalSec += isoCandidate.timeSec;
    }
  }

  return { exercises: session, totalSec };
}

      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });
  } else {
    // urgency: sort by recommendation score (highest first)
    const recScores = {};
    recs.forEach(r => { recScores[r.key] = r.score; });
    groupKeys.sort((a, b) => (recScores[b] || 0) - (recScores[a] || 0));
  }

  recs.forEach(r => { recMap[r.key] = r; });

  for (const key of groupKeys) {
    const exes = grouped[key];
    const meta = MUSCLE_GROUPS[key];

    const rec = recMap[key];

    exHtml += `<div class="ex-group">
      <div class="ex-group-title" style="color:${meta.color};cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleSessionExplainer('exp-${key}')">

      </div>`;

    // B1: Collapsible "Why this?" explainer
    if (rec) {
      const daysSince = rec.daysSince === Infinity ? '\u00E2\u02C6\u017E' : rec.daysSince;
      const idealFreq = (muscleAnalysis && muscleAnalysis[key]) ? muscleAnalysis[key].idealFreqDays : '?';
      const volActual = rec.weeklyActual;
      const volIdeal = rec.weeklyIdeal;
      const propDef = proportionDeficits[key];

      let bullets = [];
      bullets.push(`<span style="color:${C.textDim};">Days since:</span> <strong>${daysSince}</strong> <span style="color:${C.textDark};">vs ideal ${idealFreq}d</span>`);
      const deficit = Math.max(0, volIdeal - volActual);
      if (deficit > 0) {
        bullets.push(`<span style="color:${C.textDim};">Volume gap:</span> <strong>${deficit.toFixed(1)} sets/wk</strong> <span style="color:${C.textDark};">below ${volIdeal}</span>`);
      } else {
        bullets.push(`<span style="color:${C.textDim};">Volume:</span> <strong>${volActual} / ${volIdeal}</strong> <span style="color:${C.accent};">\u00E2\u0153\u201D</span>`);
      }
      if (propDef && propDef > 0.05) {
        const ft = Object.entries(FRAME_TARGETS).find(([k, v]) => v.muscle === key);
        if (ft) bullets.push(`<span style="color:${C.textDim};">Frame target:</span> <strong>${ft[1].label}</strong> <span style="color:${C.warn};">${Math.round(propDef * 100)}% below potential</span>`);
      }

      exHtml += `<div class="rec-expand" id="exp-${key}" style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;">

          ${bullets.map(b => `<div>${b}</div>`).join('')}
        </div>
      </div>`;
    }

    for (const ex of exes) {
      const rx = formatPrescription(ex.prescription);
      const timeMin = (ex.timeSec / 60).toFixed(0);
      exHtml += `
        <div class="ex-row">
          <div class="ex-name" style="color:${C.text}">${ex.name}</div>
          <div class="ex-prescription" style="color:${C.accent}">${rx}</div>
          <div class="ex-time" style="color:${C.textDim}">${timeMin}m</div>
        </div>`;
    }
    exHtml += `</div>`;
  }
  exContainer.innerHTML = exHtml;

  // Auto-expand first group's explainer to teach discoverability
  if (groupKeys.length > 0) {
    const firstId = `exp-${groupKeys[0]}`;
    const firstEl = document.getElementById(firstId);
    if (firstEl) {
      firstEl.classList.add('open');
      firstEl.style.opacity = '1';
      firstEl.style.maxHeight = firstEl.scrollHeight + 'px';
    }
  }
}

  const entries = Object.entries(muscleStats).sort((a, b) => {
    const scoreA = recMap[a[0]] ? recMap[a[0]].score : 0;
    const scoreB = recMap[b[0]] ? recMap[b[0]].score : 0;
    return scoreB - scoreA;
  });

  grid.innerHTML = entries.map(([key, stat]) => {
    let daysText;
    if (stat.daysSincePrimary === Infinity && stat.daysSinceAny === Infinity) {
      daysText = 'no data';
    } else if (stat.daysSincePrimary === Infinity) {
      daysText = `indirect ${stat.daysSinceAny}d`;
    } else {
      daysText = `${stat.daysSincePrimary}d ago`;
    }
    const weeklyVol = (stat.totalSets30d / 4.3).toFixed(1);
    const rec = recMap[key];
    const urgency = rec ? rec.urgency : 'low';
    const urgencyColors = { high: C.danger, med: C.warn, low: C.accent };
    const uColor = urgencyColors[urgency] || C.accent;
    const volPct = Math.min(100, Math.round((parseFloat(weeklyVol) / stat.idealSetsPerWeek) * 100));

    return `
      <div class="muscle-cell" style="background:${C.surface2};border-color:${C.border};border-left:3px solid ${uColor}" onclick="toggleMuscleDetail('${key}')">
        <div class="muscle-cell-header">
          <div class="muscle-name" style="color:${C.text}">${stat.name}</div>
          <div style="width:8px;height:8px;border-radius:50%;background:${uColor};flex-shrink:0;"></div>
        </div>
        <div class="muscle-stat" style="color:${C.textMid};font-family:'Space Grotesk',sans-serif;font-size:12px;margin-top:5px;">${daysText} \u00b7 ${weeklyVol}/${stat.idealSetsPerWeek}/wk</div>
        <div style="height:2px;border-radius:1px;background:${C.surface3};margin-top:6px;overflow:hidden;">
          <div style="height:100%;width:${volPct}%;border-radius:1px;background:${uColor};opacity:0.7;transition:width 0.4s ease;"></div>
        </div>
      </div>`;
  }).join('');

  // Legend (remove stale from prior render, then add fresh)
  const prevLegend = document.getElementById('muscle-grid-legend');
  if (prevLegend) prevLegend.remove();
  grid.insertAdjacentHTML('afterend',
    `<div id="muscle-grid-legend" style="display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;font-family:'Space Grotesk',sans-serif;color:${C.textDim};max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;">
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${C.danger};margin-right:3px;vertical-align:middle;"></span>Needs work</span>
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${C.warn};margin-right:3px;vertical-align:middle;"></span>Due soon</span>
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${C.accent};margin-right:3px;vertical-align:middle;"></span>On track</span>
    </div>`);

  // Store recs for detail panel
  _muscleRecMap = recMap;

  // Click outside any cell to deselect (attach once)
  if (!grid.dataset.clickOutside) {
    grid.dataset.clickOutside = '1';
    grid.addEventListener('click', function(e) {
      if (!e.target.closest('.muscle-cell')) {
        const detailEl = document.getElementById('muscle-detail');
        if (detailEl && detailEl.classList.contains('open')) {
          detailEl.style.maxHeight = '0';
          detailEl.classList.remove('open');
          selectedMuscleKey = null;
          document.querySelectorAll('.muscle-cell').forEach(c => c.style.outline = 'none');
        }
      }
    });
  }
}

function renderWeeklySummary(dayWorkoutsMap, dayMuscleMap, dayCardioMap, workouts) {
  const container = document.getElementById('weekly-summary');
  if (!container) return;

  const now = new Date();
  const muscleTotal = Object.keys(MUSCLE_GROUPS).length;

  // Helper: compute stats for a 7-day window ending on `endDate`
  function weekStats(endDate) {
    const sessions = new Set();
    let totalSets = 0;
    const musclesHit = new Set();
    let cardioMin = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(endDate);
      d.setDate(d.getDate() - i);
      const key = localDateStr(d);
      // Lifting
      const exs = dayWorkoutsMap[key];
      if (exs && exs.length > 0) {
        sessions.add(key);
        for (const ex of exs) totalSets += ex.sets;
      }
      // Muscles
      const muscles = dayMuscleMap[key];
      if (muscles) {
        for (const m of Object.keys(muscles)) {
          if (muscles[m] > 0) musclesHit.add(m);
        }
      }
      // Cardio
      const cd = dayCardioMap[key];
      if (cd && cd.minutes) cardioMin += cd.minutes;
    }
    return { sessions: sessions.size, totalSets, musclesHit: musclesHit.size, cardioMin };
  }

  const thisWeek = weekStats(now);
  const lastWeekEnd = new Date(now);
  lastWeekEnd.setDate(lastWeekEnd.getDate() - 7);
  const lastWeek = weekStats(lastWeekEnd);

  // Delta helper
  function delta(curr, prev) {
    const diff = curr - prev;
    if (diff === 0 || prev === 0) return '';
    const sign = diff > 0 ? '+' : '';
    return `<span style="font-size:10px;font-family:'Space Grotesk',sans-serif;color:${diff > 0 ? C.accent : C.warn};margin-left:4px;">${sign}${diff}</span>`;
  }

  // Cardio bar
  const cardioTarget = CARDIO_WEEKLY_TARGETS.totalMinModerate;
  const cardioPct = Math.min(100, Math.round((thisWeek.cardioMin / cardioTarget) * 100));
  const cardioBarColor = cardioPct >= 100 ? C.accent : cardioPct >= 50 ? C.blue : C.warn;

  const statStyle = `padding:12px;border-radius:8px;border:1px solid ${C.border};background:${C.surface2};text-align:center;`;
  const labelStyle = `font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:${C.textDim};font-family:'Space Grotesk',sans-serif;margin-bottom:4px;`;
  const valueStyle = `font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:${C.text};line-height:1.2;`;
  const subStyle = `font-size:11px;font-family:'Space Grotesk',sans-serif;color:${C.textDark};`;

  container.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
      <div style="${statStyle}">
        <div style="${labelStyle}">Sessions</div>
        <div style="${valueStyle}">${thisWeek.sessions}${delta(thisWeek.sessions, lastWeek.sessions)}</div>
        <div style="${subStyle}">of 7 days</div>
      </div>
      <div style="${statStyle}">
        <div style="${labelStyle}">Volume</div>
        <div style="${valueStyle}">${thisWeek.totalSets}${delta(thisWeek.totalSets, lastWeek.totalSets)}</div>
        <div style="${subStyle}">total sets</div>
      </div>
      <div style="${statStyle}">
        <div style="${labelStyle}">Coverage</div>
        <div style="${valueStyle}">${thisWeek.musclesHit}<span style="font-size:14px;font-weight:400;color:${C.textDim};">/${muscleTotal}</span></div>
        <div style="${subStyle}">muscles</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;color:${cardioPct >= 100 ? C.accent : C.text};font-weight:600;white-space:nowrap;">${Math.round(thisWeek.cardioMin)}/${cardioTarget}m</div>
      <div style="flex:1;height:5px;border-radius:3px;background:${C.surface3};overflow:hidden;">
        <div style="height:100%;border-radius:3px;background:${cardioBarColor};width:${cardioPct}%;transition:width 0.4s ease;"></div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;color:${C.textDim};white-space:nowrap;">cardio${delta(Math.round(thisWeek.cardioMin), Math.round(lastWeek.cardioMin))}</div>
    </div>`;
}
