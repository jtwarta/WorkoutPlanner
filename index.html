      html += `<div style="padding:10px 0;border-bottom:1px solid ${C.surface2};${hasInstr ? 'cursor:pointer;-webkit-tap-highlight-color:transparent;' : ''}" ${hasInstr ? 'onclick="toggleCardioInstr(\'' + instrId + '\')"' : ''}>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:0.5px;background:${zs.bg};color:${zs.color};">${zs.label}</span>
          <span style="font-size:14px;font-weight:600;color:${C.text};flex:1;">${rx.name}</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:13px;color:${C.accent};font-weight:600;">${rx.durationMin}m</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div style="font-size:12px;font-family:'Space Grotesk',sans-serif;color:${C.textDim};line-height:1.4;flex:1;">${detailNote}</div>
          <span style="font-size:11px;font-family:'Space Grotesk',sans-serif;color:${zs.color};padding:2px 7px;border-radius:4px;background:${zs.bg};white-space:nowrap;">\u2661 ${rx.hrRange}</span>
        </div>
        ${hasInstr ? '<div id="' + instrId + '" style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;"><div style="margin-top:8px;padding:8px 10px;border-radius:6px;background:' + C.surface + ';font-size:11px;font-family:Space Grotesk,sans-serif;color:' + C.textMid + ';line-height:1.5;">' + rx.instructions + '</div></div>' : ''}
      </div>`;
    }

    // Surface HIIT gate block reason if applicable
    if (result.hiitBlockReason) {
      html += `<div style="padding:6px 0;font-size:11px;font-family:'Space Grotesk',sans-serif;color:${C.textDark};">HIIT gated: ${result.hiitBlockReason}</div>`;
    }
  }

  html += `</div>`;
  sectionEl.innerHTML = html;
}

// ============================================================
// SMART WEIGHT PRESCRIPTION (Pillar 4)
// ============================================================

// Estimate starting weight for an exercise with no history and no EXERCISE_DB entry
// Uses the user's demonstrated strength in the same muscle group to infer a reasonable starting weight
function estimateWeightFromPeers(name) {
  var cls = classifyExercise(name);
  if (cls.primary === 'cardio' || cls.primary === 'other') return 0;
  var muscleKey = cls.primary;
  var compound = isLikelyCompound(name);

  // Collect strength ratios from exercises in this muscle group that have both DB benchmarks and history
  var ratios = [];
  var sameTypeWeights = [];
  for (var exName in EXERCISE_DB) {
    var exDb = EXERCISE_DB[exName];
    if (exDb.muscle !== muscleKey) continue;
    if (!exDb.benchmarkLbs || exDb.benchmarkLbs <= 0) continue;
    var exHist = exerciseHistory[exName];
    if (!exHist || !exHist.lastWeightLbs || exHist.lastWeightLbs <= 0) continue;

    var ratio = exHist.lastWeightLbs / exDb.benchmarkLbs;
    ratios.push(ratio);

    // Track weights from same type (compound vs isolation)
    var exIsCompound = exDb.type === 'compound';
    if (exIsCompound === compound) {
      sameTypeWeights.push(exHist.lastWeightLbs);
    }
  }

  if (ratios.length === 0) return 0;

  // User's average strength factor for this muscle group
  var avgRatio = ratios.reduce(function(a, b) { return a + b; }, 0) / ratios.length;

  // If the exercise IS in EXERCISE_DB (has benchmark but no history), scale the benchmark
  var db = EXERCISE_DB[name];
  if (db && db.benchmarkLbs > 0) {
    return Math.round(db.benchmarkLbs * avgRatio / 5) * 5;
  }

  // Exercise not in EXERCISE_DB: use median weight of same-type exercises, scaled conservatively
  // Start at 80% of median same-type weight (safety margin for unfamiliar movement)
  if (sameTypeWeights.length > 0) {
    sameTypeWeights.sort(function(a, b) { return a - b; });
    var median = sameTypeWeights[Math.floor(sameTypeWeights.length / 2)];
    return Math.round(median * 0.8 / 5) * 5;
  }

  return 0;
}

function prescribeExercise(name) {
  const db = EXERCISE_DB[name];
  const hist = exerciseHistory[name];

  let sets = db ? db.sets : 3;
  let reps = db ? db.reps : '8-10';
  let weightLbs = db ? db.benchmarkLbs : 0;
  let note = db ? (db.note || '') : '';

  if (hist && hist.lastWeightLbs > 0) {
    const lastW = hist.lastWeightLbs;
    const trend = hist.weights.length >= 3
      ? hist.weights.slice(-3).reduce((a, b) => a + b, 0) / 3
      : lastW;

    if (db && lastW < db.benchmarkLbs * 0.85) {
      weightLbs = Math.min(Math.round(trend * 1.05 / 5) * 5, db.benchmarkLbs);
    } else {
      weightLbs = Math.round(trend * 1.025 / 5) * 5;
    }
    // Enforce 5lb minimum increment: if target is above last weight
    // but less than a full 5lb jump, snap up to lastW + 5
    if (weightLbs > lastW && weightLbs < lastW + 5) {
      weightLbs = lastW + 5;
    }
    // Never prescribe less than last weight (rep progression instead)
    if (weightLbs < lastW) {
      weightLbs = lastW;
    }
    if (hist.lastSets >= 2 && hist.lastSets <= 6) sets = hist.lastSets;
  } else if (!db) {
    // No EXERCISE_DB entry and no history: estimate from peer exercises
    weightLbs = estimateWeightFromPeers(name);
  } else {
    // Has EXERCISE_DB entry but no history: scale benchmark by user's strength in this muscle group
    var estimated = estimateWeightFromPeers(name);
    if (estimated > 0) weightLbs = estimated;
  }

  if (note === 'bodyweight' || note === 'hold') weightLbs = 0;
  // Final guard: ensure weight is always a multiple of 5
  if (weightLbs > 0) weightLbs = Math.round(weightLbs / 5) * 5;
  return { sets, reps, weightLbs, note };
}

function formatPrescription(p) {
  let str = `${p.sets}\u00d7${p.reps}`;
  if (p.weightLbs > 0) str += ` @ ${p.weightLbs}lbs`;
  if (p.note === 'per hand' || p.note === 'per side') str += '/ea';
  return str;
}

// ============================================================
// IMBALANCE DETECTION & RECOMMENDATIONS
// ============================================================
function generateRecommendations(muscleStats) {
  const recs = [];
  const weeklyVolumes = {};
  for (const [key, stat] of Object.entries(muscleStats)) {
    weeklyVolumes[key] = stat.totalSets30d / 4.3;
  }

  const volumeRatios = {};
  let maxRatio = 0;
  for (const [key, stat] of Object.entries(muscleStats)) {
    const ratio = weeklyVolumes[key] / stat.idealSetsPerWeek;
    volumeRatios[key] = ratio;
    if (ratio > maxRatio) maxRatio = ratio;
  }

  // Phase 3: proportion deficit scores (0 if no measurements)
  const hasProportions = Object.keys(proportionDeficits).length > 0;
  const proportionWeight = hasProportions ? 0.15 : 0;
  // Rebalance weights when proportions are available
  const recencyW   = hasProportions ? 0.35 : 0.40;
  const volumeW    = hasProportions ? 0.25 : 0.30;
  const imbalanceW = hasProportions ? 0.25 : 0.30;

  // Structural importance: bias toward foundation muscle groups when
  // training frequency is low. At full frequency (5+/wk) the bonus is
  // minimal so neglect signals dominate. At low frequency (1-2/wk) the
  // bonus is strong so limited sessions hit big compounds first.
  // Tier 1 = large compound groups (chest, back, shoulders, quads)
  // Tier 2 = posterior chain (hamstrings, glutes)
  // Tier 3 = accessories (biceps, triceps, calves, core, neck, forearms)
  var liftDays14d = 0;
  var freqNow = new Date();
  for (var fi = 0; fi < 14; fi++) {
    var fd = new Date(freqNow);
    fd.setDate(fd.getDate() - fi);
    var fk = localDateStr(fd);
    if (heatmapDayWorkouts[fk] && heatmapDayWorkouts[fk].length > 0) liftDays14d++;
  }
  var weeklyFreq = liftDays14d / 2;
  // Scale: 5+/wk -> 0.03, 3-4/wk -> 0.08, 1-2/wk -> 0.15, 0/wk -> 0.20
  var structuralW = weeklyFreq >= 5 ? 0.03
                  : weeklyFreq >= 3 ? 0.08
                  : weeklyFreq >= 1 ? 0.15
                  : 0.20;
  var tierBonus = { 1: 1.0, 2: 0.5, 3: 0.0 };

  for (const [key, stat] of Object.entries(muscleStats)) {
    // Recency uses PRIMARY training date -- secondary stimulus (e.g. RDLs for back)
    // doesn't reset the clock. This prevents back from being deprioritized when
    // only indirect work has been done recently.
    const recencyScore = Math.min(stat.daysSincePrimary / stat.idealFreqDays, 3);
    const idealSets30d = stat.idealSetsPerWeek * 4.3;
    const volumeDeficit = Math.max(0, 1 - (stat.totalSets30d / idealSets30d));
    const imbalanceScore = maxRatio > 0 ? Math.max(0, 1 - (volumeRatios[key] / maxRatio)) : 0;
    const propDeficit = proportionDeficits[key] || 0;

    // Structural importance bonus (tier from MUSCLE_GROUPS)
    const muscleTier = (MUSCLE_GROUPS[key] && MUSCLE_GROUPS[key].tier) || 3;
    const structBonus = (tierBonus[muscleTier] || 0) * structuralW;

    const score = (recencyScore * recencyW)
               + (volumeDeficit * volumeW)
               + (imbalanceScore * imbalanceW)
               + (propDeficit * proportionWeight)
               + structBonus;

    let urgency = 'low';
    if (stat.daysSincePrimary >= stat.idealFreqDays * 2.5 || (volumeDeficit > 0.7 && imbalanceScore > 0.5)) {
      urgency = 'high';
    } else if (stat.daysSincePrimary >= stat.idealFreqDays * 1.5 || volumeDeficit > 0.5) {
      urgency = 'med';
    }

    const weeklyActual = weeklyVolumes[key].toFixed(1);
    const weeklyIdeal = stat.idealSetsPerWeek;
    let explainer = '';

    // Has secondary-only recent work? (primary is old but any is recent)
    const hasIndirectOnly = stat.daysSincePrimary > stat.daysSinceAny && stat.daysSinceAny < stat.idealFreqDays;

    if (stat.daysSincePrimary === Infinity && stat.daysSinceAny === Infinity) {
      explainer = `No ${stat.name.toLowerCase()} training found in your history. This muscle group needs attention to build a balanced physique.`;
    } else if (stat.daysSincePrimary === Infinity) {
      explainer = `No direct ${stat.name.toLowerCase()} work found -- only indirect stimulus (${stat.daysSinceAny}d ago). Add dedicated exercises to develop this muscle group.`;
    } else {
      const parts = [];
      if (stat.daysSincePrimary >= stat.idealFreqDays * 2.5) {
        let msg = `Last direct work <strong>${stat.daysSincePrimary} days ago</strong> \u2014 ideally every ${stat.idealFreqDays} days for optimal growth`;
        if (hasIndirectOnly) msg += ` (indirect stimulus ${stat.daysSinceAny}d ago doesn\u2019t fully count)`;
        parts.push(msg);
      } else if (stat.daysSincePrimary >= stat.idealFreqDays * 1.5) {
        let msg = `Directly trained ${stat.daysSincePrimary} days ago, slightly past the ${stat.idealFreqDays}-day window`;
        if (hasIndirectOnly) msg += ` (secondary-only work ${stat.daysSinceAny}d ago)`;
        parts.push(msg);
      }
      if (volumeDeficit > 0.4) {
        parts.push(`Volume is <strong>${weeklyActual} sets/week</strong> vs the ${weeklyIdeal} recommended \u2014 ${Math.round(volumeDeficit * 100)}% below target`);
      }
      if (imbalanceScore > 0.4) {
        const topMuscle = Object.entries(volumeRatios).sort((a, b) => b[1] - a[1])[0];
        if (topMuscle[0] !== key) {
          parts.push(`Lagging behind your ${muscleStats[topMuscle[0]].name.toLowerCase()} proportionally \u2014 focus here to balance out`);
        }
      }
      if (propDeficit > 0.05) {
        const ft = Object.entries(FRAME_TARGETS).find(([k, v]) => v.muscle === key);
        if (ft) {
          parts.push(`Frame target (<strong>${ft[1].label}</strong>) is ${Math.round(propDeficit * 100)}% below potential`);
        }
      }
      if (parts.length === 0) {
        parts.push(`On track. ${weeklyActual} sets/week is close to the ${weeklyIdeal} target. Last direct work ${stat.daysSincePrimary} days ago.`);
      }
      explainer = parts.join('. ') + '.';
    }

    recs.push({
      key, name: stat.name, score, urgency,
      daysSince: stat.daysSincePrimary,
      daysSinceAny: stat.daysSinceAny,
      sets30d: stat.totalSets30d,
      detail: stat.daysSincePrimary === Infinity
        ? (stat.daysSinceAny === Infinity ? 'no data' : `indirect ${stat.daysSinceAny}d ago`)
        : `${stat.daysSincePrimary}d ago \u00b7 ${formatSets(stat.totalSets30d)} sets/30d`,
      explainer,
      weeklyActual: parseFloat(weeklyActual),
      weeklyIdeal,
    });
  }

  recs.sort((a, b) => b.score - a.score);
  return recs;
}

// ============================================================
// SESSION PLANNING (v1.1 Task 8 - upgraded)
// Improved: fatigue-aware, ensures isolation for #1 priority,
// avoids stacking heavy compounds for same movement pattern
// ============================================================
const MUSCLE_EXERCISE_CAP = {
  caps: [3, 2, 2],
};

// Movement pattern groups to avoid stacking
const MOVEMENT_PATTERNS = {
  'horizontal_push': ['Bench Press (Barbell)', 'Incline Bench Press (Dumbbell)', 'Incline Bench Press (Barbell)', 'Chest Press (Machine)', 'Decline Bench Press (Barbell)'],
  'vertical_push': ['Overhead Press (Barbell)', 'Overhead Press (Dumbbell)', 'Arnold Press (Dumbbell)', 'Seated Shoulder Press (Machine)', 'Shoulder Press (Dumbbell)', 'Standing Military Press (Barbell)'],
  'horizontal_pull': ['Bent Over Row (Barbell)', 'Seated Row (Machine)', 'Dumbbell Row', 'Pendlay Row (Barbell)'],
  'vertical_pull': ['Pull Up', 'Chin Up', 'Lat Pulldown (Cable)', 'Lat Pulldown (Machine)'],
  'knee_dominant': ['Squat (Barbell)', 'Leg Press (Machine)', 'Front Squat', 'Goblet Squat'],
  'hip_dominant': ['Deadlift (Barbell)', 'Romanian Deadlift (Barbell)', 'Hip Thrust (Barbell)', 'Hip Thrust (Machine)'],
};

function getMovementPattern(exName) {
  for (const [pattern, exercises] of Object.entries(MOVEMENT_PATTERNS)) {
    if (exercises.includes(exName)) return pattern;
  }
  return null;
}

// Heuristic: infer compound vs isolation from exercise name
// Used for exercises not in EXERCISE_DB
const COMPOUND_PATTERNS = [
  /press/i, /squat/i, /deadlift/i, /row/i, /pull.?up/i, /chin.?up/i,
  /dip/i, /lunge/i, /thrust/i, /clean/i, /snatch/i, /step.?up/i,
  /good morning/i, /leg press/i, /rack pull/i, /farmer/i,
];

function isLikelyCompound(name) {
  return COMPOUND_PATTERNS.some(function(p) { return p.test(name); });
}

// Evidence-based rest periods (Schoenfeld 2016, de Salles 2009, Singer 2024):
// 180s: Heavy barbell compounds (squat, deadlift, bench, OHP, heavy rows, leg press)
// 120s: Moderate compounds (dumbbell/machine presses, pulls, dips, RDL, hip thrust)
//  90s: Multi-joint machines, heavier isolation (barbell curl, skullcrusher, lat pulldown)
//  60s: Pure isolation, small muscles (raises, curls, extensions, core, neck, forearms, calves)
// Hardcoded per-exercise in EXERCISE_DB.rest; heuristic fallback for unknown exercises
const HEAVY_COMPOUND_PATTERNS = [
  /squat.*barbell/i, /barbell.*squat/i,
  /^squat$/i,
  /deadlift.*barbell/i, /barbell.*deadlift/i, /^deadlift$/i,
  /bench press.*barbell/i, /barbell.*bench press/i, /^bench press$/i,
  /overhead press.*barbell/i, /military press/i,
  /rack pull/i, /pendlay row/i, /leg press/i,
];

function getRestSeconds(name) {
  // Use hardcoded value if available
  var db = EXERCISE_DB[name];
  if (db && db.rest) return db.rest;
  // Fallback heuristic for exercises not in EXERCISE_DB
  for (var i = 0; i < HEAVY_COMPOUND_PATTERNS.length; i++) {
    if (HEAVY_COMPOUND_PATTERNS[i].test(name)) return 180;
  }
  var compound = db ? db.type === 'compound' : isLikelyCompound(name);
  if (compound) return 120;
  return 60;
}

function buildTimedSession(recs, prefs) {
  prefs = prefs || sessionPrefs;
  const topKeys = recs.slice(0, 3).map(r => r.key);
  const recScores = {};
  recs.forEach(r => { recScores[r.key] = r.score; });

  const muscleCaps = {};
  topKeys.forEach((key, idx) => { muscleCaps[key] = MUSCLE_EXERCISE_CAP.caps[idx] || 2; });

  // Build candidates
  const candidates = [];
  for (const key of topKeys) {
    const picks = rankExercisesForMuscle(key);
    const cappedPicks = picks.slice(0, muscleCaps[key]);
    const groupPriority = recScores[key] || 0;

    for (let i = 0; i < cappedPicks.length; i++) {
      const exName = cappedPicks[i];

      // Equipment filter: exclude gym-only exercises in home mode
      if (prefs.equipment === 'home' && GYM_ONLY_REGEX.test(exName)) continue;

      const db = EXERCISE_DB[exName];
      const p = prescribeExercise(exName);
      const mp = getMovementPattern(exName);

      // No OHP filter: exclude compound vertical push
      if (prefs.avoidOHP && mp === 'vertical_push' && (db ? db.type === 'compound' : isLikelyCompound(exName))) continue;

      const compound = db ? db.type === 'compound' : isLikelyCompound(exName);
      const isolation = db ? db.type === 'isolation' : !isLikelyCompound(exName);
      const typeBonus = compound ? 1.5 : 1.0;
      let deficitBonus = 1.0;
      if (db && db.benchmarkLbs > 0 && p.weightLbs > 0) {
        deficitBonus = (p.weightLbs / db.benchmarkLbs) < 0.85 ? 1.3 : 1.0;
      }
      const orderBonus = 1 - (i * 0.1);
      const importance = groupPriority * typeBonus * deficitBonus * orderBonus;
      const timeSec = calculateExerciseTime(exName, p.sets);

      candidates.push({
        name: exName, muscle: key, prescription: p,
        importance, timeSec,
        isCompound: compound,
        isIsolation: isolation,
        movementPattern: mp,
      });
    }
  }

  candidates.sort((a, b) => b.importance - a.importance);

  // Time cap from prefs
  const capSec = (prefs.sessionCapMin || TIME_CONSTANTS.sessionCapMin) * 60;
  const session = [];
  let totalSec = 0;
  const usedPatterns = new Set();
  const muscleCompoundCount = {};

  const topMuscle = topKeys[0];
  let topMuscleHasIsolation = false;

  // Strictness rules
  const enforcePatternRule = prefs.strictness !== 'loose';
  const strictCompoundRule = prefs.strictness === 'strict';

  for (const c of candidates) {
    if (totalSec + c.timeSec > capSec) continue;

    // Movement pattern uniqueness (strict + balanced)
    if (enforcePatternRule && c.isCompound && c.movementPattern) {
      if (usedPatterns.has(c.movementPattern)) continue;
    }

    // Max 1 compound per muscle
    if (c.isCompound) {
      if (strictCompoundRule && (muscleCompoundCount[c.muscle] || 0) >= 1) continue;
      // Balanced: relax if session is under-filled (<70% cap)
      if (prefs.strictness === 'balanced' && (muscleCompoundCount[c.muscle] || 0) >= 1) {
        if (totalSec >= capSec * 0.7) continue;
      }
    }

    session.push(c);
    totalSec += c.timeSec;
    if (c.isCompound && c.movementPattern) usedPatterns.add(c.movementPattern);
    if (c.isCompound) muscleCompoundCount[c.muscle] = (muscleCompoundCount[c.muscle] || 0) + 1;
    if (c.muscle === topMuscle && c.isIsolation) topMuscleHasIsolation = true;
  }

  // Ensure #1 priority has at least one isolation if possible
  if (!topMuscleHasIsolation && session.length > 0) {
    const isoCandidate = candidates.find(c =>
      c.muscle === topMuscle && c.isIsolation && !session.includes(c) &&
      totalSec + c.timeSec <= capSec
    );
    if (isoCandidate) {
      session.push(isoCandidate);
      totalSec += isoCandidate.timeSec;
    }
  }

  return { exercises: session, totalSec };
}

// Store for Send to Hevy feature
function buildTimedSessionAndStore(recs, prefs) {
  const result = buildTimedSession(recs, prefs);
  _lastBuiltSession = result;
  return result;
}

function showToast(msg, isError) {
  var existing = document.getElementById('ls-toast');

  var bg = isError ? '#7f1d1d' : '#14532d';
  var border = isError ? C.danger : C.accent;

  div.id = 'ls-toast';
  div.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;font-family:Space Grotesk,sans-serif;color:#f4f4f6;z-index:9999;opacity:0;transition:opacity 0.3s ease;max-width:90vw;text-align:center;background:' + bg + ';border:1px solid ' + border + '40;';

// Fetch exercise templates from Hevy to resolve missing template IDs
async function fetchAllHevyTemplateIds() {
  // Try localStorage cache first (7-day TTL)
  try {
    var cached = Storage.get('hevy_template_map');
    var cachedTs = Storage.get('hevy_template_map_ts');
    var cacheAge = cachedTs ? (Date.now() - cachedTs) : Infinity;
    var CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days
    if (cached && typeof cached === 'object' && Object.keys(cached).length > 20 && cacheAge < CACHE_TTL) {
      // Preserve workout-derived IDs (custom exercises) over cached ones
      var workoutDerived = {};
      for (var wk in _templateIdMap) { workoutDerived[wk] = _templateIdMap[wk]; }
      Object.assign(_templateIdMap, cached);
      // Overlay workout-derived IDs back on top (fresher, includes custom exercises)
      Object.assign(_templateIdMap, workoutDerived);
      _hevyTemplatesLoaded = true;
      console.log('Hevy templates loaded from cache: ' + Object.keys(_templateIdMap).length + ' exercises (age: ' + Math.round(cacheAge / 3600000) + 'h)');
      addHevyTemplatesToPool();
      warnUnmatchedExercises();
      return;
    }
  } catch (e) { /* ignore cache errors */ }

  try {
    // Collect all exercise names we need to match
    var needed = new Set();
    for (var key in _dynamicExercisePool) {
      _dynamicExercisePool[key].forEach(function(n) { needed.add(n); });
    }
    // Also include static MUSCLE_EXERCISE_PICKS as fallback
    for (var key2 in MUSCLE_EXERCISE_PICKS) {
      var arr = MUSCLE_EXERCISE_PICKS[key2];
      for (var i = 0; i < arr.length; i++) needed.add(arr[i]);
    }

    var page = 1;
    var maxPages = 50;
    var matched = 0;
    while (page <= maxPages) {
      var resp = await fetchWithTimeout(API_BASE + '/exercise_templates?page=' + page + '&pageSize=10', {
        headers: { 'api-key': apiKey },
        mode: 'cors'
      });
      if (!resp.ok) break;
      var data = await resp.json();
      var templates = data.exercise_templates || [];
      if (templates.length === 0) break;

      for (var j = 0; j < templates.length; j++) {
        var t = templates[j];
        var tName = t.title || '';
        if (tName && !_templateIdMap[tName]) {
          _templateIdMap[tName] = t.id;
          if (needed.has(tName)) matched++;
        }
      }

      // Early stop: all MUSCLE_EXERCISE_PICKS exercises are matched
      if (matched >= needed.size) {
        console.log('Hevy templates: all ' + needed.size + ' needed exercises matched after ' + page + ' pages');
        break;
      }

      var totalPages = data.page_count || 1;
      if (page >= totalPages) break;
      page++;
    }

    _hevyTemplatesLoaded = true;
    console.log('Hevy templates loaded: ' + Object.keys(_templateIdMap).length + ' total, ' + matched + '/' + needed.size + ' needed');

    // Cache to localStorage for fast future loads
    Storage.set('hevy_template_map', _templateIdMap);
    Storage.set('hevy_template_map_ts', Date.now());

    // Expand dynamic pool with newly discovered Hevy exercises
    addHevyTemplatesToPool();

    warnUnmatchedExercises();
  } catch (e) {
    console.error('fetchAllHevyTemplateIds error:', e);
  }
}

function warnUnmatchedExercises() {
  var unmatched = [];
  var totalPool = 0;
  var matchedPool = 0;
  for (var key in _dynamicExercisePool) {
    _dynamicExercisePool[key].forEach(function(name) {
      totalPool++;
      if (_templateIdMap[name]) matchedPool++;
      else unmatched.push(name + ' (' + key + ')');
    });
  }
  console.log('Exercise pool: ' + matchedPool + '/' + totalPool + ' matched to Hevy templates');
  if (unmatched.length > 0) {
    console.warn('Hevy template mismatch - these exercises will be excluded from sessions:\n  ' + unmatched.join('\n  '));
  }
}

async function resolveTemplateIds(names) {
  var missing = names.filter(function(n) { return !_templateIdMap[n]; });
  if (missing.length === 0) return true;

  try {
    var page = 1;
    var maxPages = 30; // up to ~300 templates
    while (missing.length > 0 && page <= maxPages) {
      var resp = await fetchWithTimeout(API_BASE + '/exercise_templates?page=' + page + '&pageSize=10', {
        headers: { 'api-key': apiKey },
        mode: 'cors'
      });
      if (!resp.ok) break;
      var data = await resp.json();
      var templates = data.exercise_templates || [];
      if (templates.length === 0) break;

      for (var i = 0; i < templates.length; i++) {
        var t = templates[i];
        var tName = t.title || '';
        if (tName && !_templateIdMap[tName]) {
          _templateIdMap[tName] = t.id;
        }
      }

      missing = names.filter(function(n) { return !_templateIdMap[n]; });
      var totalPages = data.page_count || 1;
      if (page >= totalPages) break;
      page++;
    }
  } catch (e) {
    console.error('resolveTemplateIds error:', e);
  }
  return names.filter(function(n) { return !_templateIdMap[n]; }).length === 0;
}

async function sendSessionToHevy() {
  var btn = document.getElementById('send-to-hevy-btn');
  if (!btn || !_lastBuiltSession || !_lastBuiltSession.exercises || _lastBuiltSession.exercises.length === 0) {
    showToast('No session to send', true);
    return;
  }

  // Disable button and show loading
  btn.disabled = true;
  var origHTML = btn.innerHTML;
  btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Sending...</span>';
  btn.style.opacity = '0.6';

  try {
    // Get all exercise names in session
    var exNames = _lastBuiltSession.exercises.map(function(ex) { return ex.name; });

    // Resolve any missing template IDs
    var allResolved = await resolveTemplateIds(exNames);
    var unresolvedNames = exNames.filter(function(n) { return !_templateIdMap[n]; });
    var resolvedExercises = _lastBuiltSession.exercises.filter(function(ex) { return !!_templateIdMap[ex.name]; });

    if (resolvedExercises.length === 0) {
      showToast('Could not find any Hevy IDs for these exercises', true);
      btn.innerHTML = origHTML;
      btn.style.opacity = '1';
      btn.disabled = false;
      return;
    }

    // Build exercises array
    var routineTitle = 'LiftScript Daily';
    var exercises = [];
    for (var i = 0; i < resolvedExercises.length; i++) {
      var ex = resolvedExercises[i];
      var p = ex.prescription;
      var templateId = _templateIdMap[ex.name];

      // Parse rep range (e.g. "8-10")
      var repStr = String(p.reps || '8-10');
      var repParts = repStr.split('-');
      var repLow = parseInt(repParts[0], 10) || 8;
      var repHigh = repParts.length > 1 ? (parseInt(repParts[1], 10) || repLow) : repLow;

      // Convert lbs to kg (round to nearest 0.5 per Hevy API)
      var weightKg = p.weightLbs > 0 ? Math.round(p.weightLbs * 0.453592 * 2) / 2 : null;

      // Build sets array
      var sets = [];
      for (var s = 0; s < (p.sets || 3); s++) {
        var setObj = { type: 'normal' };
        if (weightKg !== null) setObj.weight_kg = weightKg;
        if (repLow === repHigh) {
          setObj.reps = repLow;
        } else {
          setObj.reps = Math.round((repLow + repHigh) / 2);
        }
        sets.push(setObj);
      }

      var exObj = {
        exercise_template_id: templateId,
        rest_seconds: getRestSeconds(ex.name),
        notes: '',
        sets: sets
      };

      if (p.note === 'per hand' || p.note === 'per side') {
        exObj.notes = p.note;
      }

      exercises.push(exObj);
    }

    var routinePayload = {
      title: routineTitle,
      exercises: exercises
    };

    // Check for existing routine ID in localStorage
    var existingId = Storage.get('hevy_routine_id');

    // Fallback: search Hevy for existing "LiftScript Daily" routine by name
    // This prevents duplicates when localStorage is cleared or PWA storage differs
    if (!existingId) {
      try {
        var searchResp = await fetchWithTimeout(API_BASE + '/routines?page=1&pageSize=10', {
          headers: { 'api-key': apiKey },
          mode: 'cors'
        });
        if (searchResp.ok) {
          var searchData = await searchResp.json();
          var routines = searchData.routines || [];
          for (var ri = 0; ri < routines.length; ri++) {
            if (routines[ri].title === routineTitle) {
              existingId = routines[ri].id;
              Storage.set('hevy_routine_id', existingId);
              console.log('Found existing LiftScript routine: ' + existingId);
              break;
            }
          }
        }
      } catch (e) {
        console.warn('Routine search failed:', e.message);
      }
    }

    var resp;
    var isUpdate = false;

    if (existingId) {
      // Try to update existing routine via PUT
      resp = await fetchWithTimeout(API_BASE + '/routines/' + existingId, {
        method: 'PUT',
        headers: {
          'api-key': apiKey,
          'Content-Type': 'application/json'
        },
        mode: 'cors',
        body: JSON.stringify({ routine: routinePayload })
      });
      // If 404 (routine was manually deleted), fall through to create
      if (resp.status === 404) {
        Storage.remove('hevy_routine_id');
        existingId = null;
      } else if (resp.ok) {
        isUpdate = true;
      } else if (resp.status === 400) {
        // 400 on PUT means routine schema mismatch -- delete and recreate
        console.warn('PUT 400 on routine ' + existingId + ', deleting and recreating');
        try {
          await fetchWithTimeout(API_BASE + '/routines/' + existingId, {
            method: 'DELETE',
            headers: { 'api-key': apiKey },
            mode: 'cors'
          });
        } catch(_) {}
        Storage.remove('hevy_routine_id');
        existingId = null;
      } else {
        // Other error -- abort
        var putErr = '';
        try { putErr = await resp.text(); } catch(_) {}
        console.error('Hevy routine update failed:', resp.status, putErr);
        showToast('Hevy error ' + resp.status + ': ' + (putErr || '').slice(0, 100), true);
        btn.innerHTML = origHTML;
        btn.style.opacity = '1';
        btn.disabled = false;
        return;
      }
    }

    if (!existingId) {
      // Create new routine via POST
      var postBody = JSON.stringify({ routine: routinePayload });
      console.log('Hevy POST payload:', postBody);
      resp = await fetchWithTimeout(API_BASE + '/routines', {
        method: 'POST',
        headers: {
          'api-key': apiKey,
          'Content-Type': 'application/json'
        },
        mode: 'cors',
        body: postBody
      });
      isUpdate = false;
    }

    if (resp.ok) {
      var result = await resp.json();
      // Save routine ID for future updates
      if (!isUpdate && result && result.routine && result.routine.id) {
        Storage.set('hevy_routine_id', result.routine.id);
      }
      var skipMsg = unresolvedNames.length > 0
        ? ' (skipped ' + unresolvedNames.length + ': ' + unresolvedNames.join(', ') + ')'
        : '';
      var verb = isUpdate ? 'updated' : 'created';
      showToast('\u2714 \"' + routineTitle + '\" ' + verb + ' in Hevy!' + skipMsg, false);
      btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="' + C.accent + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> <span style="color:' + C.accent + ';">Sent!</span></span>';
      btn.style.opacity = '1';
      btn.disabled = true;
      setTimeout(function() {
        btn.innerHTML = origHTML;
        btn.disabled = false;
      }, 10000);
    } else {
      var errBody = '';
      try { errBody = await resp.text(); } catch(_) {}
      console.error('Hevy routine send failed:', resp.status, errBody);
      showToast('Hevy API error ' + resp.status + ': ' + (errBody || resp.statusText), true);
      btn.innerHTML = origHTML;
      btn.style.opacity = '1';
      btn.disabled = false;
    }
  } catch (e) {
    console.error('sendSessionToHevy error:', e);
    showToast('Network error: ' + e.message, true);
    btn.innerHTML = origHTML;
    btn.style.opacity = '1';
    btn.disabled = false;
  }
}

function renderMuscleGrid(muscleStats, recs) {
  const grid = document.getElementById('muscle-grid');

  // Build a lookup from recs for urgency + explainer + score
  const recMap = {};
  if (recs) {
    recs.forEach(r => { recMap[r.key] = r; });
  }

  // Sort by priority score (highest first) so most urgent = top-left
  const entries = Object.entries(muscleStats).sort((a, b) => {
    const scoreA = recMap[a[0]] ? recMap[a[0]].score : 0;
    const scoreB = recMap[b[0]] ? recMap[b[0]].score : 0;
    return scoreB - scoreA;
  });

  // SVG arc helper for recency ring
  function recencyRingSvg(daysSince, idealDays) {
    const size = 28;
    const r = 10;
    const cx = size / 2;
    const cy = size / 2;
    const stroke = 3;
    const circumference = 2 * Math.PI * r;

    // How much time remains: 1.0 = just trained, 0.0 = at/past ideal
    let remaining;
    if (daysSince === Infinity) {
      remaining = 0;
    } else {
      remaining = Math.max(0, 1 - (daysSince / idealDays));
    }
    const arcLen = remaining * circumference;
    const gapLen = circumference - arcLen;

    // Color based on remaining
    let arcColor;
    if (remaining >= 0.6) arcColor = C.accent;
    else if (remaining >= 0.2) arcColor = C.warn;
    else arcColor = C.danger;

    // Day label
    const label = daysSince === Infinity ? '?' : daysSince;
    const fontSize = String(label).length > 1 ? 9 : 10;

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.surface3}" stroke-width="${stroke}"/>

    // Volume label

  // Legend (remove stale from prior render, then add fresh)
  const prevLegend = document.getElementById('muscle-grid-legend');
  if (prevLegend) prevLegend.remove();
  grid.insertAdjacentHTML('afterend',
    `<div id="muscle-grid-legend" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:10px;font-family:'Space Grotesk',sans-serif;color:${C.textDim};max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;">
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${C.danger};"></span>Overdue</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${C.warn};"></span>Due soon</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${C.accent};"></span>On track</span>
      <span style="display:flex;align-items:center;gap:3px;"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="${C.textDim}" stroke-width="1.5"/></svg>Ring = days since</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:3px;border-radius:1px;background:${C.textDim};"></span>Bar = sets/wk</span>

function renderWeeklySummary(dayWorkoutsMap, dayMuscleMap, dayCardioMap, workouts) {
  const container = document.getElementById('weekly-summary');
  if (!container) return;

  const now = new Date();
  const muscleTotal = Object.keys(MUSCLE_GROUPS).length;

  // Helper: compute stats for a 7-day window ending on `endDate`
  function weekStats(endDate) {
    const sessions = new Set();
    let totalSets = 0;
    const musclesHit = new Set();
    let cardioMin = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(endDate);
      d.setDate(d.getDate() - i);
      const key = localDateStr(d);
      // Lifting
      const exs = dayWorkoutsMap[key];
      if (exs && exs.length > 0) {
        sessions.add(key);
        for (const ex of exs) totalSets += ex.sets;
      }
      // Muscles
      const muscles = dayMuscleMap[key];
      if (muscles) {
        for (const m of Object.keys(muscles)) {
          if (muscles[m] > 0) musclesHit.add(m);
        }
      }
      // Cardio
      const cd = dayCardioMap[key];
      if (cd && cd.minutes) cardioMin += cd.minutes;
    }
    return { sessions: sessions.size, totalSets, musclesHit: musclesHit.size, cardioMin };
  }

  const thisWeek = weekStats(now);
  const lastWeekEnd = new Date(now);
  lastWeekEnd.setDate(lastWeekEnd.getDate() - 7);
  const lastWeek = weekStats(lastWeekEnd);

  // Delta helper
  function delta(curr, prev) {
    const diff = curr - prev;
    if (diff === 0 || prev === 0) return '';
    const sign = diff > 0 ? '+' : '';
    return `<span style="font-size:10px;font-family:'Space Grotesk',sans-serif;color:${diff > 0 ? C.accent : C.warn};margin-left:4px;">${sign}${diff}</span>`;
  }

  // Cardio bar
  const cardioTarget = CARDIO_WEEKLY_TARGETS.totalMinModerate;
  const cardioPct = Math.min(100, Math.round((thisWeek.cardioMin / cardioTarget) * 100));
  const cardioBarColor = cardioPct >= 100 ? C.accent : cardioPct >= 50 ? C.blue : C.warn;

  const statStyle = `padding:12px;border-radius:8px;border:1px solid ${C.border};background:${C.surface2};text-align:center;`;
  const labelStyle = `font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:${C.textDim};font-family:'Space Grotesk',sans-serif;margin-bottom:4px;`;
  const valueStyle = `font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:${C.text};line-height:1.2;`;
  const subStyle = `font-size:11px;font-family:'Space Grotesk',sans-serif;color:${C.textDark};`;

  container.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
      <div style="${statStyle}">
        <div style="${labelStyle}">Sessions</div>
        <div style="${valueStyle}">${thisWeek.sessions}${delta(thisWeek.sessions, lastWeek.sessions)}</div>
        <div style="${subStyle}">of 7 days</div>
      </div>
      <div style="${statStyle}">
        <div style="${labelStyle}">Volume</div>
        <div style="${valueStyle}">${thisWeek.totalSets}${delta(thisWeek.totalSets, lastWeek.totalSets)}</div>
        <div style="${subStyle}">total sets</div>
      </div>
      <div style="${statStyle}">
        <div style="${labelStyle}">Coverage</div>
        <div style="${valueStyle}">${thisWeek.musclesHit}<span style="font-size:14px;font-weight:400;color:${C.textDim};">/${muscleTotal}</span></div>
        <div style="${subStyle}">muscles</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;color:${cardioPct >= 100 ? C.accent : C.text};font-weight:600;white-space:nowrap;">${Math.round(thisWeek.cardioMin)}/${cardioTarget}m</div>
      <div style="flex:1;height:5px;border-radius:3px;background:${C.surface3};overflow:hidden;">
        <div style="height:100%;border-radius:3px;background:${cardioBarColor};width:${cardioPct}%;transition:width 0.4s ease;"></div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;color:${C.textDim};white-space:nowrap;">cardio${delta(Math.round(thisWeek.cardioMin), Math.round(lastWeek.cardioMin))}</div>
    </div>`;
}

let heatmapDayWorkouts = {};
let heatmapDayCardio = {};
let selectedHeatmapDay = null;
let _consecutiveTrainDays = 0;

// Count consecutive training days ending today (or yesterday)
function countConsecutiveTrainingDays(dayWorkoutsMap) {
  const now = new Date();
  let count = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    if (dayWorkoutsMap[key] && dayWorkoutsMap[key].length > 0) {
      count++;
    } else {
      // Allow skipping today if it's early -- check if yesterday continues a streak
      if (i === 0) continue;
      break;
    }
  }
  return count;
}

function renderHeatmap(dayMuscleMap, dayWorkoutsMap, dayCardioMap) {
  heatmapDayWorkouts = dayWorkoutsMap;
  heatmapDayCardio = dayCardioMap || {};
  const container = document.getElementById('heatmap-container');
  const muscleKeys = ['chest', 'back', 'shoulders', 'quads', 'hamstrings', 'glutes', 'biceps', 'triceps', 'calves', 'core', 'neck', 'forearms'];
  const muscleLabels = ['Chest', 'Back', 'Shldr', 'Quads', 'Hams', 'Glts', 'Bis', 'Tris', 'Calves', 'Core', 'Neck', 'F.Arms'];

  const CARDIO_THRESHOLD_MIN = 15; // minimum minutes for a lit cell

  const now = new Date();
  const days = [];
  const numDays = 14;
  for (let i = numDays - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(localDateStr(d));
  }

  let maxSets = 0;
  for (const [, muscles] of Object.entries(dayMuscleMap)) {
    for (const [, sets] of Object.entries(muscles)) {
      if (sets > maxSets) maxSets = sets;
    }
  }
  if (maxSets === 0) maxSets = 1;

  const labelWidth = 54;
  const cellSize = 16;
  const totalRows = muscleKeys.length + 1; // +1 for cardio
  let html = '';

  html += `<div class="heatmap-grid" style="grid-template-columns: ${labelWidth}px repeat(${numDays}, ${cellSize}px); grid-template-rows: 22px repeat(${totalRows}, ${cellSize}px);">`;

  // Day labels row -- evenly spaced for 14 days
  html += `<div></div>`;
  for (let i = 0; i < days.length; i++) {
    const d = new Date(days[i] + 'T12:00:00');
    const isFirst = i === 0;
    const isLast = i === days.length - 1;
    const isMid1 = i === 4;
    const isMid2 = i === 9;
    let label = '';
    if (isFirst || isMid1 || isMid2) {
      label = `${d.getMonth() + 1}/${d.getDate()}`;
    } else if (isLast) {
      label = 'Today';
    }
    html += `<div class="heatmap-day-labels">${label}</div>`;
  }

  // Muscle rows
  for (let m = 0; m < muscleKeys.length; m++) {
    const mKey = muscleKeys[m];
    html += `<div class="heatmap-label">${muscleLabels[m]}</div>`;
    for (const day of days) {
      const sets = (dayMuscleMap[day] && dayMuscleMap[day][mKey]) || 0;
      const opacity = sets > 0 ? Math.max(0.25, Math.min(sets / maxSets, 1)) : 0;
      const bgColor = sets > 0 ? `rgba(94, 234, 212, ${opacity})` : C.surface2; // accent RGB with dynamic opacity
      html += `<div class="heatmap-cell" style="background:${bgColor}" data-day="${day}" onclick="selectHeatmapDay('${day}')" title="${day}: ${formatSets(sets)} sets"></div>`;
    }
  }

  // Cardio row (blue, opacity scales with duration: 15 min -> 0.3, 30 -> 0.6, 45+ -> 1.0)
  html += `<div class="heatmap-label" style="color:${C.blue}">Cardio</div>`;
  for (const day of days) {
    const cd = heatmapDayCardio[day];
    const min = cd ? cd.minutes : 0;
    let bgColor = C.surface2;
    if (min >= CARDIO_THRESHOLD_MIN) {
      const opacity = Math.max(0.3, Math.min((min - 15) / 30 + 0.3, 1));
      bgColor = `rgba(96, 165, 250, ${opacity.toFixed(2)})`; // blue RGB
    }
    const title = min > 0 ? `${day}: ${Math.round(min)} min cardio` : day;
    html += `<div class="heatmap-cell" style="background:${bgColor}" data-day="${day}" onclick="selectHeatmapDay('${day}')" title="${title}"></div>`;
  }

  html += '</div>';
  container.innerHTML = html;

  // Click outside any cell to deselect (attach once)
  if (!container.dataset.clickOutside) {
    container.dataset.clickOutside = '1';
    container.addEventListener('click', function(e) {
      if (!e.target.classList.contains('heatmap-cell')) {
        const detailEl = document.getElementById('heatmap-day-detail');
        if (detailEl.classList.contains('open')) {
          detailEl.style.maxHeight = '0';
          detailEl.classList.remove('open');
          selectedHeatmapDay = null;
          document.querySelectorAll('.heatmap-cell').forEach(c => { c.style.outline = 'none'; });
        }
      }
    });
  }
}

let _chartPoints = []; // [{x, y, date, weight, si, cs, ded}] for click interaction
let _chartTooltipTimer = null;
const _chartLineVisible = { weight: true, si: true, cardio: true, dedication: true, bodyComp: true };
let _chartPeriod = '1Y'; // '1M', '3M', '6M', '1Y', 'ALL'

function showChartTooltip(canvas, pt) {
  const parent = canvas.parentElement;
  // Remove existing
  const old = parent.querySelector('.chart-tooltip');
  if (old) old.remove();
  if (_chartTooltipTimer) clearTimeout(_chartTooltipTimer);

  const dateObj = new Date(pt.date + 'T12:00:00');
  const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  let label = `${pt.weight.toFixed(1)} lbs`;
  if (pt.si) label += `<br><span style="color:${C.strength};">SI ${pt.si.toFixed(2)}</span>`;
  if (pt.cs) label += `<br><span style="color:${C.danger};">CF ${pt.cs.toFixed(2)}</span>`;
  if (pt.ded) label += `<br><span style="color:${C.gold};">Ded ${pt.ded.toFixed(2)}</span>`;
  if (pt.bc) label += `<br><span style="color:${C.fuchsia};">BC ${pt.bc.toFixed(2)}</span>`;

  const tip = document.createElement('div');
  tip.className = 'chart-tooltip';
  // Clamp horizontal position
  const tipX = Math.max(40, Math.min(pt.x, parent.offsetWidth - 40));
  const above = pt.y > 60;
  tip.style.cssText = `position:absolute;left:${tipX}px;${above ? 'top' : 'bottom'}:${above ? (pt.y - 44) + 'px' : (150 - pt.y + 12) + 'px'};transform:translateX(-50%);background:${C.surface3};border:1px solid ${C.border};border-radius:6px;padding:4px 8px;font-family:'Space Grotesk',sans-serif;font-size:11px;color:${C.text};text-align:center;white-space:nowrap;pointer-events:none;z-index:10;opacity:1;transition:opacity 0.6s ease;line-height:1.4;`;
  tip.innerHTML = `<div style="font-weight:600;">${label}</div><div style="font-size:10px;color:${C.textDim};">${dateStr}</div>`;
  parent.appendChild(tip);

  // Draw highlight dot on canvas
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = C.accent;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = C.bg;
  ctx.fill();
  ctx.restore();

  // Auto-fade after 3s
  _chartTooltipTimer = setTimeout(() => {
    tip.style.opacity = '0';
    setTimeout(() => tip.remove(), 600);
    // Redraw chart to clear highlight dot
    renderWeightChart();
  }, 3000);
}

function renderWeightChart() {
  WEIGHT_DATA = getMergedWeightData();

  // Update bodyweight BEFORE populating strength detail so benchmarks use fresh weight
  if (WEIGHT_DATA.length > 0) PROFILE.bodyweightLbs = WEIGHT_DATA[0].value;

  // ALWAYS populate strength detail BEFORE any early returns
  populateStrengthDetail();
  renderPRBoard();

  if (WEIGHT_DATA.length === 0) return;

  const cutoff = new Date();
  if (_chartPeriod === '1M') cutoff.setMonth(cutoff.getMonth() - 1);
  else if (_chartPeriod === '3M') cutoff.setMonth(cutoff.getMonth() - 3);
  else if (_chartPeriod === '6M') cutoff.setMonth(cutoff.getMonth() - 6);
  else if (_chartPeriod === '1Y') cutoff.setFullYear(cutoff.getFullYear() - 1);
  else cutoff.setFullYear(2000); // ALL
  const recent = WEIGHT_DATA.filter(d => new Date(d.date) >= cutoff).reverse();
  if (recent.length === 0) return;

  const current = WEIGHT_DATA[0].value;
  const prev = WEIGHT_DATA.length > 1 ? WEIGHT_DATA[1].value : current;
  const delta = current - prev;

  document.getElementById('weight-current').textContent = current.toFixed(1);
  const deltaEl = document.getElementById('weight-delta');
  deltaEl.textContent = `${delta >= 0 ? '+' : ''}${delta.toFixed(1)}`;
  deltaEl.style.color = delta <= 0 ? C.accent : C.warn;

  // Period selector chips
  const periodChipsEl = document.getElementById('chart-period-chips');
  if (periodChipsEl) {
    const periods = ['1M', '3M', '6M', '1Y', 'ALL'];
    periodChipsEl.innerHTML = periods.map(function(p) {
      var isActive = _chartPeriod === p;
      var bg = isActive ? C.accentDim : C.surface2;
      var color = isActive ? C.accent : C.textDim;
      var border = isActive ? C.accentBorder : C.border;
      return '<div onclick="setChartPeriod(\'' + p + '\')" style="padding:3px 10px;border-radius:5px;font-family:Space Grotesk,sans-serif;font-size:11px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;background:' + bg + ';color:' + color + ';border:1px solid ' + border + ';">' + p + '</div>';
    }).join('');
  }

  // Canvas
  const canvas = document.getElementById('weight-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 150 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '150px';
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = 150;
  const pad = { top: 12, bottom: 22, left: 0, right: 0 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;

  const wValues = recent.map(d => d.value);
  const wMin = Math.min(...wValues) - 2;
  const wMax = Math.max(...wValues) + 2;
  const wXStep = chartW / Math.max(recent.length - 1, 1);

  // Weight line (always visible - base layer)
  _chartPoints = []; // reset
  ctx.beginPath();
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  recent.forEach((d, i) => {
    const x = pad.left + i * wXStep;
    const y = pad.top + (1 - (d.value - wMin) / (wMax - wMin)) * chartH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    _chartPoints.push({ x, y, date: d.date, weight: d.value, si: null, cs: null, csMin: null, ded: null, bc: null });
  });
  ctx.stroke();

  // Gradient fill
  const lastX = pad.left + (recent.length - 1) * wXStep;
  ctx.lineTo(lastX, h - pad.bottom);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.closePath();
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(94, 234, 212, 0.15)'); // accent RGB gradient
  gradient.addColorStop(1, 'rgba(94, 234, 212, 0)');
  ctx.fillStyle = gradient;
  ctx.fill();

  // Endpoint dots
  [0, recent.length - 1].forEach(i => {
    const x = pad.left + i * wXStep;
    const y = pad.top + (1 - (recent[i].value - wMin) / (wMax - wMin)) * chartH;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = C.accent;
    ctx.fill();
  });

  // Strength Index line
  if (strengthIndexData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const siFiltered = strengthIndexData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (siFiltered.length >= 2) {
      const siValues = siFiltered.map(d => d.index);
      const siMin = Math.min(...siValues) - 0.1;
      const siMax = Math.max(...siValues) + 0.1;

      if (_chartLineVisible.si) {
        ctx.beginPath();
        ctx.strokeStyle = C.strength;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        siFiltered.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.index - siMin) / (siMax - siMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
        [0, siFiltered.length - 1].forEach(i => {
          const d = siFiltered[i];
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.index - siMin) / (siMax - siMin)) * chartH;
          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = C.strength;
          ctx.fill();
        });
      }

      // Attach SI values to nearest weight points (always, for tooltip)
      for (const sid of siFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(sid.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) closest.si = sid.index;
      }
    }
  }

  // Cardio Fitness line (vitals-only)
  if (cardioScoreData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const csFiltered = cardioScoreData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (csFiltered.length >= 2) {
      const csValues = csFiltered.map(d => d.score);
      const csMin = Math.min(...csValues) - 0.1;
      const csMax = Math.max(...csValues) + 0.1;

      if (_chartLineVisible.cardio) {
        ctx.beginPath();
        ctx.strokeStyle = C.danger;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        csFiltered.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - csMin) / (csMax - csMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
        [0, csFiltered.length - 1].forEach(i => {
          const d = csFiltered[i];
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - csMin) / (csMax - csMin)) * chartH;
          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = C.danger;
          ctx.fill();
        });
      }

      // Attach CS values to nearest weight points (always, for tooltip)
      for (const csd of csFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(csd.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) {
          closest.cs = csd.score;
        }
      }
    }
  }

  // Dedication line (effort + consistency, rolling 7d, smoothed)
  if (dedicationData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const dedFiltered = dedicationData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (dedFiltered.length >= 2) {
      // 5-point moving average to tame daily spikes
      const SMOOTH_W = Math.min(5, dedFiltered.length);
      const smoothed = dedFiltered.map((d, i) => {
        let sum = 0, count = 0;
        for (let j = Math.max(0, i - Math.floor(SMOOTH_W / 2)); j <= Math.min(dedFiltered.length - 1, i + Math.floor(SMOOTH_W / 2)); j++) {
          sum += dedFiltered[j].score;
          count++;
        }
        return { date: d.date, score: sum / count };
      });

      const dedValues = smoothed.map(d => d.score);
      const dedMin = Math.min(...dedValues) - 0.05;
      const dedMax = Math.max(...dedValues) + 0.05;

      if (_chartLineVisible.dedication) {
        ctx.beginPath();
        ctx.strokeStyle = C.gold;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([2, 3]);
        smoothed.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - dedMin) / (dedMax - dedMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Attach ded values to nearest weight points (raw values for tooltip)
      for (const dd of dedFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(dd.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) {
          closest.ded = dd.score;
        }
      }
    }
  }

  // Body Composition line
  if (bodyCompData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const bcFiltered = bodyCompData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (bcFiltered.length >= 2) {
      const bcValues = bcFiltered.map(d => d.score);
      const bcMin = Math.min(...bcValues) - 0.05;
      const bcMax = Math.max(...bcValues) + 0.05;

      if (_chartLineVisible.bodyComp) {
        ctx.beginPath();
        ctx.strokeStyle = C.fuchsia;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        bcFiltered.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - bcMin) / (bcMax - bcMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Attach BC values to nearest weight points (for tooltip)
      for (const bcd of bcFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(bcd.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) {
          closest.bc = bcd.score;
        }
      }
    }
  }

  // Date labels
  ctx.fillStyle = C.textDark2;
  ctx.font = '12px Space Grotesk, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(recent[0].date.substring(5), pad.left, h - 4);
  ctx.textAlign = 'right';
  ctx.fillText(recent[recent.length - 1].date.substring(5), w - pad.right, h - 4);

  // Click-to-inspect handler (attach once)
  if (!canvas.dataset.chartClick) {
    canvas.dataset.chartClick = '1';
    canvas.style.cursor = 'crosshair';
    canvas.addEventListener('click', function(e) {
      if (_chartPoints.length === 0) return;
      const r = canvas.getBoundingClientRect();
      const clickX = e.clientX - r.left;
      let closest = _chartPoints[0], bestDist = Infinity;
      for (const pt of _chartPoints) {
        const dist = Math.abs(pt.x - clickX);
        if (dist < bestDist) { bestDist = dist; closest = pt; }
      }
      showChartTooltip(canvas, closest);
    });
  }

  // Populate chart legend dynamically with tap-to-toggle
  const legendEl = document.getElementById('weight-chart-legend');
  if (legendEl) {
    const items = [
      { key: 'weight', color: C.accent, label: 'Weight', alwaysOn: true },
      { key: 'si', color: C.strength, label: 'Strength' },
      { key: 'cardio', color: C.danger, label: 'Cardio' },
      { key: 'dedication', color: C.gold, label: 'Dedication' },
      { key: 'bodyComp', color: C.fuchsia, label: 'Body Comp' },
    ];
    legendEl.innerHTML = items.map(it => {
      const vis = it.alwaysOn || _chartLineVisible[it.key];
      const opacity = vis ? '1' : '0.3';
      const cursor = it.alwaysOn ? 'default' : 'pointer';
      const onclick = it.alwaysOn ? '' : ` onclick="toggleChartLine('${it.key}')"`;
      return `<span style="opacity:${opacity};cursor:${cursor};-webkit-tap-highlight-color:transparent;"${onclick}><span class="legend-dot" style="background:${it.color}"></span>${it.label}</span>`;
    }).join('');
  }
}

function toggleChartLine(key) {
  _chartLineVisible[key] = !_chartLineVisible[key];
  renderWeightChart();
}

function setChartPeriod(period) {
  _chartPeriod = period;
  renderWeightChart();
}

// ============================================================
// TIER EMBLEMS (v1.13: visual rank icons for categories)
// ============================================================
function tierEmblem(label, color) {
  // Map labels to tier rank (1-5) for distinct icon shapes
  const tierMap = {
    'Low': 1, 'Developing': 1, 'Elevated': 1, 'Above Avg': 1, 'Poor': 1,
    'Normal': 2, 'Fair': 2, 'Moderate': 2,
    'Good': 3, 'Average': 3, 'Intermediate': 3, 'Fit': 3,
    'Athletic': 4, 'Active': 4, 'High': 4, 'Advanced': 4, 'Great': 4,
    'Elite': 5, 'Excellent': 5,
  };
  const tier = tierMap[label] || 2;
  const s = 12; // svg size

  let icon;
  if (tier === 1) {
    // hollow circle
    icon = `<circle cx="6" cy="6" r="4" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  } else if (tier === 2) {
    // filled circle
    icon = `<circle cx="6" cy="6" r="4" fill="${color}" opacity="0.7"/>`;
  } else if (tier === 3) {
    // diamond
    icon = `<path d="M6 2L10 6L6 10L2 6Z" fill="${color}" opacity="0.8"/>`;
  } else if (tier === 4) {
    // shield/chevron up
    icon = `<path d="M6 1.5L10.5 4V7.5C10.5 9.5 8.5 11 6 11.5C3.5 11 1.5 9.5 1.5 7.5V4L6 1.5Z" fill="${color}" opacity="0.85"/>`;
  } else {
    // star
    icon = `<path d="M6 1L7.5 4.5L11 5L8.5 7.5L9 11L6 9.5L3 11L3.5 7.5L1 5L4.5 4.5Z" fill="${color}"/>`;
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="vertical-align:middle;margin-right:3px;flex-shrink:0;">${icon}</svg>`;
}

// Format a tier badge (emblem + label) for inline use
function tierBadge(label, color) {
  return tierEmblem(label, color) + `<span style="color:${color};font-weight:600;">${label}</span>`;
}

// ============================================================
// PERSONAL RECORDS BOARD (merged into Strength Index rows)
// ============================================================
function renderPRBoard() {
  const container = document.getElementById('pr-board');
  if (!container) return;
  if (!strengthIndexData || strengthIndexData.length === 0) { container.innerHTML = ''; return; }

  // Build per-lift 1RM history from SI timeline
  const liftKeys = ['bench', 'squat', 'deadlift', 'ohp', 'row'];
  const liftLabels = { bench: 'Bench', squat: 'Squat', deadlift: 'Deadlift', ohp: 'OHP', row: 'Row' };
  const liftHistory = {};
  for (const k of liftKeys) liftHistory[k] = [];

  for (const entry of strengthIndexData) {
    for (const k of liftKeys) {
      if (entry.lifts && entry.lifts[k] && entry.lifts[k].rm > 0) {
        liftHistory[k].push({ date: entry.date, rm: entry.lifts[k].rm });
      }
    }
  }

  // Find all-time PR, previous PR, and date for each lift
  const prData = {};
  for (const k of liftKeys) {
    const hist = liftHistory[k];
    if (hist.length === 0) continue;
    let allTimePR = 0, prDate = '', prevPR = 0;
    for (const h of hist) {
      if (h.rm > allTimePR) {
        prevPR = allTimePR;
        allTimePR = h.rm;
        prDate = h.date;
      }
    }
    const current = hist[hist.length - 1].rm;
    prData[k] = { current, allTimePR, prDate, prevPR, history: hist };
  }

  // Mini sparkline SVG builder
  function prSparkline(hist) {
    if (hist.length < 2) return '';
    const vals = hist.map(function(h) { return h.rm; });
    var mn = Math.min.apply(null, vals);
    var mx = Math.max.apply(null, vals);
    if (mx === mn) { mn -= 1; mx += 1; }
    var w = 100, h = 22, pad = 2;
    var pts = [];
    for (var i = 0; i < vals.length; i++) {
      var x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
      var y = pad + (1 - (vals[i] - mn) / (mx - mn)) * (h - 2 * pad);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    var trending = vals[vals.length - 1] >= vals[Math.max(0, vals.length - 4)];
    var lineColor = trending ? C.accent : C.warn;
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="display:block;">' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + lineColor + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + pts[pts.length - 1].split(',')[0] + '" cy="' + pts[pts.length - 1].split(',')[1] + '" r="2" fill="' + lineColor + '"/>' +
      '</svg>';
  }

  var html = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid ' + C.border + ';">' +
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:' + C.textDim + ';font-family:Space Grotesk,sans-serif;margin-bottom:10px;">Personal Records</div>';

  var hasAny = false;
  for (var ki = 0; ki < liftKeys.length; ki++) {
    var k = liftKeys[ki];
    var pr = prData[k];
    if (!pr) continue;
    hasAny = true;
    var prDateObj = new Date(pr.prDate + 'T12:00:00');
    var prDateStr = prDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var isAtPR = pr.current >= pr.allTimePR;
    var delta = pr.prevPR > 0 ? pr.allTimePR - pr.prevPR : 0;
    var deltaStr = delta > 0 ? '+' + delta + ' lbs' : '';

    var prBadge = isAtPR
      ? '<span style="font-size:9px;font-weight:600;color:' + C.accent + ';padding:1px 5px;border-radius:3px;background:' + C.accentDim + ';font-family:Space Grotesk,sans-serif;letter-spacing:0.5px;margin-left:6px;">CURRENT</span>'
      : '<span style="font-size:10px;color:' + C.textDim + ';font-family:Space Grotesk,sans-serif;margin-left:6px;">' + Math.round((pr.current / pr.allTimePR) * 100) + '% of PR</span>';

    html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid ' + C.surface2 + ';">' +
      '<div style="width:58px;font-size:13px;font-weight:600;color:' + C.text + ';font-family:Space Grotesk,sans-serif;flex-shrink:0;">' + liftLabels[k] + '</div>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:baseline;gap:4px;">' +
          '<span style="font-family:Space Grotesk,sans-serif;font-size:16px;font-weight:700;color:' + (isAtPR ? C.accent : C.text) + ';">' + pr.allTimePR + '</span>' +
          '<span style="font-size:10px;color:' + C.textDark + ';font-family:Space Grotesk,sans-serif;">lbs</span>' +
          prBadge +
        '</div>' +
        '<div style="font-family:Space Grotesk,sans-serif;font-size:10px;color:' + C.textDim + ';">' +
          prDateStr + (deltaStr ? ' \u00b7 ' + deltaStr : '') +
        '</div>' +
      '</div>' +
      '<div style="flex-shrink:0;">' + prSparkline(pr.history) + '</div>' +
    '</div>';
  }

  if (!hasAny) {
    html += '<div style="font-size:12px;color:' + C.textDim + ';font-family:Space Grotesk,sans-serif;padding:8px 0;">No PR data yet \u2014 train the big 5 lifts to track records.</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

    if (v >= 1.8) { siLevel = 'Elite'; siColor = C.strength; siFloor = 1.8; siCeil = 2.5; nextLevel = ''; }
    else if (v >= 1.3) { siLevel = 'Advanced'; siColor = C.accent; siFloor = 1.3; siCeil = 1.8; nextLevel = 'Elite'; }
    else if (v >= 0.9) { siLevel = 'Intermediate'; siColor = C.warn; siFloor = 0.9; siCeil = 1.3; nextLevel = 'Advanced'; }
    else { siLevel = 'Developing'; siColor = C.danger; siFloor = 0; siCeil = 0.9; nextLevel = 'Intermediate'; }
  }

  // XP bar calculation
  const siVal = latestSI ? latestSI.index : 0;
  const xpPct = siCeil > siFloor ? Math.min(100, Math.max(0, Math.round(((siVal - siFloor) / (siCeil - siFloor)) * 100))) : 100;
  const xpLabel = nextLevel ? `${xpPct}% to ${nextLevel}` : 'Max tier reached';

  // Tier segments for the XP track
  const siTierSegs = [
    { floor: 0,   ceil: 0.9, label: 'Developing',   abbr: 'DEV', color: C.danger,   desc: 'Building foundation \u00b7 Focus on form and consistency' },
    { floor: 0.9, ceil: 1.3, label: 'Intermediate',  abbr: 'INT', color: C.warn,     desc: 'Average gym-goer \u00b7 Solid base across all lifts' },

    let fillPct = 0;
    if (isPast) fillPct = 100;

    // Segment background: dark, with fill in the strength purple color
    const fillColor = isPast || isCurrent ? C.strength : 'transparent';
    const fillOpacity = isPast ? '0.5' : isCurrent ? '0.8' : '0';

    segHtml += '<div onclick="showSITierTooltip(event,' + i + ')" style="position:relative;flex:' + segWidthPct + ';height:10px;background:' + C.surface3 + ';' + borderL + borderR + gapR + 'cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden;">' +

  // Tier labels below segments
  let labelHtml = '';
  for (let i = 0; i < siTierSegs.length; i++) {
    const seg = siTierSegs[i];
    const segWidthPct = ((seg.ceil - seg.floor) / xpTrackMax) * 100;

  // Scan SI timeline for all-time PR per lift
  const _prs = {};
  for (const entry of strengthIndexData) {

// ---- Hevy CSV Measurement Import ----
// Parses exported measurements CSV from Hevy app (Profile > Settings > Export)
// Handles cm or inch columns, averages L/R measurements, converts cm->in
function importHevyCSV(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = ''; // reset so same file can be re-imported

  const statusEl = document.getElementById('hevy-import-status');
  const showStatus = (msg, isError) => {
    statusEl.style.display = 'block';
    statusEl.style.background = isError ? 'rgba(248,113,113,0.12)' : 'rgba(94,234,212,0.12)';
    statusEl.style.color = isError ? C.danger : C.accent;
    statusEl.style.border = `1px solid ${isError ? 'rgba(248,113,113,0.2)' : 'rgba(94,234,212,0.2)'}`;
    statusEl.textContent = msg;
    setTimeout(() => { statusEl.style.display = 'none'; }, 5000);
  };

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const rows = parseCSV(text);
      if (rows.length < 2) { showStatus('CSV appears empty or has no data rows.', true); return; }

      const headers = rows[0].map(h => h.trim().toLowerCase());
      const dateCol = headers.findIndex(h => h === 'date');
      if (dateCol === -1) { showStatus('No "date" column found in CSV.', true); return; }

      // Detect unit system from column names
      const isCm = headers.some(h => h.endsWith('_cm'));
      const cmToIn = (v) => v / 2.54;

      // Column mapping: Hevy column name -> { lsKey, isLeft }
      // For L/R pairs, we average them
      const colMap = {};
      
      // Build mapping from headers
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i];
        const mapEntry = matchHevyColumn(h);
        if (mapEntry) colMap[i] = mapEntry;
      }

      if (Object.keys(colMap).length === 0) {
        showStatus('No recognized measurement columns found.', true);
        return;
      }

      let imported = 0;
      for (let r = 1; r < rows.length; r++) {
        const cells = rows[r];
        if (cells.length <= dateCol) continue;

        // Parse Hevy date format: "23 Oct 2023, 00:00" -> "2023-10-23"
        const dateRaw = cells[dateCol].trim();
        const parsedDate = parseHevyDate(dateRaw);
        if (!parsedDate) continue;

        const entry = { date: parsedDate };
        const lrAccum = {}; // { lsKey: [values] }
        let hasValue = false;

        for (const [colIdx, mapping] of Object.entries(colMap)) {
          const rawVal = parseFloat(cells[colIdx]);
          if (isNaN(rawVal) || rawVal <= 0) continue;
          const val = isCm ? cmToIn(rawVal) : rawVal;

          if (mapping.pair) {
            // L/R measurement -> accumulate for averaging
            if (!lrAccum[mapping.lsKey]) lrAccum[mapping.lsKey] = [];
            lrAccum[mapping.lsKey].push(val);
          } else {
            entry[mapping.lsKey] = Math.round(val * 10) / 10;
            hasValue = true;
          }
        }

        // Average L/R pairs
        for (const [key, vals] of Object.entries(lrAccum)) {
          const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
          entry[key] = Math.round(avg * 10) / 10;
          hasValue = true;
        }

        if (hasValue) {
          saveMeasurementEntry(entry);
          imported++;
        }
      }

      if (imported === 0) {
        showStatus('No measurement data found in rows.', true);
        return;
      }

      // Refresh display
      latestMeasurements = getLatestMeasurements();
      proportionDeficits = computeProportionDeficits(latestMeasurements);
      renderMeasurementsDisplay();
      renderProportionsDisplay();
      if (workoutCache && muscleAnalysis) {
        const recs = generateRecommendations(muscleAnalysis);
        LAST_RECS = recs;
        renderTimedSession(recs);
        renderMuscleGrid(muscleAnalysis, recs);
      }

      showStatus(`Imported ${imported} measurement entr${imported === 1 ? 'y' : 'ies'} from Hevy.`, false);
    } catch (err) {
      showStatus('Error parsing CSV: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

// Simple CSV parser (handles quoted fields)
function parseCSV(text) {
  const rows = [];
  let current = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { current.push(field); field = ''; }
      else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) {
        current.push(field); field = '';
        if (current.some(c => c.trim() !== '')) rows.push(current);
        current = [];
        if (ch === '\r') i++; // skip \n in \r\n
      } else { field += ch; }
    }
  }
  // Last row
  current.push(field);
  if (current.some(c => c.trim() !== '')) rows.push(current);
  return rows;
}

// Match a Hevy CSV header to a LiftScript measurement key
function matchHevyColumn(header) {
  const h = header.replace(/[()]/g, '').trim();
  // Map of patterns -> { lsKey, pair? }
  const maps = [
    { patterns: [/^neck/],                       lsKey: 'neck_in' },
    { patterns: [/^shoulder/],                    lsKey: 'shoulder_in' },
    { patterns: [/^chest/],                       lsKey: 'chest_in' },
    { patterns: [/^(left_?)?bicep/, /^l_bicep/],  lsKey: 'bicep_in', pair: true },
    { patterns: [/^(right_?)?bicep/, /^r_bicep/], lsKey: 'bicep_in', pair: true },
    { patterns: [/^(left_?)?forearm/, /^l_forearm/],  lsKey: 'forearm_in', pair: true },
    { patterns: [/^(right_?)?forearm/, /^r_forearm/], lsKey: 'forearm_in', pair: true },
    { patterns: [/^waist/],                       lsKey: 'waist_in' },
    { patterns: [/^hip/],                         lsKey: 'hip_in' },
    { patterns: [/^(left_?)?thigh/, /^l_thigh/],  lsKey: 'thigh_in', pair: true },
    { patterns: [/^(right_?)?thigh/, /^r_thigh/], lsKey: 'thigh_in', pair: true },
    { patterns: [/^(left_?)?calf/, /^l_calf/, /^(left_?)?calves/],  lsKey: 'calf_in', pair: true },
    { patterns: [/^(right_?)?calf/, /^r_calf/, /^(right_?)?calves/], lsKey: 'calf_in', pair: true },
  ];

  // Strip unit suffix for matching
  const stripped = h.replace(/_(cm|in|inch|inches)$/, '');

  for (const m of maps) {
    if (m.patterns.some(p => p.test(stripped))) {
      return { lsKey: m.lsKey, pair: !!m.pair };
    }
  }
  return null;
}

// Parse Hevy date: "23 Oct 2023, 00:00" -> "2023-10-23"
// Also handles ISO "2023-10-23" passthrough
function parseHevyDate(str) {
  if (!str) return null;
  // ISO format passthrough
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0, 10);
  // Hevy format: "23 Oct 2023, 00:00"
  const months = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const match = str.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
  if (!match) return null;
  const day = match[1].padStart(2, '0');
  const mon = months[match[2].toLowerCase()];
  if (!mon) return null;
  return `${match[3]}-${String(mon).padStart(2, '0')}-${day}`;
}

  let html = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">`;
  let hasAny = false;
  for (const field of MEASUREMENT_FIELDS) {

    hasAny = true;
    const dateStr = latest._dates ? latest._dates[field.key] : '';
