// Analyze cardio from workout history (last 7 days)
// Cardio Counting Rules (v1.17):
// ---------------------------------------------------------------
// Source        | Type          | Counts toward 150 min/wk?
// --------------|---------------|-------------------------------
// Hevy          | Any cardio    | ALWAYS (intentional logging)
// Apple Watch   | Indoor Walk   | ALWAYS (treadmill = intentional)
// Apple Watch   | Hiking/Hike   | ALWAYS (intentional training)
// Apple Watch   | Outdoor Walk  | ONLY if duration >= 20 min (v1.18a)
// Passive       | Steps         | NEVER (tracked in vitals only)
// ---------------------------------------------------------------

// Apple Watch workout types that count as cardio.
// v1.35 comment fix: the Shortcut's HealthKit query returns workouts from
// ALL sources (iPhone, third-party apps, Watch) -- see master doc S27.
// Keys are lowercase; matching uses exact then fuzzy fallback.
const APPLE_CARDIO_TYPES = {
  'indoor walk':    'treadmill',
  'outdoor walk':   'treadmill',
  'indoor run':     'treadmill',
  'outdoor run':    'treadmill',
  'indoor cycle':   'bike',
  'outdoor cycle':  'bike',
  'cycling':        'bike',
  'elliptical':     'elliptical',
  'stair climbing': 'stairclimber',
  'stair stepper':  'stairclimber',
  'stairstepper':   'stairclimber',
  'rowing':         'rower',
  'hiking':         'hiking',
  'swimming':       'swimming',
  'cross training': 'cross-training',
  'walking':        'treadmill',
  'running':        'treadmill',
};

// Fuzzy fallback for workout types not in the exact map
const APPLE_CARDIO_FUZZY = [
  { pattern: /walk/i,      modality: 'treadmill' },
  { pattern: /run|jog/i,   modality: 'treadmill' },
  { pattern: /cycl|bike/i, modality: 'bike' },
  { pattern: /ellip/i,     modality: 'elliptical' },
  { pattern: /stair|step/i,modality: 'stairclimber' },
  { pattern: /row/i,       modality: 'rower' },
  { pattern: /hik/i,       modality: 'hiking' },
  { pattern: /swim/i,      modality: 'swimming' },
  { pattern: /cross.?train/i, modality: 'cross-training' },
];

function analyzeCardioHistory(dayCardioMap) {
  // Single source of truth: dayCardioMap (already deduped in preprocessWorkouts)
  const now = new Date();
  let cardioSessions7d = 0;
  let estimatedMinutes7d = 0;
  const recentModalities = [];
  let hevySessions = 0;
  let appleSessions = 0;
  let hevyMinutes = 0;
  let appleMinutes = 0;
  const cardioLog = [];

  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    const cd = dayCardioMap[key];
    if (!cd || !cd.sessions) continue;

    // Use cd.minutes for total (same as weekStats in History tab)
    estimatedMinutes7d += cd.minutes;

    for (const sess of cd.sessions) {
      cardioSessions7d++;

      if (sess.source === 'hevy') {
        hevySessions++;
        hevyMinutes += sess.minutes;
      } else {
        appleSessions++;
        appleMinutes += sess.minutes;
      }

      // Modality tagging for variety tracking
      const modality = (sess.name || '').toLowerCase();
      if (/hik/i.test(modality)) recentModalities.push('hiking');
      else if (/treadmill|walk|run/i.test(modality)) recentModalities.push('treadmill');
      else if (/bike|cycl/i.test(modality)) recentModalities.push('bike');
      else if (/elliptical/i.test(modality)) recentModalities.push('elliptical');
      else if (/stair/i.test(modality)) recentModalities.push('stairclimber');
      else if (/row/i.test(modality)) recentModalities.push('rower');
      else recentModalities.push('other');

      cardioLog.push({
        source: sess.source === 'hevy' ? 'hevy' : 'watch',
        type: sess.name || 'Unknown',
        date: sess.timestamp ? new Date(sess.timestamp) : d,
        minutes: sess.minutes,
        calories: sess.calories || 0,
      });
    }
  }

  return {
    cardioSessions7d, estimatedMinutes7d, recentModalities,
    hevySessions, appleSessions, hevyMinutes, appleMinutes,
    cardioLog,
    // Estimate how many sessions this week were high-intensity
    // Heuristic: short sessions (<=25 min) with interval/sprint/HIIT in name, or matching HIIT protocol names
    hiitSessions7d: cardioLog.filter(function(s) {
      var n = (s.type || '').toLowerCase();
      if (/interval|sprint|hiit|tabata/i.test(n)) return true;
      // Match known HIIT protocol names from CARDIO_PROTOCOLS.hiit
      for (var j = 0; j < CARDIO_PROTOCOLS.hiit.length; j++) {
        if (n === CARDIO_PROTOCOLS.hiit[j].name.toLowerCase()) return true;
      }
      return false;
    }).length,
  };
}

// Generate cardio recommendations for today
function generateCardioRecommendations(dayCardioMap, rerollOffset) {
  var offset = rerollOffset || 0;
  const rhr = healthData ? healthData.resting_heart_rate : null;
  const zones = calculateHRZones(PROFILE.age, rhr);
  const history = analyzeCardioHistory(dayCardioMap);

  const targetMin = CARDIO_WEEKLY_TARGETS.totalMinModerate;
  const remainingMin = Math.max(0, targetMin - history.estimatedMinutes7d);
  const targetSessions = CARDIO_WEEKLY_TARGETS.sessionsPerWeek;
  const remainingSessions = Math.max(0, targetSessions - history.cardioSessions7d);

  // If target met for the week
  if (remainingSessions <= 0 && remainingMin <= 0) {
    return { zones, history, prescriptions: [], weekComplete: true, remainingMin: 0, targetMin, completedMin: Math.round(history.estimatedMinutes7d) };
  }

  const prescriptions = [];

  // ---- HIIT readiness gate (v1.15) ----
  // Only prescribe HIIT when readiness is acceptable AND cardio base is not extremely low.
  // Otherwise, default to Zone 2 (safer, builds aerobic base).
  let hiitAllowed = true;
  let hiitBlockReason = '';

  // Gate 1: RHR elevation vs baseline -- elevated RHR signals poor recovery
  if (rhr && rhr > 0) {
    // Use 3-month RHR as baseline if available, else 12-month, else conservative default
    const rhrBaseline = (healthData && (healthData.rhr_3m || healthData.rhr_6m || healthData.rhr_12m)) || 0;
    if (rhrBaseline > 0 && rhr > rhrBaseline * 1.10) {
      // RHR elevated >10% above baseline
      hiitAllowed = false;
      hiitBlockReason = 'RHR elevated vs baseline';
    }
  } else {
    // No RHR data at all -- be conservative, still allow if other signals are OK
  }

  // Gate 2: Recovery score -- if available and poor, block HIIT
  if (hiitAllowed && healthData) {
    const recovery = healthData.cardio_recovery || 0;
    if (recovery > 0 && recovery < 15) {
      // Poor recovery (<15 bpm drop in 1 min) -- skip HIIT
      hiitAllowed = false;
      hiitBlockReason = 'Poor recovery score';
    }
  }

  // Gate 3: No cardio base at all -- 0 sessions in last 14 days means start with Zone 2
  if (hiitAllowed) {
    // Count cardio sessions in last 14 days
    const now = new Date();
    let sessions14d = 0;
    for (let i = 0; i < 14; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = localDateStr(d);
      const cd = dayCardioMap[key];
      if (cd && cd.sessions && cd.sessions.length > 0) sessions14d++;
    }
    if (sessions14d === 0) {
      hiitAllowed = false;
      hiitBlockReason = 'No cardio base (ramp with Zone 2 first)';
    }
  }

  // Gate 4: Multiple consecutive hard training days -- use _consecutiveTrainDays if available
  if (hiitAllowed) {
    const consecDays = (typeof _consecutiveTrainDays !== 'undefined') ? _consecutiveTrainDays : 0;
    if (consecDays >= 4) {
      hiitAllowed = false;
      hiitBlockReason = 'Multiple consecutive training days';
    }
  }

  // Decide session split -- polarized 80/20 model
  // Target: 2 Zone 2 + 1 HIIT per week (Seiler 2010, Stoggl & Sperlich 2014)
  // Logic: prescribe based on what has ALREADY been done this week,
  // not just how many slots remain.
  const effectiveSessions = remainingSessions > 0 ? remainingSessions : (remainingMin > 0 ? 1 : 0);
  const zone2Done = Math.max(0, history.cardioSessions7d - history.hiitSessions7d);
  const hiitDone = history.hiitSessions7d;

  let hiitCount = 0;
  let zone2Count = 0;

  if (!hiitAllowed || effectiveSessions <= 0) {
    // Gates failed or nothing to prescribe -- all Zone 2
    zone2Count = Math.min(effectiveSessions, 2);
  } else if (hiitDone >= 1) {
    // Already did HIIT this week -- remaining slots are Zone 2
    zone2Count = Math.min(effectiveSessions, 2);
  } else if (zone2Done >= 1) {
    // Have aerobic base this week, HIIT slot is due
    hiitCount = 1;
    zone2Count = Math.max(0, effectiveSessions - 1);
  } else {
    // No cardio done yet this week -- Zone 2 first, HIIT if 2+ slots
    if (effectiveSessions >= 2) {
      zone2Count = effectiveSessions - 1;
      hiitCount = 1;
    } else {
      zone2Count = 1;
    }
  }

  // Progressive Zone 2 duration scaling
  // As aerobic base builds, extend durations to maintain stimulus (up to +10 min cap)
  // Based on 30-day cardio session count as a proxy for training consistency
  let sessions30d = 0;
  const now30 = new Date();
  for (let i = 0; i < 30; i++) {
    const d30 = new Date(now30);
    d30.setDate(d30.getDate() - i);
    const k30 = localDateStr(d30);
    if (dayCardioMap[k30] && dayCardioMap[k30].sessions && dayCardioMap[k30].sessions.length > 0) sessions30d++;
  }
  const z2DurationBonus = sessions30d >= 12 ? 10 : sessions30d >= 6 ? 5 : 0;

  // Pick zone 2 protocols
  // When rerolling (offset > 0), cycle through ALL protocols for guaranteed variety
  // When initial (offset === 0), prefer protocols whose modality wasn't recently used
  const z2All = CARDIO_PROTOCOLS.zone2;
  const z2Fresh = z2All.filter(p => !history.recentModalities.includes(p.modality));
  const z2Picks = (offset > 0) ? z2All : (z2Fresh.length > 0 ? z2Fresh : z2All);

  for (let i = 0; i < zone2Count && i < z2Picks.length; i++) {
    const protocol = z2Picks[(i + offset) % z2Picks.length];
    prescriptions.push({
      ...protocol,
      zone: 2,
      durationMin: protocol.durationMin + z2DurationBonus,
      hrRange: `${zones.zone2.low}-${zones.zone2.high}`,
    });
  }

  // Pick HIIT protocol
  if (hiitCount > 0) {
    const hiitAll = CARDIO_PROTOCOLS.hiit;
    const hiitFresh = hiitAll.filter(p => !history.recentModalities.includes(p.modality));
    const hiitPicks = (offset > 0) ? hiitAll : (hiitFresh.length > 0 ? hiitFresh : hiitAll);
    const protocol = hiitPicks[offset % hiitPicks.length];
    const hiitZone = protocol.zone || 4;
    const zoneData = hiitZone === 5 ? zones.zone5 : zones.zone4;
    prescriptions.push({
      ...protocol,
      zone: hiitZone,
      hrRange: `${zoneData.low}-${zoneData.high}`,
    });
  }

  return { zones, history, prescriptions, weekComplete: false, remainingMin, targetMin, completedMin: Math.round(history.estimatedMinutes7d), hiitBlockReason };
}

let _cardioRerollOffset = 0;
let _liftRerollOffset = 0;

// Custom muscle session state
let _customSessionActive = false;
let _customSessionRecs = null;
let _muscleSelectMode = false;
let _selectedMuscles = new Set();

function rerollLifts() {
  _liftRerollOffset++;
  haptic(12);
  var activeRecs = _customSessionActive && _customSessionRecs ? _customSessionRecs : LAST_RECS;
  if (activeRecs) {
    renderTimedSession(activeRecs);
    // v1.26: shuffle non-anchor rows into place with stagger
    try {
      var rows = document.querySelectorAll('#suggested-exercises .ex-row:not(.ex-row-anchor)');
      rows.forEach(function(r, i) {
        r.style.animationDelay = (i * 45) + 'ms';
        r.classList.add('reroll-shuffle');
        setTimeout(function() {
          r.classList.remove('reroll-shuffle');
          r.style.animationDelay = '';
        }, 420 + (i * 45) + 60);
      });
    } catch(_) {}
  }
}

function rerollCardio() {
  _cardioRerollOffset++;
  haptic(10);
  renderCardioPlan(heatmapDayCardio);
}

function resetToAutoSession() {
  _customSessionActive = false;
  _customSessionRecs = null;
  _liftRerollOffset = 0;
  if (LAST_RECS) renderTimedSession(LAST_RECS);
}

function toggleMuscleSelectMode() {
  _muscleSelectMode = !_muscleSelectMode;
  _selectedMuscles.clear();
  if (muscleAnalysis && LAST_RECS) {
    renderMuscleGrid(muscleAnalysis, LAST_RECS);
  }
}

function toggleMuscleSelection(key, evt) {
  if (evt) evt.stopPropagation();
  if (_selectedMuscles.has(key)) {
    _selectedMuscles.delete(key);
  } else {
    _selectedMuscles.add(key);
  }
  // Re-render grid to update selection highlights
  if (muscleAnalysis && LAST_RECS) {
    renderMuscleGrid(muscleAnalysis, LAST_RECS);
  }
}

function buildCustomSession() {
  if (_selectedMuscles.size === 0 || !LAST_RECS || !muscleAnalysis) return;
  // Build synthetic recs: selected muscles scored highest (in selection order),
  // then remaining muscles at their normal scores
  var selected = Array.from(_selectedMuscles);
  var customRecs = [];
  var maxScore = 10; // Ensure selected muscles rank above all others
  for (var i = 0; i < selected.length; i++) {
    var origRec = LAST_RECS.find(function(r) { return r.key === selected[i]; });
    if (origRec) {
      var clone = Object.assign({}, origRec);
      clone.score = maxScore - i; // Descending priority
      customRecs.push(clone);
    }
  }
  // Add remaining muscles at their original scores (won't be in top N)
  for (var j = 0; j < LAST_RECS.length; j++) {
    if (!_selectedMuscles.has(LAST_RECS[j].key)) {
      customRecs.push(Object.assign({}, LAST_RECS[j]));
    }
  }
  _customSessionActive = true;
  _customSessionRecs = customRecs;
  _liftRerollOffset = 0;
  _muscleSelectMode = false;
  _selectedMuscles.clear();
  renderTimedSession(customRecs);
  // Re-render muscle grid to exit select mode
  if (muscleAnalysis) renderMuscleGrid(muscleAnalysis, LAST_RECS);
  switchTab('today');
}

  var isOpen = el.style.maxHeight && el.style.maxHeight !== '0px';
  if (isOpen) {
    el.style.maxHeight = '0';
    el.style.opacity = '0';
  } else {
    el.style.maxHeight = el.scrollHeight + 'px';
    el.style.opacity = '1';
  }
}

function buildCardioBreakdownHTML(history) {
  const log = history.cardioLog || [];
  if (log.length === 0) {
    return `<div style="font-size:12px;font-family:'JetBrains Mono',monospace;color:${C.textDark};">No cardio sessions this week.</div>`;
  }

  // Sort by date descending
  const sorted = [...log].sort((a, b) => b.date - a.date);

  // Source summary line
  const parts = [];
  if (history.hevySessions > 0) parts.push(`\u{1F3CB}\uFE0F Hevy: ${history.hevySessions} session${history.hevySessions > 1 ? 's' : ''}, ${Math.round(history.hevyMinutes)} min`);
  if (history.appleSessions > 0) parts.push(`\u231A Watch: ${history.appleSessions} session${history.appleSessions > 1 ? 's' : ''}, ${Math.round(history.appleMinutes)} min`);

  let html = `<div style="font-size:11px;font-family:'JetBrains Mono',monospace;color:${C.textDim};margin-bottom:8px;">${parts.join(' \u00B7 ')}</div>`;

  // Per-session rows
  for (const s of sorted) {
    const dayStr = s.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const icon = s.source === 'watch' ? '\u231A' : '\u{1F3CB}\uFE0F';
    const calStr = s.calories > 0 ? ` \u00B7 ${Math.round(s.calories)} cal` : '';
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;font-family:'JetBrains Mono',monospace;">
      <span style="color:${C.textMid};">${icon} ${s.type}</span>
      <span style="color:${C.textDark};">${Math.round(s.minutes)} min${calStr} \u00B7 ${dayStr}</span>
    </div>`;
  }

  return html;
}

    // Surface HIIT gate block reason if applicable
    if (result.hiitBlockReason) {
      html += `<div style="padding:6px 0;font-size:11px;font-family:'JetBrains Mono',monospace;color:${C.textDark};">HIIT gated: ${result.hiitBlockReason}</div>`;
    }
  }

  html += `</div>`;
  sectionEl.innerHTML = html;
}

// ============================================================
// SMART WEIGHT PRESCRIPTION (Pillar 4)
// ============================================================

// Estimate starting weight for an exercise with no history and no EXERCISE_DB entry
// Uses the user's demonstrated strength in the same muscle group to infer a reasonable starting weight
function estimateWeightFromPeers(name) {
  var cls = classifyExercise(name);
  if (cls.primary === 'cardio' || cls.primary === 'other') return 0;
  var muscleKey = cls.primary;
  var compound = isLikelyCompound(name);

  // Collect strength ratios from exercises in this muscle group that have both DB benchmarks and history
  var ratios = [];
  var sameTypeWeights = [];
  for (var exName in EXERCISE_DB) {
    var exDb = EXERCISE_DB[exName];
    if (exDb.muscle !== muscleKey) continue;
    if (!exDb.benchmarkLbs || exDb.benchmarkLbs <= 0) continue;
    var exHist = exerciseHistory[exName];
    if (!exHist || !exHist.lastWeightLbs || exHist.lastWeightLbs <= 0) continue;

    var ratio = exHist.lastWeightLbs / exDb.benchmarkLbs;
    ratios.push(ratio);

    // Track weights from same type (compound vs isolation)
    var exIsCompound = exDb.type === 'compound';
    if (exIsCompound === compound) {
      sameTypeWeights.push(exHist.lastWeightLbs);
    }
  }

  if (ratios.length === 0) return 0;

  // User's average strength factor for this muscle group
  var avgRatio = ratios.reduce(function(a, b) { return a + b; }, 0) / ratios.length;

  // If the exercise IS in EXERCISE_DB (has benchmark but no history), scale the benchmark
  // Cap at 1.5x benchmark for isolation to prevent cross-exercise ratio inflation
  // (e.g. heavy Reverse Curl ratio inflating Wrist Curl prescription)
  var db = EXERCISE_DB[name];
  if (db && db.benchmarkLbs > 0) {
    var cappedRatio = (db.type === 'isolation') ? Math.min(avgRatio, 1.5) : Math.min(avgRatio, 2.0);
    return Math.round(db.benchmarkLbs * cappedRatio / 5) * 5;
  }

  // Exercise not in EXERCISE_DB: use median weight of same-type exercises, scaled conservatively
  // Start at 80% of median same-type weight (safety margin for unfamiliar movement)
  if (sameTypeWeights.length > 0) {
    sameTypeWeights.sort(function(a, b) { return a - b; });
    var median = sameTypeWeights[Math.floor(sameTypeWeights.length / 2)];
    return Math.round(median * 0.8 / 5) * 5;
  }

  return 0;
}

function prescribeExercise(name) {
  const db = EXERCISE_DB[name];
  const hist = exerciseHistory[name];

  let sets = db ? db.sets : 3;
  let reps = db ? db.reps : '8-10';
  let weightLbs = db ? db.benchmarkLbs : 0;
  let note = db ? (db.note || '') : '';

  // Parse the target rep range from EXERCISE_DB (e.g. "8-10" -> low=8, high=10)
  const repStr = String(db ? (db.reps || '8-10') : '8-10');
  const repParts = repStr.split('-');
  const repRangeLow = parseInt(repParts[0], 10) || 8;
  const repRangeHigh = repParts.length > 1 ? (parseInt(repParts[1], 10) || repRangeLow) : repRangeLow;

  let isDeload = false;
  if (hist && hist.lastWeightLbs > 0) {
    const lastW = hist.lastWeightLbs;
    const lastR = hist.lastReps || repRangeLow;
    if (hist.lastSets >= 2 && hist.lastSets <= 6) sets = hist.lastSets;

    // v1.39: stall detection. Double progression previously had no failure
    // mode -- repeat the same weight and reps forever and the app keeps
    // prescribing +1 rep. Rule (NSCA-aligned: repeated failed attempts at a
    // target -> reduce load and rebuild): if the trailing run at the current
    // weight spans >= 4 sessions and the gating rep count (min reps among
    // top-weight sets) shows no net progress across the last 3 attempts,
    // prescribe a ~10% deload (rounded to 5 lbs) and reset to the bottom of
    // the rep range. Skipped for bodyweight/hold exercises.
    let stalled = false;
    if (note !== 'bodyweight' && note !== 'hold'
        && Array.isArray(hist.weights) && Array.isArray(hist.reps)
        && hist.weights.length >= 4 && hist.reps.length === hist.weights.length
        && lastR < repRangeHigh) {
      let runLen = 0;
      for (let hi = hist.weights.length - 1; hi >= 0; hi--) {
        if (hist.weights[hi] === lastW) runLen++;
        else break;
      }
      if (runLen >= 4) {
        // "No net progress" = NO attempt in the last 3 sessions exceeded the
        // baseline rep count. A single bad day after visible progress (e.g.
        // 6,8,9,6) does NOT trigger a deload; a flat or declining run
        // (7,7,7,7 or 4,4,3,3) does.
        const rBase = hist.reps[hist.reps.length - 4];
        const recentMax = Math.max(
          hist.reps[hist.reps.length - 1],
          hist.reps[hist.reps.length - 2],
          hist.reps[hist.reps.length - 3]
        );
        if (recentMax > 0 && rBase > 0 && recentMax <= rBase) stalled = true;
      }
    }

    // Double progression:
    // Phase 1 -- same weight, +1 rep, until top of rep range is reached
    // Phase 2 -- once top of rep range is hit, bump weight +5 lbs and reset to bottom of rep range
    // Phase 0 (v1.39) -- stalled: deload ~10%, reset to bottom of rep range
    if (stalled) {
      let deloaded = Math.max(5, Math.round((lastW * 0.9) / 5) * 5);
      if (deloaded >= lastW) deloaded = Math.max(5, lastW - 5);
      weightLbs = deloaded;
      reps = String(repRangeLow);
      isDeload = true;
    } else if (lastR >= repRangeHigh) {
      // Hit the top of the rep range -- bump weight, reset to low end
      weightLbs = lastW + 5;
      reps = String(repRangeLow);
    } else {
      // Still within rep range -- hold weight, add one rep
      weightLbs = lastW;
      reps = String(lastR + 1);
    }

  } else if (!db) {
    // No EXERCISE_DB entry and no history: estimate from peer exercises
    weightLbs = estimateWeightFromPeers(name);
  } else {
    // Has EXERCISE_DB entry but no history: scale benchmark by user's strength in this muscle group
    var estimated = estimateWeightFromPeers(name);
    if (estimated > 0) weightLbs = estimated;
  }

  if (note === 'bodyweight' || note === 'hold') weightLbs = 0;
  // Final guard: ensure weight is always a multiple of 5
  if (weightLbs > 0) weightLbs = Math.round(weightLbs / 5) * 5;
  return { sets, reps, weightLbs, note, deload: isDeload };
}

function formatPrescription(p) {
  let str = `${p.sets}\u00d7${p.reps}`;
  if (p.weightLbs > 0) str += ` @ ${p.weightLbs}lbs`;
  if (p.note === 'per hand' || p.note === 'per side') str += '/ea';
  return str;
}

// ============================================================
// IMBALANCE DETECTION & RECOMMENDATIONS
// ============================================================
function generateRecommendations(muscleStats) {
  const recs = [];
  const weeklyVolumes = {};
  for (const [key, stat] of Object.entries(muscleStats)) {
    weeklyVolumes[key] = stat.totalSets30d / 4.3;
  }

  const volumeRatios = {};
  let maxRatio = 0;
  for (const [key, stat] of Object.entries(muscleStats)) {
    const ratio = weeklyVolumes[key] / stat.idealSetsPerWeek;
    volumeRatios[key] = ratio;
    if (ratio > maxRatio) maxRatio = ratio;
  }

  // Phase 3: proportion deficit scores (0 if no measurements)
  const hasProportions = Object.keys(proportionDeficits).length > 0;
  const proportionWeight = hasProportions ? 0.15 : 0;
  // Rebalance weights when proportions are available
  const recencyW   = hasProportions ? 0.35 : 0.40;
  const volumeW    = hasProportions ? 0.25 : 0.30;
  const imbalanceW = hasProportions ? 0.25 : 0.30;

  // Structural importance: bias toward foundation muscle groups when
  // training frequency is low. At full frequency (5+/wk) the bonus is
  // minimal so neglect signals dominate. At low frequency (1-2/wk) the
  // bonus is strong so limited sessions hit big compounds first.
  // Tier 1 = large compound groups (chest, back, shoulders, quads)
  // Tier 2 = posterior chain (hamstrings, glutes)
  // Tier 3 = accessories (biceps, triceps, calves, core, neck, forearms)
  var liftDays14d = 0;
  var freqNow = new Date();
  for (var fi = 0; fi < 14; fi++) {
    var fd = new Date(freqNow);
    fd.setDate(fd.getDate() - fi);
    var fk = localDateStr(fd);
    if (heatmapDayWorkouts[fk] && heatmapDayWorkouts[fk].length > 0) liftDays14d++;
  }
  var weeklyFreq = liftDays14d / 2;
  // Scale: 5+/wk -> 0.03, 3-4/wk -> 0.08, 1-2/wk -> 0.15, 0/wk -> 0.20
  var structuralW = weeklyFreq >= 5 ? 0.08
                  : weeklyFreq >= 3 ? 0.16
                  : weeklyFreq >= 1 ? 0.25
                  : 0.35;
  var tierBonus = { 1: 1.0, 2: 0.5, 3: 0.0 };

  for (const [key, stat] of Object.entries(muscleStats)) {
    // Recency uses PRIMARY training date -- secondary stimulus (e.g. RDLs for back)
    // doesn't reset the clock. This prevents back from being deprioritized when
    // only indirect work has been done recently.
    const recencyScore = Math.min(stat.daysSincePrimary / stat.idealFreqDays, 3);
    const idealSets30d = stat.idealSetsPerWeek * 4.3;
    const volumeDeficit = Math.max(0, 1 - (stat.totalSets30d / idealSets30d));
    const imbalanceScore = maxRatio > 0 ? Math.max(0, 1 - (volumeRatios[key] / maxRatio)) : 0;
    const propDeficit = proportionDeficits[key] || 0;

    // Structural importance bonus (tier from MUSCLE_GROUPS)
    const muscleTier = (MUSCLE_GROUPS[key] && MUSCLE_GROUPS[key].tier) || 3;
    const structBonus = (tierBonus[muscleTier] || 0) * structuralW;

    const score = (recencyScore * recencyW)
               + (volumeDeficit * volumeW)
               + (imbalanceScore * imbalanceW)
               + (propDeficit * proportionWeight)
               + structBonus;

    let urgency = 'low';
    if (stat.daysSincePrimary >= stat.idealFreqDays * 2.5 || (volumeDeficit > 0.7 && imbalanceScore > 0.5)) {
      urgency = 'high';
    } else if (stat.daysSincePrimary >= stat.idealFreqDays * 1.5 || volumeDeficit > 0.5) {
      urgency = 'med';
    }

    const weeklyActual = weeklyVolumes[key].toFixed(1);
    const weeklyIdeal = stat.idealSetsPerWeek;
    let explainer = '';

    // Has secondary-only recent work? (primary is old but any is recent)
    const hasIndirectOnly = stat.daysSincePrimary > stat.daysSinceAny && stat.daysSinceAny < stat.idealFreqDays;

    if (stat.daysSincePrimary === Infinity && stat.daysSinceAny === Infinity) {
      explainer = `No ${stat.name.toLowerCase()} training found in your history. This muscle group needs attention to build a balanced physique.`;
    } else if (stat.daysSincePrimary === Infinity) {
      explainer = `No direct ${stat.name.toLowerCase()} work found -- only indirect stimulus (${stat.daysSinceAny}d ago). Add dedicated exercises to develop this muscle group.`;
    } else {
      const parts = [];
      if (stat.daysSincePrimary >= stat.idealFreqDays * 2.5) {
        let msg = `Last direct work <strong>${stat.daysSincePrimary} days ago</strong> \u2014 ideally every ${stat.idealFreqDays} days for optimal growth`;
        if (hasIndirectOnly) msg += ` (indirect stimulus ${stat.daysSinceAny}d ago doesn\u2019t fully count)`;
        parts.push(msg);
      } else if (stat.daysSincePrimary >= stat.idealFreqDays * 1.5) {
        let msg = `Directly trained ${stat.daysSincePrimary} days ago, slightly past the ${stat.idealFreqDays}-day window`;
        if (hasIndirectOnly) msg += ` (secondary-only work ${stat.daysSinceAny}d ago)`;
        parts.push(msg);
      }
      if (volumeDeficit > 0.4) {
        parts.push(`Volume is <strong>${weeklyActual} sets/week</strong> vs the ${weeklyIdeal} recommended \u2014 ${Math.round(volumeDeficit * 100)}% below target`);
      }
      if (imbalanceScore > 0.4) {
        const topMuscle = Object.entries(volumeRatios).sort((a, b) => b[1] - a[1])[0];
        if (topMuscle[0] !== key) {
          parts.push(`Lagging behind your ${muscleStats[topMuscle[0]].name.toLowerCase()} proportionally \u2014 focus here to balance out`);
        }
      }
      if (propDeficit > 0.05) {
        const ft = Object.entries(FRAME_TARGETS).find(([k, v]) => v.muscle === key);
        if (ft) {
          parts.push(`Frame target (<strong>${ft[1].label}</strong>) is ${Math.round(propDeficit * 100)}% below potential`);
        }
      }
      if (parts.length === 0) {
        parts.push(`On track. ${weeklyActual} sets/week is close to the ${weeklyIdeal} target. Last direct work ${stat.daysSincePrimary} days ago.`);
      }
      explainer = parts.join('. ') + '.';
    }

    recs.push({
      key, name: stat.name, score, urgency, structBonus, tier: muscleTier,
      daysSince: stat.daysSincePrimary,
      daysSinceAny: stat.daysSinceAny,
      sets30d: stat.totalSets30d,
      detail: stat.daysSincePrimary === Infinity
        ? (stat.daysSinceAny === Infinity ? 'no data' : `indirect ${stat.daysSinceAny}d ago`)
        : `${stat.daysSincePrimary}d ago \u00b7 ${formatSets(stat.totalSets30d)} sets/30d`,
      explainer,
      weeklyActual: parseFloat(weeklyActual),
      weeklyIdeal,
    });
  }

  // Recovery guard: muscles trained today (daysSincePrimary === 0) need at least
  // 1 rest day before being recommended again. Suppress their score so they fall
  // to the bottom of the list regardless of volume/imbalance/proportion signals.
  for (const r of recs) {
    if (r.daysSince === 0) {
      r.score = -1;
      r.urgency = 'low';
      r.explainer = 'Trained today \u2014 rest at least 1 day before hitting this muscle again.';
    }
  }

  recs.sort((a, b) => b.score - a.score);
  return recs;
}

// ============================================================
// SESSION PLANNING (v1.1 Task 8 - upgraded)
// Improved: fatigue-aware, ensures isolation for #1 priority,
// avoids stacking heavy compounds for same movement pattern
// ============================================================
const MUSCLE_EXERCISE_CAP = {
  caps: [3, 2, 2],
};

// Movement pattern groups to avoid stacking
const MOVEMENT_PATTERNS = {
  'horizontal_push': ['Bench Press (Barbell)', 'Incline Bench Press (Dumbbell)', 'Incline Bench Press (Barbell)', 'Chest Press (Machine)', 'Decline Bench Press (Barbell)'],
  'vertical_push': ['Overhead Press (Barbell)', 'Overhead Press (Dumbbell)', 'Arnold Press (Dumbbell)', 'Seated Shoulder Press (Machine)', 'Shoulder Press (Dumbbell)', 'Standing Military Press (Barbell)'],
  'horizontal_pull': ['Bent Over Row (Barbell)', 'Seated Row (Machine)', 'Dumbbell Row', 'Pendlay Row (Barbell)'],
  'vertical_pull': ['Pull Up', 'Chin Up', 'Lat Pulldown (Cable)', 'Lat Pulldown (Machine)'],
  'knee_dominant': ['Squat (Barbell)', 'Leg Press (Machine)', 'Front Squat', 'Goblet Squat'],
  'hip_dominant': ['Deadlift (Barbell)', 'Romanian Deadlift (Barbell)', 'Hip Thrust (Barbell)', 'Hip Thrust (Machine)'],
};

function getMovementPattern(exName) {
  for (const [pattern, exercises] of Object.entries(MOVEMENT_PATTERNS)) {
    if (exercises.includes(exName)) return pattern;
  }
  return null;
}

// Heuristic: infer compound vs isolation from exercise name
// Used for exercises not in EXERCISE_DB
const COMPOUND_PATTERNS = [
  /press/i, /squat/i, /deadlift/i, /row/i, /pull.?up/i, /chin.?up/i,
  /dip/i, /lunge/i, /thrust/i, /clean/i, /snatch/i, /step.?up/i,
  /good morning/i, /leg press/i, /rack pull/i, /farmer/i,
];

function isLikelyCompound(name) {
  return COMPOUND_PATTERNS.some(function(p) { return p.test(name); });
}

// Evidence-based rest periods (Schoenfeld 2016, de Salles 2009, Singer 2024):
// 180s: Heavy barbell compounds (squat, deadlift, bench, OHP, heavy rows, leg press)
// 120s: Moderate compounds (dumbbell/machine presses, pulls, dips, RDL, hip thrust)
//  90s: Multi-joint machines, heavier isolation (barbell curl, skullcrusher, lat pulldown)
//  60s: Pure isolation, small muscles (raises, curls, extensions, core, neck, forearms, calves)
// Hardcoded per-exercise in EXERCISE_DB.rest; heuristic fallback for unknown exercises
const HEAVY_COMPOUND_PATTERNS = [
  /squat.*barbell/i, /barbell.*squat/i,
  /^squat$/i,
  /deadlift.*barbell/i, /barbell.*deadlift/i, /^deadlift$/i,
  /bench press.*barbell/i, /barbell.*bench press/i, /^bench press$/i,
  /overhead press.*barbell/i, /military press/i,
  /rack pull/i, /pendlay row/i, /leg press/i,
];

function getRestSeconds(name) {
  // Use hardcoded value if available
  var db = EXERCISE_DB[name];
  if (db && db.rest) return db.rest;
  // Fallback heuristic for exercises not in EXERCISE_DB
  for (var i = 0; i < HEAVY_COMPOUND_PATTERNS.length; i++) {
    if (HEAVY_COMPOUND_PATTERNS[i].test(name)) return 180;
  }
  var compound = db ? db.type === 'compound' : isLikelyCompound(name);
  if (compound) return 120;
  return 60;
}

function buildTimedSession(recs, prefs) {
  prefs = prefs || sessionPrefs;
  var focusMode = prefs.focusMode || 'auto';
  // Custom session overrides focus mode
  if (_customSessionActive) focusMode = 'auto';
  var filteredRecs = recs;
  if (focusMode === 'foundation') {
    filteredRecs = recs.filter(function(r) { return r.tier && r.tier <= 2; });
    if (filteredRecs.length < 2) filteredRecs = recs; // fallback if not enough
  } else if (focusMode === 'neglect') {
    filteredRecs = recs.slice().sort(function(a, b) {
      var aScore = a.score >= 0 ? a.score - (a.structBonus || 0) : a.score;
      var bScore = b.score >= 0 ? b.score - (b.structBonus || 0) : b.score;
      return bScore - aScore;
    });
  }
  // Dynamic muscle count: start with 3, expand if time budget allows
  var startCount = 3;
  var maxCount = Math.min(filteredRecs.length, 6);
  var topKeys = filteredRecs.slice(0, startCount).map(r => r.key);
  const recScores = {};
  recs.forEach(r => { recScores[r.key] = r.score; });

  const capSec = (prefs.sessionCapMin || TIME_CONSTANTS.sessionCapMin) * 60;

  function buildCandidatesForKeys(keys) {
    var muscleCaps = {};
    keys.forEach(function(key, idx) { muscleCaps[key] = MUSCLE_EXERCISE_CAP.caps[idx] || 2; });
    var cands = [];
    for (var ki = 0; ki < keys.length; ki++) {
      var key = keys[ki];
      var picks = rankExercisesForMuscle(key);
      var cappedPicks = picks.slice(0, muscleCaps[key]);
      var groupPriority = recScores[key] || 0;
      for (var ei = 0; ei < cappedPicks.length; ei++) {
        var exName = cappedPicks[ei];
        if (prefs.equipment === 'home' && GYM_ONLY_REGEX.test(exName)) continue;
        var db = EXERCISE_DB[exName];
        var p = prescribeExercise(exName);
        var mp = getMovementPattern(exName);
        var compound = db ? db.type === 'compound' : isLikelyCompound(exName);
        var isolation = db ? db.type === 'isolation' : !isLikelyCompound(exName);
        var typeBonus = compound ? 1.5 : 1.0;
        var deficitBonus = 1.0;
        if (db && db.benchmarkLbs > 0 && p.weightLbs > 0) {
          deficitBonus = (p.weightLbs / db.benchmarkLbs) < 0.85 ? 1.3 : 1.0;
        }
        var orderBonus = 1 - (ei * 0.1);
        var importance = groupPriority * typeBonus * deficitBonus * orderBonus;
        var timeSec = calculateExerciseTime(exName, p.sets);
        cands.push({
          name: exName, muscle: key, prescription: p,
          importance: importance, timeSec: timeSec,
          isCompound: compound, isIsolation: isolation,
          movementPattern: mp,
        });
      }
    }
    cands.sort(function(a, b) { return b.importance - a.importance; });
    return cands;
  }

  function fitCandidates(cands, keys) {
    var sess = [];
    var total = 0;
    var usedPat = new Set();
    var muscCompCount = {};
    var topM = keys[0];
    var topMHasIso = false;
    // v1.29: Big 5 conflict + cap tracking
    var big5InSession = [];          // e.g. ['squat', 'bench']
    var big5Cap = bigFiveCapForBudget(capSec);
    var conflictLog = [];            // user-visible resolution reasons
    // v1.33: session variety guards
    var usedFamilies = new Set();    // same movement, different equipment = one slot
    var muscIsoCount = {};           // soft cap: 2 isolations per muscle per session

    for (var ci = 0; ci < cands.length; ci++) {
      var c = cands[ci];
      if (total + c.timeSec > capSec) continue;
      // v1.33: variety guards -- silent skips (hygiene, not a research rail)
      var fam = exerciseFamily(c.name);
      if (usedFamilies.has(fam)) continue;
      if (c.isIsolation && (muscIsoCount[c.muscle] || 0) >= 2) continue;
      if (c.isCompound && c.movementPattern) {
        if (usedPat.has(c.movementPattern)) continue;
      }
      if (c.isCompound && (muscCompCount[c.muscle] || 0) >= 1) {
        if (total >= capSec * 0.7) continue;
      }

      // v1.29: Big 5 conflict + cap checks - run only on Big 5 lifts
      var big5Key = isBig5(c.name);
      if (big5Key) {
        // Cap enforcement
        if (big5InSession.length >= big5Cap) {
          conflictLog.push({
            type: 'cap',
            skipped: c.name,
            reason: 'Session cap of ' + big5Cap + ' heavy compounds for ' + Math.round(capSec / 60) + '-min sessions. Adding another would compromise recovery or rush accessories.'
          });
          continue;
        }
        // Conflict enforcement
        var conflict = findBig5Conflict(big5Key, big5InSession);
        if (conflict) {
          if (conflict.severity === 'block') {
            conflictLog.push({
              type: 'block',
              skipped: c.name,
              pair: conflict.pair,
              reason: conflict.reason
            });
            continue;
          }
          if (conflict.severity === 'caution') {
            // Caution: skip only if we're already past 40% time budget
            // (i.e. we have room for it early but not late in the session)
            if (total >= capSec * 0.4) {
              conflictLog.push({
                type: 'caution',
                skipped: c.name,
                pair: conflict.pair,
                reason: conflict.reason
              });
              continue;
            }
          }
        }
      }

      sess.push(c);
      total += c.timeSec;
      if (c.isCompound && c.movementPattern) usedPat.add(c.movementPattern);
      if (c.isCompound) muscCompCount[c.muscle] = (muscCompCount[c.muscle] || 0) + 1;
      if (c.muscle === topM && c.isIsolation) topMHasIso = true;
      if (big5Key) big5InSession.push(big5Key);
      usedFamilies.add(fam);
      if (c.isIsolation) muscIsoCount[c.muscle] = (muscIsoCount[c.muscle] || 0) + 1;
    }
    if (!topMHasIso && sess.length > 0) {
      var isoC = cands.find(function(c) {
        return c.muscle === topM && c.isIsolation && sess.indexOf(c) === -1 && total + c.timeSec <= capSec && !usedFamilies.has(exerciseFamily(c.name));
      });
      if (isoC) { sess.push(isoC); total += isoC.timeSec; }
    }
    return { session: sess, totalSec: total, conflictLog: conflictLog, big5InSession: big5InSession };
  }

  // Build initial session with 3 muscles, then expand if >25% time remaining
  var candidates = buildCandidatesForKeys(topKeys);
  var result = fitCandidates(candidates, topKeys);
  var session = result.session;
  var totalSec = result.totalSec;

  while (totalSec < capSec * 0.75 && topKeys.length < maxCount) {
    var nextRec = filteredRecs[topKeys.length];
    if (!nextRec || nextRec.score < 0) break; // skip suppressed muscles
    topKeys.push(nextRec.key);
    candidates = buildCandidatesForKeys(topKeys);
    result = fitCandidates(candidates, topKeys);
    session = result.session;
    totalSec = result.totalSec;
  }

  // Sort by demand: heavy compounds first, small accessories last
  session.sort(function(a, b) {
    return getExerciseDemandRank(a.name) - getExerciseDemandRank(b.name);
  });

  // v1.29: surface conflict resolution log from final fit pass
  return { exercises: session, totalSec: totalSec, conflictLog: (result && result.conflictLog) || [], big5InSession: (result && result.big5InSession) || [] };
}

  _lastBuiltSession = result;
  return result;
}

// Fetch exercise templates from Hevy to resolve missing template IDs
// Fuzzy-match EXERCISE_DB and pool names to Hevy template names
// Handles cases like "Standing Calf Raise" -> "Standing Calf Raise (Barbell)"
function fuzzyMatchTemplateIds() {
  var allTemplateNames = Object.keys(_templateIdMap);
  var fuzzyMatched = 0;
  // Check all EXERCISE_DB names
  for (var exName in EXERCISE_DB) {
    if (_templateIdMap[exName]) continue;
    var needle = exName.toLowerCase().trim();
    for (var fi = 0; fi < allTemplateNames.length; fi++) {
      var tn = allTemplateNames[fi].toLowerCase().trim();
      if (tn.indexOf(needle) === 0 || needle.indexOf(tn) === 0) {
        _templateIdMap[exName] = _templateIdMap[allTemplateNames[fi]];
        fuzzyMatched++;
        break;
      }
    }
  }
  // Check all dynamic pool names
  for (var key in _dynamicExercisePool) {
    _dynamicExercisePool[key].forEach(function(exName) {
      if (_templateIdMap[exName]) return;
      var needle = exName.toLowerCase().trim();
      for (var fi = 0; fi < allTemplateNames.length; fi++) {
        var tn = allTemplateNames[fi].toLowerCase().trim();
        if (tn.indexOf(needle) === 0 || needle.indexOf(tn) === 0) {
          _templateIdMap[exName] = _templateIdMap[allTemplateNames[fi]];
          fuzzyMatched++;
        }
      }
    });
  }
  if (fuzzyMatched > 0) console.log('Fuzzy-matched ' + fuzzyMatched + ' exercises to Hevy templates');
}

async function fetchAllHevyTemplateIds() {
  // Try localStorage cache first (7-day TTL)
  try {
    var cached = Storage.get('hevy_template_map');
    var cachedTs = Storage.get('hevy_template_map_ts');
    var cacheAge = cachedTs ? (Date.now() - cachedTs) : Infinity;
    var CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days
    if (cached && typeof cached === 'object' && Object.keys(cached).length > 20 && cacheAge < CACHE_TTL) {
      // Preserve workout-derived IDs (custom exercises) over cached ones
      var workoutDerived = {};
      for (var wk in _templateIdMap) { workoutDerived[wk] = _templateIdMap[wk]; }
      Object.assign(_templateIdMap, cached);
      // Overlay workout-derived IDs back on top (fresher, includes custom exercises)
      Object.assign(_templateIdMap, workoutDerived);
      _hevyTemplatesLoaded = true;
      console.log('Hevy templates loaded from cache: ' + Object.keys(_templateIdMap).length + ' exercises (age: ' + Math.round(cacheAge / 3600000) + 'h)');
      addHevyTemplatesToPool();
      fuzzyMatchTemplateIds();
      warnUnmatchedExercises();
      return;
    }
  } catch (e) { /* ignore cache errors */ }

  try {
    // Collect all exercise names we need to match
    var needed = new Set();
    for (var key in _dynamicExercisePool) {
      _dynamicExercisePool[key].forEach(function(n) { needed.add(n); });
    }
    // Also include static MUSCLE_EXERCISE_PICKS as fallback
    for (var key2 in MUSCLE_EXERCISE_PICKS) {
      var arr = MUSCLE_EXERCISE_PICKS[key2];
      for (var i = 0; i < arr.length; i++) needed.add(arr[i]);
    }

    var page = 1;
    var maxPages = 50;
    var matched = 0;
    while (page <= maxPages) {
      var resp = await fetchWithTimeout(API_BASE + '/exercise_templates?page=' + page + '&pageSize=10', {
        headers: { 'api-key': apiKey },
        mode: 'cors'
      });
      if (!resp.ok) break;
      var data = await resp.json();
      var templates = data.exercise_templates || [];
      if (templates.length === 0) break;

      for (var j = 0; j < templates.length; j++) {
        var t = templates[j];
        var tName = t.title || '';
        if (tName && !_templateIdMap[tName]) {
          _templateIdMap[tName] = t.id;
          if (needed.has(tName)) matched++;
        }
      }

      // Early stop: all MUSCLE_EXERCISE_PICKS exercises are matched
      if (matched >= needed.size) {
        console.log('Hevy templates: all ' + needed.size + ' needed exercises matched after ' + page + ' pages');
        break;
      }

      var totalPages = data.page_count || 1;
      if (page >= totalPages) break;
      page++;
    }

    _hevyTemplatesLoaded = true;
    console.log('Hevy templates loaded: ' + Object.keys(_templateIdMap).length + ' total, ' + matched + '/' + needed.size + ' needed');

    // Expand dynamic pool with newly discovered Hevy exercises
    addHevyTemplatesToPool();
    fuzzyMatchTemplateIds();

    // Cache to localStorage for fast future loads (includes fuzzy matches)
    Storage.set('hevy_template_map', _templateIdMap);
    Storage.set('hevy_template_map_ts', Date.now());

    warnUnmatchedExercises();
  } catch (e) {
    console.error('fetchAllHevyTemplateIds error:', e);
  }
}

function warnUnmatchedExercises() {
  var unmatched = [];
  var totalPool = 0;
  var matchedPool = 0;
  for (var key in _dynamicExercisePool) {
    _dynamicExercisePool[key].forEach(function(name) {
      totalPool++;
      if (_templateIdMap[name]) matchedPool++;
      else unmatched.push(name + ' (' + key + ')');
    });
  }
  console.log('Exercise pool: ' + matchedPool + '/' + totalPool + ' matched to Hevy templates');
  if (unmatched.length > 0) {
    console.warn('Hevy template mismatch - these exercises will be excluded from sessions:\n  ' + unmatched.join('\n  '));
  }
}

async function resolveTemplateIds(names) {
  // Apply hardcoded ID overrides first (neck, forearm exercises with non-matching Hevy names)
  for (var oi = 0; oi < names.length; oi++) {
    if (HEVY_ID_OVERRIDES[names[oi]] && !_templateIdMap[names[oi]]) {
      _templateIdMap[names[oi]] = HEVY_ID_OVERRIDES[names[oi]];
    }
  }
  var missing = names.filter(function(n) { return !_templateIdMap[n]; });
  if (missing.length === 0) return true;

  // First: try fuzzy match against already-loaded templates
  // If LiftScript says "Standing Calf Raise" and Hevy has "Standing Calf Raise (Barbell)",
  // match on the base name
  if (missing.length > 0) {
    var allLoaded = Object.keys(_templateIdMap);
    for (var mi = 0; mi < missing.length; mi++) {
      var needle = missing[mi].toLowerCase().trim();
      // Strategy 1: LiftScript name is a prefix of a Hevy template name
      // e.g. "Standing Calf Raise" matches "Standing Calf Raise (Barbell)"
      var bestMatch = null;
      for (var ti = 0; ti < allLoaded.length; ti++) {
        var tl = allLoaded[ti].toLowerCase().trim();
        if (tl === needle) { bestMatch = allLoaded[ti]; break; }
        if (tl.indexOf(needle) === 0 || needle.indexOf(tl) === 0) {
          bestMatch = allLoaded[ti];
        }
      }
      if (bestMatch && !_templateIdMap[missing[mi]]) {
        _templateIdMap[missing[mi]] = _templateIdMap[bestMatch];
      }
    }
    missing = names.filter(function(n) { return !_templateIdMap[n]; });
  }

  if (missing.length === 0) return true;

  // Second: fetch from API for any still missing
  try {
    var page = 1;
    var maxPages = 30;
    while (missing.length > 0 && page <= maxPages) {
      var resp = await fetchWithTimeout(API_BASE + '/exercise_templates?page=' + page + '&pageSize=10', {
        headers: { 'api-key': apiKey },
        mode: 'cors'
      });
      if (!resp.ok) break;
      var data = await resp.json();
      var templates = data.exercise_templates || [];
      if (templates.length === 0) break;

      for (var i = 0; i < templates.length; i++) {
        var t = templates[i];
        var tName = t.title || '';
        if (tName && !_templateIdMap[tName]) {
          _templateIdMap[tName] = t.id;
        }
        // Fuzzy match: check if any missing name is a prefix of this template
        for (var mi2 = 0; mi2 < missing.length; mi2++) {
          var mn = missing[mi2].toLowerCase().trim();
          var tn = tName.toLowerCase().trim();
          if (!_templateIdMap[missing[mi2]] && (tn.indexOf(mn) === 0 || mn.indexOf(tn) === 0)) {
            _templateIdMap[missing[mi2]] = t.id;
          }
        }
      }

      missing = names.filter(function(n) { return !_templateIdMap[n]; });
      var totalPages = data.page_count || 1;
      if (page >= totalPages) break;
      page++;
    }
  } catch (e) {
    console.error('resolveTemplateIds error:', e);
  }

  // Log any still unresolved for debugging
  var stillMissing = names.filter(function(n) { return !_templateIdMap[n]; });
  if (stillMissing.length > 0) {
    console.warn('Unresolved exercises after fuzzy match:', stillMissing.join(', '));
  }

  return stillMissing.length === 0;
}

async function sendSessionToHevy() {
  var btn = document.getElementById('send-to-hevy-btn');
  if (!btn || !_lastBuiltSession || !_lastBuiltSession.exercises || _lastBuiltSession.exercises.length === 0) {
    showToast('No session to send', true);
    return;
  }

  // Disable button and show loading
  btn.disabled = true;
  var origHTML = btn.innerHTML;
  btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Sending...</span>';
  btn.style.opacity = '0.6';

  try {
    // Get all exercise names in session
    var exNames = _lastBuiltSession.exercises.map(function(ex) { return ex.name; });

    // Resolve any missing template IDs
    var allResolved = await resolveTemplateIds(exNames);
    var unresolvedNames = exNames.filter(function(n) { return !_templateIdMap[n]; });
    var resolvedExercises = _lastBuiltSession.exercises.filter(function(ex) { return !!_templateIdMap[ex.name]; });
    var droppedExercises = _lastBuiltSession.exercises.filter(function(ex) { return !_templateIdMap[ex.name]; });
    if (droppedExercises.length > 0) {
      console.warn('Dropped (no Hevy template):', droppedExercises.map(function(e){return e.name;}).join(', '));
    }

    if (resolvedExercises.length === 0) {
      showToast('Could not find any Hevy IDs for these exercises', true);
      btn.innerHTML = origHTML;
      btn.style.opacity = '1';
      btn.disabled = false;
      return;
    }

    // Build exercises array
    var routineTitle = 'LiftScript Daily';
    var exercises = [];
    for (var i = 0; i < resolvedExercises.length; i++) {
      var ex = resolvedExercises[i];
      var p = ex.prescription;
      var templateId = _templateIdMap[ex.name];

      // Use the exact prescribed rep count (double progression sets this as a single integer string)
      var repStr = String(p.reps || '8');
      var repParts = repStr.split('-');
      // If reps is a range (e.g. "8-10" for exercises with no history), use the low end
      var prescribedReps = parseInt(repParts[0], 10) || 8;

      // Round weight to nearest 5 lbs, then convert to kg.
      // Hevy displays lbs as floor(kg * 2.20462, 2dp) -- truncation, not rounding.
      // So we ceil the kg to 3dp to ensure the back-conversion lands on or above target.
      // e.g. 140 lbs: round gives 63.503 kg -> floor(139.999) = 139.99. WRONG.
      //               ceil  gives 63.504 kg -> floor(140.002) = 140.00. CORRECT.
      var weightLbsRounded = p.weightLbs > 0 ? Math.ceil(p.weightLbs / 5) * 5 : 0;
      var weightKg = weightLbsRounded > 0 ? Math.ceil((weightLbsRounded / 2.20462) * 1000) / 1000 : null;

      // Build sets array
      var sets = [];
      for (var s = 0; s < (p.sets || 3); s++) {
        var setObj = { type: 'normal' };
        if (weightKg !== null) setObj.weight_kg = weightKg;
        setObj.reps = prescribedReps;
        sets.push(setObj);
      }

      var exObj = {
        exercise_template_id: templateId,
        superset_id: null,
        rest_seconds: getRestSeconds(ex.name),
        sets: sets
      };

      var noteParts = [];
      if (p.deload) noteParts.push('deload -10%'); // v1.39
      if (p.note === 'per hand' || p.note === 'per side') noteParts.push(p.note);
      if (noteParts.length > 0) exObj.notes = noteParts.join(' \u00b7 ');

      exercises.push(exObj);
    }

    var routinePayload = {
      title: routineTitle,
      exercises: exercises
    };

    // Find existing "LiftScript Daily" routine to update (prevent duplicates)
    // Always search by name -- cached IDs can go stale if the routine was deleted in Hevy
    var existingId = null;
    try {
      var searchPage = 1;
      while (searchPage <= 5) {
        var searchResp = await fetchWithTimeout(API_BASE + '/routines?page=' + searchPage + '&pageSize=10', {
          headers: { 'api-key': apiKey },
          mode: 'cors'
        });
        if (!searchResp.ok) break;
        var searchData = await searchResp.json();
        var routines = searchData.routines || [];
        if (routines.length === 0) break;
        for (var ri = 0; ri < routines.length; ri++) {
          if (routines[ri].title === routineTitle) {
            existingId = routines[ri].id;
            Storage.set('hevy_routine_id', existingId);
            console.log('Found existing LiftScript routine: ' + existingId);
            break;
          }
        }
        if (existingId) break;
        if (searchPage >= (searchData.page_count || 1)) break;
        searchPage++;
      }
    } catch (e) {
      console.warn('Routine search failed:', e.message);
    }

    var resp;
    if (existingId) {
      // Update existing routine via PUT
      var putBody = JSON.stringify({ routine: routinePayload });
      console.log('Hevy PUT to ' + existingId + ':', putBody);
      resp = await fetchWithTimeout(API_BASE + '/routines/' + existingId, {
        method: 'PUT',
        headers: {
          'api-key': apiKey,
          'Content-Type': 'application/json'
        },
        mode: 'cors',
        body: putBody
      });
      if (resp.status === 404) {
        // Routine was deleted in Hevy, fall through to create
        Storage.remove('hevy_routine_id');
        existingId = null;
      } else if (!resp.ok) {
        var putErr = '';
        try { putErr = await resp.text(); } catch(_) {}
        console.error('PUT failed:', resp.status, putErr);
        showToast('Hevy update error ' + resp.status + ': ' + (putErr || resp.statusText), true);
        btn.innerHTML = origHTML;
        btn.style.opacity = '1';
        btn.disabled = false;
        return;
      }
    }

    if (!existingId) {
      // Create new routine via POST (folder_id required for POST but rejected by PUT)
      var postPayload = Object.assign({}, routinePayload, { folder_id: null });
      var postBody = JSON.stringify({ routine: postPayload });
      console.log('Hevy POST payload:', postBody);
      resp = await fetchWithTimeout(API_BASE + '/routines', {
        method: 'POST',
        headers: {
          'api-key': apiKey,
          'Content-Type': 'application/json'
        },
        mode: 'cors',
        body: postBody
      });
    }

    if (resp.ok) {
      var result = await resp.json();
      if (result && result.routine && result.routine.id) {
        Storage.set('hevy_routine_id', result.routine.id);
      }
      var skipMsg = unresolvedNames.length > 0
        ? ' (skipped ' + unresolvedNames.length + ': ' + unresolvedNames.join(', ') + ')'
        : '';
      var verb = existingId ? 'updated' : 'created';
      showToast('\u2714 \"' + routineTitle + '\" ' + verb + ' in Hevy!' + skipMsg, false);
      haptic(15);
      btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="' + C.accent + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> <span style="color:' + C.accent + ';">Sent!</span></span>';
      btn.style.opacity = '1';
      btn.disabled = true;
      btn.classList.add('send-pulse');
      setTimeout(function() { btn.classList.remove('send-pulse'); }, 600);
      setTimeout(function() {
        btn.innerHTML = origHTML;
        btn.disabled = false;
      }, 10000);
    } else {
      var errBody = '';
      try { errBody = await resp.text(); } catch(_) {}
      console.error('Hevy routine send failed:', resp.status, errBody);
      showToast('Hevy API error ' + resp.status + ': ' + (errBody || resp.statusText), true);
      btn.innerHTML = origHTML;
      btn.style.opacity = '1';
      btn.disabled = false;
    }
  } catch (e) {
    console.error('sendSessionToHevy error:', e);
    showToast('Network error: ' + e.message, true);
    btn.innerHTML = origHTML;
    btn.style.opacity = '1';
    btn.disabled = false;
  }
}

// B2: Sort mode state for Today tab -- 'urgency' (default) or 'anatomy'
const ANATOMY_ORDER = ['chest', 'back', 'shoulders', 'quads', 'hamstrings', 'glutes', 'biceps', 'triceps', 'calves', 'core', 'neck', 'forearms'];

// Demand rank for exercise ordering: lower = more demanding = listed first
// Tier 1 compounds (bench, squat, deadlift, OHP, rows) -> 1
// Tier 2 compounds (dumbbell presses, leg press, RDL, hip thrust) -> 2
// Tier 3 isolation large muscle (flies, curls, extensions, leg curl) -> 3
// Tier 4 small muscle / accessory (calves, core, neck, forearms) -> 4
function getExerciseDemandRank(exName) {
  var db = EXERCISE_DB[exName];
  var isCompound = db ? db.type === 'compound' : isLikelyCompound(exName);
  var muscle = db ? db.muscle : null;
  // Also check if it's a small accessory muscle
  var smallMuscles = { calves: 1, core: 1, neck: 1, forearms: 1 };

  if (isCompound) {
    // Heavy barbell compounds get rank 1
    var heavyPattern = /barbell|squat|deadlift|bench press|overhead press|barbell row|pendlay/i;
    if (heavyPattern.test(exName)) return 1;
    return 2;
  }
  // Isolation on small muscles
  if (muscle && smallMuscles[muscle]) return 4;
  // Isolation on large muscles
  return 3;
}

      <button onclick="rerollLifts()" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:${C.surface2};border:1px solid ${C.border};color:${C.textMid};font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>Reroll</button>
      ${_customSessionActive ? '<button onclick="resetToAutoSession()" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:' + C.dangerDim + ';border:1px solid ' + C.danger + '30;color:' + C.danger + ';font-size:11px;font-weight:600;font-family:JetBrains Mono,monospace;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Reset</button>' : ''}
      <button id="send-to-hevy-btn" onclick="sendSessionToHevy()" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:${C.surface2};border:1px solid ${C.border};color:${C.textMid};font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all 0.2s ease;white-space:nowrap;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Hevy
      </button>
      ${chipDefs}
    </div>
    ${branchDividerHTML()}`;

  // --- EXERCISE LIST ---
  const exContainer = document.getElementById('suggested-exercises');

  // Sort muscle groups by anatomy order
  let groupKeys = Object.keys(grouped);
  groupKeys.sort((a, b) => {
    const ai = ANATOMY_ORDER.indexOf(a);
    const bi = ANATOMY_ORDER.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });

  // B1: Build rec lookup for explainers
  const recMap = {};
  recs.forEach(r => { recMap[r.key] = r; });

  let exHtml = '';

  // v1.29: Conflict resolution strip - surface algorithm decisions
  if (conflictLog.length > 0) {
    // Deduplicate reasons (multiple rerolls can produce same entry)
    var seenReasons = {};
    var uniqueLog = [];
    for (var cli = 0; cli < conflictLog.length; cli++) {
      var key_cl = conflictLog[cli].reason;
      if (!seenReasons[key_cl]) { seenReasons[key_cl] = true; uniqueLog.push(conflictLog[cli]); }
    }
    var items = uniqueLog.map(function(e) {
      var label = e.type === 'cap' ? 'Over cap' : (e.type === 'block' ? 'Conflict' : 'Caution');
      var iconColor = e.type === 'cap' ? C.textMid : (e.type === 'block' ? C.warn : C.textDim);
      return '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;">' +
        '<div style="flex-shrink:0;width:14px;height:14px;border-radius:50%;background:' + iconColor + '22;border:1px solid ' + iconColor + ';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:' + iconColor + ';font-family:var(--font-mono);margin-top:1px;">!</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:' + iconColor + ';">' + label + (e.skipped ? ' \u00b7 ' + e.skipped + ' skipped' : '') + '</div>' +
          '<div style="font-family:var(--font-sans);font-size:12px;color:' + C.textMid + ';line-height:1.45;margin-top:2px;">' + e.reason + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    exHtml += '<div id="session-conflict-strip" style="margin-bottom:14px;padding:10px 12px 8px;border-radius:8px;background:' + C.surface2 + ';border:1px solid ' + C.border + ';border-left:3px solid ' + C.warn + ';">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;" onclick="toggleConflictDetail()">'
        + '<div style="font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:' + C.textDim + ';">Session Adjustments \u00b7 ' + uniqueLog.length + '</div>'
        + '<span id="conflict-chevron" style="font-size:10px;color:' + C.textDim + ';transition:transform 0.3s ease;">\u25BE</span>'
      + '</div>'
      + '<div id="conflict-detail" style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease, opacity 0.25s ease;">'
        + '<div style="padding-top:8px;">' + items + '</div>'
      + '</div>'
    + '</div>';
  }

  for (const key of groupKeys) {
    const exes = grouped[key];
    const meta = MUSCLE_GROUPS[key];
    if (!meta) continue;
    const rec = recMap[key];

    exHtml += `<div class="ex-group" style="border-left:3px solid ${meta.color};">
      <div class="ex-group-title" style="color:${meta.color};cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleSessionExplainer('exp-${key}')">
        <span>${meta.name}</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="transition:transform 0.2s ease;"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="${C.textMid}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;

    // B1: Collapsible "Why this?" explainer
    if (rec) {
      const daysSince = rec.daysSince === Infinity ? '\u221E' : rec.daysSince;
      const idealFreq = (muscleAnalysis && muscleAnalysis[key]) ? muscleAnalysis[key].idealFreqDays : '?';
      const volActual = rec.weeklyActual;
      const volIdeal = rec.weeklyIdeal;
      const propDef = proportionDeficits[key];

      let bullets = [];
      bullets.push(`<span style="color:${C.textDim};">Days since:</span> <strong>${daysSince}</strong> <span style="color:${C.textDark};">vs ideal ${idealFreq}d</span>`);
      const deficit = Math.max(0, volIdeal - volActual);
      if (deficit > 0) {
        bullets.push(`<span style="color:${C.textDim};">Volume gap:</span> <strong>${deficit.toFixed(1)} sets/wk</strong> <span style="color:${C.textDark};">below ${volIdeal}</span>`);
      } else {
        bullets.push(`<span style="color:${C.textDim};">Volume:</span> <strong>${volActual} / ${volIdeal}</strong> <span style="color:${C.accent};">\u2714</span>`);
      }
      if (propDef && propDef > 0.05) {
        const ft = Object.entries(FRAME_TARGETS).find(([k, v]) => v.muscle === key);
        if (ft) bullets.push(`<span style="color:${C.textDim};">Frame target:</span> <strong>${ft[1].label}</strong> <span style="color:${C.warn};">${Math.round(propDef * 100)}% below potential</span>`);
      }

      exHtml += `<div class="rec-expand" id="exp-${key}" style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;border-top:1px solid ${C.border};">
        <div class="rec-explainer" style="padding:8px 14px;font-size:12px;line-height:1.7;">
          ${bullets.map(b => `<div>${b}</div>`).join('')}
        </div>
      </div>`;
    }

    for (const ex of exes) {
      const rx = formatPrescription(ex.prescription);
      // v1.25: compound anchor promotion - U+25C9 fisheye glyph + stronger weight
      const isAnchor = COMPOUND_ANCHORS[key] === ex.name;
      const anchorPrefix = isAnchor
        ? '<span style="color:' + C.gold + ';margin-right:6px;font-size:10px;vertical-align:middle;">\u25C9</span>'
        : '';
      const nameColor = isAnchor ? C.text : C.textMid;
      const nameWeight = isAnchor ? '600' : '400';
      // v1.39: stalled exercises surface a deload chip + amber prescription
      const isDeload = !!(ex.prescription && ex.prescription.deload);
      const deloadChip = isDeload
        ? '<span style="font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:' + C.warn + ';background:' + C.warnDim + ';border:1px solid rgba(212,152,59,0.32);padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;">Deload</span>'
        : '';
      exHtml += `
        <div class="ex-row${isAnchor ? ' ex-row-anchor' : ''}">
          <div class="ex-name" style="color:${nameColor};font-weight:${nameWeight};">${anchorPrefix}${ex.name}${deloadChip}</div>
          <div class="ex-prescription" style="color:${isDeload ? C.warn : C.accent}">${rx}</div>
        </div>`;
    }
    exHtml += `</div>`;
  }
  exContainer.innerHTML = exHtml;
}

// Generic collapsible section toggle
function toggleSectionExplainer(id, triggerEl) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.classList.contains('open')) {
    el.style.maxHeight = '0';
    el.style.opacity = '0';
    el.classList.remove('open');
    if (triggerEl) {
      const chev = triggerEl.querySelector('.section-chevron');
      if (chev) chev.style.transform = 'rotate(0deg)';
    }
  } else {
    el.classList.add('open');
    el.style.opacity = '1';
    el.style.maxHeight = el.scrollHeight + 'px';
    if (triggerEl) {
      const chev = triggerEl.querySelector('.section-chevron');
      if (chev) chev.style.transform = 'rotate(180deg)';
    }
  }
}

// v1.29: Toggle the conflict resolution detail strip
function toggleConflictDetail() {
  var el = document.getElementById('conflict-detail');
  var chev = document.getElementById('conflict-chevron');

  if (el.dataset.open === '1') {

}

// B1: Toggle explainer panel for a muscle group in Today tab
function toggleSessionExplainer(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.classList.contains('open')) {
    el.style.maxHeight = '0';
    el.style.opacity = '0';
    el.classList.remove('open');
  } else {
