<!DOCTYPE html>

<!--
  LiftScript v1.40
  Changes from v1.39 (v1.40 - waist tile source-of-truth fix):
  - Body Composition WAIST tile now uses the merged measurement value
    (getLatestMeasurements) instead of raw Apple Health, so a newer manual/
    Hevy-imported waist entry is not shadowed by a stale HealthKit value.
    Target-delta label unchanged (distance from height*0.45).

  Changes from v1.38 (v1.39 - progression stall detection + deload):
  1.  exerciseHistory now records the per-session gating rep count (min reps
      among top-weight sets, v1.33 semantics) in a reps[] array parallel to
      weights[]/dates[].
  2.  prescribeExercise: if the trailing run at the current weight spans >= 4
      sessions and no attempt in the last 3 sessions exceeded the baseline
      gating rep count (max(reps[-3:]) <= reps[-4]) while still below the rep
      ceiling -- so a single bad day after progress does not trigger it --
      the prescription becomes a ~10% deload (rounded to 5 lbs, guaranteed
      below the stalled weight, floor 5 lbs) with reps reset to the bottom of
      the range. NSCA-aligned failure mode for double progression; previously
      the app prescribed +1 rep forever regardless of stagnation. Skipped for
      bodyweight/hold exercises. Prescription objects gain a deload flag.
  3.  Today tab: stalled exercises show an amber DELOAD chip after the name
      and an amber prescription. Send to Hevy writes 'deload -10%' into the
      exercise notes so the cue survives into the logged routine.
  Changes from v1.37 (v1.38 - Strength Index true rolling window):
  1.  The SI "rolling 6-month window" now actually rolls. Old behavior:
      per-lift 1RMs were cumulative high-water marks over the pass, with a
      183-days-before-NOW gate on which workouts entered -- so the timeline
      was monotone per lift (historical dips never rendered) and SI only
      dropped on a reload where an old PR crossed the boundary, rewriting the
      whole timeline when it did. New: per-lift chronological event lists
      (best est 1RM per lift per workout); each datapoint takes the max over
      events in the trailing 183 days relative to THAT date. SI can now
      decline as PRs age out -- expected and honest.
  2.  Downstream unchanged in shape: timeline lift entries keep {rm, mult,
      src}; PR board still scans all-time max; 30-day trend arrows can now
      legitimately show declines. Removed write-only siUpdated flag and the
      now-unused sixMonthsAgo/isWithin6m gate.
  3.  Note: the fetch cap (~155 workouts / ~6 months) means the earliest
      timeline points have a partially-filled window -- same as before.
  Changes from v1.36 (v1.37 - Body Comp timeline computed from dated measurements):
  1.  computeBodyCompTimeline rewritten. Old behavior: one score from
      current-snapshot values stamped on every weigh-in date -- a flat line
      that could not trend. New: dated measurement entries (embedded baseline
      + Hevy CSV imports) walked chronologically with per-field carry-forward;
      frame-target achievement and waist-to-height scored per date; body fat
      held constant (no history source exists); per-date reweighting for
      missing components (same scheme as before). Final point at today merges
      the live Apple Health waist.
  2.  Removed the dead healthData.weight_history branch (schema only has
      weight_entries) and the dependency on the proportionDeficits global.
  3.  Note: early dates have fewer measured fields, so frame achievement
      averages over fewer muscles there -- inherent to sparse data, still
      strictly more informative than the old constant.
  Changes from v1.35 (v1.36 - chart time-axis alignment):
  1.  Weight & Trends: the weight line (plus its gradient fill, endpoint dots,
      and tooltip anchor points) is now plotted on the same time-proportional
      x-axis as the SI / Cardio Fitness / Dedication / Body Comp overlays.
      Previously weight was index-spaced (one even step per weigh-in regardless
      of the gap between weigh-ins) while overlays were day-offset spaced, so
      the two could not be read against each other on the same canvas.
      Clustered weigh-ins now correctly cluster; long gaps read as long gaps.
  2.  Removed the never-read csMin field from _chartPoints.
  Changes from v1.34 (v1.35 - correctness remediation from full-file audit):
  1.  DEDICATION FIX: cardio-only Hevy workouts (hikes, runs, cardio circuits) no
      longer count as lift days. preprocessWorkouts initializes heatmapDayWorkouts
      [dateStr] = [] for every Hevy workout before inspecting contents, and the
      Dedication loop tested the entry for truthiness -- an empty array is truthy,
      so 14 cardio-only workouts in the current history each scored as a lift day,
      inflating liftScore and chaining the consecutive-day fatigue penalty across
      hike days. Fix: check .length > 0, matching weekStats and
      countConsecutiveTrainingDays which were already correct.
  2.  SET-TYPE FIX (latent): getWorkingSets filtered on s.set_type, but the Hevy
      GET /workouts API returns the set kind in s.type (verified live). The old
      check was vacuously true, so warmup/dropset sets would silently count as
      working sets (set counts, volume, lastSets prescriptions). Zero impact on
      current history (all 1,197 sets are 'normal') but certain breakage the first
      time a warmup set is logged. 'failure' sets still count as working.
  3.  Per-workout calories from health-data.json (new Shortcut field) now flow
      into the cardio breakdown rows -- the UI already rendered calories > 0 but
      cardioLog hardcoded 0.
  4.  Chart secondary 'off' state now persists ('none' sentinel; empty string
      failed the load whitelist and reverted to SI on reload).
  5.  Stale comments corrected: Watch-only source claim above APPLE_CARDIO_TYPES
      (all-source per doc S27) and the pre-v1.18a HR-gate row in the cardio
      counting rules table (now the 20-min duration gate).
  Changes from v1.33 (v1.34 - legibility micro-pass from the aesthetics audit):
  1.  Chart legend wraps at narrow widths (flex-wrap + tightened gap). The Body Comp toggle was clipped entirely out of view at 390px with no wrap or pan affordance.
  2.  New lifted text-danger color: C.dangerText / --danger-text = #ED7960 "ember" (4.62:1 on surface2, 5.32:1 on surface). Base danger #CC4433 (3.15:1) failed WCAG AA for the small text it was carrying and is now reserved for stripes/fills/lines. Applied to: muscle grid fraction text, rest-day chip (high state), power score detail values, frame-target percentage labels, SI percentile labels, PR 30-day down-trend arrows, chart tooltip CF value, Cancel button text, Hevy import error text.
  3.  Muscle grid bar + fraction now follow URGENCY TIER (high=danger red, med=sap warn, low=dim bark; rested=gold) instead of a volume-ratio scale that collapsed to flat red whenever everything was under 50% -- restoring rank information exactly when many groups are behind. A muscle at >=80% of weekly volume still shows achievement green.
  4.  Muscle detail explainer scrolls into view on open (it rendered below all 12 cells with no scroll, so top-row taps looked inert). Respects prefers-reduced-motion.
  5.  Header subtitle restructured to a deliberate two-line stack (version / time + sync dot); the single line wrapped awkwardly at 390px at every hour. Locale time output is stripped of U+202F (iOS Safari narrow space).
  6.  Body Comp chart line, legend dot, and tooltip recolored to rose (C.pink #D45A7A). It previously shared #C084FC with the Strength line, leaving the two legend dots indistinguishable.
  7.  Copy: Dedication detail pluralizes ("1 lift"); loading screen no longer shows "(0)" before the first workout page arrives.
  Changes from v1.32 (v1.33 - audit remediation: Power Score Dedication fix, session variety, progression gate):
  1.  POWER SCORE FIX: Dedication pillar mapping corrected from score*50 to score*100 in computePowerScore. The "0-2 scale" comment was wrong: the Dedication timeline is a 0-1.09 weighted composite (lift 40% + coverage 20% + cardio 30% capped 1.3 + consistency 10%), unlike Cardio Fitness and Body Comp which genuinely span 0-2. The *50 mapping permanently capped the pillar at ~55/100. Expected visible impact: Power Score +3 at current tapered volume, +11 to +13 at the normal 6-day/week cadence. The chart Dedication line is unaffected (chart self-normalizes each series).
  2.  SESSION VARIETY: fitCandidates dedupes by exercise name family (equipment parenthetical stripped, so all "Standing Calf Raise (X)" variants compete for one slot) and soft-caps isolations at 2 per muscle per session. Fixes the builder stacking 3 near-identical variants (9 sets of one movement) on a maximally-urgent muscle. Skips are silent: variety hygiene, not a research rail, so no Session Adjustments entry.
  3.  PROGRESSION GATE: double progression now requires ALL working sets at the top weight to reach the rep ceiling before adding weight (lastReps = min reps among heaviest-weight sets). Previously the first set at the top weight gated alone, so an 8,6,5 session on a 6-8 range triggered +5 lbs. Canonical double progression for straight sets; degrades to a top-set gate for pyramid-style logging. Conservative direction chosen deliberately: under-delivered volume plus aggressive bumps is the worst pairing, especially returning from a taper on stale history.
  4.  Removed dead code: walkHRPassesGate block (pre-v1.18a HR-gate remnant, computed but never read). Also removes the stray 220-age formula; Tanaka 208 - 0.7*age is now the single HRmax source.
  5.  Removed test.html debug harness from the repo root.
  6.  Reworded Big 5 cap message ("Adding another...") to avoid the broken ordinal ("a 4rd") reachable since the v1.30 adaptive cap; fixed the unreachable "8 consec" comment tier.
  Changes from v1.31 (Dedication recalibration - stop penalizing 6-day/week pattern):
  1.  Lift score curve peak shifted from 5 days/week to 6 days/week. Old: 5 days = 1.0, 6 days = 0.85, 7 days = 0.70. New: 5-6 days = 1.0, 7 days = 0.85, 8 days = 0.70.
  2.  Consecutive-day fatigue penalty start shifted from 5 consec days to 6 consec days. Old: 5 consec = -0.07, 6 = -0.14, 7 = -0.21. New: 6 consec = -0.07, 7 = -0.14, 8 = -0.21.
  3.  Rationale: the original curve assumed a 4-5 day/week training pattern with rest days baked in. For users training 6 days/week consistently, both penalties stacked on every session past day 5, suppressing dedication and causing the Power Score to DROP after a workout and APPEAR to rise during rest days (the rise is actually at the comeback workout, not during rest, but it reads that way). New calibration treats 6 days/week as the peak and only penalizes truly extreme overtraining (7+ days, 7+ consec).
  4.  No structural change to weights, signal definitions, or other components. Pure threshold shift.
  Changes from v1.30 (Today card branch dividers - deferred item from Aesthetics Pass Seq E):
  1.  Added organic branch divider between the hero block ('Today's Session ~46m') and the chips row (Reroll/Hevy/60m/Gym/Auto).
  2.  Replaced the straight border-bottom separator below the chips row with an organic branch divider, matching the treatment already used between exercises and cardio.
  3.  Completes the Today card sub-section layout originally planned for Seq E v1.25 but dropped at time of implementation.
  Changes from v1.30 (Adaptive Big 5 cap):
  1.  bigFiveCapForBudget is now volume-aware: when Foundation muscle volume delivery (actual weekly sets / ideal weekly sets, aggregated across chest/back/shoulders/quads/hamstrings/glutes) is below 0.60 of target, the 60-min cap relaxes from 2 to 3.
  2.  Rationale: the 2-Big-5 cap is a recovery-economy safeguard that only matters when the user is at or near their volume ceiling. For consistently under-delivering users, the cap blocks useful compound work without protecting against anything real. The Squat+Deadlift block and Deadlift+Row caution still apply regardless (those are CNS/spinal safety rails, volume-independent).
  3.  Added foundationVolumeDeliveryRatio() helper computing aggregated weekly volume vs target across Foundation muscles.
  4.  Threshold 0.60 of target = ~39% of Schoenfeld optimal (master doc targets are already set at 65% of optimal). Users at 60%+ of target get the strict cap; users below get the relaxed cap.
  Changes from v1.28 (Session logic - Big 5 conflict resolution):
  1.  Added BIG_FIVE_PATTERNS and isBig5() classifier for session-level Big 5 detection
  2.  Added BIG_5_CONFLICTS table: Squat+Deadlift (block), Deadlift+Row (caution)
  3.  Added bigFiveCapForBudget: 2 Big 5 for <=75 min sessions, 3 for longer
  4.  fitCandidates: tracks Big 5 in session, enforces cap + conflicts, logs resolutions
  5.  Conflict resolution strip in Today tab: collapsible 'Session Adjustments' card showing what was skipped and why, with appropriate severity styling
  Research basis: Simao et al. 2012 (order effects on subsequent lift performance), Schoenfeld et al. 2017/2019 (volume/frequency for hypertrophy), and coaching convergence across 5/3/1, Starting Strength, Juggernaut, Renaissance Periodization programs (2 heavy compounds per session sustainable ceiling at intermediate+ load).
  Changes from v1.27 (Aesthetics Pass - Sequence H: accessibility):
  1.  --text-dim contrast bumped from #7A7262 (3.1:1 on surface) to #8B8270 (~3.7:1, passes WCAG AA for large text)
  2.  C.textDim JS palette raised to match (keeps dynamic styles consistent)
  3.  Added focus-visible outlines on button, [onclick], input, tab, muscle-cell, heatmap-cell for keyboard / AT navigation
  4.  Tap target minimums: muscle-cell 44px, chips/tabs 32px, heatmap cells get touch-action manipulation
  5.  Body sizing flipped from hardcoded 14px to 0.875rem (iOS Dynamic Type now scales prose with system setting)
  6.  ARIA labels on icon-only buttons: header refresh (aria-label), power score wrap (role=button + keyboard handler + aria-label)
  7.  Tabs get role=tablist / role=tab / aria-selected, kept in sync by switchTab
  Changes from v1.26b (Aesthetics Pass - Sequence G: data-viz refinements):
  1.  Chart defaults to Weight + one secondary line (persisted in localStorage.chart_secondary_v1, default si)
  2.  Legend dot tap is now exclusive: tapping switches the single secondary, tapping the active secondary turns it off
  3.  Weight line thickness 2.5 -> 3 for clearer primary hierarchy
  4.  SI tier threshold dashed horizontal rules at SI=1.30 (ADV) and SI=1.80 (ELT) rendered when SI line is visible
  5.  Legend dots: 12px filled with subtle halo (active) vs 12px outlined ring (inactive) for clear visual state
  6.  Legend items: 28px min tap height (WCAG+)
  7.  PR sparklines: dot at every historical PR point (small/dim for past, larger/accent for latest)
  Changes from v1.26a (haptic hotfix v2):
  1.  The real fix: WebKit BLOCKS programmatic haptics when clicking an <input type=checkbox switch> directly. Must click an associated <label> instead.
  2.  Rewrote haptic helper: wrap input inside a label, .click() the label (not the input).
  Changes from v1.26 (haptic hotfix):
  1.  iOS Safari does not support navigator.vibrate(). Swapped in checkbox-switch workaround using <input type=checkbox switch> (iOS 17.4+) which triggers native iPhone haptic when toggled.
  2.  Android/Chrome still use native navigator.vibrate when available (falls through to switch only if that fails).
  Changes from v1.25 (Aesthetics Pass - Sequence F: microinteractions):
  1.  haptic() helper wired to cycleChip (4ms), rerollLifts (12ms), rerollCardio (10ms), switchTab (6ms), sendSessionToHevy (15ms), setChartPeriod (5ms)
  2.  Universal tap feedback: button and [onclick] elements get scale(0.965) + opacity dim on :active
  3.  Tab transitions: current tab fades+slides out (140ms), next tab fades+slides in (entering animation)
  4.  Lift reroll: non-anchor ex-rows animate in with 45ms stagger via rerollShuffle keyframe (anchor stays pinned)
  5.  Chart period toggle: canvas fades out 140ms, redraws, fades in
  6.  Send-to-Hevy success: 600ms green box-shadow pulse on the button alongside the existing Sent badge
  7.  prefers-reduced-motion: honored globally - all animations collapse to 0.001ms when OS setting is on

  Changes from v1.24 (Aesthetics Pass - Sequence E: information hierarchy):
  1.  Heatmap: 5-step graduated fill (clear volume tiers) + 18px cells + scale legend below grid
  2.  Muscle grid: 'RESTED' sap-gold chip for muscles trained today + sap-gold left border, visual recovery-guard signal
  3.  Muscle grid: softer 'low' urgency color (textDim instead of accent) so trained/on-track muscles recede visually
  4.  Today exercise list: compound anchor promotion via U+25C9 fisheye glyph + stronger text color/weight
  5.  New .card-hero class (thicker accent stripe + surface2 base + elevated shadow) applied to Today, Strength Index, Weight & Trends
  Changes from v1.23 (Aesthetics Pass - Sequence D: brand payoff):

  2.  Canopy light redesign: 6 diurnal bands (dawn/morning/midday/dusk/evening/night) with on-device-visible alphas (0.32-0.42 vs prior 0.12-0.22)
  3.  Loading screen redesign: 3 concentric rings draw in outward with stroke-dashoffset animation, sap-gold brand text fade-in, amber heartwood dot
  4.  siConcentricRingsHTML helper: 5-ring visualization for Big 5 lift percentiles (ready for SI render integration)

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1C18">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>LiftScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1E1C18;
  --surface: #2A2720;
  --surface2: #35312A;
  --surface3: #403B33;
  --border: rgba(180,160,120,0.10);
  --border-light: rgba(180,160,120,0.15);
  --text: #E8E0D0;
  --text-mid: #A89E88;
  --text-dim: #8B8270;  /* v1.28: raised from #7A7262 for WCAG AA */
  --accent: #5FA052;
  --accent-dim: rgba(95, 160, 82, 0.14);
  --warn: #D4983B;
  --warn-dim: rgba(212, 152, 59, 0.14);
  --danger: #CC4433;
  --danger-dim: rgba(204, 68, 51, 0.12);
  --danger-text: #ED7960;
  --blue: #7CBAD4;
  --blue-dim: rgba(124, 186, 212, 0.14);
  --purple: #C084FC;
  --purple-dim: rgba(192, 132, 252, 0.14);
  --strength: #C084FC;
  --strength-dim: rgba(192, 132, 252, 0.14);
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', sans-serif;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
background: #1E1C18;
background-color: #1E1C18;
color-scheme: dark;
overscroll-behavior-y: none;
}

html { font-size: 100%; }
body {
font-family: var(--font-sans);
font-size: 0.875rem;  /* ~14px at default, scales with iOS Dynamic Type */
color: var(--text);
min-height: 100vh;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
line-height: 1.5;
}

/* Layout */
.app {
max-width: 480px;
margin: 0 auto;
padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
background: #1E1C18;
}

/* Header */
.header {
padding: 8px 0 12px;
margin-bottom: 12px;
border-bottom: 1px solid rgba(95,160,82,0.15);
border-bottom: 1px dashed rgba(255,255,255,0.10);
}
.header h1 {
font-family: var(--font-mono);
font-size: 22px;
font-weight: 700;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(--accent);
text-shadow: 0 0 24px rgba(232, 196, 74, 0.18);
}
.header .subtitle {
font-size: 10px;
line-height: 1.6;
color: var(--text-dim);
font-family: 'JetBrains Mono', monospace;
letter-spacing: 0.1em;
text-transform: uppercase;
}

/* Cards */
.card {
background: linear-gradient(135deg, var(--surface) 0%, #302C24 100%);
border: 1px solid var(--border);
border-left: 3px solid rgba(95,160,82,0.25);
border-radius: 10px;
padding: 20px;
margin-bottom: 14px;
box-shadow: 0 2px 12px rgba(0,0,0,0.25), inset 0 1px 0 rgba(180,160,120,0.06);
position: relative;
overflow: hidden;
}
.card::before {
content: '';
position: absolute;
inset: 0;
background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.22'/%3E%3C/svg%3E");
border-radius: 10px;
pointer-events: none;
z-index: 0;
}
.card > * {
position: relative;
z-index: 1;
}
/* v1.26: microinteractions */
button, [onclick] {
  transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
}
button:active, [onclick]:active {
  transform: scale(0.965);
  opacity: 0.88;
}
/* Tab-body fade+slide transitions */
#tab-today, #tab-muscles, #tab-history, #tab-weight {
  transition: opacity 0.18s ease, transform 0.22s ease;
}
.tab-leaving {
  opacity: 0 !important;
  transform: translateY(4px) !important;
  pointer-events: none !important;
}
.tab-entering {
  opacity: 0;
  transform: translateY(-4px);
}
/* Reroll shuffle on non-anchor rows */
@keyframes rerollShuffle {
  0%   { opacity: 0; transform: translateX(-10px); }
  55%  { opacity: 1; transform: translateX(2px); }
  100% { opacity: 1; transform: translateX(0); }
}
.reroll-shuffle {
  animation: rerollShuffle 0.42s ease;
}
/* Chart canvas fade */
.weight-chart canvas {
  transition: opacity 0.14s ease;
}
/* Send-to-Hevy success pulse */
@keyframes sendPulse {
  0%   { box-shadow: 0 0 0 0 rgba(95,160,82,0.55); }
  60%  { box-shadow: 0 0 0 10px rgba(95,160,82,0); }
  100% { box-shadow: 0 0 0 0 rgba(95,160,82,0); }
}
.send-pulse {
  animation: sendPulse 0.55s ease-out;
}
/* v1.28: accessibility - focus-visible for keyboard/AT navigation */
button:focus-visible,
[onclick]:focus-visible,
input:focus-visible,
.tab:focus-visible,
.muscle-cell:focus-visible,
.heatmap-cell:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 5px;
}
/* v1.28: tap target minimums - invisible padding preserves visual size */
.muscle-cell {
  min-height: 44px;
}
.heatmap-cell {
  /* 18px visual cell + 4px padding in each direction = ~26px total tap zone.
     Can't go full 44px without breaking the grid layout, so we bump
     touch-action + add min-width for slightly easier thumb targeting. */
  min-width: 18px;
  touch-action: manipulation;
}
.constraint-chip, .tab {
  min-height: 32px;
  touch-action: manipulation;
}
/* Respect OS reduced-motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
/* v1.25: card tier - hero cards (Today, SI, Weight & Trends) */
.card-hero {
  border-left-width: 4px;
  border-left-color: rgba(95,160,82,0.45);
  background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
  box-shadow: 0 3px 16px rgba(0,0,0,0.32), inset 0 1px 0 rgba(180,160,120,0.08);
}
.card-title {
font-family: var(--font-mono);
font-size: 10px;
font-weight: 500;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(--text-dim);
margin-bottom: 14px;
}

/* Tabs */
.tabs {
display: flex;
gap: 2px;
margin-bottom: 18px;
background: linear-gradient(135deg, var(--surface) 0%, #2E2A22 100%);
border-radius: 8px;
padding: 3px;
border: 1px solid var(--border);
box-shadow: inset 0 1px 0 rgba(180,160,120,0.05);
}
.tab {
flex: 1;
padding: 8px 6px;
text-align: center;
font-size: 10px;
font-weight: 500;
letter-spacing: 0.12em;
text-transform: uppercase;
border-radius: 4px;
cursor: pointer;
color: var(--text-dim);
transition: all 0.25s ease;
border: none;
background: none;
font-family: var(--font-mono);
-webkit-tap-highlight-color: transparent;
}
.tab.active {
background: rgba(95, 160, 82, 0.12);
color: #5FA052;
box-shadow: 0 0 0 1px rgba(95, 160, 82, 0.25);
}

/* Expandable explainer */
.rec-expand {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
}
.rec-expand.open {
opacity: 1;
}
.rec-explainer {
font-family: var(--font-sans);
text-transform: none;
letter-spacing: normal;
padding: 0 2px 14px 40px;
font-size: 14px;
color: var(--text-mid);
line-height: 1.55;
}
.rec-explainer strong {
color: var(--text);
font-weight: 600;
}

/* ===================== */
/* EXERCISE PRESCRIPTIONS */
/* ===================== */

.ex-group {
margin-bottom: 20px;
background: var(--surface2);
border-radius: 6px;
padding: 0;
overflow: hidden;
border: 1px solid var(--border);
border-left: 2px solid var(--accent);
}
.ex-group:last-child { margin-bottom: 0; }
.ex-group-title {
font-family: var(--font-mono);
font-size: 11px;
font-weight: 500;
padding: 10px 14px;
background: var(--surface);
text-transform: uppercase;
letter-spacing: 0.12em;
}
.ex-row {
display: flex;
align-items: center;
padding: 10px 14px;
border-top: 1px solid var(--border);
gap: 8px;
}
.ex-name {
font-family: var(--font-mono);
font-size: 11px;
font-weight: 400;
flex: 1;
min-width: 0;
color: var(--text-mid);
line-height: 1.3;
text-transform: uppercase;
letter-spacing: 0.06em;
}
.ex-prescription {
font-family: var(--font-mono);
font-variant-numeric: tabular-nums;
font-size: 12px;
font-weight: 500;
color: var(--accent);
white-space: nowrap;
flex-shrink: 0;
letter-spacing: 0.05em;
}

/* ===================== */
/* MUSCLE GRID (v1.2: tappable with explainers) */
/* ===================== */
.muscle-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.muscle-cell {
border-radius: 6px;
padding: 10px 12px;
transition: all 0.3s ease;
border: 1px solid var(--border);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
background-size: 16px 16px;
}
.muscle-cell:active { opacity: 0.85; }
.muscle-cell-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 8px;
}
.muscle-name {
font-family: var(--font-mono);
font-size: 12px;
font-weight: 500;
letter-spacing: 0.08em;
text-transform: uppercase;
}
.muscle-detail {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
grid-column: 1 / -1;
}
.muscle-detail.open {
opacity: 1;
}
.muscle-detail-inner {
font-family: var(--font-sans);
text-transform: none;
letter-spacing: normal;
padding: 14px;
background: var(--surface2);
border-radius: 6px;
border: 1px solid var(--border);
font-size: 14px;
color: var(--text-mid);
line-height: 1.55;
}
.muscle-detail-inner strong {
color: var(--text);
font-weight: 600;
}

/* ===================== */
/* WEIGHT TAB            */
/* ===================== */
.weight-header {
display: flex;
align-items: baseline;
justify-content: space-between;
margin-bottom: 18px;
}
.weight-left {
display: flex;
align-items: baseline;
gap: 8px;
}
.weight-chart {
width: 100%;
height: 150px;
position: relative;
}
.weight-chart canvas { width: 100%; height: 100%; }
.weight-current {
font-family: var(--font-mono);
font-variant-numeric: tabular-nums;
font-size: 34px;
font-weight: 700;
letter-spacing: -1px;
color: var(--accent);
}
.weight-delta {
font-family: var(--font-mono);
font-variant-numeric: tabular-nums;
font-size: 14px;
}
.weight-unit {
font-size: 14px;
color: var(--text-dim);
}

/* Constraints chips */
.constraints-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 14px;
}
.constraint-chip {
padding: 5px 10px;
font-size: 13px;
font-weight: 500;
font-family: 'JetBrains Mono', monospace;
background: var(--surface2);
color: var(--text-dim);
border: 1px solid var(--border);
border-radius: 4px;
cursor: pointer;
text-transform: uppercase;
letter-spacing: 0.08em;
-webkit-tap-highlight-color: transparent;
transition: all 0.15s ease;
user-select: none;
}
.constraint-chip:active {
transform: scale(0.96);
}
.constraint-chip.active {
color: var(--accent);
border-color: rgba(95,160,82,0.35);
background: var(--accent-dim);
}
.chart-legend {
display: flex;
flex-wrap: wrap;
gap: 4px 14px;
margin-top: 12px;
font-size: 12px;
font-family: 'JetBrains Mono', monospace;
color: var(--text-mid);
}
.legend-dot {
display: inline-block;
width: 8px;
height: 8px;
border-radius: 50%;
margin-right: 5px;
vertical-align: middle;
}

/* Weight input form */
.btn-log-weight {
padding: 5px 12px;
font-size: 13px;
font-weight: 600;
background: var(--accent-dim);
color: var(--accent);
border: 1px solid rgba(95,160,82,0.28);
border-radius: 7px;
cursor: pointer;
font-family: 'JetBrains Mono', monospace;
-webkit-tap-highlight-color: transparent;
transition: all 0.2s ease;
}
.btn-log-weight:active {
transform: scale(0.96);
}
/* HISTORY - HEATMAP (v1.1: no scroll) */
/* ===================== */
.heatmap-container {
margin: 0 -4px;
padding: 0 4px;
}
.heatmap-grid {
display: grid;
gap: 3px;
}
.heatmap-label {
font-size: 12px;
font-family: 'JetBrains Mono', monospace;
color: var(--text-mid);
display: flex;
align-items: center;
padding-right: 6px;
white-space: nowrap;
position: sticky;
left: 0;
background: var(--surface);
z-index: 2;
text-transform: uppercase;
letter-spacing: 0.08em;
}
.heatmap-cell {
width: 18px;
height: 18px;
border-radius: 3px;
background: var(--surface2);
cursor: pointer;
transition: opacity 0.15s ease, transform 0.12s ease;
}
.heatmap-cell:active {
opacity: 0.7;
}
.heatmap-day-labels {
font-size: 10px;
font-family: 'JetBrains Mono', monospace;
color: var(--text-dim);
display: flex;
align-items: flex-end;
padding-bottom: 4px;
text-align: center;
justify-content: center;
}
.heatmap-day-detail {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
margin-top: 0;
}
.heatmap-day-detail.open {
opacity: 1;
margin-top: 12px;
}
.heatmap-day-detail-inner {
font-family: var(--font-sans);
text-transform: none;
letter-spacing: normal;
padding: 14px;
background: var(--surface2);
border-radius: 6px;
border: 1px solid var(--border);
font-size: 14px;
line-height: 1.6;
}
.heatmap-day-detail-inner .detail-date {
font-weight: 600;
margin-bottom: 8px;
font-size: 13px;
font-family: 'JetBrains Mono', monospace;
color: var(--text-mid);
}
.heatmap-day-detail-inner .detail-exercise {
display: flex;
justify-content: space-between;
align-items: baseline;
padding: 4px 0;
}
.heatmap-day-detail-inner .detail-name {
font-weight: 500;
font-size: 14px;
color: var(--text);
}
.heatmap-day-detail-inner .detail-sets {
font-size: 12px;
font-family: 'JetBrains Mono', monospace;
color: var(--accent);
flex-shrink: 0;
}

/* ===================== */
/* LOADING & ERROR       */
/* ===================== */
.loading {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 60vh;
gap: 18px;
}
.tree-ring-loader {
  width: 72px;
  height: 72px;
  position: relative;
}
.tree-ring-loader circle {
  fill: none;
  stroke-linecap: round;
  transform-origin: center;
}
.tree-ring-loader .ring-1 {
  stroke: #E8C44A;
  stroke-width: 2.5;
  stroke-dasharray: 176;
  stroke-dashoffset: 176;
  animation: ringDraw 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards, ringPulse 2.4s 1.1s ease-in-out infinite;
}
.tree-ring-loader .ring-2 {
  stroke: #5FA052;
  stroke-width: 2.2;
  stroke-dasharray: 132;
  stroke-dashoffset: 132;
  animation: ringDraw 1.1s 0.18s cubic-bezier(0.4, 0, 0.2, 1) forwards, ringPulse 2.4s 1.3s ease-in-out infinite;
}
.tree-ring-loader .ring-3 {
  stroke: #4E8A43;
  stroke-width: 1.8;
  stroke-dasharray: 88;
  stroke-dashoffset: 88;
  animation: ringDraw 1.1s 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards, ringPulse 2.4s 1.5s ease-in-out infinite;
}
.tree-ring-loader .heartwood {
  fill: #D4983B;
  opacity: 0;
  animation: heartFade 0.5s 0.8s ease-out forwards;
}
@keyframes ringDraw {
  to { stroke-dashoffset: 0; }
}
@keyframes ringPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
@keyframes heartFade {
  to { opacity: 1; }
}
.loading-brand {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #E8C44A;
  opacity: 0;
  animation: brandFade 0.6s 0.5s ease-out forwards;
}
@keyframes brandFade {
  to { opacity: 1; }
}
.loading-text {
font-size: 10px;
color: var(--text-dim);
font-family: 'JetBrains Mono', monospace;
text-transform: uppercase;
letter-spacing: 0.12em;
}
.error-msg {
font-family: var(--font-sans);
text-transform: none;
letter-spacing: normal;
background: var(--danger-dim);
border: 1px solid rgba(248,113,113,0.2);
border-radius: 6px;
padding: 14px;
font-size: 14px;
color: var(--danger);
margin-bottom: 14px;
line-height: 1.4;
}

/* Health Vitals */
.vitals-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.vital-cell {
padding: 12px;
border-radius: 6px;
border: 1px solid var(--border);
background: var(--surface2);
min-width: 0;
overflow: hidden;
}
.vital-label {
font-family: var(--font-mono);
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--text-dim);
margin-bottom: 6px;
}
.vital-value {
font-family: var(--font-mono);
font-variant-numeric: tabular-nums;
font-size: 22px;
font-weight: 500;
color: var(--accent);
line-height: 1.2;
}
.vital-unit {
font-size: 12px;
font-weight: 400;
color: var(--text-dim);
margin-left: 2px;
}
.vital-context {
font-size: 11px;
font-family: 'JetBrains Mono', monospace;
color: var(--text-dim);
margin-top: 4px;
}



.hidden { display: none; }

/* HUD Aesthetic additions (body-level type rules removed in v1.22) */
.app {
  background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 20px 20px;
}
.divider, .header {

.num-display-md {

  font-size: 28px;
  font-weight: 600;

}
.prose {
  font-family: var(--font-sans);
  text-transform: none;
  letter-spacing: normal;
  line-height: 1.55;
}
</style>

// ============================================================
// iOS Safari does not support navigator.vibrate(). Workaround: toggling an
// <input type="checkbox" switch> (iOS 17.4+) triggers a native iPhone haptic.
// CRITICAL: You cannot click the input directly - WebKit blocks programmatic
// haptics on the input itself. You have to click an associated <label>.
// Android/Chrome fall through to navigator.vibrate() which works natively.
var _hapticPair = null;
function _ensureHapticPair() {
  if (_hapticPair) return _hapticPair;
  try {
    var wrap = document.createElement('label');
    wrap.setAttribute('aria-hidden', 'true');
    wrap.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;';
    var input = document.createElement('input');
    input.type = 'checkbox';
    // The 'switch' attribute (iOS 17.4+) is what enables haptic on state change
    input.setAttribute('switch', '');
    input.tabIndex = -1;
    wrap.appendChild(input);
    document.body.appendChild(wrap);
    _hapticPair = { label: wrap, input: input };
  } catch(_) {}
  return _hapticPair;
}

function haptic(ms) {
  // Android / Chrome: native Vibration API
  var vibrated = false;
  if (typeof navigator !== 'undefined' && navigator.vibrate) {
    try {
      vibrated = !!navigator.vibrate(ms || 8);
    } catch(_) {}
  }
  if (vibrated) return;
  // iOS Safari workaround: click the LABEL (not the input) to fire native haptic
  try {
    var p = _ensureHapticPair();
    if (p && p.label) {
      p.label.click();
    }
  } catch(_) {}
}

// Cross-section ring SVG for muscle grid (organic concentric rings)
function crossSectionRingSvg(daysSince, idealDays, arcColor) {
  var size = 36;
  var cx = size / 2;
  var cy = size / 2;
  var ringCount = 5;
  var remaining;
  if (daysSince === Infinity) { remaining = 0; }
  else { remaining = Math.max(0, 1 - (daysSince / idealDays)); }
  var filled = Math.round(remaining * ringCount);
  var label = daysSince === Infinity ? '?' : daysSince;
  var fontSize = String(label).length > 1 ? 10 : 11;
  var svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="flex-shrink:0;">';
  for (var i = 0; i < ringCount; i++) {
    var r = 4 + i * 3.2;
    var isFilled = i < filled;
    var pts = [];
    for (var j = 0; j < 36; j++) {
      var angle = (j / 36) * Math.PI * 2;
      var noise = Math.sin(angle * 3 + i * 2.1) * 1.4 + Math.cos(angle * 5 + i * 1.3) * 0.7;
      var rx = cx + (r + noise) * Math.cos(angle);
      var ry = cy + (r + noise) * Math.sin(angle);
      pts.push((j === 0 ? 'M' : 'L') + rx.toFixed(1) + ',' + ry.toFixed(1));
    }
    pts.push('Z');
    var opacity = isFilled ? (0.5 + (i / ringCount) * 0.5).toFixed(2) : '0.15';
    var strokeW = isFilled ? '1.8' : '0.7';
    svg += '<path d="' + pts.join(' ') + '" fill="none" stroke="' + (isFilled ? arcColor : C.surface3) + '" stroke-width="' + strokeW + '" opacity="' + opacity + '"/>';

  svg += '</svg>';
  return svg;
}

// ============================================================
// 1RM ESTIMATION (Pillar 3)
// ============================================================
function estimate1RM_Brzycki(weightLbs, reps) {
  if (reps <= 0) return 0;
  if (reps === 1) return weightLbs;
  if (reps >= 37) return weightLbs;
  return weightLbs * (36 / (37 - reps));
}

function estimate1RM_Epley(weightLbs, reps) {
  if (reps <= 0) return 0;
  if (reps === 1) return weightLbs;
  return weightLbs * (1 + reps / 30);
}

function estimate1RM(weightLbs, reps) {
  if (reps <= 10) return estimate1RM_Brzycki(weightLbs, reps);
  return estimate1RM_Epley(weightLbs, reps);
}

// ============================================================
// PERCENTILE ESTIMATION
// ============================================================
function estimatePercentile(standardKey, bwMultiplier) {
  const std = STRENGTH_STANDARDS[standardKey];
  if (!std || !std.multipliers) return null;
  const m = std.multipliers;
  const pctiles = [10, 25, 50, 75, 90];

  if (bwMultiplier <= m[0]) return Math.round((bwMultiplier / m[0]) * 10);
  if (bwMultiplier >= m[4]) return Math.min(99, 90 + Math.round(((bwMultiplier - m[4]) / (m[4] * 0.2)) * 9));

  for (let i = 0; i < m.length - 1; i++) {
    if (bwMultiplier >= m[i] && bwMultiplier <= m[i + 1]) {
      const frac = (bwMultiplier - m[i]) / (m[i + 1] - m[i]);
      return Math.round(pctiles[i] + frac * (pctiles[i + 1] - pctiles[i]));
    }
  }
  return 50;
}

const TIME_CONSTANTS = {
  compoundSetSec: 45,
  isolationSetSec: 35,
  transitionSec: 90,
  sessionCapMin: 60,
};

function calculateExerciseTime(exerciseName, sets) {
  const db = EXERCISE_DB[exerciseName];
  const isCompound = db ? db.type === 'compound' : isLikelyCompound(exerciseName);
  const setTime = isCompound ? TIME_CONSTANTS.compoundSetSec : TIME_CONSTANTS.isolationSetSec;
  const restSec = getRestSeconds(exerciseName);
  return (sets * setTime) + ((sets - 1) * restSec) + TIME_CONSTANTS.transitionSec;
}

// Consistent working-set extraction used everywhere.
// v1.35: the Hevy GET /workouts API returns the set kind in 'type'
// ('normal' | 'warmup' | 'failure' | 'dropset'), NOT 'set_type' -- verified
// against the live API. The old filter checked a field that never exists,
// so every set (incl. warmups) silently counted as a working set.
// 'failure' sets still count as working sets (they are max-effort work).
function getWorkingSets(exercise) {
  return (exercise.sets || []).filter(s => {
    const t = s.type || s.set_type;
    return !t || t === 'normal' || t === 'failure';
  });
}

// Normalize exercise name for caching/matching
function normalizeExerciseName(name) {
  return (name || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[\u2018\u2019\u2032]/g, "'");
}

// v1.33: exercise "family" = name with the trailing equipment parenthetical
// stripped. "Standing Calf Raise (Dumbbell)" / "(Barbell)" / "(Smith)" are
// one family. fitCandidates uses this to keep near-identical variants from
// stacking inside a single session.
function exerciseFamily(name) {
  return (name || '').replace(/\s*\([^)]*\)\s*$/, '').trim().toLowerCase();
}

// Format set counts: show decimals only when fractional
function formatSets(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

// Classification cache keyed by template_id or normalized name
const _classifyCache = new Map();

function classifyExerciseCached(exercise) {
  const key = exercise.exercise_template_id || normalizeExerciseName(exercise.title || '');
  if (_classifyCache.has(key)) return _classifyCache.get(key);
  const result = classifyExercise(exercise.title || '');
  _classifyCache.set(key, result);
  return result;
}

];

function classifyExercise(name) {
  for (const c of CARDIO_PATTERNS) {
    if (c.test(name)) return { primary: 'cardio', secondary: [] };
  }
  for (const m of EXERCISE_MUSCLE_MAP) {
    if (m.pattern.test(name)) return { primary: m.primary, secondary: m.secondary };
  }
  return { primary: 'other', secondary: [] };
}

// v1.29: Big 5 classification for session-level conflict resolution.
// Evidence: Simao et al. 2012 (order effects), Schoenfeld 2017 (volume/frequency),
// plus coaching tradition consensus across 5/3/1, Starting Strength, Juggernaut, RP.
// We match by regex so reroll variations and minor name differences still classify.
var BIG_FIVE_PATTERNS = {
  bench:    /^(bench press)\s*\(barbell\)/i,
  squat:    /^(squat|back squat)\s*\(barbell\)/i,
  deadlift: /^(deadlift|conventional deadlift)\s*\(barbell\)/i,
  ohp:      /^(overhead press|military press|standing military press)\s*\(barbell\)/i,
  row:      /^(bent over row|barbell row|pendlay row)\s*\(barbell\)/i,
};
function isBig5(exName) {
  if (!exName) return null;
  for (var k in BIG_FIVE_PATTERNS) {
    if (BIG_FIVE_PATTERNS[k].test(exName)) return k;
  }
  return null;
}

// v1.29: Conflict pairs with severity and reason.
// 'block': never allow both in same session (hard rule, skips second candidate)
// 'caution': score-penalty, skip if already past 40% time budget (deprioritizes)
// Additional same-movement-pattern conflicts are already handled upstream by
// MOVEMENT_PATTERNS / usedPat - this table captures the CROSS-pattern cases.
var BIG_5_CONFLICTS = [
  { pair: ['squat', 'deadlift'], severity: 'block',
    reason: 'Squat and Deadlift both maximally load the spine and CNS. Recovery risk compounds at intermediate+ loads.' },
  { pair: ['deadlift', 'row'], severity: 'caution',
    reason: 'Deadlift and heavy Row are both grip-limited and stress the spinal erectors. Form degrades late in the session.' },
];

function findBig5Conflict(newKey, existingKeys) {
  for (var i = 0; i < BIG_5_CONFLICTS.length; i++) {
    var c = BIG_5_CONFLICTS[i];
    var a = c.pair[0], b = c.pair[1];
    var hit = (newKey === a && existingKeys.indexOf(b) !== -1)
           || (newKey === b && existingKeys.indexOf(a) !== -1);
    if (hit) return c;
  }
  return null;
}

// Big 5 cap based on time budget AND volume-delivery ratio.
// Research + tradition say 2 heavy compounds is the ceiling for 45-75 min
// sessions *when volume is maxed*. v1.30: when the user is consistently
// under-delivering Foundation volume, the cap relaxes to 3 since there's
// no recovery economy to protect. The Squat+Deadlift block and Deadlift+Row
// caution are independent of this - those are CNS/spinal safety rails that
// apply regardless of volume loading.
function foundationVolumeDeliveryRatio() {
  if (!muscleAnalysis) return null;
  var foundationKeys = ['chest', 'back', 'shoulders', 'quads', 'hamstrings', 'glutes'];
  var totalActual = 0;
  var totalTarget = 0;
  for (var i = 0; i < foundationKeys.length; i++) {
    var k = foundationKeys[i];
    var stat = muscleAnalysis[k];
    if (stat && stat.idealSetsPerWeek > 0) {
      // 30-day actual sets divided by 4.3 weeks = average weekly sets
      totalActual += (stat.totalSets30d || 0) / 4.3;
      totalTarget += stat.idealSetsPerWeek;
    }
  }
  if (totalTarget === 0) return null;
  return totalActual / totalTarget;
}

function bigFiveCapForBudget(capSec) {
  var capMin = capSec / 60;
  var baseCap = capMin <= 75 ? 2 : 3;
  // Adaptive: if user is significantly under-delivering Foundation volume,
  // relax the cap to 3. Threshold 0.60 of target = ~39% of Schoenfeld
  // optimal (since targets are set at 65% of optimal per master doc).
  // A user at 60%+ of target is consistent enough that cap=2 protects
  // meaningful recovery; below 60% the cap is just getting in the way.
  if (baseCap === 2) {
    var ratio = foundationVolumeDeliveryRatio();
    if (ratio !== null && ratio < 0.60) return 3;
  }
  return baseCap;
}

// Build the dynamic exercise pool from all known sources
// Tier 1 (instant): EXERCISE_DB + workout history
// Tier 2 (background): Hevy template library (added by fetchAllHevyTemplateIds)
function buildDynamicExercisePool() {
  const pool = {};
  const muscleKeys = Object.keys(MUSCLE_GROUPS);
  for (const key of muscleKeys) pool[key] = new Set();

  // Source 1: All exercises in EXERCISE_DB (always available)
  for (const name in EXERCISE_DB) {
    const db = EXERCISE_DB[name];
    if (db.muscle && pool[db.muscle]) pool[db.muscle].add(name);
  }

  // Source 2: All exercises from workout history (classify by name)
  for (const name in exerciseHistory) {
    const cls = classifyExercise(name);
    if (cls.primary !== 'cardio' && cls.primary !== 'other' && pool[cls.primary]) {
      pool[cls.primary].add(name);
    }
  }

  _dynamicExercisePool = pool;
  return pool;
}

// Add exercises from Hevy templates into the dynamic pool
// Only adds exercises we can classify to a known muscle group
function addHevyTemplatesToPool() {
  var added = 0;
  for (const name in _templateIdMap) {
    // Skip if already in pool
    var alreadyInPool = false;
    for (var key in _dynamicExercisePool) {
      if (_dynamicExercisePool[key].has(name)) { alreadyInPool = true; break; }
    }
    if (alreadyInPool) continue;

    var cls = classifyExercise(name);
    if (cls.primary !== 'cardio' && cls.primary !== 'other' && _dynamicExercisePool[cls.primary]) {
      _dynamicExercisePool[cls.primary].add(name);
      added++;
    }
  }
  if (added > 0) console.log('Added ' + added + ' exercises from Hevy templates to dynamic pool');
}

// Rank exercises within a muscle group using history data
// Returns the same exercise names but reordered by composite score
function rankExercisesForMuscle(muscleKey) {
  let pool = _dynamicExercisePool[muscleKey]
    ? Array.from(_dynamicExercisePool[muscleKey])
    : (MUSCLE_EXERCISE_PICKS[muscleKey] || []);

  if (pool.length === 0) return pool;

  if (pool.length <= 1) return pool;

  const now = new Date();
  const todayStr = localDateStr(now);
  let scored = [];

  for (const exName of pool) {
    const hist = exerciseHistory[exName];
    const db = EXERCISE_DB[exName];
    let score = 1.0;

    // 1. Recency: days since last performed (more days = higher score)
    // Cap at 21 days to avoid infinite growth for never-done exercises
    let daysSince = 14; // default if never done
    if (hist && hist.lastDate) {
      const last = new Date(hist.lastDate + 'T12:00:00');
      daysSince = Math.max(0, Math.round((now - last) / (1000 * 60 * 60 * 24)));
    }
    const recencyScore = Math.min(daysSince / 14, 1.5);
    score += recencyScore * 0.4;

    // 2. Variety: fewer appearances in last 30d = higher score
    let count30d = 0;
    if (hist && hist.dates) {
      const cutoff = new Date(now);
      cutoff.setDate(cutoff.getDate() - 30);
      const cutoffStr = localDateStr(cutoff);
      for (const d of hist.dates) {
        if (d >= cutoffStr) count30d++;
      }
    }
    const varietyScore = Math.max(0, 1 - (count30d / 8));
    score += varietyScore * 0.25;

    // 3. Compound anchor bonus: primary compound gets permanent boost
    if (COMPOUND_ANCHORS[muscleKey] === exName) {
      score += 0.6;
    }

    // 4. Deficit bonus: if current weight is well below benchmark
    if (db && db.benchmarkLbs > 0 && hist && hist.lastWeightLbs > 0) {
      if (hist.lastWeightLbs / db.benchmarkLbs < 0.85) {
        score += 0.2;
      }
    }

    scored.push({ name: exName, score });
  }

  scored.sort((a, b) => b.score - a.score);
  // Apply reroll rotation: shift top picks to create variety
  if (_liftRerollOffset > 0 && scored.length > 1) {
    // Keep compound anchor in position 0 if present, rotate the rest
    var anchorName = COMPOUND_ANCHORS[muscleKey];
    var anchorIdx = -1;
    for (var ri = 0; ri < scored.length; ri++) {
      if (scored[ri].name === anchorName) { anchorIdx = ri; break; }
    }
    var anchor = anchorIdx >= 0 ? scored.splice(anchorIdx, 1)[0] : null;
    // Rotate remaining by offset
    if (scored.length > 1) {
      var rot = _liftRerollOffset % scored.length;
      scored = scored.slice(rot).concat(scored.slice(0, rot));
    }
    if (anchor) scored.unshift(anchor);
  }
  return scored.map(s => s.name);
}

  if (!entry.date) entry.date = localDateStr(new Date());
  // Read/write ONLY the localStorage delta list -- never copy baseline into storage.
  // Baseline lives in MEASUREMENTS_BASELINE and is merged at read/render time.
  const deltas = Storage.get(MEASUREMENTS_KEY, []);
  const idx = deltas.findIndex(e => e.date === entry.date);
  if (idx !== -1) {
    // Merge: new fields overwrite, keep old fields not in new entry
    deltas[idx] = Object.assign({}, deltas[idx], entry);
  } else {
    deltas.push(entry);
  }
  deltas.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (deltas.length > 400) deltas.splice(0, deltas.length - 400);
  Storage.set(MEASUREMENTS_KEY, deltas);
}

  const sorted = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  for (const entry of sorted) {
    for (const field of MEASUREMENT_FIELDS) {
      if (entry[field.key] != null && entry[field.key] !== '' && !isNaN(entry[field.key])) {
        latest[field.key] = parseFloat(entry[field.key]);

// ---- Phase 3: Compute proportion deficit scores ----
function computeProportionDeficits(measurements) {
  if (!measurements) return {};
  const deficits = {};

  for (const [fieldKey, ft] of Object.entries(FRAME_TARGETS)) {
    if (!ft.target || !ft.muscle) continue;
    const current = measurements[fieldKey];
    if (current == null || current <= 0) continue;

    if (ft.inverted) {
      deficits[ft.muscle] = Math.max(0, (current / ft.target) - 1);
    } else {
      deficits[ft.muscle] = Math.max(0, 1 - (current / ft.target));
    }
  }
  return deficits;
}

function fetchWithTimeout(url, options, timeoutMs) {

  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('Network timeout after ' + (timeoutMs / 1000) + 's')); }, timeoutMs);

  ]);

async function fetchWorkouts(pageSize = 10, maxPages = 16) {
  const allWorkouts = [];
  let page = 1;
  let totalPages = 1;
  const HARD_CAP = 155; // ~6 months at 6 days/week

  while (page <= totalPages && page <= maxPages && allWorkouts.length < HARD_CAP) {
    updateLoading('Loading workouts' + (allWorkouts.length > 0 ? ` (${allWorkouts.length})` : '') + '...');
    const resp = await fetchWithTimeout(`${API_BASE}/workouts?page=${page}&pageSize=${pageSize}`, {
      headers: { 'api-key': apiKey },
      mode: 'cors'
    });
    if (!resp.ok) {
      let body = '';
      try { body = await resp.text(); } catch (_) {}
      throw new Error(`API error ${resp.status}: ${body || resp.statusText}`);
    }
    const data = await resp.json();
    totalPages = data.page_count || 1;
    if (data.workouts) allWorkouts.push(...data.workouts);
    page++;
  }
  return allWorkouts;
}

    let bw = bodyweightLbs;
    for (const w of weightSorted) {
      if (w.date <= dateStr) bw = w.value;
      else break;
    }
    return bw;
  }

  // ---- Single pass ----
  for (const w of sorted) {
    const wDate = new Date(w.start_time || w.created_at);
    const dateStr = localDateStr(wDate);
    const isRecent = wDate >= thirtyDaysAgo;
    const musclesThisWorkout = new Set();
    const siWorkoutBest = { bench: null, squat: null, deadlift: null, ohp: null, row: null };

    if (!heatmapDayMuscle[dateStr]) heatmapDayMuscle[dateStr] = {};
    if (!heatmapDayWorkouts[dateStr]) heatmapDayWorkouts[dateStr] = [];

    for (const ex of (w.exercises || [])) {
      const name = ex.title || '';
      if (!name) continue;

      const classification = classifyExerciseCached(ex);
      const workingSets = getWorkingSets(ex);

      // --- Exercise history ---
      if (workingSets.length > 0) {
        // v1.33: progression gate = ALL sets at the top weight must hit the
        // rep ceiling, so lastReps is the MIN reps among sets at the heaviest
        // weight (canonical double progression for straight sets; degrades to
        // a top-set gate for pyramid-style logging). Previously this recorded
        // the reps of the FIRST set at the top weight, which triggered +5 lbs
        // off an 8,6,5 session on a 6-8 range. Zero-rep sets are ignored for
        // the min; bodyweight (0-lb) exercises keep their old behavior.
        let bestWeight = 0, bestReps = 0;
        for (const s of workingSets) {
          const wLbs = Math.round((s.weight_kg || 0) * 2.20462);
          const r = s.reps || 0;
          if (wLbs > bestWeight) { bestWeight = wLbs; bestReps = r; }
          else if (wLbs > 0 && wLbs === bestWeight && r > 0 && (bestReps === 0 || r < bestReps)) { bestReps = r; }
        }
        if (!exHistory[name]) exHistory[name] = { weights: [], dates: [], reps: [] };
        if (!exHistory[name].reps) exHistory[name].reps = []; // safety for older shapes
        exHistory[name].lastWeightLbs = bestWeight;
        exHistory[name].lastReps = bestReps;
        exHistory[name].lastDate = dateStr;
        exHistory[name].lastSets = workingSets.length;
        exHistory[name].weights.push(bestWeight);
        exHistory[name].dates.push(dateStr);
        exHistory[name].reps.push(bestReps); // v1.39: per-session gating reps for stall detection
        // Capture Hevy exercise_template_id for Send to Hevy
        if (ex.exercise_template_id && !templateIdMap[name]) {
          templateIdMap[name] = ex.exercise_template_id;
        }
      }

      if (classification.primary === 'cardio') {
        // Hevy-logged cardio ALWAYS counts toward weekly target.
        // See Cardio Counting Rules table in APPLE_CARDIO_TYPES section.
        let cardioMin = 0;
        for (const s of (ex.sets || [])) {
          if (s.duration_seconds && s.duration_seconds > 0) {
            cardioMin += s.duration_seconds / 60;
          }
        }
        // Conservative default: if cardio exercise exists but has no duration data, assume 15 min
        if (cardioMin === 0 && (ex.sets || []).length > 0) cardioMin = 15;
        if (cardioMin > 0) {
          if (!heatmapDayCardio[dateStr]) heatmapDayCardio[dateStr] = { minutes: 0, sessions: [] };
          heatmapDayCardio[dateStr].minutes += cardioMin;
          heatmapDayCardio[dateStr].sessions.push({ name, minutes: Math.round(cardioMin), source: 'hevy', timestamp: wDate.getTime() });
        }
      }

      if (classification.primary === 'cardio' || classification.primary === 'other') continue;

      const setCount = workingSets.length;
      const allMuscles = [classification.primary, ...classification.secondary];

      // --- Muscle stats (30d) ---
      for (const muscle of allMuscles) {
        if (!muscleStats[muscle]) continue;
        const stat = muscleStats[muscle];
        const isPrimary = muscle === classification.primary;

        // Track recency: primary vs any (secondary) separately
        // This prevents secondary stimulus (e.g. RDLs for back) from
        // resetting the "last trained" clock on back, which would
        // incorrectly suppress back recommendations.
        if (!stat.lastTrainedAny || wDate > stat.lastTrainedAny) {
          stat.lastTrainedAny = wDate;
          stat.daysSinceAny = Math.floor((now - wDate) / (1000 * 60 * 60 * 24));
        }
        if (isPrimary && (!stat.lastTrainedPrimary || wDate > stat.lastTrainedPrimary)) {
          stat.lastTrainedPrimary = wDate;
          stat.daysSincePrimary = Math.floor((now - wDate) / (1000 * 60 * 60 * 24));
        }

        if (isRecent) {
          const weight = isPrimary ? 1.0 : 0.5;
          stat.totalSets30d += setCount * weight;
          for (const s of workingSets) {
            stat.totalVolume30d += (s.reps || 0) * (s.weight_kg || 0) * weight;
          }
          stat.exercises.add(name);
          musclesThisWorkout.add(muscle);
        }
      }

      // --- Heatmap data ---
      for (const muscle of allMuscles) {
        if (!MUSCLE_GROUPS[muscle]) continue;
        const isPrimary = muscle === classification.primary;
        const weight = isPrimary ? 1.0 : 0.5;
        heatmapDayMuscle[dateStr][muscle] = (heatmapDayMuscle[dateStr][muscle] || 0) + setCount * weight;
      }

      // Heatmap detail
      const bestSet = workingSets.reduce((best, s) => {
        const wLbs = Math.round((s.weight_kg || 0) * 2.20462);
        return wLbs > (best.w || 0) ? { w: wLbs, r: s.reps || 0 } : best;
      }, {});
      heatmapDayWorkouts[dateStr].push({
        name, sets: setCount,
        bestWeight: bestSet.w || 0, bestReps: bestSet.r || 0,
      });

      // --- Muscle 1RM (last 30d) ---
      if (isRecent) {
        for (const [muscleKey, keyLift] of Object.entries(MUSCLE_KEY_LIFTS)) {
          const matched = keyLift.patterns.some(p => p.test(name));
          if (!matched) continue;
          for (const s of workingSets) {
            const wLbs = (s.weight_kg || 0) * 2.20462;
            const reps = s.reps || 0;
            if (wLbs <= 0 || reps <= 0) continue;
            const est = estimate1RM(wLbs, reps);
            if (est > muscle1RMInputs[muscleKey].best1RM) {
              muscle1RMInputs[muscleKey].best1RM = est;
              muscle1RMInputs[muscleKey].exercise = name;
            }
          }
        }
      }

      // --- Strength index events (v1.38: true 183-day rolling window) ---
      // Record the best estimated 1RM per lift in THIS workout; the SI
      // datapoint below windows over the trailing 183 days.
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        const matched = liftDef.patterns.some(p => p.test(name));
        if (!matched) continue;
        for (const s of workingSets) {
          const wLbs = (s.weight_kg || 0) * 2.20462;
          const reps = s.reps || 0;
          if (wLbs <= 0 || reps <= 0) continue;
          const est = estimate1RM(wLbs, reps);
          const prevBest = siWorkoutBest[liftKey];
          if (!prevBest || est > prevBest.est) {
            siWorkoutBest[liftKey] = { est: est, src: { ex: name, wt: Math.round(wLbs), reps: reps, date: dateStr } };
          }
        }
      }
    }

    // Session count
    if (isRecent) {
      for (const m of musclesThisWorkout) {
        if (muscleStats[m]) muscleStats[m].sessionCount30d++;
      }
    }

    // Strength Score data point (normalized: 1.0 = 50th percentile gym-goer for user's age)
    // v1.38: push this workout's per-lift bests as events, then take the max
    // over the trailing 183 days per lift. SI can now decline as PRs age out.
    const wMs = wDate.getTime();
    for (const liftKey in siWorkoutBest) {
      if (siWorkoutBest[liftKey]) {
        siEvents[liftKey].push({ t: wMs, est: siWorkoutBest[liftKey].est, src: siWorkoutBest[liftKey].src });
      }
    }
    const siWindowStart = wMs - SI_WINDOW_MS;
    const siCurrent = {};
    let hasData = false;
    for (const liftKey in siEvents) {
      let best = 0, bestSrc = null;
      const evs = siEvents[liftKey];
      for (let ei = evs.length - 1; ei >= 0; ei--) {
        if (evs[ei].t < siWindowStart) break; // events are chronological
        if (evs[ei].est > best) { best = evs[ei].est; bestSrc = evs[ei].src; }
      }
      siCurrent[liftKey] = { rm1: best, src: bestSrc };
      if (best > 0) hasData = true;
    }
    if (hasData) {
      const bw = getBodyweightAt(dateStr);
      const lifts = {};
      let totalWeight = 0;

      // First pass: identify which lifts have data and sum their weights
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        if (siCurrent[liftKey].rm1 > 0) totalWeight += liftDef.weight;
      }

      // Second pass: compute normalized score with re-weighted lifts
      let index = 0;
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        const rm1 = siCurrent[liftKey].rm1;
        const mult = bw > 0 ? rm1 / bw : 0;
        const normalized = liftDef.p50 > 0 ? mult / liftDef.p50 : 0;
        const adjustedWeight = totalWeight > 0 ? liftDef.weight / totalWeight : 0;
        if (rm1 > 0) {
          index += normalized * adjustedWeight;
        }
        lifts[liftKey] = { rm: Math.round(rm1), mult: Math.round(mult * 100) / 100, src: siCurrent[liftKey].src };
      }
      siTimeline.push({ date: dateStr, index: Math.round(index * 100) / 100, lifts: { ...lifts } });
    }
  }

  // Finalize muscle 1RMs with percentiles
  const muscle1RMResults = {};
  for (const [key, data] of Object.entries(muscle1RMInputs)) {
    const keyLift = MUSCLE_KEY_LIFTS[key];
    const bwMult = bodyweightLbs > 0 ? data.best1RM / bodyweightLbs : 0;
    const percentile = estimatePercentile(keyLift.standard, bwMult);
    muscle1RMResults[key] = {
      best1RM: Math.round(data.best1RM),
      bwMult: Math.round(bwMult * 100) / 100,
      percentile, exercise: data.exercise,
    };
  }

  // Merge Apple Watch cardio into heatmap (dedup against Hevy within 30 min)
  const WATCH_NON_CARDIO_HM = /strength|weight\s*train|yoga|pilates|stretch|cool\s*down|flexibility|mind.*body|tai\s*chi/i;
  if (healthData && Array.isArray(healthData.workouts)) {
    // Collect actual Hevy cardio timestamps for accurate dedup
    const hevyCardioTs = [];
    for (const [, cd] of Object.entries(heatmapDayCardio)) {
      for (const sess of cd.sessions) {
        if (sess.source === 'hevy' && sess.timestamp) {
          hevyCardioTs.push(sess.timestamp);
        }
      }
    }
    for (const aw of healthData.workouts) {
      if (WATCH_NON_CARDIO_HM.test(aw.type || '')) continue;

      // Walk filter: only count walks that represent intentional cardio training.
      // Indoor walks always count (treadmill = intentional).
      // Hikes always count (starting a hike is an intentional decision).
      // Other walks (plain "Walking", "Outdoor Walk") must be >= 20 min to count --
      // this filters casual errands while keeping intentional cardio walks.
      // The global walking HR avg is too noisy (blends casual + intense walks)
      // and per-workout HR is not available from the Shortcut.
      if (/walk/i.test(aw.type || '') && !/hik/i.test(aw.type || '')) {
        var isIndoor = /indoor/i.test(aw.type || '');
        var walkDur = parseFloat(aw.duration_min) || 0;
        if (!isIndoor && walkDur < 20) continue;
      }

      const startStr = (aw.start || '').replace(/\s+at\s+/i, ' ').replace(/\u202f/g, ' ');
      const awDate = new Date(startStr);
      if (isNaN(awDate.getTime())) continue;
      const dur = parseFloat(aw.duration_min) || 0;
      if (dur <= 0) continue;
      const dateStr = localDateStr(awDate);
      // Dedup: skip if Hevy cardio on same day within 30 min
      const DEDUP_MS = 30 * 60 * 1000;
      const isDup = hevyCardioTs.some(ts => Math.abs(ts - awDate.getTime()) < DEDUP_MS);
      if (isDup) continue;
      if (!heatmapDayCardio[dateStr]) heatmapDayCardio[dateStr] = { minutes: 0, sessions: [] };
      heatmapDayCardio[dateStr].minutes += dur;
      heatmapDayCardio[dateStr].sessions.push({ name: aw.type || 'Cardio', minutes: Math.round(dur), source: 'watch', timestamp: awDate.getTime(), calories: parseFloat(aw.calories) || 0 });
    }
  }

  // ---- Cardio Fitness timeline (vitals-only, no activity) ----
  // Signals: VO2 Max 50%, RHR 30% (inverted), Recovery 20%
  const csTimeline = [];
  // ---- Dedication timeline (effort + consistency, rolling 7d) ----
  const dedTimeline = [];

  const cardioDates = Object.keys(heatmapDayCardio).sort();
  const allActivityDates = new Set([
    ...Object.keys(heatmapDayWorkouts),
    ...cardioDates,
  ]);
  const allDatesArr = [...allActivityDates].sort();

  // Build vitals interpolation from quarterly snapshots (12m, 6m, 3m, current)
  function buildVitalTimeline(v12m, v6m, v3m, vNow) {
    const now = new Date();
    const points = [];
    const addPoint = (monthsAgo, val) => {
      if (val && val > 0) {
        const d = new Date(now);
        d.setMonth(d.getMonth() - monthsAgo);
        points.push({ date: localDateStr(d), value: val });
      }
    };
    addPoint(12, v12m);
    addPoint(6, v6m);
    addPoint(3, v3m);
    addPoint(0, vNow);
    return points.sort((a, b) => a.date.localeCompare(b.date));
  }

  function interpolateVital(timeline, dateStr) {
    if (!timeline || timeline.length === 0) return null;
    if (timeline.length === 1) return timeline[0].value;
    if (dateStr <= timeline[0].date) return timeline[0].value;
    if (dateStr >= timeline[timeline.length - 1].date) return timeline[timeline.length - 1].value;
    for (let i = 0; i < timeline.length - 1; i++) {
      if (dateStr >= timeline[i].date && dateStr <= timeline[i + 1].date) {
        const t0 = new Date(timeline[i].date).getTime();
        const t1 = new Date(timeline[i + 1].date).getTime();
        const t = new Date(dateStr).getTime();
        const frac = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
        return timeline[i].value + frac * (timeline[i + 1].value - timeline[i].value);
      }
    }
    return timeline[timeline.length - 1].value;
  }

  const rhrTimeline = healthData ? buildVitalTimeline(
    healthData.rhr_12m, healthData.rhr_6m, healthData.rhr_3m,
    healthData.resting_heart_rate
  ) : [];
  const vo2Timeline = healthData ? buildVitalTimeline(
    healthData.vo2_12m, healthData.vo2_6m, healthData.vo2_3m,
    healthData.cardio_fitness
  ) : [];
  const recTimeline = healthData ? buildVitalTimeline(
    healthData.rec_12m, healthData.rec_6m, healthData.rec_3m,
    healthData.cardio_recovery
  ) : [];

  // Count total unique muscle groups in MUSCLE_GROUPS
  const totalMuscleGroups = Object.keys(MUSCLE_GROUPS).length;

  for (const dateStr of allDatesArr) {
    const d = new Date(dateStr + 'T12:00:00');

    // ==== CARDIO FITNESS (vitals only) ====
    const vo2Val = interpolateVital(vo2Timeline, dateStr);
    let vo2Signal = null;
    if (vo2Val && vo2Val > 0) {
      const pctile = estimateVO2Percentile(vo2Val, PROFILE.age);
      vo2Signal = Math.min(pctile / 50, 2.0);
    }
    const rhrVal = interpolateVital(rhrTimeline, dateStr);
    let rhrSignal = null;
    if (rhrVal && rhrVal > 0) {
      rhrSignal = Math.max(0.5, Math.min(1.5, 60 / rhrVal));
    }
    const recVal = interpolateVital(recTimeline, dateStr);
    let recSignal = null;
    if (recVal && recVal > 0) {
      recSignal = Math.min(recVal / 20, 2.0);
    }

    // Vitals-only composite (reweight for available signals)
    let csTotalW = 0, csWSum = 0;
    if (vo2Signal !== null) { csWSum += vo2Signal * 50; csTotalW += 50; }
    if (rhrSignal !== null) { csWSum += rhrSignal * 30; csTotalW += 30; }
    if (recSignal !== null) { csWSum += recSignal * 20; csTotalW += 20; }
    if (csTotalW > 0) {
      csTimeline.push({
        date: dateStr,
        score: Math.round((csWSum / csTotalW) * 100) / 100,
        signals: {
          vo2: vo2Signal !== null ? Math.round(vo2Signal * 100) / 100 : null,
          rhr: rhrSignal !== null ? Math.round(rhrSignal * 100) / 100 : null,
          recovery: recSignal !== null ? Math.round(recSignal * 100) / 100 : null,
        },
      });
    }

    // ==== DEDICATION (effort + recovery, rolling 7d) ====
    let weekLiftDays = 0;
    let weekCardioMin = 0;
    const weekMusclesHit = new Set();
    // Track consecutive lift days ending on this date for fatigue penalty
    let consecLift = 0;
    for (let i = 0; i < 7; i++) {
      const lb = new Date(d);
      lb.setDate(lb.getDate() - i);
      const lbStr = localDateStr(lb);
      if (heatmapDayWorkouts[lbStr] && heatmapDayWorkouts[lbStr].length > 0) {
        weekLiftDays++;
        const dayMuscles = heatmapDayMuscle[lbStr];
        if (dayMuscles) {
          for (const m of Object.keys(dayMuscles)) weekMusclesHit.add(m);
        }
        // Count consecutive days from most recent date backward
        if (i === consecLift) consecLift++;
      }
      if (heatmapDayCardio[lbStr]) weekCardioMin += heatmapDayCardio[lbStr].minutes;
    }

    // Lifting: peaks at 5-6 days (1.0), declines at 7+ (overtraining)
    // 0->0, 1->0.25, 2->0.5, 3->0.75, 4->1.0, 5->1.0, 6->1.0, 7->0.85, 8->0.7
    let liftScore;
    if (weekLiftDays <= 6) liftScore = Math.min(weekLiftDays / 4, 1.0);
    else liftScore = 1.0 - ((weekLiftDays - 6) * 0.15);

    // Consecutive day fatigue penalty: 6+ straight days hurts recovery
    // 6 consecutive -> -0.07, 7 -> -0.14 (max: the 7-day window never sees 8)
    const fatiguePenalty = consecLift >= 6 ? (consecLift - 5) * 0.07 : 0;

    // Muscle coverage: all 12 groups in 7d = 1.0
    const coverageScore = weekMusclesHit.size / totalMuscleGroups;
    // Cardio: 150min/week target = 1.0, diminishing returns cap at 1.3
    const cardioMinScore = Math.min(weekCardioMin / 150, 1.3);

    // Weighted: lifting 40%, coverage 20%, cardio 30%, consistency bonus 10%
    // Consistency bonus: rewards balanced weeks (both lifting and cardio on target)
    const consistencyBonus = (weekLiftDays >= 3 && weekCardioMin >= 100) ? 1.0 : (weekLiftDays >= 2 || weekCardioMin >= 50) ? 0.5 : 0;
    const dedRaw = (liftScore * 0.40) + (coverageScore * 0.20) + (cardioMinScore * 0.30) + (consistencyBonus * 0.10);
    const dedScore = Math.max(0, dedRaw - fatiguePenalty);
    dedTimeline.push({
      date: dateStr,
      score: Math.round(dedScore * 100) / 100,
      liftDays: weekLiftDays,
      cardioMin: Math.round(weekCardioMin),
      musclesCovered: weekMusclesHit.size,
    });
  }

  return {
    exerciseHistory: exHistory,
    templateIdMap,
    muscleStats,
    muscle1RMs: muscle1RMResults,
    strengthIndexTimeline: siTimeline,
    cardioScoreTimeline: csTimeline,
    dedicationTimeline: dedTimeline,
    heatmapDayMuscle,
    heatmapDayWorkouts,
    heatmapDayCardio,
  };
}

// ============================================================
// CARDIOVASCULAR TRAINING ENGINE (Pillar 5)
// ============================================================
// SCIENTIFIC FOUNDATION
// Source 1: ACSM (2018) "Guidelines for Exercise Testing & Prescription" (11th ed)
//   - 150 min/week moderate OR 75 min/week vigorous, or equivalent combination
// Source 2: Seiler (2010) "What is Best Practice for Training Intensity and Duration
//   Distribution in Endurance Athletes?" - polarized 80/20 model
// Source 3: Tanaka et al. (2001) "Age-predicted maximal heart rate revisited"
//   - HRmax = 208 - 0.7 x age (more accurate than 220-age)
// Source 4: Karvonen (1957) "Heart Rate Reserve" method for HR zones
//   - Target HR = ((HRmax - HRrest) x %intensity) + HRrest
// Source 5: Stoggl & Sperlich (2014) "Polarized training has greater impact on key
//   endurance variables than threshold, high-intensity, or high-volume training"

// HR Zone calculations
function calculateHRZones(age, restingHR) {
  // Tanaka formula (Source 3)
  const hrMax = Math.round(208 - 0.7 * age);

  if (restingHR && restingHR > 0) {
    // Karvonen method (Source 4) - more personalized
    const hrr = hrMax - restingHR;
    return {
      hrMax,
      method: 'karvonen',
      zone1: { low: Math.round(restingHR + hrr * 0.50), high: Math.round(restingHR + hrr * 0.60), label: 'Recovery' },
      zone2: { low: Math.round(restingHR + hrr * 0.60), high: Math.round(restingHR + hrr * 0.70), label: 'Aerobic Base' },
      zone3: { low: Math.round(restingHR + hrr * 0.70), high: Math.round(restingHR + hrr * 0.80), label: 'Tempo' },
      zone4: { low: Math.round(restingHR + hrr * 0.80), high: Math.round(restingHR + hrr * 0.90), label: 'Threshold' },
      zone5: { low: Math.round(restingHR + hrr * 0.90), high: hrMax, label: 'VO2max' },
    };
  }

  // Fallback: straight %HRmax
  return {
    hrMax,
    method: 'hrmax',
    zone1: { low: Math.round(hrMax * 0.50), high: Math.round(hrMax * 0.60), label: 'Recovery' },
    zone2: { low: Math.round(hrMax * 0.60), high: Math.round(hrMax * 0.70), label: 'Aerobic Base' },
    zone3: { low: Math.round(hrMax * 0.70), high: Math.round(hrMax * 0.80), label: 'Tempo' },
    zone4: { low: Math.round(hrMax * 0.80), high: Math.round(hrMax * 0.90), label: 'Threshold' },
    zone5: { low: Math.round(hrMax * 0.90), high: hrMax, label: 'VO2max' },
  };
}

// Weekly targets (Source 1: ACSM + Source 2: Seiler polarized model)
const CARDIO_WEEKLY_TARGETS = {
  totalMinModerate: 150,  // ACSM: 150 min/week moderate
  zone2Pct: 0.80,         // Polarized: 80% easy
  hiitPct: 0.20,          // Polarized: 20% hard
  zone2MinPerWeek: 120,   // 80% of 150 = 120 min
  hiitMinPerWeek: 30,     // 20% of 150 = 30 min (at vigorous = 60 min moderate-equivalent)
  sessionsPerWeek: 3,     // 2 easy + 1 hard
};
