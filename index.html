<!DOCTYPE html>

<!--
  LiftScript v1.16
  Changes from v1.15:
  1.  PR Board: personal records with sparkline history, delta from previous PR, current % of PR
  2.  Progressive overload: 30-day trend arrows on each lift in Strength Index detail
  3.  Chart period toggles: tappable 1M/3M/6M/1Y/ALL chips on Weight & Trends chart
  Changes from v1.14:
  1.  Fix UTC/local date math: all day keys now use localDateStr() consistently
  2.  Measurements persistence: localStorage stores only deltas, baseline stays in HTML
  3.  Hevy fetch cap: ~155 workouts (6 months at 6 days/week)
  4.  Inverted target display: waist shows clear "+X.X in over target" instead of ambiguous %
  5.  HIIT gating: readiness checks (RHR, recovery, cardio base, consecutive days) before prescribing
  Changes from v1.13:
  1.  Exercise rotation: recency + variety scoring replaces static pick order
  2.  Compound anchor bonus keeps core barbell lifts in most sessions
  3.  Cardio Score restructured: vitals-only (VO2 50%, RHR 30%, Recovery 20%)
  4.  New Dedication Score: rolling 7d effort (lift sessions, coverage, cardio min)
  5.  New Body Composition Index: body fat, frame targets, waist-to-height ratio
  6.  Power Score now composites all 4 indices (no redundant calculations)
  7.  Chart: 5 toggleable lines (Weight, SI, Cardio Fitness, Dedication, Body Comp)
  8.  Tooltip updated: shows all index values at each data point
  Changes from v1.11:
  1.  Hevy CSV measurement import: tap "Import Hevy" on Body Measurements card
  2.  Added shoulder, hip, and thigh to MEASUREMENT_FIELDS
  3.  Manual entry form now includes new fields
  UI upgrades (v1.12b):
  4.  Removed +Log weight and +Measure buttons (Import Hevy is sole data path)
  5.  Active calories now classified with color-coded labels
  6.  Tappable measurement tiles with animated SVG sparkline history charts
  7.  Proportion analysis replaced with SVG radar/spider chart
  8.  Collapsible section headers for strength index, muscle grid legend
  9.  Increased header/title text sizes for scannability
  10. Muscle grid redesign: uniform tiles, urgency dots, volume micro-bars
-->

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141e27">
<title>LiftScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #141e27;
  --surface: #1c2e3a;
  --surface2: #243a4a;
  --surface3: #2e4858;
  --border: rgba(180,197,219,0.16);
  --border-light: rgba(180,197,219,0.24);
  --text: #eaf1f7;
  --text-mid: #b8ccdf;
  --text-dim: #8299ad;
  --accent: #5eead4;
  --accent-dim: rgba(94, 234, 212, 0.16);
  --warn: #fbbf24;
  --warn-dim: rgba(251, 191, 36, 0.14);
  --danger: #f87171;
  --danger-dim: rgba(248, 113, 113, 0.12);
  --blue: #7eb8e8;
  --blue-dim: rgba(126, 184, 232, 0.14);
  --purple: #b8a0e8;
  --purple-dim: rgba(184, 160, 232, 0.14);
  --strength: #8f9ae8;
  --strength-dim: rgba(143, 154, 232, 0.14);
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
background: #141e27;
background-color: #141e27;
color-scheme: dark;
overscroll-behavior-y: none;
}

body {
font-family: 'Figtree', -apple-system, sans-serif;
color: var(--text);
min-height: 100vh;
-webkit-font-smoothing: antialiased;
line-height: 1.5;
}

/* Layout */
.app {
max-width: 480px;
margin: 0 auto;
padding: 20px 18px;
padding-bottom: 120px;
background: #141e27;
}

/* Header */
.header {
padding: 8px 0 12px;
margin-bottom: 12px;
border-bottom: 1px solid var(--border);
}
.header h1 {
font-size: 30px;
font-weight: 700;
letter-spacing: -0.5px;
color: var(--text);
text-shadow: 0 0 20px rgba(94, 234, 212, 0.15);
}
.header .subtitle {
font-size: 13px;
color: var(--text-dim);
font-family: 'Space Grotesk', sans-serif;
}

/* Cards */
.card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 20px;
padding: 20px;
margin-bottom: 14px;
box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
.card-title {
font-size: 14px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1.2px;
color: #8299ad;
margin-bottom: 14px;
}

/* Tabs */
.tabs {
display: flex;
gap: 4px;
margin-bottom: 18px;
background: var(--surface);
border-radius: 16px;
padding: 4px;
border: 1px solid var(--border);
}
.tab {
flex: 1;
padding: 9px 6px;
text-align: center;
font-size: 16px;
font-weight: 600;
border-radius: 12px;
cursor: pointer;
color: var(--text-dim);
transition: all 0.25s ease;
border: none;
background: none;
font-family: 'Figtree', sans-serif;
-webkit-tap-highlight-color: transparent;
}
.tab.active {
background: rgba(94, 234, 212, 0.10);
color: #5eead4;
box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.20);
}

/* Expandable explainer */
.rec-expand {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
}
.rec-expand.open {
opacity: 1;
}
.rec-explainer {
padding: 0 2px 14px 40px;
font-size: 14px;
color: var(--text-mid);
line-height: 1.55;
}
.rec-explainer strong {
color: var(--text);
font-weight: 600;
}

/* ===================== */
/* EXERCISE PRESCRIPTIONS */
/* ===================== */

.ex-group {
margin-bottom: 20px;
background: var(--surface2);
border-radius: 10px;
padding: 0;
overflow: hidden;
border: 1px solid var(--border);
border-left: 3px solid var(--accent);
}
.ex-group:last-child { margin-bottom: 0; }
.ex-group-title {
font-size: 15px;
font-weight: 600;
padding: 10px 14px;
background: var(--surface);
}
.ex-row {
display: flex;
align-items: center;
padding: 10px 14px;
border-top: 1px solid var(--border);
gap: 8px;
}
.ex-name {
font-size: 13px;
font-weight: 500;
flex: 1;
min-width: 0;
color: var(--text-mid);
line-height: 1.3;
}
.ex-prescription {
font-family: 'Space Grotesk', sans-serif;
font-size: 14px;
font-weight: 600;
color: var(--accent);
white-space: nowrap;
flex-shrink: 0;
}

/* ===================== */
/* MUSCLE GRID (v1.2: tappable with explainers) */
/* ===================== */
.muscle-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.muscle-cell {
border-radius: 10px;
padding: 10px 12px;
transition: all 0.3s ease;
border: 1px solid var(--border);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
}
.muscle-cell:active { opacity: 0.85; }
.muscle-cell-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 8px;
}
.muscle-name {
font-size: 15px;
font-weight: 600;
}
.muscle-detail {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
grid-column: 1 / -1;
}
.muscle-detail.open {
opacity: 1;
}
.muscle-detail-inner {
padding: 14px;
background: var(--surface2);
border-radius: 10px;
border: 1px solid var(--border);
font-size: 14px;
color: var(--text-mid);
line-height: 1.55;
}
.muscle-detail-inner strong {
color: var(--text);
font-weight: 600;
}

/* ===================== */
/* WEIGHT TAB            */
/* ===================== */
.weight-header {
display: flex;
align-items: baseline;
justify-content: space-between;
margin-bottom: 18px;
}
.weight-left {
display: flex;
align-items: baseline;
gap: 8px;
}
.weight-chart {
width: 100%;
height: 150px;
position: relative;
}
.weight-chart canvas { width: 100%; height: 100%; }
.weight-current {
font-family: 'Space Grotesk', sans-serif;
font-size: 34px;
font-weight: 700;
letter-spacing: -1px;
color: var(--text);
}
.weight-delta {
font-family: 'Space Grotesk', sans-serif;
font-size: 14px;
}
.weight-unit {
font-size: 14px;
color: var(--text-dim);
}

/* Constraints chips */
.constraints-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 14px;
}
.constraint-chip {
padding: 5px 10px;
font-size: 13px;
font-weight: 500;
font-family: 'Space Grotesk', sans-serif;
background: var(--surface2);
color: var(--text-dim);
border: 1px solid var(--border);
border-radius: 6px;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
transition: all 0.15s ease;
user-select: none;
}
.constraint-chip:active {
transform: scale(0.96);
}
.constraint-chip.active {
color: var(--accent);
border-color: rgba(94, 234, 212, 0.4);
background: var(--accent-dim);
}
.chart-legend {
display: flex;
gap: 16px;
margin-top: 12px;
font-size: 12px;
font-family: 'Space Grotesk', sans-serif;
color: var(--text-mid);
}
.legend-dot {
display: inline-block;
width: 8px;
height: 8px;
border-radius: 50%;
margin-right: 5px;
vertical-align: middle;
}

/* Weight input form */
.btn-log-weight {
padding: 5px 12px;
font-size: 13px;
font-weight: 600;
background: var(--accent-dim);
color: var(--accent);
border: 1px solid rgba(94, 234, 212, 0.35);
border-radius: 7px;
cursor: pointer;
font-family: 'Figtree', sans-serif;
-webkit-tap-highlight-color: transparent;
transition: all 0.2s ease;
}
.btn-log-weight:active {
transform: scale(0.96);
}
/* HISTORY - HEATMAP (v1.1: no scroll) */
/* ===================== */
.heatmap-container {
margin: 0 -4px;
padding: 0 4px;
}
.heatmap-grid {
display: grid;
gap: 3px;
}
.heatmap-label {
font-size: 12px;
font-family: 'Space Grotesk', sans-serif;
color: var(--text-mid);
display: flex;
align-items: center;
padding-right: 6px;
white-space: nowrap;
position: sticky;
left: 0;
background: var(--surface);
z-index: 2;
}
.heatmap-cell {
width: 16px;
height: 16px;
border-radius: 3px;
background: var(--surface2);
cursor: pointer;
transition: opacity 0.15s ease;
}
.heatmap-cell:active {
opacity: 0.7;
}
.heatmap-day-labels {
font-size: 10px;
font-family: 'Space Grotesk', sans-serif;
color: var(--text-dim);
display: flex;
align-items: flex-end;
padding-bottom: 4px;
text-align: center;
justify-content: center;
}
.heatmap-day-detail {
max-height: 0;
overflow: hidden;
transition: max-height 0.3s ease, opacity 0.25s ease;
opacity: 0;
margin-top: 0;
}
.heatmap-day-detail.open {
opacity: 1;
margin-top: 12px;
}
.heatmap-day-detail-inner {
padding: 14px;
background: var(--surface2);
border-radius: 10px;
border: 1px solid var(--border);
font-size: 14px;
line-height: 1.6;
}
.heatmap-day-detail-inner .detail-date {
font-weight: 600;
margin-bottom: 8px;
font-size: 13px;
font-family: 'Space Grotesk', sans-serif;
color: var(--text-mid);
}
.heatmap-day-detail-inner .detail-exercise {
display: flex;
justify-content: space-between;
align-items: baseline;
padding: 4px 0;
}
.heatmap-day-detail-inner .detail-name {
font-weight: 500;
font-size: 14px;
color: var(--text);
}
.heatmap-day-detail-inner .detail-sets {
font-size: 12px;
font-family: 'Space Grotesk', sans-serif;
color: var(--accent);
flex-shrink: 0;
}

/* ===================== */
/* LOADING & ERROR       */
/* ===================== */
.loading {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 60vh;
gap: 18px;
}
.spinner {
width: 28px; height: 28px;
border: 2.5px solid var(--border);
border-top-color: var(--accent);
border-radius: 50%;
animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
font-size: 14px;
color: var(--text-dim);
font-family: 'Space Grotesk', sans-serif;
}
.error-msg {
background: var(--danger-dim);
border: 1px solid rgba(248,113,113,0.2);
border-radius: 10px;
padding: 14px;
font-size: 14px;
color: var(--danger);
margin-bottom: 14px;
line-height: 1.4;
}

/* Health Vitals */
.vitals-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-top: 14px;
}
.vital-cell {
padding: 12px;
border-radius: 10px;
border: 1px solid var(--border);
background: var(--surface2);
min-width: 0;
overflow: hidden;
}
.vital-label {
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1px;
color: var(--text-dim);
margin-bottom: 6px;
}
.vital-value {
font-family: 'Space Grotesk', sans-serif;
font-size: 22px;
font-weight: 700;
color: var(--text);
line-height: 1.2;
}
.vital-unit {
font-size: 12px;
font-weight: 400;
color: var(--text-dim);
margin-left: 2px;
}
.vital-context {
font-size: 11px;
font-family: 'Space Grotesk', sans-serif;
color: var(--text-dim);
margin-top: 4px;
}

/* Cardio Fitness Score */
.cardio-score-row {
margin-bottom: 14px;
padding-bottom: 14px;
border-bottom: 1px solid var(--border);
}
.cardio-score-header {
display: flex;
align-items: baseline;
justify-content: space-between;
margin-bottom: 10px;
}
.cardio-score-left {
display: flex;
align-items: baseline;
gap: 6px;
}
.cardio-score-value {
font-family: 'Space Grotesk', sans-serif;
font-size: 28px;
font-weight: 700;
color: var(--text);
}
.cardio-score-unit {
font-size: 12px;
color: var(--text-dim);
}
.cardio-score-label {
font-family: 'Space Grotesk', sans-serif;
font-size: 14px;
font-weight: 600;
}
.cardio-score-bar-wrap {
height: 6px;
border-radius: 3px;
background: var(--surface3);
overflow: hidden;
position: relative;
}
.cardio-score-bar {
height: 100%;
border-radius: 3px;
transition: width 0.6s ease;
}
.cardio-score-scale {
display: flex;
justify-content: space-between;
margin-top: 4px;
font-size: 10px;
font-family: 'Space Grotesk', sans-serif;
color: var(--text-dim);
}

.hidden { display: none; }
</style>

</head>
<body>
<div class="app" id="app">

  <!-- Loading Screen -->

  <div id="loading-screen" class="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Connecting to Hevy...</div>
  </div>

  <!-- Main Dashboard -->

  <div id="dashboard" class="hidden">
    <div class="header">
      <div style="display:flex;align-items:center;gap:10px;">
        <h1>LiftScript</h1>
        <div class="subtitle" id="last-updated">v1.15-slate</div>
        <div id="power-score-wrap" style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;" onclick="togglePowerScoreDetail()">
          <div id="power-score-ring"></div>
        </div>
        <button id="header-refresh-btn" onclick="refreshData()" title="Refresh data" style="background:none;border:none;cursor:pointer;padding:2px 4px;position:relative;top:1px;line-height:1;-webkit-tap-highlight-color:transparent;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:block;">
            <path d="M13.65 2.35A7.96 7.96 0 008 0C3.58 0 .01 3.58.01 8S3.58 16 8 16c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 018 14 6 6 0 012 8a6 6 0 016-6c1.66 0 3.14.69 4.22 1.78L9 7h7V0l-2.35 2.35z" fill="#8299ad"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="power-score-detail" style="display:none;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);"></div>

<div class="tabs">
  <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
  <button class="tab" data-tab="muscles" onclick="switchTab('muscles')">Muscles</button>
  <button class="tab" data-tab="history" onclick="switchTab('history')">History</button>
  <button class="tab" data-tab="weight" onclick="switchTab('weight')">Body</button>
</div>

<!-- Today Tab -->

<div id="tab-today">
  <div class="card" style="border:1px solid rgba(180,197,219,0.16);">
    <div id="today-hero"></div>
    <div id="today-chips-wrapper"></div>
    <div id="suggested-exercises"></div>
    <div id="cardio-section"></div>
  </div>
</div>

<!-- Muscles Tab -->

<div id="tab-muscles" class="hidden">
  <div class="card">
    <div class="card-title" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleSectionExplainer('muscle-grid-legend',this)">
      <span>Muscle Group Status</span>
      <span class="section-chevron" style="font-size:10px;color:var(--text-dim);transition:transform 0.3s ease;display:inline-block;">&#9662;</span>
    </div>
    <div id="muscle-grid" class="muscle-grid"></div>
    <div class="muscle-detail" id="muscle-detail">
      <div class="muscle-detail-inner" id="muscle-detail-inner"></div>
    </div>
  </div>
</div>

<!-- History Tab -->

<div id="tab-history" class="hidden">
  <div class="card" id="weekly-summary-card">
    <div class="card-title">This Week</div>
    <div id="weekly-summary"></div>
  </div>
  <div class="card">
    <div class="card-title">Training Heatmap</div>
    <div class="heatmap-container" id="heatmap-container"></div>
    <div class="heatmap-day-detail" id="heatmap-day-detail">
      <div class="heatmap-day-detail-inner" id="heatmap-day-detail-inner"></div>
    </div>
  </div>
</div>

<!-- Weight Tab -->

<div id="tab-weight" class="hidden">
  <div class="card">
    <div class="card-title">Strength Index</div>
    <div id="strength-detail" style="margin-bottom:14px;"></div>
    <div id="pr-board"></div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Weight & Trends</span>
    </div>
    <div class="weight-header">
      <div class="weight-left">
        <span class="weight-current" id="weight-current">--</span>
        <span class="weight-delta" id="weight-delta"></span>
        <span class="weight-unit">lbs</span>
      </div>
    </div>
    <div id="chart-period-chips" style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;"></div>
    <div class="weight-chart">
      <canvas id="weight-canvas"></canvas>
    </div>
    <div id="weight-chart-legend" class="chart-legend"></div>
  </div>

  <!-- Health Vitals Card -->

  <div class="card" id="health-vitals-card" style="display:none;">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Health Vitals</span>
      <span class="health-sync-time" id="health-sync-time" style="font-size:11px;font-family:'Space Grotesk',sans-serif;color:var(--text-dim);text-transform:none;letter-spacing:0;"></span>
    </div>
    <!-- Cardio Fitness Score -->
    <div class="cardio-score-row" id="cardio-score-row">
      <div class="cardio-score-header">
        <div class="cardio-score-left">
          <span class="cardio-score-value" id="cardio-score-value">--</span>
          <span class="cardio-score-unit">mL/kg/min</span>
        </div>
        <div class="cardio-score-label" id="cardio-score-label">--</div>
      </div>
      <div class="cardio-score-bar-wrap">
        <div class="cardio-score-bar" id="cardio-score-bar"></div>
      </div>
      <div class="cardio-score-scale">
        <span>Low</span><span>Fair</span><span>Good</span><span>Great</span><span>Elite</span>
      </div>
    </div>
    <!-- Vitals Grid -->
    <div class="vitals-grid" id="vitals-grid"></div>
  </div>

  <!-- Body Measurements Card (v1.7) -->

  <div class="card" id="measurements-card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Body Measurements</span>
      <div style="display:flex;gap:6px;">
        <button class="btn-log-weight" onclick="exportEmbeddableData()" style="background:rgba(142,142,152,0.12);color:#8299ad;font-size:11px;padding:4px 8px;">Export</button>
        <button class="btn-log-weight" onclick="document.getElementById('hevy-csv-input').click()" style="background:rgba(126,184,232,0.16);color:#7eb8e8;border-color:rgba(126,184,232,0.30);">Import Hevy</button>
      </div>
    </div>
    <input type="file" id="hevy-csv-input" accept=".csv" style="display:none;" onchange="importHevyCSV(this)">
    <div id="hevy-import-status" style="display:none;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;font-family:'Space Grotesk',sans-serif;"></div>
    <div id="measurements-display"></div>
    <div id="proportions-display" style="margin-top:14px;"></div>
  </div>
</div>

  </div>
</div>

<script>
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('loading-text');
  if (el) el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('loading-text');
  if (el) el.textContent = 'Promise Error: ' + (e.reason ? e.reason.message || e.reason : 'unknown');
});
</script>
<script>
// ============================================================

// Local date string helper -- avoids UTC shift from toISOString()
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// ============================================================
// 1RM ESTIMATION (Pillar 3)
// ============================================================
function estimate1RM_Brzycki(weightLbs, reps) {
  if (reps <= 0) return 0;
  if (reps === 1) return weightLbs;
  if (reps >= 37) return weightLbs;
  return weightLbs * (36 / (37 - reps));
}

function estimate1RM_Epley(weightLbs, reps) {
  if (reps <= 0) return 0;
  if (reps === 1) return weightLbs;
  return weightLbs * (1 + reps / 30);
}

function estimate1RM(weightLbs, reps) {
  if (reps <= 10) return estimate1RM_Brzycki(weightLbs, reps);
  return estimate1RM_Epley(weightLbs, reps);
}

// ============================================================
// PERCENTILE ESTIMATION
// ============================================================
function estimatePercentile(standardKey, bwMultiplier) {
  const std = STRENGTH_STANDARDS[standardKey];
  if (!std || !std.multipliers) return null;
  const m = std.multipliers;
  const pctiles = [10, 25, 50, 75, 90];

  if (bwMultiplier <= m[0]) return Math.round((bwMultiplier / m[0]) * 10);
  if (bwMultiplier >= m[4]) return Math.min(99, 90 + Math.round(((bwMultiplier - m[4]) / (m[4] * 0.2)) * 9));

  for (let i = 0; i < m.length - 1; i++) {
    if (bwMultiplier >= m[i] && bwMultiplier <= m[i + 1]) {
      const frac = (bwMultiplier - m[i]) / (m[i + 1] - m[i]);
      return Math.round(pctiles[i] + frac * (pctiles[i + 1] - pctiles[i]));
    }
  }
  return 50;
}

// ============================================================
// TIME ESTIMATION
// ============================================================
const TIME_CONSTANTS = {
  compoundSetSec: 45,
  isolationSetSec: 35,
  transitionSec: 90,
  sessionCapMin: 60,
};

function calculateExerciseTime(exerciseName, sets) {
  const db = EXERCISE_DB[exerciseName];
  const isCompound = db ? db.type === 'compound' : isLikelyCompound(exerciseName);
  const setTime = isCompound ? TIME_CONSTANTS.compoundSetSec : TIME_CONSTANTS.isolationSetSec;
  const restSec = getRestSeconds(exerciseName);
  return (sets * setTime) + ((sets - 1) * restSec) + TIME_CONSTANTS.transitionSec;
}

// Consistent working-set extraction used everywhere
function getWorkingSets(exercise) {
  return (exercise.sets || []).filter(s =>
    s.set_type === 'normal' || !s.set_type
  );
}

// Normalize exercise name for caching/matching
function normalizeExerciseName(name) {
  return (name || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[\u2018\u2019\u2032]/g, "'");
}

// Format set counts: show decimals only when fractional
function formatSets(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

// Classification cache keyed by template_id or normalized name
const _classifyCache = new Map();

function classifyExerciseCached(exercise) {
  const key = exercise.exercise_template_id || normalizeExerciseName(exercise.title || '');
  if (_classifyCache.has(key)) return _classifyCache.get(key);
  const result = classifyExercise(exercise.title || '');
  _classifyCache.set(key, result);
  return result;
}

const CARDIO_PATTERNS = [
  /treadmill/i, /elliptical/i, /\bbike\b/i, /cycling/i, /rowing machine/i,
  /jump rope/i, /jumping jack/i, /burpee/i, /stair/i, /running/i, /walking/i,
];

function classifyExercise(name) {
  for (const c of CARDIO_PATTERNS) {
    if (c.test(name)) return { primary: 'cardio', secondary: [] };
  }
  for (const m of EXERCISE_MUSCLE_MAP) {
    if (m.pattern.test(name)) return { primary: m.primary, secondary: m.secondary };
  }
  return { primary: 'other', secondary: [] };
}

// Build the dynamic exercise pool from all known sources
// Tier 1 (instant): EXERCISE_DB + workout history
// Tier 2 (background): Hevy template library (added by fetchAllHevyTemplateIds)
function buildDynamicExercisePool() {
  const pool = {};
  const muscleKeys = Object.keys(MUSCLE_GROUPS);
  for (const key of muscleKeys) pool[key] = new Set();

  // Source 1: All exercises in EXERCISE_DB (always available)
  for (const name in EXERCISE_DB) {
    const db = EXERCISE_DB[name];
    if (db.muscle && pool[db.muscle]) pool[db.muscle].add(name);
  }

  // Source 2: All exercises from workout history (classify by name)
  for (const name in exerciseHistory) {
    const cls = classifyExercise(name);
    if (cls.primary !== 'cardio' && cls.primary !== 'other' && pool[cls.primary]) {
      pool[cls.primary].add(name);
    }
  }

  _dynamicExercisePool = pool;
  return pool;
}

// Add exercises from Hevy templates into the dynamic pool
// Only adds exercises we can classify to a known muscle group
function addHevyTemplatesToPool() {
  var added = 0;
  for (const name in _templateIdMap) {
    // Skip if already in pool
    var alreadyInPool = false;
    for (var key in _dynamicExercisePool) {
      if (_dynamicExercisePool[key].has(name)) { alreadyInPool = true; break; }
    }
    if (alreadyInPool) continue;

    var cls = classifyExercise(name);
    if (cls.primary !== 'cardio' && cls.primary !== 'other' && _dynamicExercisePool[cls.primary]) {
      _dynamicExercisePool[cls.primary].add(name);
      added++;
    }
  }
  if (added > 0) console.log('Added ' + added + ' exercises from Hevy templates to dynamic pool');
}

// Rank exercises within a muscle group using history data
// Returns the same exercise names but reordered by composite score
function rankExercisesForMuscle(muscleKey) {
  let pool = _dynamicExercisePool[muscleKey]
    ? Array.from(_dynamicExercisePool[muscleKey])
    : (MUSCLE_EXERCISE_PICKS[muscleKey] || []);

  if (pool.length === 0) return pool;

  if (pool.length <= 1) return pool;

  const now = new Date();
  const todayStr = localDateStr(now);
  const scored = [];

  for (const exName of pool) {
    const hist = exerciseHistory[exName];
    const db = EXERCISE_DB[exName];
    let score = 1.0;

    // 1. Recency: days since last performed (more days = higher score)
    // Cap at 21 days to avoid infinite growth for never-done exercises
    let daysSince = 14; // default if never done
    if (hist && hist.lastDate) {
      const last = new Date(hist.lastDate + 'T12:00:00');
      daysSince = Math.max(0, Math.round((now - last) / (1000 * 60 * 60 * 24)));
    }
    const recencyScore = Math.min(daysSince / 14, 1.5);
    score += recencyScore * 0.4;

    // 2. Variety: fewer appearances in last 30d = higher score
    let count30d = 0;
    if (hist && hist.dates) {
      const cutoff = new Date(now);
      cutoff.setDate(cutoff.getDate() - 30);
      const cutoffStr = localDateStr(cutoff);
      for (const d of hist.dates) {
        if (d >= cutoffStr) count30d++;
      }
    }
    const varietyScore = Math.max(0, 1 - (count30d / 8));
    score += varietyScore * 0.25;

    // 3. Compound anchor bonus: primary compound gets permanent boost
    if (COMPOUND_ANCHORS[muscleKey] === exName) {
      score += 0.6;
    }

    // 4. Deficit bonus: if current weight is well below benchmark
    if (db && db.benchmarkLbs > 0 && hist && hist.lastWeightLbs > 0) {
      if (hist.lastWeightLbs / db.benchmarkLbs < 0.85) {
        score += 0.2;
      }
    }

    scored.push({ name: exName, score });
  }

  scored.sort((a, b) => b.score - a.score);
  return scored.map(s => s.name);
}

const Storage = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn(`Storage.get('${key}') failed:`, e.message);
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.warn(`Storage.set('${key}') failed:`, e.message);
      return false;
    }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch (e) { /* silent */ }
  }
};

function getStoredMeasurements() {
  const stored = Storage.get(MEASUREMENTS_KEY, []);
  // Merge: embedded baseline first, then localStorage overwrites by date
  const all = [...MEASUREMENTS_BASELINE, ...stored];
  const byDate = {};
  for (const entry of all) {
    if (!entry.date) continue;
    byDate[entry.date] = byDate[entry.date]
      ? Object.assign({}, byDate[entry.date], entry)
      : { ...entry };
  }
  return Object.values(byDate).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

function saveMeasurementEntry(entry) {
  if (!entry.date) entry.date = localDateStr(new Date());
  // Read/write ONLY the localStorage delta list -- never copy baseline into storage.
  // Baseline lives in MEASUREMENTS_BASELINE and is merged at read/render time.
  const deltas = Storage.get(MEASUREMENTS_KEY, []);
  const idx = deltas.findIndex(e => e.date === entry.date);
  if (idx !== -1) {
    // Merge: new fields overwrite, keep old fields not in new entry
    deltas[idx] = Object.assign({}, deltas[idx], entry);
  } else {
    deltas.push(entry);
  }
  deltas.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (deltas.length > 400) deltas.splice(0, deltas.length - 400);
  Storage.set(MEASUREMENTS_KEY, deltas);
}

function getLatestMeasurements() {
  const entries = getStoredMeasurements();
  if (entries.length === 0 && !(healthData && healthData.waist_circumference_in)) return null;
  // Merge all entries -- latest value per field wins
  const latest = {};
  const dates = {};
  // Sort chronologically so later entries overwrite
  const sorted = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  for (const entry of sorted) {
    for (const field of MEASUREMENT_FIELDS) {
      if (entry[field.key] != null && entry[field.key] !== '' && !isNaN(entry[field.key])) {
        latest[field.key] = parseFloat(entry[field.key]);
        dates[field.key] = entry.date;
      }
    }
  }
  // Merge Apple Health waist if we don't have a manual entry or Apple is newer
  if (healthData && healthData.waist_circumference_in > 0) {
    const ahDate = healthData.waist_date || '';
    if (!latest.waist_in || (ahDate && ahDate > (dates.waist_in || ''))) {
      latest.waist_in = healthData.waist_circumference_in;
      dates.waist_in = ahDate;
    }
  }
  if (Object.keys(latest).length === 0) return null;
  latest._dates = dates;
  return latest;
}

// ---- Phase 3: Compute proportion deficit scores ----
function computeProportionDeficits(measurements) {
  if (!measurements) return {};
  const deficits = {};

  for (const [fieldKey, ft] of Object.entries(FRAME_TARGETS)) {
    if (!ft.target || !ft.muscle) continue;
    const current = measurements[fieldKey];
    if (current == null || current <= 0) continue;

    if (ft.inverted) {
      deficits[ft.muscle] = Math.max(0, (current / ft.target) - 1);
    } else {
      deficits[ft.muscle] = Math.max(0, 1 - (current / ft.target));
    }
  }
  return deficits;
}

  { key: 'strictness', label: v => v.charAt(0).toUpperCase() + v.slice(1), values: ['loose', 'balanced', 'strict'] },
];

function renderConstraintChips() {
  const row = document.getElementById('constraints-row');
  if (!row) return;
  row.innerHTML = CHIP_DEFS.map(def => {
    const current = sessionPrefs[def.key];
    const isNonDefault = current !== PREFS_DEFAULTS[def.key];
    const chipStyle = isNonDefault
      ? `background:${C.accentDim};color:${C.accent};border:1px solid ${C.accentBorder};padding:5px 10px;font-size:12px;font-weight:500;font-family:Space Grotesk,sans-serif;border-radius:6px;cursor:pointer;user-select:none;`
      : `background:${C.surface2};color:${C.textDim};border:1px solid ${C.border};padding:5px 10px;font-size:12px;font-weight:500;font-family:Space Grotesk,sans-serif;border-radius:6px;cursor:pointer;user-select:none;`;
    return `<div class="constraint-chip${isNonDefault ? ' active' : ''}" style="${chipStyle}" data-key="${def.key}" onclick="cycleChip('${def.key}')">${def.label(current)} <span style="opacity:0.35;font-size:9px;margin-left:1px;">\u21BB</span></div>`;
  }).join('');
}

function cycleChip(key) {
  const def = CHIP_DEFS.find(d => d.key === key);
  if (!def) return;
  const current = sessionPrefs[key];
  const idx = def.values.indexOf(current);
  const next = def.values[(idx + 1) % def.values.length];
  sessionPrefs[key] = next;
  savePrefs(sessionPrefs);
  // Preserve chips-open state across re-render
  const wrapper = document.getElementById('today-chips-wrapper');
  const wasOpen = wrapper?.dataset.open === 'true';
  if (LAST_RECS) renderTimedSession(LAST_RECS);
  const newWrapper = document.getElementById('today-chips-wrapper');
  if (newWrapper && wasOpen) {
    newWrapper.dataset.open = 'true';
    const row = document.getElementById('today-chips-row');
    if (row) row.style.display = 'flex';
  }
  if (workoutCache) renderCardioPlan(heatmapDayCardio);
}

// ============================================================
// API + CACHING (v1.1 Task 7)
// ============================================================
const API_BASE = 'https://api.hevyapp.com/v1';
const FETCH_TIMEOUT_MS = 15000;
function fetchWithTimeout(url, options, timeoutMs) {
  timeoutMs = timeoutMs || FETCH_TIMEOUT_MS;
  return Promise.race([
    fetch(url, options),
    new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('Network timeout after ' + (timeoutMs / 1000) + 's')); }, timeoutMs);
    })
  ]);
}
const CACHE_KEY = 'workoutCache_v1';
const CACHE_STALE_MS = 8 * 60 * 60 * 1000; // 8 hours

function getCachedWorkouts() {
  const parsed = Storage.get(CACHE_KEY, null);
  if (!parsed || !parsed.ts || !parsed.data) return null;
  return parsed;
}

function setCachedWorkouts(workouts) {
  Storage.set(CACHE_KEY, { ts: Date.now(), data: workouts });
}

function isCacheStale(cached) {
  return !cached || (Date.now() - cached.ts) > CACHE_STALE_MS;
}

async function fetchWorkouts(pageSize = 10, maxPages = 16) {
  const allWorkouts = [];
  let page = 1;
  let totalPages = 1;
  const HARD_CAP = 155; // ~6 months at 6 days/week

  while (page <= totalPages && page <= maxPages && allWorkouts.length < HARD_CAP) {
    updateLoading(`Loading workouts (${allWorkouts.length})...`);
    const resp = await fetchWithTimeout(`${API_BASE}/workouts?page=${page}&pageSize=${pageSize}`, {
      headers: { 'api-key': apiKey },
      mode: 'cors'
    });
    if (!resp.ok) {
      let body = '';
      try { body = await resp.text(); } catch (_) {}
      throw new Error(`API error ${resp.status}: ${body || resp.statusText}`);
    }
    const data = await resp.json();
    totalPages = data.page_count || 1;
    if (data.workouts) allWorkouts.push(...data.workouts);
    page++;
  }
  return allWorkouts;
}

// ============================================================
// STRENGTH INDEX LIFT DEFINITIONS
// ============================================================
// p50 = 50th percentile BW multiplier for general gym-going male population
// Derived from STRENGTH_STANDARDS (competition 25th ~ gym 50th)
// Age-adjusted dynamically via PROFILE.age
const STRENGTH_INDEX_LIFTS = {
  bench:    { weight: 0.20, p50: 0.95, patterns: [/bench press.*barbell/i, /^bench press$/i] },
  squat:    { weight: 0.25, p50: 1.20, patterns: [/squat.*barbell/i, /^squat$/i, /barbell.*squat/i] },
  deadlift: { weight: 0.30, p50: 1.45, patterns: [/^deadlift/i, /deadlift.*barbell/i] },
  ohp:      { weight: 0.10, p50: 0.55, patterns: [/overhead press/i, /shoulder press/i, /military press/i] },
  row:      { weight: 0.15, p50: 0.70, patterns: [/barbell row/i, /bent over row/i, /pendlay row/i, /seated row/i, /cable row/i, /dumbbell row/i] },
};

// ============================================================
// UNIFIED PREPROCESS PIPELINE (v1.1 Task 6)
// Single pass over workouts producing all downstream data
// ============================================================
function preprocessWorkouts(workouts, bodyweightLbs, weightData) {
  const now = new Date();
  const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const sixMonthsAgo = new Date(now.getTime() - 183 * 24 * 60 * 60 * 1000);

  // Sort oldest -> newest for history building
  const sorted = [...workouts].sort((a, b) =>
    new Date(a.start_time || a.created_at) - new Date(b.start_time || b.created_at)
  );

  // ---- Output structures ----
  const exHistory = {};
  const templateIdMap = {};
  const muscleStats = {};
  const muscle1RMInputs = {}; // { muscleKey: { best1RM, exercise } }
  const siRolling1RMs = { bench: 0, squat: 0, deadlift: 0, ohp: 0, row: 0 };
  const siRollingSrc = { bench: null, squat: null, deadlift: null, ohp: null, row: null };
  const siTimeline = [];
  const heatmapDayMuscle = {};
  const heatmapDayWorkouts = {};
  const heatmapDayCardio = {}; // dateStr -> { minutes, sessions: [{ name, minutes, source }] }

  // Init muscle stats
  for (const [key, meta] of Object.entries(MUSCLE_GROUPS)) {
    muscleStats[key] = {
      key, name: meta.name, color: meta.color,
      idealFreqDays: meta.idealFreqDays, idealSetsPerWeek: meta.idealSetsPerWeek,
      lastTrainedPrimary: null, daysSincePrimary: Infinity,
      lastTrainedAny: null, daysSinceAny: Infinity,
      totalSets30d: 0, totalVolume30d: 0, sessionCount30d: 0, exercises: new Set(),
    };
    muscle1RMInputs[key] = { best1RM: 0, exercise: '' };
  }

  // Weight data sorted for SI interpolation
  const weightSorted = [...weightData].sort((a, b) => a.date.localeCompare(b.date));
  function getBodyweightAt(dateStr) {
    let bw = bodyweightLbs;
    for (const w of weightSorted) {
      if (w.date <= dateStr) bw = w.value;
      else break;
    }
    return bw;
  }

  // ---- Single pass ----
  for (const w of sorted) {
    const wDate = new Date(w.start_time || w.created_at);
    const dateStr = localDateStr(wDate);
    const isRecent = wDate >= thirtyDaysAgo;
    const isWithin6m = wDate >= sixMonthsAgo;
    const musclesThisWorkout = new Set();
    let siUpdated = false;

    if (!heatmapDayMuscle[dateStr]) heatmapDayMuscle[dateStr] = {};
    if (!heatmapDayWorkouts[dateStr]) heatmapDayWorkouts[dateStr] = [];

    for (const ex of (w.exercises || [])) {
      const name = ex.title || '';
      if (!name) continue;

      const classification = classifyExerciseCached(ex);
      const workingSets = getWorkingSets(ex);

      // --- Exercise history ---
      if (workingSets.length > 0) {
        let bestWeight = 0, bestReps = 0;
        for (const s of workingSets) {
          const wLbs = Math.round((s.weight_kg || 0) * 2.20462);
          if (wLbs > bestWeight) { bestWeight = wLbs; bestReps = s.reps || 0; }
        }
        if (!exHistory[name]) exHistory[name] = { weights: [], dates: [] };
        exHistory[name].lastWeightLbs = bestWeight;
        exHistory[name].lastReps = bestReps;
        exHistory[name].lastDate = wDate;
        exHistory[name].lastSets = workingSets.length;
        exHistory[name].weights.push(bestWeight);
        exHistory[name].dates.push(wDate);
        // Capture Hevy exercise_template_id for Send to Hevy
        if (ex.exercise_template_id && !templateIdMap[name]) {
          templateIdMap[name] = ex.exercise_template_id;
        }
      }

      if (classification.primary === 'cardio') {
        // Accumulate cardio minutes for heatmap row
        let cardioMin = 0;
        for (const s of (ex.sets || [])) {
          if (s.duration_seconds && s.duration_seconds > 0) {
            cardioMin += s.duration_seconds / 60;
          }
        }
        // Conservative default: if cardio exercise exists but has no duration data, assume 15 min
        if (cardioMin === 0 && (ex.sets || []).length > 0) cardioMin = 15;
        if (cardioMin > 0) {
          if (!heatmapDayCardio[dateStr]) heatmapDayCardio[dateStr] = { minutes: 0, sessions: [] };
          heatmapDayCardio[dateStr].minutes += cardioMin;
          heatmapDayCardio[dateStr].sessions.push({ name, minutes: Math.round(cardioMin), source: 'hevy', timestamp: wDate.getTime() });
        }
      }

      if (classification.primary === 'cardio' || classification.primary === 'other') continue;

      const setCount = workingSets.length;
      const allMuscles = [classification.primary, ...classification.secondary];

      // --- Muscle stats (30d) ---
      for (const muscle of allMuscles) {
        if (!muscleStats[muscle]) continue;
        const stat = muscleStats[muscle];
        const isPrimary = muscle === classification.primary;

        // Track recency: primary vs any (secondary) separately
        // This prevents secondary stimulus (e.g. RDLs for back) from
        // resetting the "last trained" clock on back, which would
        // incorrectly suppress back recommendations.
        if (!stat.lastTrainedAny || wDate > stat.lastTrainedAny) {
          stat.lastTrainedAny = wDate;
          stat.daysSinceAny = Math.floor((now - wDate) / (1000 * 60 * 60 * 24));
        }
        if (isPrimary && (!stat.lastTrainedPrimary || wDate > stat.lastTrainedPrimary)) {
          stat.lastTrainedPrimary = wDate;
          stat.daysSincePrimary = Math.floor((now - wDate) / (1000 * 60 * 60 * 24));
        }

        if (isRecent) {
          const weight = isPrimary ? 1.0 : 0.5;
          stat.totalSets30d += setCount * weight;
          for (const s of workingSets) {
            stat.totalVolume30d += (s.reps || 0) * (s.weight_kg || 0) * weight;
          }
          stat.exercises.add(name);
          musclesThisWorkout.add(muscle);
        }
      }

      // --- Heatmap data ---
      for (const muscle of allMuscles) {
        if (!MUSCLE_GROUPS[muscle]) continue;
        const isPrimary = muscle === classification.primary;
        const weight = isPrimary ? 1.0 : 0.5;
        heatmapDayMuscle[dateStr][muscle] = (heatmapDayMuscle[dateStr][muscle] || 0) + setCount * weight;
      }

      // Heatmap detail
      const bestSet = workingSets.reduce((best, s) => {
        const wLbs = Math.round((s.weight_kg || 0) * 2.20462);
        return wLbs > (best.w || 0) ? { w: wLbs, r: s.reps || 0 } : best;
      }, {});
      heatmapDayWorkouts[dateStr].push({
        name, sets: setCount,
        bestWeight: bestSet.w || 0, bestReps: bestSet.r || 0,
      });

      // --- Muscle 1RM (last 30d) ---
      if (isRecent) {
        for (const [muscleKey, keyLift] of Object.entries(MUSCLE_KEY_LIFTS)) {
          const matched = keyLift.patterns.some(p => p.test(name));
          if (!matched) continue;
          for (const s of workingSets) {
            const wLbs = (s.weight_kg || 0) * 2.20462;
            const reps = s.reps || 0;
            if (wLbs <= 0 || reps <= 0) continue;
            const est = estimate1RM(wLbs, reps);
            if (est > muscle1RMInputs[muscleKey].best1RM) {
              muscle1RMInputs[muscleKey].best1RM = est;
              muscle1RMInputs[muscleKey].exercise = name;
            }
          }
        }
      }

      // --- Strength index timeline (6-month rolling window) ---
      if (isWithin6m) {
        for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
          const matched = liftDef.patterns.some(p => p.test(name));
          if (!matched) continue;
          for (const s of workingSets) {
            const wLbs = (s.weight_kg || 0) * 2.20462;
            const reps = s.reps || 0;
            if (wLbs <= 0 || reps <= 0) continue;
            const est = estimate1RM(wLbs, reps);
            if (est > siRolling1RMs[liftKey]) {
              siRolling1RMs[liftKey] = est;
              siRollingSrc[liftKey] = { ex: name, wt: Math.round(wLbs), reps: reps, date: dateStr };
              siUpdated = true;
            }
          }
        }
      }
    }

    // Session count
    if (isRecent) {
      for (const m of musclesThisWorkout) {
        if (muscleStats[m]) muscleStats[m].sessionCount30d++;
      }
    }

    // Strength Score data point (normalized: 1.0 = 50th percentile gym-goer for user's age)
    const hasData = Object.values(siRolling1RMs).some(v => v > 0);
    if (hasData) {
      const bw = getBodyweightAt(dateStr);
      const lifts = {};
      let totalWeight = 0;

      // First pass: identify which lifts have data and sum their weights
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        if (siRolling1RMs[liftKey] > 0) totalWeight += liftDef.weight;
      }

      // Second pass: compute normalized score with re-weighted lifts
      let index = 0;
      for (const [liftKey, liftDef] of Object.entries(STRENGTH_INDEX_LIFTS)) {
        const mult = bw > 0 ? siRolling1RMs[liftKey] / bw : 0;
        const normalized = liftDef.p50 > 0 ? mult / liftDef.p50 : 0;
        const adjustedWeight = totalWeight > 0 ? liftDef.weight / totalWeight : 0;
        if (siRolling1RMs[liftKey] > 0) {
          index += normalized * adjustedWeight;
        }
        lifts[liftKey] = { rm: Math.round(siRolling1RMs[liftKey]), mult: Math.round(mult * 100) / 100, src: siRollingSrc[liftKey] };
      }
      siTimeline.push({ date: dateStr, index: Math.round(index * 100) / 100, lifts: { ...lifts } });
    }
  }

  // Finalize muscle 1RMs with percentiles
  const muscle1RMResults = {};
  for (const [key, data] of Object.entries(muscle1RMInputs)) {
    const keyLift = MUSCLE_KEY_LIFTS[key];
    const bwMult = bodyweightLbs > 0 ? data.best1RM / bodyweightLbs : 0;
    const percentile = estimatePercentile(keyLift.standard, bwMult);
    muscle1RMResults[key] = {
      best1RM: Math.round(data.best1RM),
      bwMult: Math.round(bwMult * 100) / 100,
      percentile, exercise: data.exercise,
    };
  }

  // Merge Apple Watch cardio into heatmap (dedup against Hevy within 30 min)
  const WATCH_NON_CARDIO_HM = /strength|weight\s*train|yoga|pilates|stretch|cool\s*down|flexibility|mind.*body|tai\s*chi/i;
  const WALK_PATTERN = /walk|hiking|hike/i;
  // Walk HR gate: use global walking HR average from Apple Health.
  // If avg walking HR is below Zone 2 floor, walks aren't intense enough
  // to count as moderate-intensity cardio for the 150 min/week target.
  var walkHRPassesGate = false;
  if (healthData) {
    var _rhr = healthData.resting_heart_rate || 0;
    var _hrMax = 220 - PROFILE.age;
    var z2Floor = _rhr > 0 ? Math.round(_rhr + (_hrMax - _rhr) * 0.55) : Math.round(_hrMax * 0.55);
    var globalWalkHR = parseFloat(healthData.walking_heart_rate_avg) || 0;
    walkHRPassesGate = globalWalkHR >= z2Floor;
  }
  if (healthData && Array.isArray(healthData.workouts)) {
    // Collect actual Hevy cardio timestamps for accurate dedup
    const hevyCardioTs = [];
    for (const [, cd] of Object.entries(heatmapDayCardio)) {
      for (const sess of cd.sessions) {
        if (sess.source === 'hevy' && sess.timestamp) {
          hevyCardioTs.push(sess.timestamp);
        }
      }
    }
    for (const aw of healthData.workouts) {
      if (WATCH_NON_CARDIO_HM.test(aw.type || '')) continue;

      // Walk HR gate: indoor walks always count (intentional treadmill
      // cardio, typically with incline). Outdoor walks only count if
      // global walking HR avg reaches Zone 2 -- otherwise they're
      // casual walks already captured by step tracking in vitals.
      if (WALK_PATTERN.test(aw.type || '')) {
        var isIndoor = /indoor/i.test(aw.type || '');
        if (!isIndoor && !walkHRPassesGate) continue;
      }

      const startStr = (aw.start || '').replace(/\s+at\s+/i, ' ');
      const awDate = new Date(startStr);
      if (isNaN(awDate.getTime())) continue;
      const dur = parseFloat(aw.duration_min) || 0;
      if (dur <= 0) continue;
      const dateStr = localDateStr(awDate);
      // Dedup: skip if Hevy cardio on same day within 30 min
      const DEDUP_MS = 30 * 60 * 1000;
      const isDup = hevyCardioTs.some(ts => Math.abs(ts - awDate.getTime()) < DEDUP_MS);
      if (isDup) continue;
      if (!heatmapDayCardio[dateStr]) heatmapDayCardio[dateStr] = { minutes: 0, sessions: [] };
      heatmapDayCardio[dateStr].minutes += dur;
      heatmapDayCardio[dateStr].sessions.push({ name: aw.type || 'Cardio', minutes: Math.round(dur), source: 'watch', timestamp: awDate.getTime() });
    }
  }

  // ---- Cardio Fitness timeline (vitals-only, no activity) ----
  // Signals: VO2 Max 50%, RHR 30% (inverted), Recovery 20%
  const csTimeline = [];
  // ---- Dedication timeline (effort + consistency, rolling 7d) ----
  const dedTimeline = [];

  const cardioDates = Object.keys(heatmapDayCardio).sort();
  const allActivityDates = new Set([
    ...Object.keys(heatmapDayWorkouts),
    ...cardioDates,
  ]);
  const allDatesArr = [...allActivityDates].sort();

  // Build vitals interpolation from quarterly snapshots (12m, 6m, 3m, current)
  function buildVitalTimeline(v12m, v6m, v3m, vNow) {
    const now = new Date();
    const points = [];
    const addPoint = (monthsAgo, val) => {
      if (val && val > 0) {
        const d = new Date(now);
        d.setMonth(d.getMonth() - monthsAgo);
        points.push({ date: localDateStr(d), value: val });
      }
    };
    addPoint(12, v12m);
    addPoint(6, v6m);
    addPoint(3, v3m);
    addPoint(0, vNow);
    return points.sort((a, b) => a.date.localeCompare(b.date));
  }

  function interpolateVital(timeline, dateStr) {
    if (!timeline || timeline.length === 0) return null;
    if (timeline.length === 1) return timeline[0].value;
    if (dateStr <= timeline[0].date) return timeline[0].value;
    if (dateStr >= timeline[timeline.length - 1].date) return timeline[timeline.length - 1].value;
    for (let i = 0; i < timeline.length - 1; i++) {
      if (dateStr >= timeline[i].date && dateStr <= timeline[i + 1].date) {
        const t0 = new Date(timeline[i].date).getTime();
        const t1 = new Date(timeline[i + 1].date).getTime();
        const t = new Date(dateStr).getTime();
        const frac = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
        return timeline[i].value + frac * (timeline[i + 1].value - timeline[i].value);
      }
    }
    return timeline[timeline.length - 1].value;
  }

  const rhrTimeline = healthData ? buildVitalTimeline(
    healthData.rhr_12m, healthData.rhr_6m, healthData.rhr_3m,
    healthData.resting_heart_rate
  ) : [];
  const vo2Timeline = healthData ? buildVitalTimeline(
    healthData.vo2_12m, healthData.vo2_6m, healthData.vo2_3m,
    healthData.cardio_fitness
  ) : [];
  const recTimeline = healthData ? buildVitalTimeline(
    healthData.rec_12m, healthData.rec_6m, healthData.rec_3m,
    healthData.cardio_recovery
  ) : [];

  // Count total unique muscle groups in MUSCLE_GROUPS
  const totalMuscleGroups = Object.keys(MUSCLE_GROUPS).length;

  for (const dateStr of allDatesArr) {
    const d = new Date(dateStr + 'T12:00:00');

    // ==== CARDIO FITNESS (vitals only) ====
    const vo2Val = interpolateVital(vo2Timeline, dateStr);
    let vo2Signal = null;
    if (vo2Val && vo2Val > 0) {
      const pctile = estimateVO2Percentile(vo2Val, PROFILE.age);
      vo2Signal = Math.min(pctile / 50, 2.0);
    }
    const rhrVal = interpolateVital(rhrTimeline, dateStr);
    let rhrSignal = null;
    if (rhrVal && rhrVal > 0) {
      rhrSignal = Math.max(0.5, Math.min(1.5, 60 / rhrVal));
    }
    const recVal = interpolateVital(recTimeline, dateStr);
    let recSignal = null;
    if (recVal && recVal > 0) {
      recSignal = Math.min(recVal / 20, 2.0);
    }

    // Vitals-only composite (reweight for available signals)
    let csTotalW = 0, csWSum = 0;
    if (vo2Signal !== null) { csWSum += vo2Signal * 50; csTotalW += 50; }
    if (rhrSignal !== null) { csWSum += rhrSignal * 30; csTotalW += 30; }
    if (recSignal !== null) { csWSum += recSignal * 20; csTotalW += 20; }
    if (csTotalW > 0) {
      csTimeline.push({
        date: dateStr,
        score: Math.round((csWSum / csTotalW) * 100) / 100,
        signals: {
          vo2: vo2Signal !== null ? Math.round(vo2Signal * 100) / 100 : null,
          rhr: rhrSignal !== null ? Math.round(rhrSignal * 100) / 100 : null,
          recovery: recSignal !== null ? Math.round(recSignal * 100) / 100 : null,
        },
      });
    }

    // ==== DEDICATION (effort + recovery, rolling 7d) ====
    let weekLiftDays = 0;
    let weekCardioMin = 0;
    const weekMusclesHit = new Set();
    // Track consecutive lift days ending on this date for fatigue penalty
    let consecLift = 0;
    for (let i = 0; i < 7; i++) {
      const lb = new Date(d);
      lb.setDate(lb.getDate() - i);
      const lbStr = localDateStr(lb);
      if (heatmapDayWorkouts[lbStr]) {
        weekLiftDays++;
        const dayMuscles = heatmapDayMuscle[lbStr];
        if (dayMuscles) {
          for (const m of Object.keys(dayMuscles)) weekMusclesHit.add(m);
        }
        // Count consecutive days from most recent date backward
        if (i === consecLift) consecLift++;
      }
      if (heatmapDayCardio[lbStr]) weekCardioMin += heatmapDayCardio[lbStr].minutes;
    }

    // Lifting: peaks at 4-5 days (1.0), declines at 6+ (overtraining)
    // 0->0, 1->0.25, 2->0.5, 3->0.75, 4->1.0, 5->1.0, 6->0.85, 7->0.7
    let liftScore;
    if (weekLiftDays <= 5) liftScore = Math.min(weekLiftDays / 4, 1.0);
    else liftScore = 1.0 - ((weekLiftDays - 5) * 0.15);

    // Consecutive day fatigue penalty: 5+ straight days hurts recovery
    // 5 consecutive -> -0.08, 6 -> -0.15, 7 -> -0.22
    const fatiguePenalty = consecLift >= 5 ? (consecLift - 4) * 0.07 : 0;

    // Muscle coverage: all 12 groups in 7d = 1.0
    const coverageScore = weekMusclesHit.size / totalMuscleGroups;
    // Cardio: 150min/week target = 1.0, diminishing returns cap at 1.3
    const cardioMinScore = Math.min(weekCardioMin / 150, 1.3);

    // Weighted: lifting 40%, coverage 20%, cardio 30%, consistency bonus 10%
    // Consistency bonus: rewards balanced weeks (both lifting and cardio on target)
    const consistencyBonus = (weekLiftDays >= 3 && weekCardioMin >= 100) ? 1.0 : (weekLiftDays >= 2 || weekCardioMin >= 50) ? 0.5 : 0;
    const dedRaw = (liftScore * 0.40) + (coverageScore * 0.20) + (cardioMinScore * 0.30) + (consistencyBonus * 0.10);
    const dedScore = Math.max(0, dedRaw - fatiguePenalty);
    dedTimeline.push({
      date: dateStr,
      score: Math.round(dedScore * 100) / 100,
      liftDays: weekLiftDays,
      cardioMin: Math.round(weekCardioMin),
      musclesCovered: weekMusclesHit.size,
    });
  }

  return {
    exerciseHistory: exHistory,
    templateIdMap,
    muscleStats,
    muscle1RMs: muscle1RMResults,
    strengthIndexTimeline: siTimeline,
    cardioScoreTimeline: csTimeline,
    dedicationTimeline: dedTimeline,
    heatmapDayMuscle,
    heatmapDayWorkouts,
    heatmapDayCardio,
  };
}

// ============================================================
// CARDIOVASCULAR TRAINING ENGINE (Pillar 5)
// ============================================================
// SCIENTIFIC FOUNDATION
// Source 1: ACSM (2018) "Guidelines for Exercise Testing & Prescription" (11th ed)
//   - 150 min/week moderate OR 75 min/week vigorous, or equivalent combination
// Source 2: Seiler (2010) "What is Best Practice for Training Intensity and Duration
//   Distribution in Endurance Athletes?" - polarized 80/20 model
// Source 3: Tanaka et al. (2001) "Age-predicted maximal heart rate revisited"
//   - HRmax = 208 - 0.7 x age (more accurate than 220-age)
// Source 4: Karvonen (1957) "Heart Rate Reserve" method for HR zones
//   - Target HR = ((HRmax - HRrest) x %intensity) + HRrest
// Source 5: Stoggl & Sperlich (2014) "Polarized training has greater impact on key
//   endurance variables than threshold, high-intensity, or high-volume training"

// HR Zone calculations
function calculateHRZones(age, restingHR) {
  // Tanaka formula (Source 3)
  const hrMax = Math.round(208 - 0.7 * age);

  if (restingHR && restingHR > 0) {
    // Karvonen method (Source 4) - more personalized
    const hrr = hrMax - restingHR;
    return {
      hrMax,
      method: 'karvonen',
      zone1: { low: Math.round(restingHR + hrr * 0.50), high: Math.round(restingHR + hrr * 0.60), label: 'Recovery' },
      zone2: { low: Math.round(restingHR + hrr * 0.60), high: Math.round(restingHR + hrr * 0.70), label: 'Aerobic Base' },
      zone3: { low: Math.round(restingHR + hrr * 0.70), high: Math.round(restingHR + hrr * 0.80), label: 'Tempo' },
      zone4: { low: Math.round(restingHR + hrr * 0.80), high: Math.round(restingHR + hrr * 0.90), label: 'Threshold' },
      zone5: { low: Math.round(restingHR + hrr * 0.90), high: hrMax, label: 'VO2max' },
    };
  }

  // Fallback: straight %HRmax
  return {
    hrMax,
    method: 'hrmax',
    zone1: { low: Math.round(hrMax * 0.50), high: Math.round(hrMax * 0.60), label: 'Recovery' },
    zone2: { low: Math.round(hrMax * 0.60), high: Math.round(hrMax * 0.70), label: 'Aerobic Base' },
    zone3: { low: Math.round(hrMax * 0.70), high: Math.round(hrMax * 0.80), label: 'Tempo' },
    zone4: { low: Math.round(hrMax * 0.80), high: Math.round(hrMax * 0.90), label: 'Threshold' },
    zone5: { low: Math.round(hrMax * 0.90), high: hrMax, label: 'VO2max' },
  };
}

// Weekly targets (Source 1: ACSM + Source 2: Seiler polarized model)
const CARDIO_WEEKLY_TARGETS = {

  zone2Pct: 0.80,         // Polarized: 80% easy
  hiitPct: 0.20,          // Polarized: 20% hard
  zone2MinPerWeek: 120,   // 80% of 150 = 120 min
  hiitMinPerWeek: 30,     // 20% of 150 = 30 min (at vigorous = 60 min moderate-equivalent)
  sessionsPerWeek: 3,     // 2 easy + 1 hard
};

// Analyze cardio from workout history (last 7 days)
// Apple Watch workout types that count as cardio
// Only workouts explicitly started via the Watch Workouts app are included
// in health-data.json (the Shortcut filters source = Apple Watch).
// Keys are lowercase; matching uses exact then fuzzy fallback.
const APPLE_CARDIO_TYPES = {
  'indoor walk':    'treadmill',
  'outdoor walk':   'treadmill',
  'indoor run':     'treadmill',
  'outdoor run':    'treadmill',
  'indoor cycle':   'bike',
  'outdoor cycle':  'bike',
  'cycling':        'bike',
  'elliptical':     'elliptical',
  'stair climbing': 'stairclimber',
  'stair stepper':  'stairclimber',
  'stairstepper':   'stairclimber',
  'rowing':         'rower',
  'hiking':         'treadmill',
  'swimming':       'swimming',
  'cross training': 'cross-training',
  'walking':        'treadmill',
  'running':        'treadmill',
};

// Fuzzy fallback for workout types not in the exact map
const APPLE_CARDIO_FUZZY = [
  { pattern: /walk/i,      modality: 'treadmill' },
  { pattern: /run|jog/i,   modality: 'treadmill' },
  { pattern: /cycl|bike/i, modality: 'bike' },
  { pattern: /ellip/i,     modality: 'elliptical' },
  { pattern: /stair|step/i,modality: 'stairclimber' },
  { pattern: /row/i,       modality: 'rower' },
  { pattern: /hik/i,       modality: 'treadmill' },
  { pattern: /swim/i,      modality: 'swimming' },
  { pattern: /cross.?train/i, modality: 'cross-training' },
];

function resolveAppleCardioModality(type) {
  const lower = (type || '').toLowerCase().trim();
  if (APPLE_CARDIO_TYPES[lower]) return APPLE_CARDIO_TYPES[lower];
  for (const f of APPLE_CARDIO_FUZZY) {
    if (f.pattern.test(lower)) return f.modality;
  }
  return null; // not a recognized cardio type
}

function analyzeCardioHistory(dayCardioMap) {
  // Single source of truth: dayCardioMap (already deduped in preprocessWorkouts)
  const now = new Date();
  let cardioSessions7d = 0;
  let estimatedMinutes7d = 0;
  const recentModalities = [];
  let hevySessions = 0;
  let appleSessions = 0;
  let hevyMinutes = 0;
  let appleMinutes = 0;
  const cardioLog = [];

  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    const cd = dayCardioMap[key];
    if (!cd || !cd.sessions) continue;

    // Use cd.minutes for total (same as weekStats in History tab)
    estimatedMinutes7d += cd.minutes;

    for (const sess of cd.sessions) {
      cardioSessions7d++;

      if (sess.source === 'hevy') {
        hevySessions++;
        hevyMinutes += sess.minutes;
      } else {
        appleSessions++;
        appleMinutes += sess.minutes;
      }

      // Modality tagging for variety tracking
      const modality = (sess.name || '').toLowerCase();
      if (/treadmill|walk|run/i.test(modality)) recentModalities.push('treadmill');
      else if (/bike|cycl/i.test(modality)) recentModalities.push('bike');
      else if (/elliptical/i.test(modality)) recentModalities.push('elliptical');
      else if (/stair/i.test(modality)) recentModalities.push('stairclimber');
      else if (/row/i.test(modality)) recentModalities.push('rower');
      else recentModalities.push('other');

      cardioLog.push({
        source: sess.source === 'hevy' ? 'hevy' : 'watch',
        type: sess.name || 'Unknown',
        date: sess.timestamp ? new Date(sess.timestamp) : d,
        minutes: sess.minutes,
        calories: 0,
      });
    }
  }

  return {
    cardioSessions7d, estimatedMinutes7d, recentModalities,
    hevySessions, appleSessions, hevyMinutes, appleMinutes,
    cardioLog,
    // Estimate how many sessions this week were high-intensity
    // Heuristic: short sessions (<=25 min) with interval/sprint/HIIT in name, or matching HIIT protocol names
    hiitSessions7d: cardioLog.filter(function(s) {
      var n = (s.type || '').toLowerCase();
      if (/interval|sprint|hiit|tabata/i.test(n)) return true;
      // Match known HIIT protocol names from CARDIO_PROTOCOLS.hiit
      for (var j = 0; j < CARDIO_PROTOCOLS.hiit.length; j++) {
        if (n === CARDIO_PROTOCOLS.hiit[j].name.toLowerCase()) return true;
      }
      return false;
    }).length,
  };
}

// Generate cardio recommendations for today
function generateCardioRecommendations(dayCardioMap, rerollOffset) {
  var offset = rerollOffset || 0;
  const rhr = healthData ? healthData.resting_heart_rate : null;
  const zones = calculateHRZones(PROFILE.age, rhr);
  const history = analyzeCardioHistory(dayCardioMap);

  const targetMin = CARDIO_WEEKLY_TARGETS.totalMinModerate;
  const remainingMin = Math.max(0, targetMin - history.estimatedMinutes7d);
  const targetSessions = CARDIO_WEEKLY_TARGETS.sessionsPerWeek;
  const remainingSessions = Math.max(0, targetSessions - history.cardioSessions7d);

  // If target met for the week
  if (remainingSessions <= 0 && remainingMin <= 0) {
    return { zones, history, prescriptions: [], weekComplete: true, remainingMin: 0, targetMin };
  }

  const prescriptions = [];

  // ---- HIIT readiness gate (v1.15) ----
  // Only prescribe HIIT when readiness is acceptable AND cardio base is not extremely low.
  // Otherwise, default to Zone 2 (safer, builds aerobic base).
  let hiitAllowed = true;
  let hiitBlockReason = '';

  // Gate 1: RHR elevation vs baseline -- elevated RHR signals poor recovery
  if (rhr && rhr > 0) {
    // Use 3-month RHR as baseline if available, else 12-month, else conservative default
    const rhrBaseline = (healthData && (healthData.rhr_3m || healthData.rhr_6m || healthData.rhr_12m)) || 0;
    if (rhrBaseline > 0 && rhr > rhrBaseline * 1.10) {
      // RHR elevated >10% above baseline
      hiitAllowed = false;
      hiitBlockReason = 'RHR elevated vs baseline';
    }
  } else {
    // No RHR data at all -- be conservative, still allow if other signals are OK
  }

  // Gate 2: Recovery score -- if available and poor, block HIIT
  if (hiitAllowed && healthData) {
    const recovery = healthData.cardio_recovery || 0;
    if (recovery > 0 && recovery < 15) {
      // Poor recovery (<15 bpm drop in 1 min) -- skip HIIT
      hiitAllowed = false;
      hiitBlockReason = 'Poor recovery score';
    }
  }

  // Gate 3: No cardio base at all -- 0 sessions in last 14 days means start with Zone 2
  if (hiitAllowed) {
    // Count cardio sessions in last 14 days
    const now = new Date();
    let sessions14d = 0;
    for (let i = 0; i < 14; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = localDateStr(d);
      const cd = dayCardioMap[key];
      if (cd && cd.sessions && cd.sessions.length > 0) sessions14d++;
    }
    if (sessions14d === 0) {
      hiitAllowed = false;
      hiitBlockReason = 'No cardio base (ramp with Zone 2 first)';
    }
  }

  // Gate 4: Multiple consecutive hard training days -- use _consecutiveTrainDays if available
  if (hiitAllowed) {
    const consecDays = (typeof _consecutiveTrainDays !== 'undefined') ? _consecutiveTrainDays : 0;
    if (consecDays >= 4) {
      hiitAllowed = false;
      hiitBlockReason = 'Multiple consecutive training days';
    }
  }

  // Decide session split -- polarized 80/20 model
  // Target: 2 Zone 2 + 1 HIIT per week (Seiler 2010, Stoggl & Sperlich 2014)
  // Logic: prescribe based on what has ALREADY been done this week,
  // not just how many slots remain.
  const effectiveSessions = remainingSessions > 0 ? remainingSessions : (remainingMin > 0 ? 1 : 0);
  const zone2Done = Math.max(0, history.cardioSessions7d - history.hiitSessions7d);
  const hiitDone = history.hiitSessions7d;

  let hiitCount = 0;
  let zone2Count = 0;

  if (!hiitAllowed || effectiveSessions <= 0) {
    // Gates failed or nothing to prescribe -- all Zone 2
    zone2Count = Math.min(effectiveSessions, 2);
  } else if (hiitDone >= 1) {
    // Already did HIIT this week -- remaining slots are Zone 2
    zone2Count = Math.min(effectiveSessions, 2);
  } else if (zone2Done >= 1) {
    // Have aerobic base this week, HIIT slot is due
    hiitCount = 1;
    zone2Count = Math.max(0, effectiveSessions - 1);
  } else {
    // No cardio done yet this week -- Zone 2 first, HIIT if 2+ slots
    if (effectiveSessions >= 2) {
      zone2Count = effectiveSessions - 1;
      hiitCount = 1;
    } else {
      zone2Count = 1;
    }
  }

  // Progressive Zone 2 duration scaling
  // As aerobic base builds, extend durations to maintain stimulus (up to +10 min cap)
  // Based on 30-day cardio session count as a proxy for training consistency
  let sessions30d = 0;
  const now30 = new Date();
  for (let i = 0; i < 30; i++) {
    const d30 = new Date(now30);
    d30.setDate(d30.getDate() - i);
    const k30 = localDateStr(d30);
    if (dayCardioMap[k30] && dayCardioMap[k30].sessions && dayCardioMap[k30].sessions.length > 0) sessions30d++;
  }
  const z2DurationBonus = sessions30d >= 12 ? 10 : sessions30d >= 6 ? 5 : 0;

  // Pick zone 2 protocols
  // When rerolling (offset > 0), cycle through ALL protocols for guaranteed variety
  // When initial (offset === 0), prefer protocols whose modality wasn't recently used
  const z2All = CARDIO_PROTOCOLS.zone2;
  const z2Fresh = z2All.filter(p => !history.recentModalities.includes(p.modality));
  const z2Picks = (offset > 0) ? z2All : (z2Fresh.length > 0 ? z2Fresh : z2All);

  for (let i = 0; i < zone2Count && i < z2Picks.length; i++) {
    const protocol = z2Picks[(i + offset) % z2Picks.length];
    prescriptions.push({
      ...protocol,
      zone: 2,
      durationMin: protocol.durationMin + z2DurationBonus,
      hrRange: `${zones.zone2.low}-${zones.zone2.high}`,
    });
  }

  // Pick HIIT protocol
  if (hiitCount > 0) {
    const hiitAll = CARDIO_PROTOCOLS.hiit;
    const hiitFresh = hiitAll.filter(p => !history.recentModalities.includes(p.modality));
    const hiitPicks = (offset > 0) ? hiitAll : (hiitFresh.length > 0 ? hiitFresh : hiitAll);
    const protocol = hiitPicks[offset % hiitPicks.length];
    const hiitZone = protocol.zone || 4;
    const zoneData = hiitZone === 5 ? zones.zone5 : zones.zone4;
    prescriptions.push({
      ...protocol,
      zone: hiitZone,
      hrRange: `${zoneData.low}-${zoneData.high}`,
    });
  }

  return { zones, history, prescriptions, weekComplete: false, remainingMin, targetMin, hiitBlockReason };
}

function toggleCardioBreakdown() {
  const el = document.getElementById('cardio-breakdown');
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

let _cardioRerollOffset = 0;

function rerollCardio() {
  _cardioRerollOffset++;
  renderCardioPlan(heatmapDayCardio);
}

function toggleCardioInstr(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var isOpen = el.style.maxHeight && el.style.maxHeight !== '0px';
  if (isOpen) {
    el.style.maxHeight = '0';
    el.style.opacity = '0';
  } else {
    el.style.maxHeight = '120px';
    el.style.opacity = '1';
  }
}

function buildCardioBreakdownHTML(history) {
  const log = history.cardioLog || [];
  if (log.length === 0) {
    return `<div style="font-size:12px;font-family:'Space Grotesk',sans-serif;color:${C.textDark};">No cardio sessions this week.</div>`;
  }

  // Sort by date descending
  const sorted = [...log].sort((a, b) => b.date - a.date);

  // Source summary line
  const parts = [];
  if (history.hevySessions > 0) parts.push(`\u{1F3CB}\uFE0F Hevy: ${history.hevySessions} session${history.hevySessions > 1 ? 's' : ''}, ${Math.round(history.hevyMinutes)} min`);
  if (history.appleSessions > 0) parts.push(`\u231A Watch: ${history.appleSessions} session${history.appleSessions > 1 ? 's' : ''}, ${Math.round(history.appleMinutes)} min`);

  let html = `<div style="font-size:11px;font-family:'Space Grotesk',sans-serif;color:${C.textDim};margin-bottom:8px;">${parts.join(' \u00B7 ')}</div>`;

  // Per-session rows
  for (const s of sorted) {
    const dayStr = s.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const icon = s.source === 'watch' ? '\u231A' : '\u{1F3CB}\uFE0F';
    const calStr = s.calories > 0 ? ` \u00B7 ${Math.round(s.calories)} cal` : '';
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;font-family:'Space Grotesk',sans-serif;">
      <span style="color:${C.textMid};">${icon} ${s.type}</span>
      <span style="color:${C.textDark};">${Math.round(s.minutes)} min${calStr} \u00B7 ${dayStr}</span>
    </div>`;
  }

  return html;
}
