    if (dateStr) {
      const dateOnly = dateStr.length > 10 ? dateStr.slice(0, 10) : dateStr;
      const parsed = new Date(dateOnly + 'T12:00:00');
      daysAgo = isNaN(parsed.getTime()) ? null : Math.floor((Date.now() - parsed.getTime()) / (1000 * 60 * 60 * 24));
    }
    const stale = daysAgo !== null && daysAgo > 90;
    const ageLabel = daysAgo === 0 ? 'today' : daysAgo !== null ? `${daysAgo}d ago` : '';
    const ageColor = stale ? C.warn : C.textDark;
    const isSelected = _selectedMeasField === field.key;
    const borderStyle = isSelected ? `border:1px solid ${C.accent}` : `border:1px solid ${C.border}`;

    html += `<div style="padding:10px;border-radius:8px;${borderStyle};background:${C.surface2};cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color 0.2s ease;" onclick="toggleMeasSparkline('${field.key}')">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:${C.textDim};font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${field.label}</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:${C.text};line-height:1.2;">${val.toFixed(1)}<span style="font-size:11px;font-weight:400;color:${C.textDim};margin-left:2px;">${field.unit}</span></div>
      <div style="font-size:10px;font-family:'Space Grotesk',sans-serif;color:${ageColor};margin-top:2px;">${ageLabel}</div>
    </div>`;
  }
  html += `</div>`;

  // Sparkline container
  html += `<div id="meas-sparkline-container" style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.4s ease,opacity 0.3s ease;margin-top:8px;"></div>`;

  if (!hasAny) {
    container.innerHTML = `<div style="font-size:13px;color:${C.textDim};font-family:'Space Grotesk',sans-serif;padding:4px 0;">No measurements yet. Use Import Hevy to start tracking.</div>`;
    return;
  }
  container.innerHTML = html;
}

let _selectedMeasField = null;

function toggleMeasSparkline(fieldKey) {
  const container = document.getElementById('meas-sparkline-container');
  if (!container) return;

  if (_selectedMeasField === fieldKey) {
    // Collapse
    container.style.maxHeight = '0';
    container.style.opacity = '0';
    _selectedMeasField = null;
    renderMeasurementsDisplay();
    return;
  }

  _selectedMeasField = fieldKey;
  renderMeasurementsDisplay(); // re-render to update selection highlight

  const sparkContainer = document.getElementById('meas-sparkline-container');
  if (!sparkContainer) return;

  const entries = getStoredMeasurements();
  const field = MEASUREMENT_FIELDS.find(f => f.key === fieldKey);
  if (!field) return;

  // Get all values for this field with dates
  const points = [];
  for (const entry of entries) {
    if (entry[fieldKey] != null && !isNaN(entry[fieldKey]) && entry[fieldKey] > 0) {
      points.push({ date: entry.date, value: parseFloat(entry[fieldKey]) });
    }
  }

  // For waist, also check Apple Health
  if (fieldKey === 'waist_in' && healthData && healthData.waist_circumference_in > 0) {
    const ahDate = healthData.waist_date || localDateStr(new Date());
    const exists = points.some(p => p.date === ahDate);
    if (!exists) points.push({ date: ahDate, value: healthData.waist_circumference_in });
  }

  points.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  if (points.length < 2) {
    sparkContainer.innerHTML = `<div style="padding:12px;text-align:center;font-size:12px;font-family:'Space Grotesk',sans-serif;color:${C.textDim};">Need 2+ entries to chart ${field.label}.</div>`;
    sparkContainer.style.opacity = '1';
    sparkContainer.style.maxHeight = '60px';
    return;
  }

  // Build SVG sparkline
  const w = 300, h = 70, pad = 20;
  const vals = points.map(p => p.value);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;

  const scaleX = (i) => pad + (i / (points.length - 1)) * (w - 2 * pad);
  const scaleY = (v) => h - pad - ((v - minV) / range) * (h - 2 * pad);

  let pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(1)},${scaleY(p.value).toFixed(1)}`).join(' ');

  // Determine trend color
  const isWaist = fieldKey === 'waist_in';
  const firstVal = vals[0], lastVal = vals[vals.length - 1];
  const trending = lastVal > firstVal ? 'up' : lastVal < firstVal ? 'down' : 'flat';
  let lineColor = C.accent;
  if (isWaist) {
    lineColor = trending === 'down' ? C.accent : trending === 'up' ? C.warn : C.textMid;
  } else {
    lineColor = trending === 'up' ? C.accent : trending === 'down' ? C.warn : C.textMid;
  }

  const totalLen = points.reduce((sum, p, i) => {
    if (i === 0) return 0;
    const dx = scaleX(i) - scaleX(i-1);
    const dy = scaleY(p.value) - scaleY(points[i-1].value);
    return sum + Math.sqrt(dx*dx + dy*dy);
  }, 0);

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">
    <style>
      @keyframes drawLine { from { stroke-dashoffset: ${totalLen.toFixed(0)}; } to { stroke-dashoffset: 0; } }
    </style>
    <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="${totalLen.toFixed(0)}" style="animation:drawLine 0.5s ease forwards;" />`;

  // Dots at each point
  points.forEach((p, i) => {
    svg += `<circle cx="${scaleX(i).toFixed(1)}" cy="${scaleY(p.value).toFixed(1)}" r="2.5" fill="${lineColor}" />`;
  });

  // Labels at first and last points
  const firstPt = points[0], lastPt = points[points.length - 1];
  svg += `<text x="${pad}" y="${scaleY(firstPt.value) - 6}" fill="${C.textDim}" font-size="9" font-family="Space Grotesk,sans-serif" text-anchor="start">${firstPt.value.toFixed(1)}</text>`;
  svg += `<text x="${w - pad}" y="${scaleY(lastPt.value) - 6}" fill="${C.text}" font-size="9" font-family="Space Grotesk,sans-serif" text-anchor="end">${lastPt.value.toFixed(1)}</text>`;

  svg += `</svg>`;

  // Date range label
  const dateRange = `${points[0].date || ''} -> ${points[points.length-1].date || ''}`;
  sparkContainer.innerHTML = `<div style="background:${C.surface2};border-radius:8px;border:1px solid ${C.border};padding:10px 8px 6px;">
    ${svg}
    <div style="text-align:center;font-size:10px;font-family:'Space Grotesk',sans-serif;color:${C.textDark};margin-top:2px;">${dateRange} \u00b7 ${points.length} entries</div>
  </div>`;
  sparkContainer.style.opacity = '1';
  sparkContainer.style.maxHeight = sparkContainer.scrollHeight + 'px';
}

function renderProportionsDisplay() {
  const container = document.getElementById('proportions-display');
  if (!container) return;
  const latest = latestMeasurements;
  if (!latest || Object.keys(latest).filter(k => k !== '_dates').length < 2) {
    container.innerHTML = '';
    return;
  }
  const bars = [];
  for (const [fieldKey, ft] of Object.entries(FRAME_TARGETS)) {
    const current = latest[fieldKey];
    if (current == null || current <= 0) continue;
    if (ft.target == null) {
      bars.push({ label: ft.label, current, target: null, pct: null, fieldKey });
      continue;
    }
    let pct;
    if (ft.inverted) {
      pct = Math.max(0, Math.min(120, Math.round((ft.target / current) * 100)));
    } else {
      pct = Math.max(0, Math.min(120, Math.round((current / ft.target) * 100)));
    }
    bars.push({ label: ft.label, current, target: ft.target, pct, inverted: ft.inverted, fieldKey });
  }
  if (bars.length === 0) { container.innerHTML = ''; return; }
  bars.sort((a, b) => {
    if (a.pct === null) return 1;
    if (b.pct === null) return -1;
    return a.pct - b.pct;
  });
  let html = '<div style="padding-top:12px;border-top:1px solid ' + C.border + ';">' +
    '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:' + C.textDim + ';margin-bottom:10px;font-family:Space Grotesk,sans-serif;">Frame-Adjusted Targets</div>';
  for (const bar of bars) {
    if (bar.target == null) {
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-family:Space Grotesk,sans-serif;">' +
        '<span style="font-size:12px;font-weight:600;color:' + C.textMid + ';min-width:70px;">' + bar.label + '</span>' +
        '<span style="font-size:12px;color:' + C.textDim + ';">' + bar.current.toFixed(1) + ' in</span></div>';
      continue;
    }
    const pct = bar.pct;
    const barColor = pct >= 95 ? C.accent : pct >= 85 ? C.warn : C.danger;
    const fillW = Math.min(pct, 100);
    let detailLabel;
    if (bar.inverted) {
      // Inverted metric: lower is better (e.g. waist)
      if (bar.current <= bar.target) {
        detailLabel = bar.current.toFixed(1) + ' / ' + bar.target.toFixed(1) + ' in <span style="color:' + C.accent + ';font-weight:600;">On target \u2713</span>';
      } else {
        const over = bar.current - bar.target;
        const overPct = Math.round((over / bar.target) * 100);
        detailLabel = bar.current.toFixed(1) + ' / ' + bar.target.toFixed(1) + ' in <span style="color:' + C.danger + ';font-weight:600;">+' + over.toFixed(1) + ' in over (' + overPct + '%) \u2193</span>';
      }
    } else {
      detailLabel = bar.current.toFixed(1) + ' / ' + bar.target.toFixed(1) + ' in <span style="color:' + barColor + ';font-weight:600;">(' + pct + '%)</span>';
    }
    html += '<div style="margin-bottom:8px;">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;font-family:Space Grotesk,sans-serif;">' +
      '<span style="font-size:12px;font-weight:600;color:' + C.textMid + ';">' + bar.label + '</span>' +
      '<span style="font-size:11px;color:' + C.textDim + ';">' + detailLabel + '</span>' +
      '</div>' +
      '<div style="height:6px;background:' + C.surface3 + ';border-radius:3px;overflow:hidden;">' +
      '<div style="height:100%;width:' + fillW + '%;background:' + barColor + ';border-radius:3px;transition:width 0.4s ease;"></div>' +
      '</div></div>';
  }
  html += '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:9px;font-family:Space Grotesk,sans-serif;color:' + C.textDark + ';">' +
    '<span>100% natural max (Casey Butt, wrist: ' + PROFILE.wristIn + '")</span></div></div>';
  container.innerHTML = html;
}


function renderMeasurementsCard() {
  renderMeasurementsDisplay();
  renderProportionsDisplay();
}

// ============================================================
// APPLE HEALTH DATA (fetched from repo via iOS Shortcut push)
// ============================================================
const HEALTH_DATA_URL = 'https://jtwarta.github.io/WorkoutPlanner/health-data.json';
const HEALTH_STALE_HOURS = 48; // consider data stale after 48h

async function fetchHealthData() {
  try {
    const resp = await fetchWithTimeout(HEALTH_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) {
      healthStatus = 'missing';
      healthData = null;
      return;
    }
    // Shortcuts inserts literal newlines in JSON - strip them before parsing
    const rawText = await resp.text();
    let cleanText = rawText.replace(/\n/g, '').replace(/\r/g, '');
    // Fix missing commas between workout objects: }{ -> },{
    cleanText = cleanText.replace(/\}\s*\{/g, '},{');
    // Strip unit suffixes from calories: "32 kcal" -> "32", "1,220 kcal" -> "1220"
    cleanText = cleanText.replace(/(\d),(\d)/g, '$1$2'); // remove thousands commas
    cleanText = cleanText.replace(/([\d.]+)\s*kcal/g, '$1');
    // Fix empty values from removed Shortcut actions: "key": , -> "key": null,
    cleanText = cleanText.replace(/:\s*,/g, ': null,');
    cleanText = cleanText.replace(/:\s*}/g, ': null}');
    const data = JSON.parse(cleanText);
    healthData = data;

    // Check freshness
    if (data.updated) {
      const updatedAt = new Date(data.updated);
      const ageHours = (Date.now() - updatedAt.getTime()) / (1000 * 60 * 60);
      healthStatus = ageHours <= HEALTH_STALE_HOURS ? 'ok' : 'stale';
    } else {
      healthStatus = 'stale';
    }
  } catch (e) {
    console.warn('Health data fetch failed:', e.message);
    healthStatus = 'missing';
    healthData = null;
  }
}

// ============================================================
// VO2 MAX / CARDIO FITNESS PERCENTILES
// ACSM norms for males, interpolated for age
// Percentile: [10th, 25th, 50th, 75th, 90th]
// ============================================================
const VO2_NORMS_MALE = {
  '20-29': [33.0, 36.5, 42.5, 46.8, 52.4],
  '30-39': [30.2, 34.0, 38.5, 43.0, 48.0],
  '40-49': [27.0, 31.0, 35.5, 39.5, 44.0],
  '50-59': [24.0, 28.0, 32.5, 36.5, 41.0],
};

function getVO2AgeGroup(age) {
  if (age < 30) return '20-29';
  if (age < 40) return '30-39';
  if (age < 50) return '40-49';
  return '50-59';
}

function estimateVO2Percentile(vo2, age) {
  const group = getVO2AgeGroup(age);
  const norms = VO2_NORMS_MALE[group];
  if (!norms) return null;

  const pctiles = [10, 25, 50, 75, 90];
  if (vo2 <= norms[0]) return Math.max(1, Math.round((vo2 / norms[0]) * 10));
  if (vo2 >= norms[4]) return Math.min(99, 90 + Math.round(((vo2 - norms[4]) / (norms[4] * 0.15)) * 9));

  for (let i = 0; i < norms.length - 1; i++) {
    if (vo2 >= norms[i] && vo2 <= norms[i + 1]) {
      const frac = (vo2 - norms[i]) / (norms[i + 1] - norms[i]);
      return Math.round(pctiles[i] + frac * (pctiles[i + 1] - pctiles[i]));
    }
  }
  return 50;
}

// Unified 5-tier rating: same labels + colors across ALL vitals
// Elite (top) > Great > Good > Fair > Low
function getVO2Category(percentile) {
  if (percentile >= 80) return { label: 'Elite', color: C.gold };
  if (percentile >= 60) return { label: 'Great', color: C.accent };
  if (percentile >= 40) return { label: 'Good', color: C.blue };
  if (percentile >= 20) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function getRHRCategory(rhr) {
  if (rhr < 50) return { label: 'Elite', color: C.gold };
  if (rhr < 60) return { label: 'Great', color: C.accent };
  if (rhr <= 70) return { label: 'Good', color: C.blue };
  if (rhr <= 80) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function getRecoveryCategory(recovery) {
  if (recovery >= 35) return { label: 'Elite', color: C.gold };
  if (recovery >= 25) return { label: 'Great', color: C.accent };
  if (recovery >= 18) return { label: 'Good', color: C.blue };
  if (recovery >= 12) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function getActiveCalCategory(cal) {
  if (cal >= 700) return { label: 'Elite', color: C.gold };
  if (cal >= 500) return { label: 'Great', color: C.accent };
  if (cal >= 350) return { label: 'Good', color: C.blue };
  if (cal >= 200) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function toggleVitalTrend(cellEl) {
  const trend = cellEl.querySelector('[data-vital-trend]');
  if (!trend) return;
  const isOpen = trend.style.maxHeight && trend.style.maxHeight !== '0px';
  if (isOpen) {
    trend.style.maxHeight = '0';
    trend.style.opacity = '0';
  } else {
    trend.style.maxHeight = '130px';
    trend.style.opacity = '1';
  }
}

function renderHealthVitals() {
  const card = document.getElementById('health-vitals-card');
  if (!healthData || healthStatus === 'missing') {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  // Sync time
  const syncEl = document.getElementById('health-sync-time');
  if (healthData.updated) {
    const hrs = Math.round((Date.now() - new Date(healthData.updated).getTime()) / (1000 * 60 * 60));
    syncEl.textContent = hrs <= 1 ? 'just now' : `${hrs}h ago`;
    syncEl.style.color = healthStatus === 'ok' ? C.accent : C.warn;
  }

  // Cardio Fitness Score (VO2 Max)
  const vo2 = healthData.cardio_fitness;
  if (vo2 && vo2 > 0) {
    const pctile = estimateVO2Percentile(vo2, PROFILE.age);
    const cat = getVO2Category(pctile);
    const barPct = Math.min(Math.max(pctile, 3), 97);

    document.getElementById('cardio-score-value').textContent = vo2.toFixed(1);
    const labelEl = document.getElementById('cardio-score-label');
    labelEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:4px;">${pctile}th %ile \u00b7 ${tierBadge(cat.label, cat.color)}</span>`;
    labelEl.style.color = cat.color;

    const bar = document.getElementById('cardio-score-bar');
    bar.style.width = barPct + '%';
    bar.style.background = cat.color;

    document.getElementById('cardio-score-row').style.display = 'block';
  } else {
    document.getElementById('cardio-score-row').style.display = 'none';
  }

  // Vitals Grid
  const grid = document.getElementById('vitals-grid');
  let html = '';

  // Helper: build mini SVG sparkline from points array [{label, value}]
  // lowerBetter: true for RHR/walking HR (lower = good), false for recovery/VO2 (higher = good)
  function vitalSparkline(points, color, lowerBetter) {
    const valid = points.filter(p => p.value > 0);
    if (valid.length < 2) return '';
    const vals = valid.map(p => p.value);
    const vMin = Math.min(...vals);
    const vMax = Math.max(...vals);
    const range = vMax - vMin || 1;
    const w = 200, h = 48, padX = 8, padY = 8;
    const chartW = w - padX * 2, chartH = h - padY * 2;

    // Points
    const pts = valid.map((p, i) => {
      const x = padX + (valid.length > 1 ? (i / (valid.length - 1)) * chartW : chartW / 2);
      const y = padY + (1 - (p.value - vMin) / range) * chartH;
      return { x, y, label: p.label, value: p.value };
    });

    // Delta
    const first = valid[0].value, last = valid[valid.length - 1].value;
    const delta = last - first;
    const improved = lowerBetter ? delta < 0 : delta > 0;
    const deltaColor = Math.abs(delta) < 0.5 ? C.textDim : improved ? C.accent : C.danger;
    const deltaSign = delta > 0 ? '+' : '';
    const deltaStr = Number.isInteger(delta) ? delta.toString() : delta.toFixed(1);

    let svg = `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="display:block;margin:8px auto 0;">`;
    // Line
    svg += `<polyline fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p => p.x + ',' + p.y).join(' ')}"/>`;
    // Dots + value labels
    for (const p of pts) {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"/>`;
      const valY = p.y < padY + 14 ? p.y + 14 : p.y - 8;
      svg += `<text x="${p.x}" y="${valY}" text-anchor="middle" fill="${C.text}" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="600">${Number.isInteger(p.value) ? p.value : p.value.toFixed(1)}</text>`;
    }
    svg += `</svg>`;

    // Time labels + delta
    let labelsHtml = `<div style="display:flex;justify-content:space-between;padding:0 ${padX}px;margin-top:2px;">`;
    for (const p of pts) {
      labelsHtml += `<span style="font-size:9px;color:${C.textDim};font-family:'Space Grotesk',sans-serif;">${p.label}</span>`;
    }
    labelsHtml += `</div>`;
    labelsHtml += `<div style="text-align:center;margin-top:4px;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;color:${deltaColor};">${deltaSign}${deltaStr} over 12mo</div>`;

    return svg + labelsHtml;
  }

  // Helper: wrap cell content with tappable trend expand
  function vitalCell(label, valueHtml, contextHtml, trendHtml) {
    if (trendHtml) {
      return `<div class="vital-cell" style="cursor:pointer;-webkit-tap-highlight-color:transparent;" onclick="toggleVitalTrend(this)">
        <div class="vital-label">${label}</div>
        <div class="vital-value">${valueHtml}</div>
        <div class="vital-context">${contextHtml}</div>
        <div data-vital-trend style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;">${trendHtml}</div>
      </div>`;
    }
    return `<div class="vital-cell">
      <div class="vital-label">${label}</div>
      <div class="vital-value">${valueHtml}</div>
      <div class="vital-context">${contextHtml}</div>
    </div>`;
  }

  // RHR
  const rhr = healthData.resting_heart_rate;
  if (rhr && rhr > 0) {
    const rhrCat = getRHRCategory(rhr);
    const rhrPts = [
      { label: '12mo', value: healthData.rhr_12m || 0 },
      { label: '6mo', value: healthData.rhr_6m || 0 },
      { label: '3mo', value: healthData.rhr_3m || 0 },
      { label: 'Now', value: rhr },
    ].filter(p => p.value > 0);
    const trend = rhrPts.length >= 2 ? vitalSparkline(rhrPts, C.danger, true) : '';
    html += vitalCell('Resting HR',
      `${Math.round(rhr)}<span class="vital-unit">bpm</span>`,
      `<span style="color:${rhrCat.color};display:flex;align-items:center;">${tierBadge(rhrCat.label, rhrCat.color)}</span>`,
      trend);
  }

  // Cardio Recovery
  const recovery = healthData.cardio_recovery;
  if (recovery && recovery > 0) {
    const recCat = getRecoveryCategory(recovery);
    const recPts = [
      { label: '12mo', value: healthData.rec_12m || 0 },
      { label: '6mo', value: healthData.rec_6m || 0 },
      { label: '3mo', value: healthData.rec_3m || 0 },
      { label: 'Now', value: recovery },
    ].filter(p => p.value > 0);
    const trend = recPts.length >= 2 ? vitalSparkline(recPts, C.accent, false) : '';
    html += vitalCell('HR Recovery',
      `${Math.round(recovery)}<span class="vital-unit">bpm</span>`,
      `<span style="color:${recCat.color};display:flex;align-items:center;">${tierBadge(recCat.label, recCat.color)}</span>`,
      trend);
  }

  // VO2 Max (in grid as well for trend access)
  const vo2g = healthData.cardio_fitness;
  if (vo2g && vo2g > 0) {
    const vo2Pctile = estimateVO2Percentile(vo2g, PROFILE.age);
    const vo2Cat = getVO2Category(vo2Pctile);
    const vo2Pts = [
      { label: '12mo', value: healthData.vo2_12m || 0 },
      { label: '6mo', value: healthData.vo2_6m || 0 },
      { label: '3mo', value: healthData.vo2_3m || 0 },
      { label: 'Now', value: vo2g },
    ].filter(p => p.value > 0);
    const trend = vo2Pts.length >= 2 ? vitalSparkline(vo2Pts, C.blue, false) : '';
    html += vitalCell('VO2 Max',
      `${vo2g.toFixed(1)}<span class="vital-unit">ml/kg</span>`,
      `<span style="color:${vo2Cat.color};display:flex;align-items:center;">${vo2Pctile}th %ile \u00b7 ${tierBadge(vo2Cat.label, vo2Cat.color)}</span>`,
      trend);
  }

  // Steps (7-day avg)
  const steps = healthData.steps;
  if (steps && steps > 0) {
    const stepsK = steps >= 1000 ? (steps / 1000).toFixed(1) + 'k' : Math.round(steps);
    const stepsCat = steps >= 12000 ? { label: 'Elite', color: C.gold }
      : steps >= 10000 ? { label: 'Great', color: C.accent }
      : steps >= 7000 ? { label: 'Good', color: C.blue }
      : steps >= 4000 ? { label: 'Fair', color: C.warn }
      : { label: 'Low', color: C.danger };
    html += vitalCell('Steps/Day', stepsK,
      `<span style="color:${stepsCat.color};display:flex;align-items:center;">${tierBadge(stepsCat.label, stepsCat.color)}</span>`, '');
  }

  // Active Calories
  const cal = healthData.active_energy_kcal;
  if (cal && cal > 0) {
    const calCat = getActiveCalCategory(cal);
    html += vitalCell('Active Cal',
      `${Math.round(cal)}<span class="vital-unit">kcal</span>`,
      `<span style="color:${calCat.color};display:flex;align-items:center;">${tierBadge(calCat.label, calCat.color)}</span>`, '');
  }

  // Walking HR
  const whr = healthData.walking_heart_rate_avg;
  if (whr && whr > 0) {
    const whrCat = whr < 85 ? { label: 'Elite', color: C.gold }
      : whr < 95 ? { label: 'Great', color: C.accent }
      : whr < 105 ? { label: 'Good', color: C.blue }
      : whr <= 115 ? { label: 'Fair', color: C.warn }
      : { label: 'Low', color: C.danger };
    html += vitalCell('Walking HR',
      `${Math.round(whr)}<span class="vital-unit">bpm</span>`,
      `<span style="color:${whrCat.color};display:flex;align-items:center;">${tierBadge(whrCat.label, whrCat.color)}</span>`, '');
  }

  // Body Fat % (from Hevy -> Apple Health)
  const bf = healthData.body_fat_pct;
  if (bf && bf > 0) {
    const bfCat = bf <= 10 ? { label: 'Elite', color: C.gold }
      : bf <= 15 ? { label: 'Great', color: C.accent }
      : bf <= 20 ? { label: 'Good', color: C.blue }
      : bf <= 25 ? { label: 'Fair', color: C.warn }
      : { label: 'Low', color: C.danger };
    html += `<div class="vital-cell">
      <div class="vital-label">Body Fat</div>
      <div class="vital-value">${bf.toFixed(1)}<span class="vital-unit">%</span></div>
      <div class="vital-context" style="color:${bfCat.color};display:flex;align-items:center;">${tierBadge(bfCat.label, bfCat.color)}</div>
    </div>`;
  }

  // Lean Body Mass (from Hevy -> Apple Health)
  const lbm = healthData.lean_body_mass_lbs;
  if (lbm && lbm > 0) {
    html += `<div class="vital-cell">
      <div class="vital-label">Lean Mass</div>
      <div class="vital-value">${Math.round(lbm)}<span class="vital-unit">lbs</span></div>
      <div class="vital-context">via Apple Health</div>
    </div>`;
  }

  // Waist (from Hevy -> Apple Health)
  const waistAH = healthData.waist_circumference_in;
  if (waistAH && waistAH > 0) {
    const waistDate = healthData.waist_date || '';
    const waistCtx = waistDate ? waistDate : 'via Apple Health';
    html += `<div class="vital-cell">
      <div class="vital-label">Waist</div>
      <div class="vital-value">${waistAH.toFixed(1)}<span class="vital-unit">in</span></div>
      <div class="vital-context">${waistCtx}</div>
    </div>`;
  }

  grid.innerHTML = html;
}

// ============================================================
// BODY COMPOSITION INDEX
// Uses body fat, frame targets, and waist-to-height ratio
// Called after proportionDeficits are available
// ============================================================
function computeBodyCompTimeline() {
  bodyCompData = [];
  const heightIn = PROFILE.heightIn;
  if (!healthData) return;

  // Get body fat (current snapshot only)
  const bf = healthData.body_fat_pct || 0;
  // Get waist (current snapshot only)
  const waistIn = healthData.waist_circumference_in || 0;
  // Get frame target achievement
  const deficits = Object.values(proportionDeficits);
  const hasFrame = deficits.length > 0;
  const avgAchievement = hasFrame ? 1 - (deficits.reduce((a, b) => a + b, 0) / deficits.length) : 0;

  // Build timeline from weight data dates (anchoring body comp to weigh-in dates)
  const allWeightData = [...WEIGHT_DATA_BASELINE];
  if (healthData.weight_history) {
    for (const w of healthData.weight_history) {
      if (w.date && w.value) allWeightData.push(w);
    }
  }
  if (healthData.weight_entries) {
    for (const w of healthData.weight_entries) {
      if (w.date && w.lbs) allWeightData.push({ date: w.date, value: parseFloat(w.lbs) });
    }
  }
  const weightByDate = {};
  for (const w of allWeightData) { if (w.value > 0) weightByDate[w.date] = w.value; }
  const dates = Object.keys(weightByDate).sort();

  for (const dateStr of dates) {
    let total = 0, sum = 0;

    // Body fat score: 10%=2.0, 15%=1.6, 20%=1.2, 25%=0.8, 30%=0.4, 35%=0
    if (bf > 0) {
      const bfScore = Math.max(0, Math.min(2.0, (35 - bf) / 12.5));
      sum += bfScore * 40;
      total += 40;
    }

    // Frame target achievement
    if (hasFrame) {
      const frameScore = Math.max(0, Math.min(2.0, avgAchievement * 2));
      sum += frameScore * 40;
      total += 40;
    }

    // Waist-to-height ratio
    if (waistIn > 0 && heightIn > 0) {
      const whr = waistIn / heightIn;
      const whrScore = Math.max(0, Math.min(2.0, (0.60 - whr) / 0.09));
      sum += whrScore * 20;
      total += 20;
    }

    if (total > 0) {
      bodyCompData.push({
        date: dateStr,
        score: Math.round((sum / total) * 100) / 100,
      });
    }
  }
}

// Render dashboard from workouts data (shared by cache + fresh load)
// ============================================================
// POWER SCORE (Composite fitness metric, 0-100)
// ============================================================
function computePowerScore() {
  const components = [];

  // 1. Strength (30%) - from SI timeline
  if (strengthIndexData.length > 0) {
    const si = strengthIndexData[strengthIndexData.length - 1].index;
    // Piecewise: 0->0, 0.9->50, 1.3->70, 1.8->90, 2.5->100
    let sScore;
    if (si >= 1.8) sScore = 90 + ((si - 1.8) / 0.7) * 10;
    else if (si >= 1.3) sScore = 70 + ((si - 1.3) / 0.5) * 20;
    else if (si >= 0.9) sScore = 50 + ((si - 0.9) / 0.4) * 20;
    else sScore = (si / 0.9) * 50;
    components.push({ key: 'strength', label: 'Strength', value: Math.min(100, Math.round(sScore)), weight: 30, detail: 'SI ' + si.toFixed(2) });
  }

  // 2. Cardio Fitness (25%) - from cardio score timeline (vitals-only)
  if (cardioScoreData.length > 0) {
    const latest = cardioScoreData[cardioScoreData.length - 1];
    // Score is 0-2 scale, map to 0-100
    const cfScore = Math.min(100, Math.round(latest.score * 50));
    let detail = '';
    if (healthData && healthData.cardio_fitness) detail = 'VO2 ' + healthData.cardio_fitness.toFixed(1);
    components.push({ key: 'cardio', label: 'Cardio Fitness', value: cfScore, weight: 25, detail });
  }

  // 3. Body Comp (20%) - from body comp timeline
  if (bodyCompData.length > 0) {
    const latest = bodyCompData[bodyCompData.length - 1];
    // Score is 0-2 scale, map to 0-100
    const bcScore = Math.min(100, Math.round(latest.score * 50));
    let detail = '';
    if (healthData && healthData.body_fat_pct) detail = healthData.body_fat_pct.toFixed(1) + '% BF';
    components.push({ key: 'body', label: 'Body Comp', value: bcScore, weight: 20, detail });
  }

  // 4. Dedication (25%) - from dedication timeline (rolling 7d effort)
  if (dedicationData.length > 0) {
    const latest = dedicationData[dedicationData.length - 1];
    // Score is 0-2 scale, map to 0-100
    const dedScore = Math.min(100, Math.round(latest.score * 50));
    const detail = latest.liftDays + ' lifts + ' + latest.cardioMin + 'min cardio/7d';
    components.push({ key: 'dedication', label: 'Dedication', value: dedScore, weight: 25, detail });
  }

  if (components.length === 0) return { score: 0, components: [] };

  // Redistribute weights proportionally for available components
  const totalWeight = components.reduce((sum, c) => sum + c.weight, 0);
  let score = 0;
  for (const c of components) {
    const normalizedWeight = c.weight / totalWeight;
    score += c.value * normalizedWeight;
    c.normalizedWeight = normalizedWeight;
  }

  return { score: Math.round(score), components };
}

function renderPowerScore() {
  const ring = document.getElementById('power-score-ring');
  if (!ring) return;

  const ps = computePowerScore();
  if (ps.score === 0 && ps.components.length === 0) {
    ring.parentElement.style.display = 'none';
    return;
  }
  ring.parentElement.style.display = 'flex';

  // Store for detail panel
  window._powerScoreData = ps;

  const size = 38;
  const r = 14;
  const cx = size / 2;
  const cy = size / 2;
  const stroke = 3.5;
  const circumference = 2 * Math.PI * r;
  const fillLen = (ps.score / 100) * circumference;
  const gapLen = circumference - fillLen;

  // Color based on score
  const scoreColor = ps.score >= 70 ? C.accent : ps.score >= 45 ? C.warn : C.danger;

  ring.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.surface3}" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${scoreColor}" stroke-width="${stroke}"
      stroke-dasharray="${fillLen.toFixed(1)} ${gapLen.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray 0.6s ease;"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
      fill="${scoreColor}" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700">${ps.score}</text>
  </svg>`;
}

function togglePowerScoreDetail() {
  const panel = document.getElementById('power-score-detail');
  if (!panel) return;
  const ps = window._powerScoreData;
  if (!ps || ps.components.length === 0) return;

  if (panel.style.display !== 'none') {
    panel.style.display = 'none';
    return;
  }

  const scoreColor = ps.score >= 70 ? C.accent : ps.score >= 45 ? C.warn : C.danger;
  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:${C.textDim};font-family:'Space Grotesk',sans-serif;">Power Score</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:${scoreColor};">${ps.score}<span style="font-size:12px;font-weight:500;color:${C.textDim};">/100</span></div>
  </div>`;

  for (const c of ps.components) {
    const barColor = c.value >= 70 ? C.accent : c.value >= 45 ? C.warn : C.danger;
    const weightPct = Math.round((c.normalizedWeight || 0) * 100);
    html += `<div style="margin-bottom:8px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;font-family:'Space Grotesk',sans-serif;">
        <span style="font-size:12px;font-weight:600;color:${C.text};">${c.label} <span style="font-size:10px;font-weight:400;color:${C.textDim};">${weightPct}%</span></span>
        <span style="font-size:11px;color:${C.textDim};">${c.detail} <span style="font-weight:600;color:${barColor};">${c.value}</span></span>
      </div>
      <div style="height:4px;border-radius:2px;background:${C.surface3};overflow:hidden;">
        <div style="height:100%;width:${c.value}%;border-radius:2px;background:${barColor};transition:width 0.4s ease;"></div>
      </div>
    </div>`;
  }

  panel.innerHTML = html;
  panel.style.display = 'block';
}

function renderDashboard(workouts) {
  _cardioRerollOffset = 0;
  WEIGHT_DATA = getMergedWeightData();
  if (WEIGHT_DATA.length > 0) PROFILE.bodyweightLbs = WEIGHT_DATA[0].value;

  // v1.7: Load measurements and compute proportion deficits before recommendations
  latestMeasurements = getLatestMeasurements();
  proportionDeficits = computeProportionDeficits(latestMeasurements);

  // v1.1 Task 6: unified preprocess pipeline
  const pp = preprocessWorkouts(workouts, PROFILE.bodyweightLbs, WEIGHT_DATA);

  exerciseHistory = pp.exerciseHistory;
  _templateIdMap = pp.templateIdMap || {};
  muscleAnalysis = pp.muscleStats;
  muscle1RMs = pp.muscle1RMs;
  strengthIndexData = pp.strengthIndexTimeline;
  cardioScoreData = pp.cardioScoreTimeline;
  dedicationData = pp.dedicationTimeline || [];
  computeBodyCompTimeline();

  // Build dynamic exercise pool from EXERCISE_DB + workout history (Tier 1)
  buildDynamicExercisePool();

  const recs = generateRecommendations(pp.muscleStats);
  LAST_RECS = recs;

  // Compute consecutive training days for rest day awareness
  _consecutiveTrainDays = countConsecutiveTrainingDays(pp.heatmapDayWorkouts);

  showScreen('dashboard');

  const now = new Date();
  const syncColor = (hevyStatus === 'ok' && healthStatus === 'ok') ? C.accent
    : (hevyStatus === 'error' || healthStatus === 'missing') ? C.textDim : C.warn;
  document.getElementById('last-updated').innerHTML =
    `v1.16 \u00b7${now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })} <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${syncColor};margin-left:5px;vertical-align:middle;position:relative;top:-1px;"></span>`;

  // Populate globals BEFORE renderTimedSession so lifted-today detection works
  heatmapDayWorkouts = pp.heatmapDayWorkouts || {};
  heatmapDayCardio = pp.heatmapDayCardio || {};

  renderTimedSession(recs);

  // Background: fetch all Hevy exercise templates for ID resolution at send-time
  // Note: we intentionally do NOT re-render the session when templates load.
  // The session is built from the full exercise pool for best recommendations.
  // Unresolvable exercises are filtered at send-time in sendSessionToHevy().
  if (!_hevyTemplatesLoaded) {
    fetchAllHevyTemplateIds();
  }

  renderCardioPlan(pp.heatmapDayCardio);
  renderMuscleGrid(pp.muscleStats, recs);
  renderWeeklySummary(pp.heatmapDayWorkouts, pp.heatmapDayMuscle, pp.heatmapDayCardio, workouts);
  renderHeatmap(pp.heatmapDayMuscle, pp.heatmapDayWorkouts, pp.heatmapDayCardio);
  renderWeightChart();
  renderHealthVitals();
  renderMeasurementsCard();
  renderPowerScore();
}

async function refreshData() {
  showScreen('loading-screen');
  try {
    updateLoading('Refreshing...');
    const [workouts] = await Promise.all([fetchWorkouts(), fetchHealthData()]);
    workoutCache = workouts;
    setCachedWorkouts(workouts);
    hevyStatus = 'ok';
    renderDashboard(workouts);
  } catch (err) {
    console.error(err);
    hevyStatus = 'error';
    showScreen('dashboard');
    showError(`Refresh failed: ${err.message.slice(0, 200)}`);
  }
}

async function loadDashboard() {
  showScreen('loading-screen');

  // Start health data fetch in parallel (non-blocking)
  const healthPromise = fetchHealthData();

  try {
    // v1.1 Task 7: Try cache first for instant load
    const cached = getCachedWorkouts();
    if (cached && cached.data && cached.data.length > 0) {
      updateLoading('Loading from cache...');
      workoutCache = cached.data;
      hevyStatus = 'ok';
      await healthPromise; // ensure health status is ready
      renderDashboard(cached.data);

      // If stale, refresh in background
      if (isCacheStale(cached)) {
        fetchWorkouts().then(fresh => {
          workoutCache = fresh;
          setCachedWorkouts(fresh);
          hevyStatus = 'ok';
          renderDashboard(fresh);
        }).catch(err => {
          console.warn('Background refresh failed:', err.message);
          hevyStatus = 'error';
        });
      }
      return;
    }

    // No cache - fresh load
    updateLoading('Loading workouts...');
    const workouts = await fetchWorkouts();
    workoutCache = workouts;
    setCachedWorkouts(workouts);
    hevyStatus = 'ok';
    await healthPromise;
    renderDashboard(workouts);
  } catch (err) {
    console.error(err);
    hevyStatus = 'error';
    showScreen('dashboard');
    showError(`Failed to load: ${err.message.slice(0, 200)}${err.message.length > 200 ? '...' : ''}<br><span style="font-size:11px;color:${C.textDim};margin-top:4px;display:block;">If using home screen app, try opening in Safari first to populate cache.</span>`);
  }
}

const DEV_TEST_MODE = false;

function runDevTests() {

  const results = [];

  // Test A1: Tricep Dip classification
  const tricepDip = classifyExercise('Tricep Dip');

  results.push({ test: 'A1: Chest Dip -> chest', pass: chestDip.primary === 'chest', got: chestDip.primary });

  const genericDip = classifyExercise('Dips');
  results.push({ test: 'A1: Dips -> chest (generic)', pass: genericDip.primary === 'chest', got: genericDip.primary });

  // Test A2: Curly apostrophe normalization
  const curly1 = normalizeExerciseName('Farmer\u2019s Carry');
  results.push({ test: 'A2: Right curly -> ASCII', pass: curly1 === "farmer's carry", got: curly1 });
  const curly2 = normalizeExerciseName('Farmer\u2018s Carry');
  results.push({ test: 'A2: Left curly -> ASCII', pass: curly2 === "farmer's carry", got: curly2 });

  // Test A3: analyzeCardioHistory reads from passed cardio map
  const _testCardioMap = {};
  const _testDate = localDateStr(new Date());
  _testCardioMap[_testDate] = { minutes: 35, sessions: [
    { name: 'Treadmill', minutes: 20, source: 'hevy', timestamp: Date.now() },
    { name: 'Elliptical', minutes: 15, source: 'hevy', timestamp: Date.now() },
  ]};
  const cardioResult = analyzeCardioHistory(_testCardioMap);
  results.push({ test: 'A3: cardio reads from passed map', pass: cardioResult.estimatedMinutes7d >= 35, got: cardioResult.estimatedMinutes7d });

  // Test A4: CSS custom properties load correctly (catches en-dash encoding bug)
  const rootStyle = getComputedStyle(document.documentElement);
  const accentVar = rootStyle.getPropertyValue('--accent').trim();
  results.push({
    test: 'A4: CSS --accent resolves to #5eead4',
    pass: accentVar === '#5eead4',
    got: accentVar || '(empty -- var() references may use en-dash instead of double-hyphen)'
  });

  // Test A5: Universal reset selector is active (catches * vs - typo)
  const testEl = document.querySelector('.app') || document.body;
  const boxSizing = getComputedStyle(testEl).boxSizing;
  results.push({
    test: 'A5: box-sizing is border-box (universal reset)',
    pass: boxSizing === 'border-box',
    got: boxSizing
  });

  // Test A6: No markdown code fences leaked into rendered page
  const bodyText = document.body.innerText;
  results.push({
    test: 'A6: No stray ``` in page text',
    pass: !bodyText.includes('```'),
    got: bodyText.includes('```') ? 'found ``` in rendered text' : 'clean'
  });

  // Test A7: STRENGTH_INDEX_LIFTS is defined (catches reference-before-definition)
  results.push({
    test: 'A7: STRENGTH_INDEX_LIFTS is defined before use',
    pass: typeof STRENGTH_INDEX_LIFTS === 'object' && STRENGTH_INDEX_LIFTS.bench != null,
    got: typeof STRENGTH_INDEX_LIFTS
  });

  // Test A8: Storage utility exists and round-trips
  const storageTestKey = '__dev_test_storage__';
  Storage.set(storageTestKey, { ok: true });
  const storageRead = Storage.get(storageTestKey);
  Storage.remove(storageTestKey);
  results.push({
    test: 'A8: Storage utility round-trips JSON',
    pass: storageRead && storageRead.ok === true,
    got: JSON.stringify(storageRead)
  });

  // Report
  console.group('\uD83E\uDDEA LiftScript Dev Tests');
  for (const r of results) {
    console.log(`${r.pass ? '\u2705' : '\u274C'} ${r.test}${r.pass ? '' : ' (got: ' + r.got + ')'}`);
  }
  console.groupEnd();
}
