}

// ============================================================
// MUSCLE GRID (v1.1 Task 3: simplified - no percentile text, no bar)
// ============================================================
function renderMuscleGrid(muscleStats, recs) {
  const grid = document.getElementById('muscle-grid');

  // Build a lookup from recs for urgency + explainer + score
  const recMap = {};
  if (recs) {
    recs.forEach(r => { recMap[r.key] = r; });
  }

  // Sort by priority score (highest first) so most urgent = top-left
  const entries = Object.entries(muscleStats).sort((a, b) => {
    const scoreA = recMap[a[0]] ? recMap[a[0]].score : 0;
    const scoreB = recMap[b[0]] ? recMap[b[0]].score : 0;
    return scoreB - scoreA;
  });

  // Cross-section ring indicator for recency (Redwood aesthetic)
  function recencyRingSvg(daysSince, idealDays) {
    var remaining;
    if (daysSince === Infinity) remaining = 0;
    else remaining = Math.max(0, 1 - (daysSince / idealDays));
    var arcColor;
    if (remaining >= 0.6) arcColor = C.accent;
    else if (remaining >= 0.2) arcColor = C.warn;
    else arcColor = C.danger;
    return crossSectionRingSvg(daysSince, idealDays, arcColor);
  }

  grid.innerHTML = entries.map(([key, stat]) => {
    const weeklyVol = parseFloat((stat.totalSets30d / 4.3).toFixed(1));
    const rec = recMap[key];
    const urgency = rec ? rec.urgency : 'low';

    // Volume bar color
    const volRatio = stat.idealSetsPerWeek > 0 ? weeklyVol / stat.idealSetsPerWeek : 1;
    const volPct = Math.min(100, Math.round(volRatio * 100));

    // Recency ring
    const daysSrc = stat.daysSincePrimary;
    const ring = recencyRingSvg(daysSrc, stat.idealFreqDays);

    // Volume label
    const volLabel = `${weeklyVol % 1 === 0 ? weeklyVol.toFixed(0) : weeklyVol.toFixed(1)}/${stat.idealSetsPerWeek}`;

    // v1.25: recovery guard - muscles trained today get "RESTED" treatment
    const isRested = stat.daysSincePrimary === 0;

    // Left border uses urgency color (softer "low" tone in v1.25)
    const urgencyColors = { high: C.danger, med: C.warn, low: C.textDim };
    let uColor = urgencyColors[urgency] || C.textDim;
    // Rested muscles get sap-gold border as a distinct visual channel
    if (isRested) uColor = C.gold;

    // v1.34: bar + fraction follow urgency tier so the grid ranks visually
    // when many groups are behind (the old volume-ratio scale collapsed to
    // flat red whenever everything was <50%). >=80% volume keeps green.
    const tierBarColor = volRatio >= 0.8 ? C.accent : uColor;
    const tierTextColor = volRatio >= 0.8 ? C.accent
      : isRested ? C.gold
      : urgency === 'high' ? C.dangerText
      : urgency === 'med' ? C.warn
      : C.textMid;

    // Rested chip for the cell header
    const restedChip = isRested
      ? '<span style="display:inline-block;font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:' + C.gold + ';background:rgba(232,196,74,0.14);border:1px solid rgba(232,196,74,0.32);padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;">Rested</span>'
      : '';

    return `
      <div class="muscle-cell" style="background:${_muscleSelectMode && _selectedMuscles.has(key) ? C.accentDim : C.surface2};border-color:${_muscleSelectMode && _selectedMuscles.has(key) ? C.accentBorder : C.border};border-left:3px solid ${uColor};${_muscleSelectMode && _selectedMuscles.has(key) ? 'outline:2px solid ' + C.accent + ';outline-offset:-2px;' : ''}${isRested ? 'opacity:0.82;' : ''}" onclick="${_muscleSelectMode ? 'toggleMuscleSelection(\'' + key + '\',event)' : 'toggleMuscleDetail(\'' + key + '\')'}">
        <div class="muscle-cell-header">
          <div class="muscle-name" style="color:${isRested ? C.textMid : C.text}">${stat.name}${_muscleSelectMode && _selectedMuscles.has(key) ? ' <span style="font-size:10px;color:' + C.accent + ';">\u2713</span>' : ''}${restedChip}</div>
          ${ring}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;">${mossBarHTML(volPct, 100, tierBarColor, 6)}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:${tierTextColor};white-space:nowrap;">${volLabel}</div>
        </div>
      </div>`;
  }).join('');

  // Legend (remove stale from prior render, then add fresh)
  const prevLegend = document.getElementById('muscle-grid-legend');
  if (prevLegend) prevLegend.remove();
  grid.insertAdjacentHTML('afterend',
    `<div id="muscle-grid-legend" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:10px;font-family:'JetBrains Mono',monospace;color:${C.textDim};max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;">
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${C.danger};"></span>Overdue</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${C.warn};"></span>Due soon</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${C.accent};"></span>On track</span>
      <span style="display:flex;align-items:center;gap:3px;"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="${C.textDim}" stroke-width="1.5"/></svg>Ring = days since</span>
      <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:3px;border-radius:1px;background:${C.textDim};"></span>Bar = sets/wk</span>
    </div>`);

  // Store recs for detail panel
  _muscleRecMap = recMap;

  // Render select mode controls
  var selectControls = document.getElementById('muscle-select-controls');
  if (selectControls) {
    var btnLabel = _muscleSelectMode ? 'Cancel' : 'Build Custom';
    var btnBg = _muscleSelectMode ? C.dangerDim : C.surface2;
    var btnBorder = _muscleSelectMode ? C.danger + '30' : C.border;
    var btnColor = _muscleSelectMode ? C.dangerText : C.textMid;
    selectControls.innerHTML = '<button onclick="toggleMuscleSelectMode()" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:' + btnBg + ';border:1px solid ' + btnBorder + ';color:' + btnColor + ';font-size:11px;font-weight:600;font-family:JetBrains Mono,monospace;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;">'
      + (_muscleSelectMode ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>')
      + btnLabel + '</button>'
      + (_muscleSelectMode ? '<span style="font-size:10px;color:' + C.textDim + ';font-family:JetBrains Mono,monospace;">Tap muscles to select</span>' : '');
  }

  // Render floating build button
  var fab = document.getElementById('muscle-build-fab');
  if (fab) {
    if (_muscleSelectMode && _selectedMuscles.size > 0) {
      fab.style.display = 'block';
      fab.innerHTML = '<button onclick="buildCustomSession()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;background:' + C.accent + ';border:1px solid ' + C.accentBorder + ';color:' + C.text + ';font-size:13px;font-weight:700;font-family:JetBrains Mono,monospace;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>Build Session (' + _selectedMuscles.size + ')</button>';
    } else {
      fab.style.display = 'none';
      fab.innerHTML = '';
    }
  }

  // Click outside any cell to deselect (attach once)
  if (!grid.dataset.clickOutside) {
    grid.dataset.clickOutside = '1';
    grid.addEventListener('click', function(e) {
      if (!e.target.closest('.muscle-cell')) {
        const detailEl = document.getElementById('muscle-detail');
        if (detailEl && detailEl.classList.contains('open')) {
          detailEl.style.maxHeight = '0';
          detailEl.classList.remove('open');
          selectedMuscleKey = null;
          document.querySelectorAll('.muscle-cell').forEach(c => c.style.outline = 'none');
        }
      }
    });
  }
}


let selectedMuscleKey = null;
let _muscleRecMap = {};

function toggleMuscleDetail(key) {
  if (_muscleSelectMode) return; // Suppress detail panel in select mode
  const detailEl = document.getElementById('muscle-detail');
  const innerEl = document.getElementById('muscle-detail-inner');

  if (selectedMuscleKey === key && detailEl.classList.contains('open')) {
    detailEl.style.maxHeight = '0';
    detailEl.classList.remove('open');
    selectedMuscleKey = null;
    document.querySelectorAll('.muscle-cell').forEach(c => c.style.outline = 'none');
    return;
  }

  selectedMuscleKey = key;
  const rec = _muscleRecMap[key] || null;

  if (rec) {
    innerEl.innerHTML = rec.explainer;
  } else {
    innerEl.innerHTML = 'No analysis available.';
  }

  detailEl.classList.add('open');
  detailEl.style.maxHeight = innerEl.scrollHeight + 24 + 'px';

  // v1.34: bring the explainer into view -- top-row taps otherwise look inert
  setTimeout(function() {
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    try { detailEl.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
  }, 200);

  // Highlight selected cell
  document.querySelectorAll('.muscle-cell').forEach(c => c.style.outline = 'none');
  const cells = document.querySelectorAll('.muscle-cell');
  const entries = Object.entries(muscleAnalysis || {}).sort((a, b) => {
    const rm = _muscleRecMap;
    return (rm[b[0]] ? rm[b[0]].score : 0) - (rm[a[0]] ? rm[a[0]].score : 0);
  });
  const idx = entries.findIndex(([k]) => k === key);
  if (idx >= 0 && cells[idx]) {
    cells[idx].style.outline = `1.5px solid ${C.accent}`;
  }
}

// ============================================================
// WEEKLY SUMMARY (v1.11 Item 7)
// ============================================================
function renderWeeklySummary(dayWorkoutsMap, dayMuscleMap, dayCardioMap, workouts) {
  const container = document.getElementById('weekly-summary');
  if (!container) return;

  const now = new Date();
  const muscleTotal = Object.keys(MUSCLE_GROUPS).length;

  // Helper: compute stats for a 7-day window ending on `endDate`
  function weekStats(endDate) {
    const sessions = new Set();
    let totalSets = 0;
    const musclesHit = new Set();
    let cardioMin = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(endDate);
      d.setDate(d.getDate() - i);
      const key = localDateStr(d);
      // Lifting
      const exs = dayWorkoutsMap[key];
      if (exs && exs.length > 0) {
        sessions.add(key);
        for (const ex of exs) totalSets += ex.sets;
      }
      // Muscles
      const muscles = dayMuscleMap[key];
      if (muscles) {
        for (const m of Object.keys(muscles)) {
          if (muscles[m] > 0) musclesHit.add(m);
        }
      }
      // Cardio
      const cd = dayCardioMap[key];
      if (cd && cd.minutes) cardioMin += cd.minutes;
    }
    return { sessions: sessions.size, totalSets, musclesHit: musclesHit.size, cardioMin };
  }

  const thisWeek = weekStats(now);
  const lastWeekEnd = new Date(now);
  lastWeekEnd.setDate(lastWeekEnd.getDate() - 7);
  const lastWeek = weekStats(lastWeekEnd);

  // Delta helper
  function delta(curr, prev) {
    const diff = curr - prev;
    if (diff === 0 || prev === 0) return '';
    const sign = diff > 0 ? '+' : '';
    return `<span style="font-size:10px;font-family:'JetBrains Mono',monospace;color:${diff > 0 ? C.accent : C.warn};margin-left:4px;">${sign}${diff}</span>`;
  }

  // Cardio bar
  const cardioTarget = CARDIO_WEEKLY_TARGETS.totalMinModerate;
  const cardioPct = Math.min(100, Math.round((thisWeek.cardioMin / cardioTarget) * 100));
  const cardioBarColor = cardioPct >= 100 ? C.accent : cardioPct >= 50 ? C.blue : C.warn;

  const statStyle = `padding:12px;border-radius:8px;border:1px solid ${C.border};background:${C.surface2};text-align:center;`;
  const labelStyle = `font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:${C.textDim};font-family:'JetBrains Mono',monospace;margin-bottom:4px;`;
  const valueStyle = `font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:${C.text};line-height:1.2;`;
  const subStyle = `font-size:11px;font-family:'JetBrains Mono',monospace;color:${C.textDark};`;

  container.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
      <div style="${statStyle}">
        <div style="${labelStyle}">Sessions</div>
        <div style="${valueStyle}">${thisWeek.sessions}${delta(thisWeek.sessions, lastWeek.sessions)}</div>
        <div style="${subStyle}">of 7 days</div>
      </div>
      <div style="${statStyle}">
        <div style="${labelStyle}">Volume</div>
        <div style="${valueStyle}">${thisWeek.totalSets}${delta(thisWeek.totalSets, lastWeek.totalSets)}</div>
        <div style="${subStyle}">total sets</div>
      </div>
      <div style="${statStyle}">
        <div style="${labelStyle}">Coverage</div>
        <div style="${valueStyle}">${thisWeek.musclesHit}<span style="font-size:14px;font-weight:400;color:${C.textDim};">/${muscleTotal}</span></div>
        <div style="${subStyle}">muscles</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:${cardioPct >= 100 ? C.accent : C.text};font-weight:600;white-space:nowrap;">${Math.round(thisWeek.cardioMin)}/${cardioTarget}m</div>
      <div style="flex:1;height:5px;border-radius:3px;background:${C.surface3};overflow:hidden;">
        <div style="height:100%;border-radius:3px;background:${cardioBarColor};width:${cardioPct}%;transition:width 0.4s ease;"></div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${C.textDim};white-space:nowrap;">cardio</div>
    </div>`;
}

// HEATMAP (v1.7: 12 days, no scroll, no direction row)

let heatmapDayWorkouts = {};
let heatmapDayCardio = {};
let selectedHeatmapDay = null;
let _consecutiveTrainDays = 0;

// Count consecutive training days ending today (or yesterday)
function countConsecutiveTrainingDays(dayWorkoutsMap) {
  const now = new Date();
  let count = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    if (dayWorkoutsMap[key] && dayWorkoutsMap[key].length > 0) {
      count++;
    } else {
      // Allow skipping today if it's early -- check if yesterday continues a streak
      if (i === 0) continue;
      break;
    }
  }
  return count;
}

function renderHeatmap(dayMuscleMap, dayWorkoutsMap, dayCardioMap) {
  heatmapDayWorkouts = dayWorkoutsMap;
  heatmapDayCardio = dayCardioMap || {};
  const container = document.getElementById('heatmap-container');
  const muscleKeys = ['chest', 'back', 'shoulders', 'quads', 'hamstrings', 'glutes', 'biceps', 'triceps', 'calves', 'core', 'neck', 'forearms'];
  const muscleLabels = ['Chest', 'Back', 'Shldr', 'Quads', 'Hams', 'Glts', 'Bis', 'Tris', 'Calves', 'Core', 'Neck', 'F.Arms'];

  const CARDIO_THRESHOLD_MIN = 15; // minimum minutes for a lit cell

  const now = new Date();
  const days = [];
  const numDays = 14;
  for (let i = numDays - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(localDateStr(d));
  }

  let maxSets = 0;
  for (const [, muscles] of Object.entries(dayMuscleMap)) {
    for (const [, sets] of Object.entries(muscles)) {
      if (sets > maxSets) maxSets = sets;
    }
  }
  if (maxSets === 0) maxSets = 1;

  const labelWidth = 54;
  const cellSize = 16;
  const totalRows = muscleKeys.length + 1; // +1 for cardio
  let html = '';

  html += `<div class="heatmap-grid" style="grid-template-columns: ${labelWidth}px repeat(${numDays}, ${cellSize}px); grid-template-rows: 22px repeat(${totalRows}, ${cellSize}px);">`;

  // Day labels row -- evenly spaced for 14 days
  html += `<div></div>`;
  for (let i = 0; i < days.length; i++) {
    const d = new Date(days[i] + 'T12:00:00');
    const isFirst = i === 0;
    const isLast = i === days.length - 1;
    const isMid1 = i === 4;
    const isMid2 = i === 9;
    let label = '';
    if (isFirst || isMid1 || isMid2) {
      label = `${d.getMonth() + 1}/${d.getDate()}`;
    } else if (isLast) {
      label = 'Today';
    }
    html += `<div class="heatmap-day-labels">${label}</div>`;
  }

  // Muscle rows
  for (let m = 0; m < muscleKeys.length; m++) {
    const mKey = muscleKeys[m];
    html += `<div class="heatmap-label">${muscleLabels[m]}</div>`;
    for (const day of days) {
      const sets = (dayMuscleMap[day] && dayMuscleMap[day][mKey]) || 0;
      // v1.25: 5-step graduated fill - discrete levels read more clearly than continuous
      let bgColor;
      if (sets === 0) bgColor = C.surface2;
      else if (sets <= 4) bgColor = 'rgba(95,160,82,0.22)';
      else if (sets <= 9) bgColor = 'rgba(95,160,82,0.42)';
      else if (sets <= 14) bgColor = 'rgba(95,160,82,0.65)';
      else bgColor = 'rgba(95,160,82,0.88)';
      html += `<div class="heatmap-cell" style="background:${bgColor}" data-day="${day}" onclick="selectHeatmapDay('${day}')" title="${day}: ${formatSets(sets)} sets"></div>`;
    }
  }

  // Cardio row (blue, opacity scales with duration: 15 min -> 0.3, 30 -> 0.6, 45+ -> 1.0)
  html += `<div class="heatmap-label" style="color:${C.blue}">Cardio</div>`;
  for (const day of days) {
    const cd = heatmapDayCardio[day];
    const min = cd ? cd.minutes : 0;
    let bgColor = C.surface2;
    if (min >= CARDIO_THRESHOLD_MIN) {
      const opacity = Math.max(0.3, Math.min((min - 15) / 30 + 0.3, 1));
      bgColor = `rgba(96, 165, 250, ${opacity.toFixed(2)})`; // blue RGB
    }
    const title = min > 0 ? `${day}: ${Math.round(min)} min cardio` : day;
    html += `<div class="heatmap-cell" style="background:${bgColor}" data-day="${day}" onclick="selectHeatmapDay('${day}')" title="${title}"></div>`;
  }

  html += '</div>';
  // v1.25: legend strip showing the 5-step volume scale
  html += '<div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:12px;font-family:var(--font-mono);font-size:9px;color:' + C.textDim + ';letter-spacing:0.08em;text-transform:uppercase;">'
    + '<span style="margin-right:4px;">Less</span>'
    + '<div style="width:12px;height:12px;border-radius:2px;background:' + C.surface2 + ';"></div>'
    + '<div style="width:12px;height:12px;border-radius:2px;background:rgba(95,160,82,0.22);"></div>'
    + '<div style="width:12px;height:12px;border-radius:2px;background:rgba(95,160,82,0.42);"></div>'
    + '<div style="width:12px;height:12px;border-radius:2px;background:rgba(95,160,82,0.65);"></div>'
    + '<div style="width:12px;height:12px;border-radius:2px;background:rgba(95,160,82,0.88);"></div>'
    + '<span style="margin-left:4px;">More</span>'
    + '</div>';
  container.innerHTML = html;

  // Click outside any cell to deselect (attach once)
  if (!container.dataset.clickOutside) {
    container.dataset.clickOutside = '1';
    container.addEventListener('click', function(e) {
      if (!e.target.classList.contains('heatmap-cell')) {
        const detailEl = document.getElementById('heatmap-day-detail');
        if (detailEl.classList.contains('open')) {
          detailEl.style.maxHeight = '0';
          detailEl.classList.remove('open');
          selectedHeatmapDay = null;
          document.querySelectorAll('.heatmap-cell').forEach(c => { c.style.outline = 'none'; });
        }
      }
    });
  }
}

function selectHeatmapDay(day) {
  const detailEl = document.getElementById('heatmap-day-detail');
  const innerEl = document.getElementById('heatmap-day-detail-inner');

  if (selectedHeatmapDay === day && detailEl.classList.contains('open')) {
    detailEl.style.maxHeight = '0';
    detailEl.classList.remove('open');
    selectedHeatmapDay = null;
    return;
  }

  selectedHeatmapDay = day;
  const exercises = heatmapDayWorkouts[day] || [];
  const cardio = heatmapDayCardio[day] || null;
  const dateObj = new Date(day + 'T12:00:00');
  const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  const hasLifts = exercises.length > 0;
  const hasCardio = cardio && cardio.sessions && cardio.sessions.length > 0;

  if (!hasLifts && !hasCardio) {
    innerEl.innerHTML = `<div class="detail-date">${dateStr}</div><div style="color:${C.textDim};font-size:12px;">Rest day</div>`;
  } else {
    let html = `<div class="detail-date">${dateStr}</div>`;
    for (const ex of exercises) {
      const weightStr = ex.bestWeight > 0 ? ` @ ${ex.bestWeight}lbs` : '';
      html += `<div class="detail-exercise">
        <span class="detail-name">${ex.name}</span>
        <span class="detail-sets">${ex.sets}s${ex.bestReps > 0 ? ` \u00d7 ${ex.bestReps}r` : ''}${weightStr}</span>
      </div>`;
    }
    if (hasCardio) {
      for (const sess of cardio.sessions) {
        const icon = sess.source === 'watch' ? '\u231A' : '\uD83C\uDFCB\uFE0F';
        html += `<div class="detail-exercise">
          <span class="detail-name" style="color:${C.blue}">${icon} ${sess.name}</span>
          <span class="detail-sets" style="color:${C.blue}">${sess.minutes} min</span>
        </div>`;
      }
    }
    innerEl.innerHTML = html;
  }

  detailEl.classList.add('open');
  detailEl.style.maxHeight = innerEl.scrollHeight + 24 + 'px';

  document.querySelectorAll('.heatmap-cell').forEach(cell => {
    cell.style.outline = cell.dataset.day === day ? `1.5px solid ${C.accent}` : 'none';
  });
}

// Dismiss heatmap selection when tapping outside
document.addEventListener('click', function(e) {
  if (!selectedHeatmapDay) return;
  if (e.target.closest('.heatmap-container, .heatmap-day-detail')) return;
  const detailEl = document.getElementById('heatmap-day-detail');
  if (detailEl && detailEl.classList.contains('open')) {
    detailEl.style.maxHeight = '0';
    detailEl.classList.remove('open');
    selectedHeatmapDay = null;
    document.querySelectorAll('.heatmap-cell').forEach(cell => { cell.style.outline = 'none'; });
  }
});

// WEIGHT CHART + SI (v1.1 Task 2: always-visible SI panel)
// ============================================================
let _chartPoints = []; // [{x, y, date, weight, si, cs, ded}] for click interaction
let _chartTooltipTimer = null;
// v1.27: chart defaults to weight + one secondary line. Secondary is persisted in localStorage.
var _chartSecondary = (function() {
  try {
    var s = localStorage.getItem('chart_secondary_v1');
    if (s === 'none') return null; // v1.35: weight-only view now persists
    if (s && ['si','cardio','dedication','bodyComp'].indexOf(s) !== -1) return s;
  } catch(_) {}
  return 'si';
})();
const _chartLineVisible = {
  weight: true,
  si:         _chartSecondary === 'si',
  cardio:     _chartSecondary === 'cardio',
  dedication: _chartSecondary === 'dedication',
  bodyComp:   _chartSecondary === 'bodyComp',
};
let _chartPeriod = '1Y'; // '1M', '3M', '6M', '1Y', 'ALL'

function showChartTooltip(canvas, pt) {
  const parent = canvas.parentElement;
  // Remove existing
  const old = parent.querySelector('.chart-tooltip');
  if (old) old.remove();
  if (_chartTooltipTimer) clearTimeout(_chartTooltipTimer);

  const dateObj = new Date(pt.date + 'T12:00:00');
  const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  let label = `${pt.weight.toFixed(1)} lbs`;
  if (pt.si) label += `<br><span style="color:${C.strength};">SI ${pt.si.toFixed(2)}</span>`;
  if (pt.cs) label += `<br><span style="color:${C.dangerText};">CF ${pt.cs.toFixed(2)}</span>`;
  if (pt.ded) label += `<br><span style="color:${C.gold};">Ded ${pt.ded.toFixed(2)}</span>`;
  if (pt.bc) label += `<br><span style="color:${C.pink};">BC ${pt.bc.toFixed(2)}</span>`;

  const tip = document.createElement('div');
  tip.className = 'chart-tooltip';
  // Clamp horizontal position
  const tipX = Math.max(40, Math.min(pt.x, parent.offsetWidth - 40));
  const above = pt.y > 60;
  tip.style.cssText = `position:absolute;left:${tipX}px;${above ? 'top' : 'bottom'}:${above ? (pt.y - 44) + 'px' : (150 - pt.y + 12) + 'px'};transform:translateX(-50%);background:${C.surface3};border:1px solid ${C.border};border-radius:6px;padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:${C.text};text-align:center;white-space:nowrap;pointer-events:none;z-index:10;opacity:1;transition:opacity 0.6s ease;line-height:1.4;`;
  tip.innerHTML = `<div style="font-weight:600;">${label}</div><div style="font-size:10px;color:${C.textDim};">${dateStr}</div>`;
  parent.appendChild(tip);

  // Draw highlight dot on canvas
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = C.accent;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = C.bg;
  ctx.fill();
  ctx.restore();

  // Auto-fade after 3s
  _chartTooltipTimer = setTimeout(() => {
    tip.style.opacity = '0';
    setTimeout(() => tip.remove(), 600);
    // Redraw chart to clear highlight dot
    renderWeightChart();
  }, 3000);
}

function renderWeightChart() {
  WEIGHT_DATA = getMergedWeightData();

  // Update bodyweight BEFORE populating strength detail so benchmarks use fresh weight
  if (WEIGHT_DATA.length > 0) PROFILE.bodyweightLbs = WEIGHT_DATA[0].value;

  // ALWAYS populate strength detail BEFORE any early returns
  populateStrengthDetail();
  renderPRBoard();

  if (WEIGHT_DATA.length === 0) return;

  const cutoff = new Date();
  if (_chartPeriod === '1M') cutoff.setMonth(cutoff.getMonth() - 1);
  else if (_chartPeriod === '3M') cutoff.setMonth(cutoff.getMonth() - 3);
  else if (_chartPeriod === '6M') cutoff.setMonth(cutoff.getMonth() - 6);
  else if (_chartPeriod === '1Y') cutoff.setFullYear(cutoff.getFullYear() - 1);
  else cutoff.setFullYear(2000); // ALL
  const recent = WEIGHT_DATA.filter(d => new Date(d.date) >= cutoff).reverse();
  if (recent.length === 0) return;

  const current = WEIGHT_DATA[0].value;
  const prev = WEIGHT_DATA.length > 1 ? WEIGHT_DATA[1].value : current;
  const delta = current - prev;

  document.getElementById('weight-current').textContent = current.toFixed(1);
  const deltaEl = document.getElementById('weight-delta');
  deltaEl.textContent = `${delta >= 0 ? '+' : ''}${delta.toFixed(1)}`;
  deltaEl.style.color = delta <= 0 ? C.accent : C.warn;

  // Period selector chips
  const periodChipsEl = document.getElementById('chart-period-chips');
  if (periodChipsEl) {
    const periods = ['1M', '3M', '6M', '1Y', 'ALL'];
    periodChipsEl.innerHTML = periods.map(function(p) {
      var isActive = _chartPeriod === p;
      var bg = isActive ? C.accentDim : C.surface2;
      var color = isActive ? C.accent : C.textDim;
      var border = isActive ? C.accentBorder : C.border;
      return '<div onclick="setChartPeriod(\'' + p + '\')" style="padding:3px 10px;border-radius:5px;font-family:JetBrains Mono,monospace;font-size:11px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;background:' + bg + ';color:' + color + ';border:1px solid ' + border + ';">' + p + '</div>';
    }).join('');
  }

  // Canvas
  const canvas = document.getElementById('weight-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 150 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '150px';
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = 150;
  const pad = { top: 12, bottom: 22, left: 0, right: 0 };
  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;

  const wValues = recent.map(d => d.value);
  const wMin = Math.min(...wValues) - 2;
  const wMax = Math.max(...wValues) + 2;
  // v1.36: weight points were index-spaced (even pixels per weigh-in) while
  // every overlay line (SI/CF/Ded/BC) was time-proportional -- two different
  // x-axes on one canvas. With irregular weigh-in intervals this distorted
  // the visual co-movement the chart exists to show. Weight now uses the
  // same day-offset mapping as the overlays.
  const wFirstDate = recent[0].date;
  const wLastDate = recent[recent.length - 1].date;
  const wTotalDays = (new Date(wLastDate) - new Date(wFirstDate)) / (1000 * 60 * 60 * 24);
  const wXForDate = function(dateStr) {
    if (wTotalDays <= 0) return pad.left;
    const off = (new Date(dateStr) - new Date(wFirstDate)) / (1000 * 60 * 60 * 24);
    return pad.left + (off / wTotalDays) * chartW;
  };

  // Weight line (always visible - base layer) - v1.27: thicker
  _chartPoints = []; // reset
  ctx.beginPath();
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  recent.forEach((d, i) => {
    const x = wXForDate(d.date);
    const y = pad.top + (1 - (d.value - wMin) / (wMax - wMin)) * chartH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    _chartPoints.push({ x, y, date: d.date, weight: d.value, si: null, cs: null, ded: null, bc: null });
  });
  ctx.stroke();

  // Gradient fill
  const lastX = wXForDate(wLastDate);
  ctx.lineTo(lastX, h - pad.bottom);
  ctx.lineTo(pad.left, h - pad.bottom);
  ctx.closePath();
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, 'rgba(95,160,82,0.28)'); // Redwood accent gradient
  gradient.addColorStop(1, 'rgba(95,160,82,0)');
  ctx.fillStyle = gradient;
  ctx.fill();

  // Endpoint dots
  [0, recent.length - 1].forEach(i => {
    const x = wXForDate(recent[i].date);
    const y = pad.top + (1 - (recent[i].value - wMin) / (wMax - wMin)) * chartH;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = C.accent;
    ctx.fill();
  });

  // Strength Index line
  if (strengthIndexData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const siFiltered = strengthIndexData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (siFiltered.length >= 2) {
      const siValues = siFiltered.map(d => d.index);
      const siMin = Math.min(...siValues) - 0.1;
      const siMax = Math.max(...siValues) + 0.1;

      if (_chartLineVisible.si) {
        // v1.27: tier threshold rules at SI=1.30 (Advanced) and SI=1.80 (Elite)
        // Only draw if threshold is within the visible Y range
        ctx.save();
        ctx.strokeStyle = C.textDim;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 4]);
        [{ v: 1.30, label: 'ADV' }, { v: 1.80, label: 'ELT' }].forEach(function(t) {
          if (t.v >= siMin && t.v <= siMax) {
            var ty = pad.top + (1 - (t.v - siMin) / (siMax - siMin)) * chartH;
            ctx.beginPath();
            ctx.moveTo(pad.left, ty);
            ctx.lineTo(pad.left + chartW, ty);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.font = '9px ' + '-apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = C.textDim;
            ctx.globalAlpha = 0.6;
            ctx.fillText(t.label, pad.left + 4, ty - 3);
            ctx.globalAlpha = 0.45;
            ctx.setLineDash([2, 4]);
          }
        });
        ctx.restore();

        ctx.beginPath();
        ctx.strokeStyle = C.strength;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        siFiltered.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.index - siMin) / (siMax - siMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
        [0, siFiltered.length - 1].forEach(i => {
          const d = siFiltered[i];
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.index - siMin) / (siMax - siMin)) * chartH;
          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = C.strength;
          ctx.fill();
        });
      }

      // Attach SI values to nearest weight points (always, for tooltip)
      for (const sid of siFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(sid.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) closest.si = sid.index;
      }
    }
  }

  // Cardio Fitness line (vitals-only)
  if (cardioScoreData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const csFiltered = cardioScoreData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (csFiltered.length >= 2) {
      const csValues = csFiltered.map(d => d.score);
      const csMin = Math.min(...csValues) - 0.1;
      const csMax = Math.max(...csValues) + 0.1;

      if (_chartLineVisible.cardio) {
        ctx.beginPath();
        ctx.strokeStyle = C.danger;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        csFiltered.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - csMin) / (csMax - csMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
        [0, csFiltered.length - 1].forEach(i => {
          const d = csFiltered[i];
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - csMin) / (csMax - csMin)) * chartH;
          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = C.danger;
          ctx.fill();
        });
      }

      // Attach CS values to nearest weight points (always, for tooltip)
      for (const csd of csFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(csd.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) {
          closest.cs = csd.score;
        }
      }
    }
  }

  // Dedication line (effort + consistency, rolling 7d, smoothed)
  if (dedicationData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const dedFiltered = dedicationData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (dedFiltered.length >= 2) {
      // 5-point moving average to tame daily spikes
      const SMOOTH_W = Math.min(5, dedFiltered.length);
      const smoothed = dedFiltered.map((d, i) => {
        let sum = 0, count = 0;
        for (let j = Math.max(0, i - Math.floor(SMOOTH_W / 2)); j <= Math.min(dedFiltered.length - 1, i + Math.floor(SMOOTH_W / 2)); j++) {
          sum += dedFiltered[j].score;
          count++;
        }
        return { date: d.date, score: sum / count };
      });

      const dedValues = smoothed.map(d => d.score);
      const dedMin = Math.min(...dedValues) - 0.05;
      const dedMax = Math.max(...dedValues) + 0.05;

      if (_chartLineVisible.dedication) {
        ctx.beginPath();
        ctx.strokeStyle = C.gold;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([2, 3]);
        smoothed.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - dedMin) / (dedMax - dedMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Attach ded values to nearest weight points (raw values for tooltip)
      for (const dd of dedFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(dd.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) {
          closest.ded = dd.score;
        }
      }
    }
  }

  // Body Composition line
  if (bodyCompData.length >= 2) {
    const wDates = recent.map(d => d.date);
    const firstDate = wDates[0];
    const lastDate = wDates[wDates.length - 1];
    const totalDays = (new Date(lastDate) - new Date(firstDate)) / (1000 * 60 * 60 * 24);

    const bcFiltered = bodyCompData.filter(d => d.date >= firstDate && d.date <= lastDate);
    if (bcFiltered.length >= 2) {
      const bcValues = bcFiltered.map(d => d.score);
      const bcMin = Math.min(...bcValues) - 0.05;
      const bcMax = Math.max(...bcValues) + 0.05;

      if (_chartLineVisible.bodyComp) {
        ctx.beginPath();
        ctx.strokeStyle = C.pink;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        bcFiltered.forEach((d, i) => {
          const dayOffset = (new Date(d.date) - new Date(firstDate)) / (1000 * 60 * 60 * 24);
          const x = pad.left + (totalDays > 0 ? (dayOffset / totalDays) : 0) * chartW;
          const y = pad.top + (1 - (d.score - bcMin) / (bcMax - bcMin)) * chartH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Attach BC values to nearest weight points (for tooltip)
      for (const bcd of bcFiltered) {
        let closest = null, bestDist = Infinity;
        for (const pt of _chartPoints) {
          const dist = Math.abs(new Date(pt.date) - new Date(bcd.date));
          if (dist < bestDist) { bestDist = dist; closest = pt; }
        }
        if (closest && bestDist < 3 * 24 * 60 * 60 * 1000) {
          closest.bc = bcd.score;
        }
      }
    }
  }

  // Date labels
  ctx.fillStyle = C.textDark2;
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(recent[0].date.substring(5), pad.left, h - 4);
  ctx.textAlign = 'right';
  ctx.fillText(recent[recent.length - 1].date.substring(5), w - pad.right, h - 4);

  // Click-to-inspect handler (attach once)
  if (!canvas.dataset.chartClick) {
    canvas.dataset.chartClick = '1';
    canvas.style.cursor = 'crosshair';
    canvas.addEventListener('click', function(e) {
      if (_chartPoints.length === 0) return;
      const r = canvas.getBoundingClientRect();
      const clickX = e.clientX - r.left;
      let closest = _chartPoints[0], bestDist = Infinity;
      for (const pt of _chartPoints) {
        const dist = Math.abs(pt.x - clickX);
        if (dist < bestDist) { bestDist = dist; closest = pt; }
      }
      showChartTooltip(canvas, closest);
    });
  }

  // Populate chart legend dynamically with tap-to-toggle
  const legendEl = document.getElementById('weight-chart-legend');
  if (legendEl) {
    const items = [
      { key: 'weight', color: C.accent, label: 'Weight', alwaysOn: true },
      { key: 'si', color: C.strength, label: 'Strength' },
      { key: 'cardio', color: C.danger, label: 'Cardio' },
      { key: 'dedication', color: C.gold, label: 'Dedication' },
      { key: 'bodyComp', color: C.pink, label: 'Body Comp' },
    ];
    // v1.27: filled 12px circle when active, 2px ring when inactive
    legendEl.innerHTML = items.map(it => {
      const vis = it.alwaysOn || _chartLineVisible[it.key];
      const textOpacity = vis ? '1' : '0.55';
      const cursor = it.alwaysOn ? 'default' : 'pointer';
      const onclick = it.alwaysOn ? '' : ` onclick="toggleChartLine('${it.key}')"`;
      // Active = filled circle with subtle ring halo. Inactive = outlined only.
      const dotStyle = vis
        ? `display:inline-block;width:12px;height:12px;border-radius:50%;background:${it.color};margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px ${it.color}22;`
        : `display:inline-block;width:12px;height:12px;border-radius:50%;background:transparent;border:1.5px solid ${it.color};margin-right:6px;vertical-align:middle;box-sizing:border-box;`;
      return `<span style="opacity:${textOpacity};cursor:${cursor};-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;padding:6px 4px;min-height:28px;"${onclick}><span style="${dotStyle}"></span>${it.label}</span>`;
    }).join('');
  }
}

function toggleChartLine(key) {
  if (key === 'weight') return; // base layer stays on
  // v1.27: exclusive single-secondary. Tapping the active one turns it off (weight-only).
  if (_chartLineVisible[key]) {
    _chartLineVisible[key] = false;
    _chartSecondary = null;
  } else {
    // Turn off all others, turn on this one
    ['si','cardio','dedication','bodyComp'].forEach(function(k) { _chartLineVisible[k] = false; });
    _chartLineVisible[key] = true;
    _chartSecondary = key;
  }
  try { localStorage.setItem('chart_secondary_v1', _chartSecondary || 'none'); } catch(_) {}
  haptic(4);
  renderWeightChart();
}

function setChartPeriod(period) {
  _chartPeriod = period;
  haptic(5);
  // v1.26: fade canvas out, redraw, fade back in
  var canvas = document.getElementById('weight-canvas');
  if (canvas) {
    canvas.style.opacity = '0';
    setTimeout(function() {
      renderWeightChart();
      canvas.style.opacity = '1';
    }, 140);
  } else {
    renderWeightChart();
  }
}

// ============================================================
// TIER EMBLEMS (v1.13: visual rank icons for categories)
// ============================================================
function tierEmblem(label, color) {
  // Map labels to tier rank (1-5) for distinct icon shapes
  const tierMap = {
    'Low': 1, 'Developing': 1, 'Elevated': 1, 'Above Avg': 1, 'Poor': 1,
    'Normal': 2, 'Fair': 2, 'Moderate': 2,
    'Good': 3, 'Average': 3, 'Intermediate': 3, 'Fit': 3,
    'Athletic': 4, 'Active': 4, 'High': 4, 'Advanced': 4, 'Great': 4,
    'Elite': 5, 'Excellent': 5,
  };
  const tier = tierMap[label] || 2;
  const s = 12; // svg size

  let icon;
  if (tier === 1) {
    // hollow circle
    icon = `<circle cx="6" cy="6" r="4" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  } else if (tier === 2) {
    // filled circle
    icon = `<circle cx="6" cy="6" r="4" fill="${color}" opacity="0.7"/>`;
  } else if (tier === 3) {
    // diamond
    icon = `<path d="M6 2L10 6L6 10L2 6Z" fill="${color}" opacity="0.8"/>`;
  } else if (tier === 4) {
    // shield/chevron up
    icon = `<path d="M6 1.5L10.5 4V7.5C10.5 9.5 8.5 11 6 11.5C3.5 11 1.5 9.5 1.5 7.5V4L6 1.5Z" fill="${color}" opacity="0.85"/>`;
  } else {
    // star
    icon = `<path d="M6 1L7.5 4.5L11 5L8.5 7.5L9 11L6 9.5L3 11L3.5 7.5L1 5L4.5 4.5Z" fill="${color}"/>`;
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="vertical-align:middle;margin-right:3px;flex-shrink:0;">${icon}</svg>`;
}

// Format a tier badge (emblem + label) for inline use
function tierBadge(label, color) {
  return tierEmblem(label, color) + `<span style="color:${color};font-weight:600;">${label}</span>`;
}

// ============================================================
// PERSONAL RECORDS BOARD (merged into Strength Index rows)
// ============================================================
function renderPRBoard() {
  const container = document.getElementById('pr-board');
  if (!container) return;
  if (!strengthIndexData || strengthIndexData.length === 0) { container.innerHTML = ''; return; }

  // Build per-lift 1RM history from SI timeline
  const liftKeys = ['bench', 'squat', 'deadlift', 'ohp', 'row'];
  const liftLabels = { bench: 'Bench', squat: 'Squat', deadlift: 'Deadlift', ohp: 'OHP', row: 'Row' };
  const liftHistory = {};
  for (const k of liftKeys) liftHistory[k] = [];

  for (const entry of strengthIndexData) {
    for (const k of liftKeys) {
      if (entry.lifts && entry.lifts[k] && entry.lifts[k].rm > 0) {
        liftHistory[k].push({ date: entry.date, rm: entry.lifts[k].rm });
      }
    }
  }

  // Find all-time PR, previous PR, and date for each lift
  const prData = {};
  for (const k of liftKeys) {
    const hist = liftHistory[k];
    if (hist.length === 0) continue;
    let allTimePR = 0, prDate = '', prevPR = 0;
    for (const h of hist) {
      if (h.rm > allTimePR) {
        prevPR = allTimePR;
        allTimePR = h.rm;
        prDate = h.date;
      }
    }
    const current = hist[hist.length - 1].rm;
    prData[k] = { current, allTimePR, prDate, prevPR, history: hist };
  }

  // Mini sparkline SVG builder
  function prSparkline(hist) {
    if (hist.length < 2) return '';
    const vals = hist.map(function(h) { return h.rm; });
    var mn = Math.min.apply(null, vals);
    var mx = Math.max.apply(null, vals);
    if (mx === mn) { mn -= 1; mx += 1; }
    var w = 100, h = 22, pad = 2;
    var pts = [];
    for (var i = 0; i < vals.length; i++) {
      var x = pad + (i / (vals.length - 1)) * (w - 2 * pad);
      var y = pad + (1 - (vals[i] - mn) / (mx - mn)) * (h - 2 * pad);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    var trending = vals[vals.length - 1] >= vals[Math.max(0, vals.length - 4)];
    var lineColor = trending ? C.accent : C.warn;
    // v1.27: dot at every historical PR point (prior = small dim, latest = larger accent)
    var histDots = '';
    for (var di = 0; di < pts.length; di++) {
      var p = pts[di].split(',');
      var isLatest = di === pts.length - 1;
      histDots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (isLatest ? '2.2' : '1.5') + '" fill="' + (isLatest ? lineColor : C.textDim) + '"/>';
    }
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="display:block;">' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + lineColor + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      histDots +
      '</svg>';
  }

  var html = '<div style="margin-top:10px;padding-top:0;">' + branchDividerHTML() +
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:' + C.textDim + ';font-family:JetBrains Mono,monospace;margin-bottom:10px;">Personal Records</div>';

  var hasAny = false;
  for (var ki = 0; ki < liftKeys.length; ki++) {
    var k = liftKeys[ki];
    var pr = prData[k];
    if (!pr) continue;
    hasAny = true;
    var prDateObj = new Date(pr.prDate + 'T12:00:00');
    var prDateStr = prDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var isAtPR = pr.current >= pr.allTimePR;
    var delta = pr.prevPR > 0 ? pr.allTimePR - pr.prevPR : 0;
    var deltaStr = delta > 0 ? '+' + delta + ' lbs' : '';

    var prBadge = isAtPR
      ? '<span style="font-size:9px;font-weight:600;color:' + C.accent + ';padding:1px 5px;border-radius:3px;background:' + C.accentDim + ';font-family:JetBrains Mono,monospace;letter-spacing:0.5px;margin-left:6px;">CURRENT</span>'
      : '<span style="font-size:10px;color:' + C.textDim + ';font-family:JetBrains Mono,monospace;margin-left:6px;">' + Math.round((pr.current / pr.allTimePR) * 100) + '% of PR</span>';

    html += '<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:none;">' +
      '<div style="width:80px;font-size:13px;font-weight:600;color:' + C.text + ';font-family:JetBrains Mono,monospace;flex-shrink:0;">' + liftLabels[k] + '</div>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:baseline;gap:4px;">' +
          '<span style="font-family:JetBrains Mono,monospace;font-size:16px;font-weight:700;color:' + (isAtPR ? C.accent : C.text) + ';">' + pr.allTimePR + '</span>' +
          '<span style="font-size:10px;color:' + C.textDark + ';font-family:JetBrains Mono,monospace;">lbs</span>' +
          prBadge +
        '</div>' +
        '<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:' + C.textDim + ';">' +
          prDateStr + (deltaStr ? ' \u00b7 ' + deltaStr : '') +
        '</div>' +
      '</div>' +
      '<div style="flex-shrink:0;">' + prSparkline(pr.history) + '</div>' +
    '</div>' + (ki < liftKeys.length - 1 ? branchDividerHTML() : '');
  }

  if (!hasAny) {
    html += '<div style="font-size:12px;color:' + C.textDim + ';font-family:JetBrains Mono,monospace;padding:8px 0;">No PR data yet \u2014 train the big 5 lifts to track records.</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

function populateStrengthDetail() {
  const container = document.getElementById('strength-detail');

  const liftBenchmarks = {
    bench:    { label: 'Bench',    std: 'bench_press' },
    squat:    { label: 'Squat',    std: 'squat' },
    deadlift: { label: 'Deadlift', std: 'deadlift' },
    ohp:      { label: 'OHP',      std: 'overhead_press' },
    row:      { label: 'Row',      std: 'barbell_row' },
  };

  const bw = PROFILE.bodyweightLbs;
  let latestSI = null;

  if (strengthIndexData.length > 0) {
    latestSI = strengthIndexData[strengthIndexData.length - 1];
  }

  // Header with explanation
  let siLevel = '--', siColor = C.textDim;
  let siFloor = 0, siCeil = 0.9, nextLevel = 'Intermediate';
  if (latestSI) {
    const v = latestSI.index;
    if (v >= 1.8) { siLevel = 'Elite'; siColor = C.strength; siFloor = 1.8; siCeil = 2.5; nextLevel = ''; }
    else if (v >= 1.3) { siLevel = 'Advanced'; siColor = C.accent; siFloor = 1.3; siCeil = 1.8; nextLevel = 'Elite'; }
    else if (v >= 0.9) { siLevel = 'Intermediate'; siColor = C.warn; siFloor = 0.9; siCeil = 1.3; nextLevel = 'Advanced'; }
    else { siLevel = 'Developing'; siColor = C.danger; siFloor = 0; siCeil = 0.9; nextLevel = 'Intermediate'; }
  }

  // XP bar calculation
  const siVal = latestSI ? latestSI.index : 0;
  const xpPct = siCeil > siFloor ? Math.min(100, Math.max(0, Math.round(((siVal - siFloor) / (siCeil - siFloor)) * 100))) : 100;
  const xpLabel = nextLevel ? `${xpPct}% to ${nextLevel}` : 'Max tier reached';

  // Tier segments for the XP track
  const siTierSegs = [
    { floor: 0,   ceil: 0.9, label: 'Developing',   abbr: 'DEV', color: C.danger,   desc: 'Building foundation \u00b7 Focus on form and consistency' },
    { floor: 0.9, ceil: 1.3, label: 'Intermediate',  abbr: 'INT', color: C.warn,     desc: 'Average gym-goer \u00b7 Solid base across all lifts' },
    { floor: 1.3, ceil: 1.8, label: 'Advanced',      abbr: 'ADV', color: C.accent,   desc: 'Strong lifter \u00b7 Well above average' },
    { floor: 1.8, ceil: 2.5, label: 'Elite',         abbr: 'ELT', color: C.strength, desc: 'Exceptional strength \u00b7 Competition-level' },
  ];
  const xpTrackMax = 2.5;

  // Build segmented bar
  let segHtml = '';
  for (let i = 0; i < siTierSegs.length; i++) {
    const seg = siTierSegs[i];
    const segStartPct = (seg.floor / xpTrackMax) * 100;
    const segWidthPct = ((seg.ceil - seg.floor) / xpTrackMax) * 100;
    const isCurrent = siVal >= seg.floor && (siVal < seg.ceil || (i === siTierSegs.length - 1 && siVal >= seg.floor));
    const isPast = siVal >= seg.ceil;

    // Fill within this segment
    let fillPct = 0;
    if (isPast) fillPct = 100;
    else if (isCurrent) fillPct = Math.max(0, Math.min(100, ((siVal - seg.floor) / (seg.ceil - seg.floor)) * 100));

    const borderL = i === 0 ? 'border-radius:5px 0 0 5px;' : '';

  // Tier labels below segments
  let labelHtml = '';
  for (let i = 0; i < siTierSegs.length; i++) {
    const seg = siTierSegs[i];

    const isCurrent = siVal >= seg.floor && (siVal < seg.ceil || (i === siTierSegs.length - 1 && siVal >= seg.floor));

  }

  // Pre-compute lift percentiles (0-1 range) for the concentric rings viz
  const liftPercentiles = {};
  if (latestSI) {
    for (const [key, info] of Object.entries(liftBenchmarks)) {
      const lift = latestSI.lifts[key];
      if (lift && lift.rm > 0) {

  let html = `<div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid ${C.border};">

      ${latestSI ? `<div style="flex-shrink:0;">${siConcentricRingsHTML(liftPercentiles)}</div>` : ''}
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;">

            <span class="section-chevron" style="font-size:10px;color:${C.textDim};transition:transform 0.3s ease;display:inline-block;">\u25BE</span>

      </div>

    ${latestSI ? `<div style="margin-top:14px;">

    </div>` : ''}
  </div>`;

  // Scan SI timeline for all-time PR per lift
  const _prs = {};
  for (const entry of strengthIndexData) {
    for (const [k, l] of Object.entries(entry.lifts)) {
      if (l.rm > 0 && (!_prs[k] || l.rm > _prs[k].rm)) {
        _prs[k] = { rm: l.rm, date: entry.date };
      }
    }
  }

  // Progressive overload: compare current 1RM to ~30 days ago
  const _trends = {};
  if (strengthIndexData.length >= 2) {
    const cutoffDate = new Date();
    cutoffDate.setDate(cutoffDate.getDate() - 30);
    const cutoffStr = localDateStr(cutoffDate);
    // Find the SI entry closest to 30 days ago
    let baselineEntry = null;
    for (const entry of strengthIndexData) {
      if (entry.date <= cutoffStr) baselineEntry = entry;
      else break;
    }
    if (baselineEntry) {
      for (const [k, l] of Object.entries(latestSI ? latestSI.lifts : {})) {
        if (l.rm > 0 && baselineEntry.lifts[k] && baselineEntry.lifts[k].rm > 0) {
          const diff = l.rm - baselineEntry.lifts[k].rm;
          const pct = Math.round((diff / baselineEntry.lifts[k].rm) * 100);
          _trends[k] = { diff, pct };

  // Column labels
  html += `<div style="display:flex;align-items:center;gap:10px;padding:0 0 6px 0;">

  // Lift rows (unified with PR data)
  for (const [key, info] of Object.entries(liftBenchmarks)) {

    const pr = _prs[key];

    // Right column: current 1RM + PR context

        + `<span style="font-size:10px;color:${C.textDark};font-family:'JetBrains Mono',monospace;"> lbs</span>`
        + `<div style="margin-top:1px;"><span style="font-size:9px;font-weight:600;color:${C.accent};padding:1px 5px;border-radius:3px;background:${C.accentDim};font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;">PR</span></div>`;
    } else if (pr) {
      const pctOfPR = Math.round((currentRM / pr.rm) * 100);
      rightHtml = `<span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:${C.text};">${currentRM}</span>`
        + `<span style="font-size:10px;color:${C.textDark};font-family:'JetBrains Mono',monospace;"> lbs</span>`
        + `<div style="margin-top:1px;font-family:'JetBrains Mono',monospace;font-size:9px;color:${C.textDim};">${pr.rm} PR \u00b7 ${pctOfPR}%</div>`;
    } else {
      rightHtml = `<span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:${C.text};">${currentRM}</span>`
        + `<span style="font-size:10px;color:${C.textDark};font-family:'JetBrains Mono',monospace;"> lbs</span>`;
    }

    // Source exercise detail (hidden by default, toggled on tap)
    let srcHtml = '';
    if (hasData && lift.src) {
      const s = lift.src;
      const srcDate = new Date(s.date + 'T12:00:00');
      const srcDateStr = srcDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      srcHtml = `<div data-si-src style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.25s ease,opacity 0.2s ease;padding-left:80px;">

    html += `<div style="border-bottom:1px solid ${C.surface2};cursor:pointer;-webkit-tap-highlight-color:transparent;" onclick="toggleSISrc(this)">

        </div>

// ---- Hevy CSV Measurement Import ----
// Parses exported measurements CSV from Hevy app (Profile > Settings > Export)
// Handles cm or inch columns, averages L/R measurements, converts cm->in
function importHevyCSV(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = ''; // reset so same file can be re-imported

  const statusEl = document.getElementById('hevy-import-status');
  const showStatus = (msg, isError) => {
    statusEl.style.display = 'block';
    statusEl.style.background = isError ? 'rgba(248,113,113,0.12)' : 'rgba(95,160,82,0.12)';
    statusEl.style.color = isError ? C.dangerText : C.accent;
    statusEl.style.border = `1px solid ${isError ? 'rgba(248,113,113,0.2)' : 'rgba(95,160,82,0.28)'}`;
    statusEl.textContent = msg;
    setTimeout(() => { statusEl.style.display = 'none'; }, 5000);
  };

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const rows = parseCSV(text);
      if (rows.length < 2) { showStatus('CSV appears empty or has no data rows.', true); return; }

      const headers = rows[0].map(h => h.trim().toLowerCase());
      const dateCol = headers.findIndex(h => h === 'date');
      if (dateCol === -1) { showStatus('No "date" column found in CSV.', true); return; }

      // Detect unit system from column names
      const isCm = headers.some(h => h.endsWith('_cm'));
      const cmToIn = (v) => v / 2.54;

      // Column mapping: Hevy column name -> { lsKey, isLeft }
      // For L/R pairs, we average them
      const colMap = {};
      
      // Build mapping from headers
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i];
        const mapEntry = matchHevyColumn(h);
        if (mapEntry) colMap[i] = mapEntry;
      }

      if (Object.keys(colMap).length === 0) {
        showStatus('No recognized measurement columns found.', true);
        return;
      }

      let imported = 0;
      for (let r = 1; r < rows.length; r++) {
        const cells = rows[r];
        if (cells.length <= dateCol) continue;

        // Parse Hevy date format: "23 Oct 2023, 00:00" -> "2023-10-23"
        const dateRaw = cells[dateCol].trim();
        const parsedDate = parseHevyDate(dateRaw);
        if (!parsedDate) continue;

        const entry = { date: parsedDate };
        const lrAccum = {}; // { lsKey: [values] }
        let hasValue = false;

        for (const [colIdx, mapping] of Object.entries(colMap)) {
          const rawVal = parseFloat(cells[colIdx]);
          if (isNaN(rawVal) || rawVal <= 0) continue;
          const val = isCm ? cmToIn(rawVal) : rawVal;

          if (mapping.pair) {
            // L/R measurement -> accumulate for averaging
            if (!lrAccum[mapping.lsKey]) lrAccum[mapping.lsKey] = [];
            lrAccum[mapping.lsKey].push(val);
          } else {
            entry[mapping.lsKey] = Math.round(val * 10) / 10;
            hasValue = true;
          }
        }

        // Average L/R pairs
        for (const [key, vals] of Object.entries(lrAccum)) {
          const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
          entry[key] = Math.round(avg * 10) / 10;
          hasValue = true;
        }

        if (hasValue) {
          saveMeasurementEntry(entry);
          imported++;
        }
      }

      if (imported === 0) {
        showStatus('No measurement data found in rows.', true);
        return;
      }

      // Refresh display
      latestMeasurements = getLatestMeasurements();
      proportionDeficits = computeProportionDeficits(latestMeasurements);
      renderMeasurementsDisplay();
      renderProportionsDisplay();
      if (workoutCache && muscleAnalysis) {
        const recs = generateRecommendations(muscleAnalysis);
        LAST_RECS = recs;
        renderTimedSession(recs);
        renderMuscleGrid(muscleAnalysis, recs);
      }

      showStatus(`Imported ${imported} measurement entr${imported === 1 ? 'y' : 'ies'} from Hevy.`, false);
    } catch (err) {
      showStatus('Error parsing CSV: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

// Simple CSV parser (handles quoted fields)
function parseCSV(text) {
  const rows = [];
  let current = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { current.push(field); field = ''; }
      else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) {
        current.push(field); field = '';
        if (current.some(c => c.trim() !== '')) rows.push(current);
        current = [];
        if (ch === '\r') i++; // skip \n in \r\n
      } else { field += ch; }
    }
  }
  // Last row
  current.push(field);
  if (current.some(c => c.trim() !== '')) rows.push(current);
  return rows;
}

// Match a Hevy CSV header to a LiftScript measurement key
function matchHevyColumn(header) {
  const h = header.replace(/[()]/g, '').trim();
  // Map of patterns -> { lsKey, pair? }
  const maps = [
    { patterns: [/^neck/],                       lsKey: 'neck_in' },
    { patterns: [/^shoulder/],                    lsKey: 'shoulder_in' },
    { patterns: [/^chest/],                       lsKey: 'chest_in' },
    { patterns: [/^(left_?)?bicep/, /^l_bicep/],  lsKey: 'bicep_in', pair: true },
    { patterns: [/^(right_?)?bicep/, /^r_bicep/], lsKey: 'bicep_in', pair: true },
    { patterns: [/^(left_?)?forearm/, /^l_forearm/],  lsKey: 'forearm_in', pair: true },
    { patterns: [/^(right_?)?forearm/, /^r_forearm/], lsKey: 'forearm_in', pair: true },
    { patterns: [/^waist/],                       lsKey: 'waist_in' },
    { patterns: [/^hip/],                         lsKey: 'hip_in' },
    { patterns: [/^(left_?)?thigh/, /^l_thigh/],  lsKey: 'thigh_in', pair: true },
    { patterns: [/^(right_?)?thigh/, /^r_thigh/], lsKey: 'thigh_in', pair: true },
    { patterns: [/^(left_?)?calf/, /^l_calf/, /^(left_?)?calves/],  lsKey: 'calf_in', pair: true },
    { patterns: [/^(right_?)?calf/, /^r_calf/, /^(right_?)?calves/], lsKey: 'calf_in', pair: true },
  ];

  // Strip unit suffix for matching
  const stripped = h.replace(/_(cm|in|inch|inches)$/, '');

  for (const m of maps) {
    if (m.patterns.some(p => p.test(stripped))) {
      return { lsKey: m.lsKey, pair: !!m.pair };
    }
  }
  return null;
}

// Parse Hevy date: "23 Oct 2023, 00:00" -> "2023-10-23"
// Also handles ISO "2023-10-23" passthrough
function parseHevyDate(str) {
  if (!str) return null;
  // ISO format passthrough
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0, 10);
  // Hevy format: "23 Oct 2023, 00:00"
  const months = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const match = str.match(/(\d{1,2})\s+(\w{3})\s+(\d{4})/);
  if (!match) return null;
  const day = match[1].padStart(2, '0');
  const mon = months[match[2].toLowerCase()];
  if (!mon) return null;
  return `${match[3]}-${String(mon).padStart(2, '0')}-${day}`;
}

      <div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:${C.text};line-height:1.2;">${val.toFixed(1)}<span style="font-size:11px;font-weight:400;color:${C.textDim};margin-left:2px;">${field.unit}</span></div>

  html += `<div id="meas-sparkline-container" style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.4s ease,opacity 0.3s ease;margin-top:8px;"></div>`;

  if (!hasAny) {
    container.innerHTML = `<div style="font-size:13px;color:${C.textDim};font-family:'JetBrains Mono',monospace;padding:4px 0;">No measurements yet. Use Import Hevy to start tracking.</div>`;
    return;
  }
  container.innerHTML = html;
}

let _selectedMeasField = null;

function toggleMeasSparkline(fieldKey) {
  const container = document.getElementById('meas-sparkline-container');
  if (!container) return;

  if (_selectedMeasField === fieldKey) {
    // Collapse
    container.style.maxHeight = '0';
    container.style.opacity = '0';
    _selectedMeasField = null;
    renderMeasurementsDisplay();
    return;
  }

  _selectedMeasField = fieldKey;
  renderMeasurementsDisplay(); // re-render to update selection highlight

  const sparkContainer = document.getElementById('meas-sparkline-container');
  if (!sparkContainer) return;

  const entries = getStoredMeasurements();
  const field = MEASUREMENT_FIELDS.find(f => f.key === fieldKey);
  if (!field) return;

  // Get all values for this field with dates
  const points = [];
  for (const entry of entries) {
    if (entry[fieldKey] != null && !isNaN(entry[fieldKey]) && entry[fieldKey] > 0) {
      points.push({ date: entry.date, value: parseFloat(entry[fieldKey]) });
    }
  }

  // For waist, also check Apple Health
  if (fieldKey === 'waist_in' && healthData && healthData.waist_circumference_in > 0) {
    const ahDate = healthData.waist_date || localDateStr(new Date());
    const exists = points.some(p => p.date === ahDate);
    if (!exists) points.push({ date: ahDate, value: healthData.waist_circumference_in });
  }

  points.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  if (points.length < 2) {
    sparkContainer.innerHTML = `<div style="padding:12px;text-align:center;font-size:12px;font-family:'JetBrains Mono',monospace;color:${C.textDim};">Need 2+ entries to chart ${field.label}.</div>`;
    sparkContainer.style.opacity = '1';
    sparkContainer.style.maxHeight = '60px';
    return;
  }

  // Build SVG sparkline
  const w = 300, h = 70, pad = 20;
  const vals = points.map(p => p.value);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;

  const scaleX = (i) => pad + (i / (points.length - 1)) * (w - 2 * pad);
  const scaleY = (v) => h - pad - ((v - minV) / range) * (h - 2 * pad);

  let pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(1)},${scaleY(p.value).toFixed(1)}`).join(' ');

  // Determine trend color
  const isWaist = fieldKey === 'waist_in';
  const firstVal = vals[0], lastVal = vals[vals.length - 1];
  const trending = lastVal > firstVal ? 'up' : lastVal < firstVal ? 'down' : 'flat';
  let lineColor = C.accent;
  if (isWaist) {
    lineColor = trending === 'down' ? C.accent : trending === 'up' ? C.warn : C.textMid;
  } else {
    lineColor = trending === 'up' ? C.accent : trending === 'down' ? C.warn : C.textMid;
  }

  const totalLen = points.reduce((sum, p, i) => {
    if (i === 0) return 0;
    const dx = scaleX(i) - scaleX(i-1);
    const dy = scaleY(p.value) - scaleY(points[i-1].value);
    return sum + Math.sqrt(dx*dx + dy*dy);
  }, 0);

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">
    <style>
      @keyframes drawLine { from { stroke-dashoffset: ${totalLen.toFixed(0)}; } to { stroke-dashoffset: 0; } }
    </style>
    <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="${totalLen.toFixed(0)}" style="animation:drawLine 0.5s ease forwards;" />`;

  // Dots at each point
  points.forEach((p, i) => {
    svg += `<circle cx="${scaleX(i).toFixed(1)}" cy="${scaleY(p.value).toFixed(1)}" r="2.5" fill="${lineColor}" />`;
  });

  // Labels at first and last points
  const firstPt = points[0], lastPt = points[points.length - 1];
  svg += `<text x="${pad}" y="${scaleY(firstPt.value) - 6}" fill="${C.textDim}" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="start">${firstPt.value.toFixed(1)}</text>`;
  svg += `<text x="${w - pad}" y="${scaleY(lastPt.value) - 6}" fill="${C.text}" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="end">${lastPt.value.toFixed(1)}</text>`;

  svg += `</svg>`;

  // Date range label
  const dateRange = `${points[0].date || ''} -> ${points[points.length-1].date || ''}`;
  sparkContainer.innerHTML = `<div style="background:${C.surface2};border-radius:8px;border:1px solid ${C.border};padding:10px 8px 6px;">
    ${svg}
    <div style="text-align:center;font-size:10px;font-family:'JetBrains Mono',monospace;color:${C.textDark};margin-top:2px;">${dateRange} \u00b7 ${points.length} entries</div>
  </div>`;
  sparkContainer.style.opacity = '1';
  sparkContainer.style.maxHeight = sparkContainer.scrollHeight + 'px';
}

function renderProportionsDisplay() {
  const container = document.getElementById('proportions-display');
  if (!container) return;
  const latest = latestMeasurements;
  if (!latest || Object.keys(latest).filter(k => k !== '_dates').length < 2) {
    container.innerHTML = '';
    return;
  }
  const bars = [];
  for (const [fieldKey, ft] of Object.entries(FRAME_TARGETS)) {
    const current = latest[fieldKey];
    if (current == null || current <= 0) continue;
    if (ft.target == null) {
      bars.push({ label: ft.label, current, target: null, pct: null, fieldKey });
      continue;
    }
    let pct;
    if (ft.inverted) {
      pct = Math.max(0, Math.min(120, Math.round((ft.target / current) * 100)));
    } else {
      pct = Math.max(0, Math.min(120, Math.round((current / ft.target) * 100)));
    }
    bars.push({ label: ft.label, current, target: ft.target, pct, inverted: ft.inverted, fieldKey });
  }
  if (bars.length === 0) { container.innerHTML = ''; return; }
  bars.sort((a, b) => {
    if (a.pct === null) return 1;
    if (b.pct === null) return -1;
    return a.pct - b.pct;
  });
  let html = '<div style="padding-top:12px;border-top:1px solid ' + C.border + ';">' +
    '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:' + C.textDim + ';margin-bottom:10px;font-family:JetBrains Mono,monospace;">Frame-Adjusted Targets</div>';
  for (const bar of bars) {
    if (bar.target == null) {
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-family:JetBrains Mono,monospace;">' +
        '<span style="font-size:12px;font-weight:600;color:' + C.textMid + ';min-width:70px;">' + bar.label + '</span>' +
        '<span style="font-size:12px;color:' + C.textDim + ';">' + bar.current.toFixed(1) + ' in</span></div>';
      continue;
    }
    const pct = bar.pct;
    const barColor = pct >= 95 ? C.accent : pct >= 85 ? C.warn : C.danger;
    const labelColor = pct >= 95 ? C.accent : pct >= 85 ? C.warn : C.dangerText; // v1.34: lifted red for 11px text
    const fillW = Math.min(pct, 100);
    let detailLabel;
    if (bar.inverted) {
      // Inverted metric: lower is better (e.g. waist)
      if (bar.current <= bar.target) {
        detailLabel = bar.current.toFixed(1) + ' / ' + bar.target.toFixed(1) + ' in <span style="color:' + C.accent + ';font-weight:600;">On target \u2713</span>';
      } else {
        const over = bar.current - bar.target;
        const overPct = Math.round((over / bar.target) * 100);
        detailLabel = bar.current.toFixed(1) + ' / ' + bar.target.toFixed(1) + ' in <span style="color:' + C.dangerText + ';font-weight:600;">+' + over.toFixed(1) + ' in over (' + overPct + '%) \u2193</span>';
      }
    } else {
      detailLabel = bar.current.toFixed(1) + ' / ' + bar.target.toFixed(1) + ' in <span style="color:' + labelColor + ';font-weight:600;">(' + pct + '%)</span>';
    }
    html += '<div style="margin-bottom:8px;">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;font-family:JetBrains Mono,monospace;">' +
      '<span style="font-size:12px;font-weight:600;color:' + C.textMid + ';">' + bar.label + '</span>' +
      '<span style="font-size:11px;color:' + C.textDim + ';">' + detailLabel + '</span>' +
      '</div>' +
      '<div style="height:6px;background:' + C.surface3 + ';border-radius:3px;overflow:hidden;">' +
      '<div style="height:100%;width:' + fillW + '%;background:' + barColor + ';border-radius:3px;transition:width 0.4s ease;"></div>' +
      '</div></div>';
  }
  html += '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:9px;font-family:JetBrains Mono,monospace;color:' + C.textDark + ';">' +
    '<span>100% natural max (Casey Butt, wrist: ' + PROFILE.wristIn + '")</span></div></div>';
  container.innerHTML = html;
}

// APPLE HEALTH DATA (fetched from repo via iOS Shortcut push)
// ============================================================
const HEALTH_DATA_URL = 'https://jtwarta.github.io/WorkoutPlanner/health-data.json';
const HEALTH_STALE_HOURS = 48; // consider data stale after 48h

async function fetchHealthData() {
  try {
    const resp = await fetchWithTimeout(HEALTH_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) {
      healthStatus = 'missing';
      healthData = null;
      return;
    }
    // Shortcuts inserts literal newlines in JSON - strip them before parsing
    const rawText = await resp.text();
    let cleanText = rawText.replace(/\n/g, '').replace(/\r/g, '');
    // Fix missing commas between workout objects: }{ -> },{
    cleanText = cleanText.replace(/\}\s*\{/g, '},{');
    // Strip unit suffixes from calories: "32 kcal" -> "32", "1,220 kcal" -> "1220"
    cleanText = cleanText.replace(/(\d),(\d)/g, '$1$2'); // remove thousands commas
    cleanText = cleanText.replace(/([\d.]+)\s*kcal/g, '$1');
    // Fix empty values from removed Shortcut actions: "key": , -> "key": null,
    cleanText = cleanText.replace(/:\s*,/g, ': null,');
    cleanText = cleanText.replace(/:\s*}/g, ': null}');
    const data = JSON.parse(cleanText);
    healthData = data;

    // Check freshness
    if (data.updated) {
      const updatedAt = new Date(data.updated);
      const ageHours = (Date.now() - updatedAt.getTime()) / (1000 * 60 * 60);
      healthStatus = ageHours <= HEALTH_STALE_HOURS ? 'ok' : 'stale';
    } else {
      healthStatus = 'stale';
    }
  } catch (e) {
    console.warn('Health data fetch failed:', e.message);
    healthStatus = 'missing';
    healthData = null;
  }
}

// ============================================================
// VO2 MAX / CARDIO FITNESS PERCENTILES
// ACSM norms for males, interpolated for age
// Percentile: [10th, 25th, 50th, 75th, 90th]
// ============================================================
const VO2_NORMS_MALE = {
  '20-29': [33.0, 36.5, 42.5, 46.8, 52.4],
  '30-39': [30.2, 34.0, 38.5, 43.0, 48.0],
  '40-49': [27.0, 31.0, 35.5, 39.5, 44.0],
  '50-59': [24.0, 28.0, 32.5, 36.5, 41.0],
};

function getVO2AgeGroup(age) {
  if (age < 30) return '20-29';
  if (age < 40) return '30-39';
  if (age < 50) return '40-49';
  return '50-59';
}

function estimateVO2Percentile(vo2, age) {
  const group = getVO2AgeGroup(age);
  const norms = VO2_NORMS_MALE[group];
  if (!norms) return null;

  const pctiles = [10, 25, 50, 75, 90];
  if (vo2 <= norms[0]) return Math.max(1, Math.round((vo2 / norms[0]) * 10));
  if (vo2 >= norms[4]) return Math.min(99, 90 + Math.round(((vo2 - norms[4]) / (norms[4] * 0.15)) * 9));

  for (let i = 0; i < norms.length - 1; i++) {
    if (vo2 >= norms[i] && vo2 <= norms[i + 1]) {
      const frac = (vo2 - norms[i]) / (norms[i + 1] - norms[i]);
      return Math.round(pctiles[i] + frac * (pctiles[i + 1] - pctiles[i]));
    }
  }
  return 50;
}

// Unified 5-tier rating: same labels + colors across ALL vitals
// Elite (top) > Great > Good > Fair > Low
function getVO2Category(percentile) {
  if (percentile >= 80) return { label: 'Elite', color: C.gold };
  if (percentile >= 60) return { label: 'Great', color: C.accent };
  if (percentile >= 40) return { label: 'Good', color: C.blue };
  if (percentile >= 20) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function getRHRCategory(rhr) {
  if (rhr < 50) return { label: 'Elite', color: C.gold };
  if (rhr < 60) return { label: 'Great', color: C.accent };
  if (rhr <= 70) return { label: 'Good', color: C.blue };
  if (rhr <= 80) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function getRecoveryCategory(recovery) {
  if (recovery >= 35) return { label: 'Elite', color: C.gold };
  if (recovery >= 25) return { label: 'Great', color: C.accent };
  if (recovery >= 18) return { label: 'Good', color: C.blue };
  if (recovery >= 12) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}

function getActiveCalCategory(cal) {
  if (cal >= 700) return { label: 'Elite', color: C.gold };
  if (cal >= 500) return { label: 'Great', color: C.accent };
  if (cal >= 350) return { label: 'Good', color: C.blue };
  if (cal >= 200) return { label: 'Fair', color: C.warn };
  return { label: 'Low', color: C.danger };
}
