function renderHealthVitals() {
  const card = document.getElementById('health-vitals-card');
  if (!healthData || healthStatus === 'missing') {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  // Sync time
  const syncEl = document.getElementById('health-sync-time');
  if (healthData.updated) {
    const hrs = Math.round((Date.now() - new Date(healthData.updated).getTime()) / (1000 * 60 * 60));
    syncEl.textContent = hrs <= 1 ? 'just now' : `${hrs}h ago`;
    syncEl.style.color = healthStatus === 'ok' ? C.accent : C.warn;
  }

  // Vitals Grid
  const grid = document.getElementById('vitals-grid');
  let html = '';

  // Sub-header: Cardiac
  html += `<div style="grid-column:1/-1;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:${C.textDim};font-family:'JetBrains Mono',monospace;padding:2px 0;">Cardiac</div>`;

  // Helper: build mini SVG sparkline from points array [{label, value}]
  // lowerBetter: true for RHR/walking HR (lower = good), false for recovery/VO2 (higher = good)
  function vitalSparkline(points, color, lowerBetter) {
    const valid = points.filter(p => p.value > 0);
    if (valid.length < 2) return '';
    const vals = valid.map(p => p.value);
    const vMin = Math.min(...vals);
    const vMax = Math.max(...vals);
    const range = vMax - vMin || 1;
    const w = 200, h = 48, padX = 8, padY = 8;
    const chartW = w - padX * 2, chartH = h - padY * 2;

    // Points
    const pts = valid.map((p, i) => {
      const x = padX + (valid.length > 1 ? (i / (valid.length - 1)) * chartW : chartW / 2);
      const y = padY + (1 - (p.value - vMin) / range) * chartH;
      return { x, y, label: p.label, value: p.value };
    });

    // Delta
    const first = valid[0].value, last = valid[valid.length - 1].value;
    const delta = last - first;
    const improved = lowerBetter ? delta < 0 : delta > 0;
    const deltaColor = Math.abs(delta) < 0.5 ? C.textDim : improved ? C.accent : C.danger;
    const deltaSign = delta > 0 ? '+' : '';
    const deltaStr = Number.isInteger(delta) ? delta.toString() : delta.toFixed(1);

    let svg = `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="display:block;margin:8px auto 0;">`;
    // Line
    svg += `<polyline fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p => p.x + ',' + p.y).join(' ')}"/>`;
    // Dots + value labels
    for (const p of pts) {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"/>`;
      const valY = p.y < padY + 14 ? p.y + 14 : p.y - 8;
      svg += `<text x="${p.x}" y="${valY}" text-anchor="middle" fill="${C.text}" font-family="JetBrains Mono,monospace" font-size="9" font-weight="600">${Number.isInteger(p.value) ? p.value : p.value.toFixed(1)}</text>`;
    }
    svg += `</svg>`;

    // Time labels + delta
    let labelsHtml = `<div style="display:flex;justify-content:space-between;padding:0 ${padX}px;margin-top:2px;">`;
    for (const p of pts) {
      labelsHtml += `<span style="font-size:9px;color:${C.textDim};font-family:'JetBrains Mono',monospace;">${p.label}</span>`;
    }
    labelsHtml += `</div>`;
    labelsHtml += `<div style="text-align:center;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:${deltaColor};">${deltaSign}${deltaStr} over 12mo</div>`;

    return svg + labelsHtml;
  }

  // Helper: wrap cell content with tappable trend expand
  function vitalCell(label, valueHtml, contextHtml, trendHtml) {
    if (trendHtml) {
      return `<div class="vital-cell" style="cursor:pointer;-webkit-tap-highlight-color:transparent;" onclick="toggleVitalTrend(this)">
        <div class="vital-label">${label}</div>
        <div class="vital-value">${valueHtml}</div>
        <div class="vital-context">${contextHtml}</div>
        <div data-vital-trend style="max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease,opacity 0.25s ease;">${trendHtml}</div>
      </div>`;
    }
    return `<div class="vital-cell">
      <div class="vital-label">${label}</div>
      <div class="vital-value">${valueHtml}</div>
      <div class="vital-context">${contextHtml}</div>
    </div>`;
  }

  // RHR
  const rhr = healthData.resting_heart_rate;
  if (rhr && rhr > 0) {
    const rhrCat = getRHRCategory(rhr);
    const rhrPts = [
      { label: '12mo', value: healthData.rhr_12m || 0 },
      { label: '6mo', value: healthData.rhr_6m || 0 },
      { label: '3mo', value: healthData.rhr_3m || 0 },
      { label: 'Now', value: rhr },
    ].filter(p => p.value > 0);
    const trend = rhrPts.length >= 2 ? vitalSparkline(rhrPts, C.danger, true) : '';
    html += vitalCell('Resting HR',
      `${Math.round(rhr)}<span class="vital-unit">bpm</span>`,
      `<span style="color:${rhrCat.color};display:flex;align-items:center;">${tierBadge(rhrCat.label, rhrCat.color)}</span>`,
      trend);
  }

  // Cardio Recovery
  const recovery = healthData.cardio_recovery;
  if (recovery && recovery > 0) {
    const recCat = getRecoveryCategory(recovery);
    const recPts = [
      { label: '12mo', value: healthData.rec_12m || 0 },
      { label: '6mo', value: healthData.rec_6m || 0 },
      { label: '3mo', value: healthData.rec_3m || 0 },
      { label: 'Now', value: recovery },
    ].filter(p => p.value > 0);
    const trend = recPts.length >= 2 ? vitalSparkline(recPts, C.accent, false) : '';
    html += vitalCell('HR Recovery',
      `${Math.round(recovery)}<span class="vital-unit">bpm</span>`,
      `<span style="color:${recCat.color};display:flex;align-items:center;">${tierBadge(recCat.label, recCat.color)}</span>`,
      trend);
  }

  // VO2 Max (in grid as well for trend access)
  const vo2g = healthData.cardio_fitness;
  if (vo2g && vo2g > 0) {
    const vo2Pctile = estimateVO2Percentile(vo2g, PROFILE.age);
    const vo2Cat = getVO2Category(vo2Pctile);
    const vo2Pts = [
      { label: '12mo', value: healthData.vo2_12m || 0 },
      { label: '6mo', value: healthData.vo2_6m || 0 },
      { label: '3mo', value: healthData.vo2_3m || 0 },
      { label: 'Now', value: vo2g },
    ].filter(p => p.value > 0);
    const trend = vo2Pts.length >= 2 ? vitalSparkline(vo2Pts, C.blue, false) : '';
    html += vitalCell('VO2 Max',
      `${vo2g.toFixed(1)}<span class="vital-unit">ml/kg</span>`,
      `<span style="color:${vo2Cat.color};display:flex;align-items:center;">${vo2Pctile}th %ile \u00b7 ${tierBadge(vo2Cat.label, vo2Cat.color)}</span>`,
      trend);
  }

  // Sub-header: Activity
  html += `<div style="grid-column:1/-1;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:${C.textDim};font-family:'JetBrains Mono',monospace;padding:2px 0;margin-top:4px;">Activity</div>`;

  // Steps (7-day avg)
  const steps = healthData.steps;
  if (steps && steps > 0) {
    const stepsK = steps >= 1000 ? (steps / 1000).toFixed(1) + 'k' : Math.round(steps);
    const stepsCat = steps >= 12000 ? { label: 'Elite', color: C.gold }
      : steps >= 10000 ? { label: 'Great', color: C.accent }
      : steps >= 7000 ? { label: 'Good', color: C.blue }
      : steps >= 4000 ? { label: 'Fair', color: C.warn }
      : { label: 'Low', color: C.danger };
    html += vitalCell('Steps/Day', stepsK,
      `<span style="color:${stepsCat.color};display:flex;align-items:center;">${tierBadge(stepsCat.label, stepsCat.color)}</span>`, '');
  }

  // Active Calories
  const cal = healthData.active_energy_kcal;
  if (cal && cal > 0) {
    const calCat = getActiveCalCategory(cal);
    html += vitalCell('Active Cal',
      `${Math.round(cal)}<span class="vital-unit">kcal</span>`,
      `<span style="color:${calCat.color};display:flex;align-items:center;">${tierBadge(calCat.label, calCat.color)}</span>`, '');
  }

  // Walking HR
  const whr = healthData.walking_heart_rate_avg;
  if (whr && whr > 0) {
    const whrCat = whr < 85 ? { label: 'Elite', color: C.gold }
      : whr < 95 ? { label: 'Great', color: C.accent }
      : whr < 105 ? { label: 'Good', color: C.blue }
      : whr <= 115 ? { label: 'Fair', color: C.warn }
      : { label: 'Low', color: C.danger };
    html += vitalCell('Walking HR',
      `${Math.round(whr)}<span class="vital-unit">bpm</span>`,
      `<span style="color:${whrCat.color};display:flex;align-items:center;">${tierBadge(whrCat.label, whrCat.color)}</span>`, '');
  }

  grid.innerHTML = html;
}

function switchTab(tab) {
  haptic(6);
  // v1.26: fade+slide transition
  var current = document.querySelector('[id^="tab-"]:not(.hidden)');
  var next = document.getElementById('tab-' + tab);
  if (!next) return;
  if (current === next) return;

  // Update tab chip active state immediately (visual feedback)
  document.querySelectorAll('.tab').forEach(function(el) {
    var isActive = el.dataset.tab === tab;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  function doSwap() {
    document.querySelectorAll('[id^="tab-"]').forEach(function(el) { el.classList.add('hidden'); });
    next.classList.remove('hidden');
    next.classList.add('tab-entering');
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        next.classList.remove('tab-entering');
      });
    });
    if (tab === 'weight') {
      setTimeout(renderWeightChart, 50);
      setTimeout(renderHealthVitals, 50);
      setTimeout(renderMeasurementsCard, 50);
    }
  }

  if (current) {
    current.classList.add('tab-leaving');
    setTimeout(function() {
      current.classList.remove('tab-leaving');
      doSwap();
    }, 140);
  } else {
    doSwap();
  }
}

// ============================================================
// BODY COMPOSITION INDEX
// Uses body fat, frame targets, and waist-to-height ratio
// Called after proportionDeficits are available
// ============================================================
function computeBodyCompTimeline() {
  // v1.37 rewrite: the old timeline computed ONE score from current-snapshot
  // bf/waist/frame values and stamped it on every historical weigh-in date --
  // the chart line was a constant and could not trend by construction.
  // Now: walk dated measurement entries (embedded baseline + CSV imports)
  // chronologically with per-field carry-forward, scoring frame achievement
  // and waist-to-height PER DATE. Body fat has no history source (single
  // Apple Health snapshot) so it is held constant when available; the score
  // reweights per-date for whichever components exist. A final point at
  // today merges the current Apple Health waist so "now" is represented.
  bodyCompData = [];
  const heightIn = PROFILE.heightIn;
  const bf = (healthData && healthData.body_fat_pct) || 0;

  // Build per-date measurement snapshots with carry-forward
  const entries = getStoredMeasurements(); // chronologically sorted
  const state = {};
  const points = [];
  for (const entry of entries) {
    if (!entry.date) continue;
    let changed = false;
    for (const field of MEASUREMENT_FIELDS) {
      const v = entry[field.key];
      if (v != null && v !== '' && !isNaN(v)) {
        state[field.key] = parseFloat(v);
        changed = true;
      }
    }
    if (changed) points.push({ date: entry.date, snap: Object.assign({}, state) });
  }

  // Final "now" point: carry latest state, merge Apple Health waist if present
  if (healthData && healthData.waist_circumference_in > 0) {
    const todayStr = localDateStr(new Date());
    const snap = Object.assign({}, state, { waist_in: healthData.waist_circumference_in });
    if (points.length > 0 && points[points.length - 1].date === todayStr) {
      points[points.length - 1].snap = snap;
    } else {
      points.push({ date: todayStr, snap });
    }
  }

  for (const p of points) {
    let total = 0, sum = 0;

    // Body fat score (constant -- snapshot only): 10%=2.0, 22.5%=1.0, 35%=0
    if (bf > 0) {
      sum += Math.max(0, Math.min(2.0, (35 - bf) / 12.5)) * 40;
      total += 40;
    }

    // Frame target achievement at this date
    const deficits = computeProportionDeficits(p.snap);
    const defVals = Object.values(deficits);
    if (defVals.length > 0) {
      const avgAchievement = 1 - (defVals.reduce((a, b) => a + b, 0) / defVals.length);
      sum += Math.max(0, Math.min(2.0, avgAchievement * 2)) * 40;
      total += 40;
    }

    // Waist-to-height ratio at this date
    const waistIn = p.snap.waist_in || 0;
    if (waistIn > 0 && heightIn > 0) {
      const whr = waistIn / heightIn;
      sum += Math.max(0, Math.min(2.0, (0.60 - whr) / 0.09)) * 20;
      total += 20;
    }

    if (total > 0) {
      bodyCompData.push({
        date: p.date,
        score: Math.round((sum / total) * 100) / 100,
      });
    }
  }
}

// Render dashboard from workouts data (shared by cache + fresh load)
// ============================================================
// POWER SCORE (Composite fitness metric, 0-100)
// ============================================================
function computePowerScore() {
  const components = [];

  // 1. Strength (30%) - from SI timeline
  if (strengthIndexData.length > 0) {
    const si = strengthIndexData[strengthIndexData.length - 1].index;
    // Piecewise: 0->0, 0.9->50, 1.3->70, 1.8->90, 2.5->100
    let sScore;
    if (si >= 1.8) sScore = 90 + ((si - 1.8) / 0.7) * 10;
    else if (si >= 1.3) sScore = 70 + ((si - 1.3) / 0.5) * 20;
    else if (si >= 0.9) sScore = 50 + ((si - 0.9) / 0.4) * 20;
    else sScore = (si / 0.9) * 50;
    components.push({ key: 'strength', label: 'Strength', value: Math.min(100, Math.round(sScore)), weight: 30, detail: 'SI ' + si.toFixed(2) });
  }

  // 2. Cardio Fitness (25%) - from cardio score timeline (vitals-only)
  if (cardioScoreData.length > 0) {
    const latest = cardioScoreData[cardioScoreData.length - 1];
    // Score is 0-2 scale, map to 0-100
    const cfScore = Math.min(100, Math.round(latest.score * 50));
    let detail = '';
    if (healthData && healthData.cardio_fitness) detail = 'VO2 ' + healthData.cardio_fitness.toFixed(1);
    components.push({ key: 'cardio', label: 'Cardio Fitness', value: cfScore, weight: 25, detail });
  }

  // 3. Body Comp (20%) - from body comp timeline
  if (bodyCompData.length > 0) {
    const latest = bodyCompData[bodyCompData.length - 1];
    // Score is 0-2 scale, map to 0-100
    const bcScore = Math.min(100, Math.round(latest.score * 50));
    let detail = '';
    if (healthData && healthData.body_fat_pct) detail = healthData.body_fat_pct.toFixed(1) + '% BF';
    components.push({ key: 'body', label: 'Body Comp', value: bcScore, weight: 20, detail });
  }

  // 4. Dedication (25%) - from dedication timeline (rolling 7d effort)
  if (dedicationData.length > 0) {
    const latest = dedicationData[dedicationData.length - 1];
    // v1.33 FIX: Dedication spans 0-~1.09 (weighted composite: lift 40% +
    // coverage 20% + cardio 30% capped at 1.3 + consistency 10%), NOT 0-2
    // like the Cardio Fitness / Body Comp pillars. The old *50 mapping
    // permanently capped this pillar at ~55/100. Map 0-1 -> 0-100; cap at
    // 100 since cardio overdrive past 150 min/wk can push the raw above 1.0.
    const dedScore = Math.min(100, Math.round(latest.score * 100));
    const detail = latest.liftDays + (latest.liftDays === 1 ? ' lift + ' : ' lifts + ') + latest.cardioMin + 'min cardio/7d';
    components.push({ key: 'dedication', label: 'Dedication', value: dedScore, weight: 25, detail });
  }

  if (components.length === 0) return { score: 0, components: [] };

  // Redistribute weights proportionally for available components
  const totalWeight = components.reduce((sum, c) => sum + c.weight, 0);
  let score = 0;
  for (const c of components) {
    const normalizedWeight = c.weight / totalWeight;
    score += c.value * normalizedWeight;
    c.normalizedWeight = normalizedWeight;
  }

  return { score: Math.round(score), components };
}

function renderPowerScore() {
  const ring = document.getElementById('power-score-ring');
  if (!ring) return;

  const ps = computePowerScore();
  if (ps.score === 0 && ps.components.length === 0) {
    ring.parentElement.style.display = 'none';
    return;
  }
  ring.parentElement.style.display = 'flex';

  // Store for detail panel
  window._powerScoreData = ps;

  const size = 38;
  const r = 14;
  const cx = size / 2;
  const cy = size / 2;
  const stroke = 3.5;
  const circumference = 2 * Math.PI * r;
  const fillLen = (ps.score / 100) * circumference;
  const gapLen = circumference - fillLen;

  // Color based on score
  const scoreColor = ps.score >= 70 ? C.accent : ps.score >= 45 ? C.warn : C.danger;

  // Organic tree-ring power score indicator
  var ringCount = 5;
  var filledRings = Math.round((ps.score / 100) * ringCount);
  var ringSvg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  for (var ri = 0; ri < ringCount; ri++) {
    var rr = 3 + ri * 2.8;
    var isFilled = ri < filledRings;
    var ringPts = [];
    for (var rj = 0; rj < 24; rj++) {
      var rAngle = (rj / 24) * Math.PI * 2;
      var rNoise = Math.sin(rAngle * 3 + ri * 2.1) * 0.8 + Math.cos(rAngle * 5 + ri * 1.3) * 0.4;
      var rrx = cx + (rr + rNoise) * Math.cos(rAngle);
      var rry = cy + (rr + rNoise) * Math.sin(rAngle);
      ringPts.push(`${rj === 0 ? 'M' : 'L'}${rrx.toFixed(1)},${rry.toFixed(1)}`);
    }
    ringPts.push('Z');
    var rOpacity = isFilled ? (0.4 + (ri / ringCount) * 0.6).toFixed(2) : '0.15';
    ringSvg += `<path d="${ringPts.join(' ')}" fill="none" stroke="${isFilled ? scoreColor : C.surface3}" stroke-width="${isFilled ? '1.5' : '0.6'}" opacity="${rOpacity}"/>`;
  }
  ringSvg += `<circle cx="${cx}" cy="${cy}" r="7" fill="${C.bg}" opacity="0.85"/>`;
  ringSvg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="${C.text}" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700">${ps.score}</text></svg>`;
  ring.innerHTML = ringSvg;
}

  renderHeatmap(pp.heatmapDayMuscle, pp.heatmapDayWorkouts, pp.heatmapDayCardio);
  renderWeightChart();
  renderHealthVitals();
  renderMeasurementsCard();
  renderPowerScore();
}

async function refreshData() {
  showScreen('loading-screen');
  try {
    updateLoading('Refreshing...');
    const [workouts] = await Promise.all([fetchWorkouts(), fetchHealthData()]);
    workoutCache = workouts;
    setCachedWorkouts(workouts);
    hevyStatus = 'ok';
    renderDashboard(workouts);
  } catch (err) {
    console.error(err);
    hevyStatus = 'error';
    showScreen('dashboard');
    showError(`Refresh failed: ${err.message.slice(0, 200)}`);
  }
}

async function loadDashboard() {
  showScreen('loading-screen');

  // Start health data fetch in parallel (non-blocking)
  const healthPromise = fetchHealthData();

  try {
    // v1.1 Task 7: Try cache first for instant load
    const cached = getCachedWorkouts();
    if (cached && cached.data && cached.data.length > 0) {
      updateLoading('Loading from cache...');
      workoutCache = cached.data;
      hevyStatus = 'ok';
      await healthPromise; // ensure health status is ready
      renderDashboard(cached.data);

      // If stale, refresh in background
      if (isCacheStale(cached)) {
        fetchWorkouts().then(fresh => {
          workoutCache = fresh;
          setCachedWorkouts(fresh);
          hevyStatus = 'ok';
          renderDashboard(fresh);
        }).catch(err => {
          console.warn('Background refresh failed:', err.message);
          hevyStatus = 'error';
        });
      }
      return;
    }

    // No cache - fresh load
    updateLoading('Loading workouts...');
    const workouts = await fetchWorkouts();
    workoutCache = workouts;
    setCachedWorkouts(workouts);
    hevyStatus = 'ok';
    await healthPromise;
    renderDashboard(workouts);
  } catch (err) {
    console.error(err);
    hevyStatus = 'error';
    showScreen('dashboard');
    showError(`Failed to load: ${err.message.slice(0, 200)}${err.message.length > 200 ? '...' : ''}<br><span style="font-size:11px;color:${C.textDim};margin-top:4px;display:block;">If using home screen app, try opening in Safari first to populate cache.</span>`);
  }
}

  const _testDate = localDateStr(new Date());
  _testCardioMap[_testDate] = { minutes: 35, sessions: [
    { name: 'Treadmill', minutes: 20, source: 'hevy', timestamp: Date.now() },
    { name: 'Elliptical', minutes: 15, source: 'hevy', timestamp: Date.now() },
  ]};
  const cardioResult = analyzeCardioHistory(_testCardioMap);
  results.push({ test: 'A3: cardio reads from passed map', pass: cardioResult.estimatedMinutes7d >= 35, got: cardioResult.estimatedMinutes7d });

  // Test A4: CSS custom properties load correctly (catches en-dash encoding bug)
  const rootStyle = getComputedStyle(document.documentElement);
  const accentVar = rootStyle.getPropertyValue('--accent').trim();
  results.push({
    test: 'A4: CSS --accent resolves to #5FA052',
    pass: accentVar === '#5FA052',
    got: accentVar || '(empty -- var() references may use en-dash instead of double-hyphen)'
  });

  // Test A5: Universal reset selector is active (catches * vs - typo)
  const testEl = document.querySelector('.app') || document.body;
  const boxSizing = getComputedStyle(testEl).boxSizing;
  results.push({
    test: 'A5: box-sizing is border-box (universal reset)',
    pass: boxSizing === 'border-box',
    got: boxSizing
  });

  // Test A6: No markdown code fences leaked into rendered page
  const bodyText = document.body.innerText;
  results.push({
    test: 'A6: No stray ``` in page text',
    pass: !bodyText.includes('```'),
    got: bodyText.includes('```') ? 'found ``` in rendered text' : 'clean'
  });

  // Test A7: STRENGTH_INDEX_LIFTS is defined (catches reference-before-definition)
  results.push({
    test: 'A7: STRENGTH_INDEX_LIFTS is defined before use',
    pass: typeof STRENGTH_INDEX_LIFTS === 'object' && STRENGTH_INDEX_LIFTS.bench != null,
    got: typeof STRENGTH_INDEX_LIFTS
  });

  // Test A8: Storage utility exists and round-trips
  const storageTestKey = '__dev_test_storage__';
  Storage.set(storageTestKey, { ok: true });
  const storageRead = Storage.get(storageTestKey);
  Storage.remove(storageTestKey);
  results.push({
    test: 'A8: Storage utility round-trips JSON',
    pass: storageRead && storageRead.ok === true,
    got: JSON.stringify(storageRead)
  });

  // Report
  console.group('\uD83E\uDDEA LiftScript Dev Tests');
  for (const r of results) {
    console.log(`${r.pass ? '\u2705' : '\u274C'} ${r.test}${r.pass ? '' : ' (got: ' + r.got + ')'}`);
  }
  console.groupEnd();
}

runDevTests();

// Boot-time CSS sanity check -- catches encoding issues like en-dash var() references
(function checkCSS() {
  const root = getComputedStyle(document.documentElement);
  const test = root.getPropertyValue('--accent').trim();
  if (!test) {
    console.error('\u26A0\uFE0F CSS custom properties not loading. Check <style> block for encoding issues (e.g. en-dash vs double-hyphen in var() references).');
  }
})();

// Boot
loadDashboard().catch(function(err) {
  var el = document.getElementById('loading-text');
  if (el) el.textContent = 'Boot error: ' + (err.message || err);
});
</script>
